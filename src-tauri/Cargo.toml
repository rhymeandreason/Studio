[package]
name = "studio"
version = "0.1.0"
description = "Studio — a menu-bar project workspace for designer-developers who build with Claude Code"
authors = ["Mary Huang"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows quirk).
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff"] }
webp = "0.3"
notify-debouncer-mini = "0.4"
trash = "5"
ureq = { version = "2", features = ["json"] }
studio-claude-core = { path = "../crates/studio-claude-core" }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-drag = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
