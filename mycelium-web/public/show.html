<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scan to connect</title>
<style>
  :root{ --bg:#17161c; --text:#eceaf2; --muted:#9a95a8; --accent:#7a5cff; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px 22px;text-align:center;gap:18px;-webkit-font-smoothing:antialiased;
  }
  .event{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1{font-size:30px;line-height:1.15;margin:0;max-width:12ch}
  .qr{
    background:#fff;border-radius:26px;padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    width:min(78vw,340px);height:min(78vw,340px);display:flex;
  }
  .qr img{width:100%;height:100%;display:block}
  .tag{font-size:17px;color:var(--muted);max-width:20ch;margin:0}
  .with{font-size:15px;color:var(--text);opacity:.85;margin:0}
  .err{color:#e08a3c;font-size:14px}
  .fs-hint{position:fixed;bottom:14px;font-size:12px;color:var(--muted);opacity:.6}
</style>
</head>
<body>
  <div class="event" id="event"></div>
  <h1 id="title">Nice to meet you 👋</h1>
  <div class="qr"><img id="qr" alt="Scan me"></div>
  <p class="tag">Scan to share your contact with me 🌱</p>
  <p class="with" id="with"></p>
  <div class="fs-hint" id="hint">Tap anywhere for full screen</div>

<script type="module">
  const params = new URLSearchParams(location.search);
  const t = (params.get("t") || "").trim();
  const name = (params.get("name") || "").trim();

  const qr = document.getElementById("qr");
  if (t) {
    qr.src = `/api/qr?t=${encodeURIComponent(t)}`;
    qr.onerror = () => { qr.replaceWith(Object.assign(document.createElement("p"),
      { className:"err", textContent:"Couldn't load the QR — check the link." })); };
  } else {
    document.querySelector(".qr").innerHTML = `<p class="err" style="margin:auto">No event in the link (?t= missing).</p>`;
  }
  if (name) document.getElementById("event").textContent = name;

  // Show "with <your name>" from your card.
  fetch("/me.json").then(r => r.ok ? r.json() : null).then(me => {
    if (me?.name) document.getElementById("with").textContent = `with ${me.name}`;
  }).catch(() => {});

  // Keep the screen awake while you're holding it up to people.
  let wake = null;
  async function keepAwake(){ try { wake = await navigator.wakeLock?.request("screen"); } catch {} }
  keepAwake();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

  // Tap to go full screen (hides the browser chrome for a cleaner display).
  document.body.addEventListener("click", () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) { el.requestFullscreen?.(); document.getElementById("hint").style.display = "none"; }
  });
</script>
</body>
</html>
