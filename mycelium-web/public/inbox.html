<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mycelium inbox</title>
<style>
  :root{--bg:#f7f5f0;--card:#fff;--text:#2a2a28;--muted:#8a8678;--line:rgba(42,42,40,.12);--accent:#7a5cff}
  @media (prefers-color-scheme:dark){:root{--bg:#17161c;--card:#211f29;--text:#eceaf2;--muted:#9a95a8;--line:rgba(255,255,255,.12)}}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:18px 14px 60px}
  .wrap{max-width:460px;margin:0 auto}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;
    animation:pop .35s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card .nm{font-weight:600;font-size:16px}
  .card .row{font-size:14px;color:var(--muted);margin-top:3px}
  .card .row b{color:var(--text);font-weight:500;text-transform:capitalize}
  .empty{color:var(--muted);text-align:center;padding:60px 0}
  input{width:100%;font-size:15px;padding:11px;border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--text);margin-bottom:14px}
  .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3aa66a;margin-right:5px;vertical-align:middle;animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.3}}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="live"></span>Inbox</h1>
  <p class="sub" id="sub">Watching for new contacts…</p>
  <input id="tree" placeholder="tree id (from the Studio tool)">
  <div id="list"></div>
</div>
<script type="module">
  const params = new URLSearchParams(location.search);
  const treeInput = document.getElementById("tree");
  treeInput.value = params.get("t") || localStorage.getItem("mycelium-tree") || "";
  treeInput.oninput = () => { localStorage.setItem("mycelium-tree", treeInput.value.trim()); poll(); };

  const list = document.getElementById("list"), sub = document.getElementById("sub");
  let seen = new Set();

  async function poll() {
    const t = treeInput.value.trim();
    if (!t) { sub.textContent = "Enter a tree id to watch."; return; }
    try {
      const res = await fetch(`/api/pull?tree=${encodeURIComponent(t)}&peek=1`);
      const subs = await res.json();
      sub.textContent = `${subs.length} contact${subs.length===1?"":"s"} collected`;
      if (!subs.length && !list.children.length) list.innerHTML = `<div class="empty">No contacts yet — share your QR to start.</div>`;
      for (const s of subs) {
        if (seen.has(s.id)) continue;
        seen.add(s.id);
        if (list.querySelector(".empty")) list.innerHTML = "";
        const card = document.createElement("div"); card.className = "card";
        card.innerHTML = `<div class="nm">${esc(s.name || "Someone")}</div>` +
          (s.contacts || []).map(c => `<div class="row"><b>${esc(c.type)}</b> · ${esc(c.value)}</div>`).join("");
        list.prepend(card);
      }
    } catch (e) { sub.textContent = "Connection issue…"; }
  }
  function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  poll(); setInterval(poll, 3000);
</script>
</body>
</html>
