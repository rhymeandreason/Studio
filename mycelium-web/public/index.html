<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Nice to meet you</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --card: #fff;
      --text: #2a2a28;
      --muted: #8a8678;
      --line: rgba(42, 42, 40, .12);
      --line-strong: rgba(42, 42, 40, .18);
      --accent: #6e6154;
      --accent-soft: #ead9c5;
      --radius: 10px;
      --radius-lg: 12px;
      --sans: "Futura", "Futura PT", -apple-system, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      padding: 22px 16px 60px;
      -webkit-font-smoothing: antialiased
    }

    .wrap {
      max-width: 440px;
      margin: 0 auto;
      text-align: center
    }

    h1 {
      font-size: 26px;
      margin: 6px 0 2px
    }

    .sub {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 15px
    }

    .card {

      padding: 16px;
      margin-bottom: 16px
    }

    .card h2 {
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px
    }

    /* Business card: warm paper stock, hairline border, letterpress feel. */
    #me-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 4px 16px rgba(42, 42, 40, .2);
      position: relative;
text-align: center;
margin-top:16px;
margin-bottom:30px;
    }



    .me-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .me-head .avatar {
      margin: 0;
      border: 1px solid var(--line-strong);
    }

    .me-head-text {
      min-width: 0;
    }

    .me-head-text .eyebrow {
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 2px;
    }

    #me-name {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: .01em;
      margin: 0;
      color: var(--text);
      text-transform: none;
text-align: center;
    }

    .me-rule {
      border: none;
      border-top: 1px dashed var(--line-strong);
      margin: 2px 0 12px;
    }

    #me-list {
      font-size: 15px;
      letter-spacing: .01em;
      color: var(--muted);
    }

    .connect,
    .connect-plain {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    .connect:active {
      color: var(--accent)
    }

    .savebtn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .02em;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--accent);
      color: var(--accent);
      background: var(--accent-soft)
    }

    .savebtn span {
      font-size: 19px;
      line-height: 1
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0
    }

    .avatar[hidden] {
      display: none
    }

    .savebtn:active {
      background: var(--accent);
      color: #fff
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 12px 0 4px
    }

    input {
      width: 100%;
      font-size: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: transparent;
      color: var(--text)
    }

    input:focus {
      outline: none;
      border-color: var(--accent)
    }

    .contact-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px
    }

    .contact-row select {
      flex: 0 0 118px;
      font-size: 15px;
      padding: 11px 8px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--card);
      color: var(--text)
    }

    .contact-row input {
      flex: 1
    }

    .addbtn {
      background: none;
      border: 1px dashed var(--line);
      color: var(--muted);
      width: 100%;
      padding: 11px;
      border-radius: 11px;
      font-size: 14px;
      margin-top: 2px
    }

    .submit {
      width: 100%;
      font-size: 17px;
      font-weight: 600;
      padding: 15px;
      border: none;
      border-radius: 13px;
      background: var(--accent);
      color: #fff;
      margin-top: 20px
    }

    .submit:disabled {
      opacity: .5
    }

    .done {
      text-align: center;
      padding: 50px 10px
    }

    .done .big {
      font-size: 52px
    }

    .done h1 {
      margin-top: 12px
    }

    .err {
      color: #d9534f;
      font-size: 14px;
      margin-top: 10px;
      text-align: center
    }

    .hidden {
      display: none
    }

  </style>
</head>

<body>
  <div class="wrap" id="app">
    <div id="form-view">
      <h1>Hi, nice to meet you 👋</h1>

      <div id="me-card">
        <div class="me-head">
          <img class="avatar" id="me-avatar" alt="" hidden>
          <div class="me-head-text">
            <h2 id="me-name">Card</h2>
          </div>
        </div>
        <hr class="me-rule">
        <div id="me-list"></div>
        <a class="savebtn" href="/api/vcard" id="save-contact">
          <span>＋</span> Save to Contacts
        </a>
      </div>

      <div class="card">
        
        <input id="name" placeholder="Your name" autocomplete="name">
    
        <div id="contacts"></div>
        <button class="addbtn" id="add">+ Add another</button>
        <button class="submit" id="send">Share with Mary</button>
        <div class="err hidden" id="err"></div>
      </div>
    </div>

    <div id="done-view" class="done hidden">
      <div class="big">🌱</div>
      <h1>Got it — thanks!</h1>
      <p class="sub">Your info is on its way. See you around.</p>
    </div>
  </div>

  <script type="module">
    const TYPES = ["phone", "email", "instagram", "linkedin", "x", "website", "other"];
    const params = new URLSearchParams(location.search);
    const treeId = params.get("t") || "";
    const contactsEl = document.getElementById("contacts");

    // Prefill your card (baked in — see mycelium-web/public/me.json for the source api/vcard.js still reads)
    const ME = {
      "name": "Mary Huang",
      "photo": "me.jpg",
      "contacts": [{
          "type": "email",
          "value": "rhymeandreason1.0@gmail.com"
        },
        {
          "type": "linkedin",
          "value": "www.linkedin.com/in/maryhuang1/"
        },
        {
          "type": "instagram",
          "value": "@rhymeandreason"
        }
      ]
    };
    (() => {
      const me = ME;
      if (me.photo) {
        const a = document.getElementById("me-avatar");
        a.src = "/" + me.photo;
        a.onload = () => a.hidden = false;
      }
      if (me.name) {
        document.getElementById("me-name").textContent = me.name;
 
      }
      const list = document.getElementById("me-list");
      (me.contacts || []).forEach((c, i) => {
        if (i > 0) list.appendChild(document.createTextNode(" | "));
        const act = contactAction(c);
        if (act) { // tappable: follow / connect / call / email
          const a = document.createElement("a");
          a.className = "connect";
          a.href = act.href;
          if (act.blank) {
            a.target = "_blank";
            a.rel = "noopener";
          }
          a.textContent = act.label;
          list.appendChild(a);
        } else { // plain fallback (e.g. "other")
          const span = document.createElement("span");
          span.className = "connect-plain";
          span.textContent = c.value;
          list.appendChild(span);
        }
      });
      if (!(me.contacts || []).length) document.getElementById("me-card").classList.add("hidden");
    })();

    function addRow(type = "phone", value = "") {
      const row = document.createElement("div");
      row.className = "contact-row";
      const sel = document.createElement("select");
      sel.innerHTML = TYPES.map(t => `<option ${t===type?"selected":""}>${t}</option>`).join("");
      const inp = document.createElement("input");
      inp.placeholder = "type something!";
      inp.value = value;
      row.append(sel, inp);
      contactsEl.appendChild(row);
    }
    addRow("email");
    addRow("website");
    document.getElementById("add").onclick = () => addRow("email");

    document.getElementById("send").onclick = async () => {
      const btn = document.getElementById("send"),
        err = document.getElementById("err");
      err.classList.add("hidden");
      const contacts = [...contactsEl.querySelectorAll(".contact-row")].map(r => ({
        type: r.querySelector("select").value,
        value: r.querySelector("input").value.trim()
      })).filter(c => c.value);
      const name = document.getElementById("name").value.trim();
      if (!name && !contacts.length) {
        err.textContent = "Add your name or a way to reach you.";
        err.classList.remove("hidden");
        return;
      }
      btn.disabled = true;
      btn.textContent = "Sharing…";
      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            treeId,
            name,
            contacts
          })
        });
        if (!res.ok) throw new Error((await res.json()).error || "failed");
        document.getElementById("form-view").classList.add("hidden");
        document.getElementById("done-view").classList.remove("hidden");
      } catch (e) {
        err.textContent = "Something went wrong. Try again.";
        err.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Share with me";
      }
    };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;"
      } [c]));
    }

    // Map a stored contact to a tappable action (follow/connect/call/email).
    function contactAction(c) {
      const v = String(c.value || "").trim();
      if (!v) return null;
      const handle = v.replace(/^@/, "");
      const bare = v.replace(/^https?:\/\//, "");
      switch (c.type) {
        case "linkedin":
          return {
            href: `https://${bare}`, blank: true, label: "LinkedIn"
          };
        case "instagram":
          return {
            href: `https://instagram.com/${handle}`, blank: true, label: "Instagram"
          };
        case "x":
          return {
            href: `https://x.com/${handle}`, blank: true, label: "X"
          };
        case "website":
          return {
            href: /^https?:\/\//.test(v) ? v : `https://${bare}`, blank: true, label: "Website"
          };
        case "email":
          return {
            href: `mailto:${v}`, blank: false, label: "Email"
          };
        case "phone":
          return {
            href: `tel:${v.replace(/\s+/g,"")}`, blank: false, label: "Phone"
          };
        default:
          return null;
      }
    }

  </script>
</body>

</html>
