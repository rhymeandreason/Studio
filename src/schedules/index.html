<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scheduled Tasks</title>
        <!-- Material Symbols is vendored via tokens.css (@import in ../styles.css). -->
        <link rel="stylesheet" href="../styles.css" />
        <link rel="stylesheet" href="schedules.css" />
        <script type="module" src="schedules.js" defer></script>
    </head>
    <body class="schedules-body">
        <div class="schedules-app">
            <header class="schedules-head">
                <h1 class="schedules-title">Scheduled Tasks</h1>
                <button type="button" class="btn-add" id="schedules-save" disabled>
                    <span class="mi mi-sm">check</span>Saved
                </button>
            </header>
            <div class="schedules-list" id="schedules-list"></div>
        </div>
    </body>
</html>
