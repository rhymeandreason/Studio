<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Claude</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../styles.css" />
        <link rel="stylesheet" href="claude.css" />
        <script type="module" src="claude.js" defer></script>
    </head>
    <body class="claude-body">
        <div class="claude-app">
            <aside class="claude-sessions" id="sessions-panel" hidden>
                <div class="claude-sessions__head">
                    <span>Sessions</span>
                </div>
                <div class="claude-sessions__list" id="sessions-list"></div>
                <div class="claude-sessions__head">
                    <span>Older — <span id="history-project"></span></span>
                    <label class="claude-toggle" title="Include sessions started outside Studio">
                        <input type="checkbox" id="history-toggle" />
                        <span class="claude-toggle__track"><span class="claude-toggle__thumb"></span></span>
                    </label>
                </div>
                <div class="claude-sessions__list" id="history-list"></div>
            </aside>

            <div class="claude-right">
                <div class="claude-topbar">
                    <button class="claude-toggle-btn" id="sessions-toggle" title="Sessions">
                        <span class="mi mi-sm">side_navigation</span>
                    </button>

                    <button class="claude-toggle-btn claude-newtab" id="new-session" title="New session">
                        <span class="mi mi-sm">add</span>
                    </button>
                    <div class="claude-tabs" id="tabs"></div>
                </div>

                <header class="claude-bar">
                    <span class="claude-session-name" id="session-name" title="Click to rename">New session</span>
                    <div class="claude-model-wrap">
                        <img class="claude-model__icon" src="claude-icon.svg" alt="" />
                        <select class="field__input claude-model" id="model-select">
                            <option value="sonnet">Sonnet</option>
                            <option value="opus">Opus</option>
                            <option value="fable">Fable</option>
                            <option value="haiku">Haiku</option>
                        </select>
                    </div>
                    <select
                        class="field__input claude-model claude-permission"
                        id="permission-select"
                        title="Permission mode"
                    >
                        <option value="default">Ask</option>
                        <option value="acceptEdits">Accept edits</option>
                        <option value="plan">Plan</option>
                        <option value="bypassPermissions">Bypass</option>
                    </select>
                </header>

                <div class="claude-usage" id="usage-bars">
                    <div class="claude-meter">
                        <div class="claude-meter__label">
                            <span class="mi mi-sm">data_usage</span>
                            <span class="claude-meter__label-text">Context</span>
                            <span id="context-pct">0%</span>
                        </div>
                        <div class="claude-meter__track">
                            <div class="claude-meter__fill" id="context-fill"></div>
                        </div>
                    </div>
                    <div class="claude-meter">
                        <div class="claude-meter__label">
                            <span class="mi mi-sm">schedule</span>
                            <span class="claude-meter__label-text">5-hour usage</span>
                            <span id="plan-status">—</span>
                        </div>
                        <div class="claude-meter__track">
                            <div class="claude-meter__fill claude-meter__fill--plan" id="plan-fill"></div>
                        </div>
                    </div>
                    <div class="claude-sevenday" id="sevenday" title="7-day usage">
                        <div class="claude-pie" id="sevenday-pie"></div>
                        <span class="claude-sevenday__label">7d</span>
                    </div>
                </div>

                <div class="claude-chat">
                    <div class="claude-transcript" id="transcript"></div>
                    <div class="claude-status" id="status" hidden>
                        <span class="claude-status__spinner"></span>
                        <span class="claude-status__label">Working</span>
                        <span class="claude-status__meta"></span>
                    </div>
                    <form class="claude-input" id="input-form">
                        <textarea
                            class="field__input claude-textarea"
                            id="prompt-input"
                            rows="2"
                            placeholder="What shall we do next?"
                        ></textarea>
                        <button class="iconbtn-round claude-send" id="send-btn" type="submit" title="Send">
                            <span class="mi mi-sm">arrow_upward</span>
                        </button>
                        <button class="iconbtn-round claude-stop" id="stop-btn" type="button" title="Stop" hidden>
                            <span class="mi mi-sm">stop</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
