<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Claude</title>
        <!-- Material Symbols is vendored via tokens.css (@import in ../styles.css). -->
        <link rel="stylesheet" href="../styles.css" />
        <link rel="stylesheet" href="../kit/kit.css" />
        <link rel="stylesheet" href="../kit/window-chrome.css" />
        <link rel="stylesheet" href="claude.css" />
        <script type="module" src="../kit/window-chrome.js"></script>
        <script type="module" src="claude.js" defer></script>
    </head>
    <body class="claude-body">
        <div class="claude-app">
            <aside class="claude-sessions" id="sessions-panel" hidden>
                <div class="claude-sessions__head">
                    <span>Sessions</span>
                </div>
                <div class="claude-sessions__list" id="sessions-list"></div>
                <div class="claude-sessions__head">
                    <span>Older — <span id="history-project"></span></span>
                    <label class="toggle-button" title="Include sessions started outside Studio">
                        <input type="checkbox" id="history-toggle" />
                        <span class="toggle-button__track"><span class="toggle-button__thumb"></span></span>
                    </label>
                </div>
                <div class="claude-sessions__list" id="history-list"></div>
            </aside>

            <div class="claude-right">
                <div class="claude-topbar" data-window-bar>
                    <button class="btn btn-icon-only" id="sessions-toggle" title="Sessions">
                        <span class="mi mi-sm">side_navigation</span>
                    </button>

                    <button class="btn btn-icon-only claude-newtab" id="new-session" title="New session">
                        <span class="mi mi-sm">add</span>
                    </button>
                    <div class="claude-tabs" id="tabs"></div>
                </div>

                <header class="claude-bar">
                    <span class="claude-session-name" id="session-name" title="Click to rename">New session</span>
                </header>

                <div class="claude-usage" id="usage-bars">
                    <div class="claude-meter">
                        <div class="claude-meter__label">
                            <span class="mi mi-sm">data_usage</span>
                            <span class="claude-meter__label-text">Context</span>
                            <span id="context-pct">0%</span>
                        </div>
                        <div class="claude-meter__track">
                            <div class="claude-meter__fill" id="context-fill"></div>
                        </div>
                    </div>
                    <div class="claude-meter" id="five-hour">
                        <div class="claude-meter__label">
                            <span class="mi mi-sm">schedule</span>
                            <span class="claude-meter__label-text">5-hour usage</span>
                            <span id="plan-status">—</span>
                        </div>
                        <div class="claude-meter__track">
                            <div class="claude-meter__fill claude-meter__fill--plan" id="plan-fill"></div>
                        </div>
                    </div>
                    <div class="claude-sevenday" id="sevenday" title="7-day usage">
                        <div class="claude-pie" id="sevenday-pie"></div>
                        <span class="claude-sevenday__label">7d</span>
                    </div>
                </div>

                <div class="claude-chat">
                    <div class="claude-transcript" id="transcript"></div>
                    <div class="claude-status" id="status">
                        <span class="claude-status__panda"></span>
                        <div class="claude-status__text">
                            <span class="claude-status__label">Working</span>
                            <span class="claude-status__tool" hidden>
                                <span class="mi claude-status__tool-icon">build</span>
                                <span class="claude-status__tool-name"></span>
                            </span>
                        </div>
                        <span class="claude-status__meta"></span>
                    </div>
                </div>
                <form class="claude-input" id="input-form">
                    <textarea
                        class="field__input claude-textarea"
                        id="prompt-input"
                        rows="2"
                        placeholder="What shall we do next?"
                    ></textarea>
                    <button class="btn-round btn-round-filled" id="send-btn" type="submit" title="Send">
                        <span class="mi mi-sm">arrow_upward</span>
                    </button>
                    <button class="btn-round claude-stop" id="stop-btn" type="button" title="Stop" hidden>
                        <span class="mi mi-sm">stop</span>
                    </button>
                </form>
                <div class="claude-controls">
                    <div class="notedrop claude-model claude-cwd" id="cwd-select" title="Working directory: project (artifacts) or code repo"></div>
                    <div class="claude-model-wrap">
                        <div class="notedrop claude-model" id="model-select"></div>
                    </div>
                    <div class="notedrop claude-model claude-permission" id="permission-select" title="Permission mode"></div>
                </div>
            </div>
        </div>
    </body>
</html>
