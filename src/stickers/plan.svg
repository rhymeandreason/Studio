<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Plan: a tear-off day calendar (the day number is drawn by the page) -->
  <defs>
    <pattern id="band" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="3" height="3" fill="#e0573f"/>
      <rect width="1" height="3" fill="#fff" opacity=".3"/>
    </pattern>
    <clipPath id="page"><rect x="8" y="10" width="32" height="30" rx="2.5"/></clipPath>
  </defs>
  <g fill="#fffdf8" stroke="#fffdf8" stroke-width="5" stroke-linejoin="round">
    <rect x="8" y="10" width="32" height="30" rx="2.5"/>
    <rect x="14" y="6" width="3" height="8" rx="1.5"/>
    <rect x="31" y="6" width="3" height="8" rx="1.5"/>
  </g>
  <g clip-path="url(#page)">
    <rect x="8" y="10" width="32" height="30" fill="#fffaf0"/>
    <rect x="8" y="10" width="32" height="9" fill="url(#band)"/>
  </g>
  <path d="M8 40.5h32" stroke="#e9dcc4" stroke-width="1" stroke-dasharray="1.6 1.2"/>
  <rect x="14" y="6" width="3" height="8" rx="1.5" fill="#2f2628"/>
  <rect x="31" y="6" width="3" height="8" rx="1.5" fill="#2f2628"/>
</svg>
