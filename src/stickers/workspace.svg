<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Workspace: two slider tracks made of washi, with button knobs -->
  <defs>
    <pattern id="stripe" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="3" fill="#f2b541"/>
      <rect width="1.1" height="3" fill="#fff" opacity=".55"/>
    </pattern>
    <pattern id="dots" width="3.4" height="3.4" patternUnits="userSpaceOnUse">
      <rect width="3.4" height="3.4" fill="#4a6b9a"/>
      <circle cx="1.7" cy="1.7" r=".65" fill="#fff" opacity=".7"/>
    </pattern>
    <path id="t1" d="M5 13H43L42 14.5 43 16 42 17.5 43 19H5L6 17.5 5 16 6 14.5Z" transform="rotate(-3 24 16)"/>
    <path id="t2" d="M5 29H43L42 30.5 43 32 42 33.5 43 35H5L6 33.5 5 32 6 30.5Z" transform="rotate(2 24 32)"/>
  </defs>
  <g fill="#fffdf8" stroke="#fffdf8" stroke-width="5" stroke-linejoin="round">
    <use href="#t1"/><use href="#t2"/>
    <circle cx="30" cy="16" r="6"/><circle cx="17" cy="32" r="6"/>
  </g>
  <use href="#t1" fill="url(#stripe)" opacity=".95"/>
  <use href="#t2" fill="url(#dots)" opacity=".95"/>
  <g fill="#fffaf0" stroke="#2f2628" stroke-width="1.8">
    <circle cx="30" cy="16" r="5"/><circle cx="17" cy="32" r="5"/>
  </g>
</svg>
