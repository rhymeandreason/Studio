<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The Lab: a bright orange sun, flat top-to-bottom gradient -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb13d"/><stop offset=".55" stop-color="#ff6a1f"/><stop offset="1" stop-color="#f2410f"/></linearGradient>
    <pattern id="grain" width="2.6" height="2.6" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="0.4" fill="#fff" opacity=".35"/></pattern>
  </defs>
  <g fill="#fffdf8" stroke="#fffdf8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="24" cy="24" r="18"/>
  </g>
  <circle cx="24" cy="24" r="18" fill="url(#sun)"/>
  <circle cx="24" cy="24" r="18" fill="url(#grain)"/>
</svg>
