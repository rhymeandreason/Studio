<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Notes: a graph-paper memo, dog-eared, taped at the top -->
  <defs>
    <pattern id="grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fcf3dc"/>
      <path d="M4 0V4H0" fill="none" stroke="#ecd9ae" stroke-width=".6"/>
    </pattern>
    <pattern id="tape" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#9fc486"/>
      <circle cx="2" cy="2" r=".8" fill="#fff" opacity=".8"/>
    </pattern>
    <path id="strip" d="M-9-3.2H9L8-1.6 9 0 8 1.6 9 3.2H-9L-8 1.6-9 0-8-1.6Z"/>
  </defs>
  <g fill="#fffdf8" stroke="#fffdf8" stroke-width="5" stroke-linejoin="round">
    <path d="M9 9H32L39 16V41H9Z"/>
    <use href="#strip" transform="translate(21 9) rotate(-5)"/>
  </g>
  <path d="M9 9H32L39 16V41H9Z" fill="url(#grid)"/>
  <path d="M32 9V16H39Z" fill="#e9d3a2"/>
  <g stroke="#2f2628" stroke-width="1.8" stroke-linecap="round">
    <path d="M14 21H33M14 27H33M14 33H26"/>
  </g>
  <use href="#strip" transform="translate(21 9) rotate(-5)" fill="url(#tape)" opacity=".92"/>
</svg>
