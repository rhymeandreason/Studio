<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Studio Dock</title>
<link rel="stylesheet" href="../tokens.css" />
<style>
/* The Dock is the one surface that deliberately does NOT use the Runes paper
   palette: it has to read as screen bezel rather than as a window, so it runs
   its own near-black scale. Type, icons and motion still come from tokens.

   This page is only ever STRIP_W (76px, in dock.rs) wide and never resizes.
   Everything it opens is a normal tool window in src/tools/ — see the module
   comment in dock.rs. */
:root {
    --dock-bg: #000;
    --dock-text: #e8e4dc;
    --dock-dim: #6b6862;
    --dock-line: rgba(232, 228, 220, 0.1);
    --dock-hover: rgba(232, 228, 220, 0.08);
}

* { box-sizing: border-box; margin: 0; }

html, body {
    height: 100%;
    background: var(--dock-bg);
    font-family: var(--sans);
    color: var(--dock-text);
    overflow: hidden;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 12px;
    gap: 4px;
}

.spacer { flex: 1 1 auto; }

.rule {
    width: 28px;
    height: 1px;
    background: var(--dock-line);
    margin: 8px 0;
    flex: 0 0 auto;
}

/* ---- buttons ---- */

.item {
    width: 48px;
    height: 48px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--dock-text);
    font-family: inherit;
    transition: background var(--dur-fast) var(--ease-standard);
}

.item:hover { background: var(--dock-hover); }
.item.off { color: var(--dock-dim); }

.item .mi { font-size: 22px; }

/* ---- clock ---- */

.clock {
    flex: 0 0 auto;
    text-align: center;
    line-height: 1.15;
    padding: 6px 0 2px;
}

.clock .time {
    font-size: 23px;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
}

.clock .day,
.clock .date {
    font-size: 13px;
    color: var(--dock-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
}

.clock .day { margin-top: 4px; }

/* ---- battery ----
   A horizontal battery is wide and short, so the percentage sits *under* it
   rather than overlapping — which is also why this one item stacks instead of
   centring a single glyph like the others. */

.batt {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
}

.batt .pct {
    font-size: 10px;
    line-height: 1;
    color: var(--dock-dim);
    font-variant-numeric: tabular-nums;
}

.batt.low .mi { color: var(--rose); }
</style>
</head>
<body>

<button class="item" data-tool="projects.html" title="Projects">
    <span class="mi">workspaces</span>
</button>

<div class="rule"></div>

<button class="item" data-tool="daily-notes.html" title="Daily Notes">
    <span class="mi">format_list_bulleted</span>
</button>
<button class="item" data-tool="tasks.html" title="Tasks">
    <span class="mi">calendar_month</span>
</button>
<button class="item" data-tool="file-directory.html" title="Files">
    <span class="mi">folder</span>
</button>
<button class="item" data-tool="server.html" title="Server">
    <span class="mi">dns</span>
</button>

<div class="spacer"></div>

<button class="item" id="wifi" data-tool="system-controls.html" title="Wi-Fi">
    <span class="mi">wifi</span>
</button>
<button class="item batt" id="batt" data-tool="system-controls.html" title="Battery">
    <span class="mi">battery_android_frame_full</span>
    <span class="pct"></span>
</button>

<div class="rule"></div>

<div class="clock">
    <div class="time" id="time">--:--</div>
    <div class="day" id="day"></div>
    <div class="date" id="date"></div>
</div>

<script type="module">
import { invoke } from "../kit/app.js";

// ---------------------------------------------------------------- clock ----

const timeEl = document.getElementById("time");
const dayEl = document.getElementById("day");
const dateEl = document.getElementById("date");

function tickClock() {
    const now = new Date();
    timeEl.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        hour12: false,
    });
    dayEl.textContent = now.toLocaleDateString([], { weekday: "short" });
    dateEl.textContent = now.toLocaleDateString([], { month: "short", day: "numeric" });
}

tickClock();
setInterval(tickClock, 1000);

// --------------------------------------------------------------- status ----

// Volume/mute are in dock_status too, but only the controls tool shows them.
let status = { wifi_on: false, battery: -1, charging: false };

const wifiBtn = document.getElementById("wifi");
const battBtn = document.getElementById("batt");

// The `battery_android_frame_*` set is the horizontal outline battery: levels
// 1–6 plus `full`, `bolt` and `alert`. (The plain `battery_*` names are the
// vertical ones, and `battery_horiz_*` only has three levels.) All confirmed
// present in the vendored Material Symbols subset — a name the font lacks
// renders as literal text.
function batteryIcon() {
    if (status.battery < 0) return "power";
    if (status.charging) return "battery_android_frame_bolt";
    if (status.battery < 10) return "battery_android_frame_alert";
    if (status.battery >= 95) return "battery_android_frame_full";
    const bars = Math.min(6, Math.max(1, Math.ceil((status.battery / 100) * 6)));
    return `battery_android_frame_${bars}`;
}

function render() {
    wifiBtn.querySelector(".mi").textContent = status.wifi_on ? "wifi" : "wifi_off";
    wifiBtn.classList.toggle("off", !status.wifi_on);

    battBtn.querySelector(".mi").textContent = batteryIcon();
    battBtn.querySelector(".pct").textContent = status.battery >= 0 ? status.battery : "";
    battBtn.classList.toggle("low", status.battery >= 0 && status.battery < 20 && !status.charging);
}

async function refresh() {
    try {
        status = await invoke("dock_status");
        render();
    } catch { /* not in Studio (browser preview) — leave the defaults */ }
}

refresh();
// Each poll shells out to networksetup/pmset/osascript, so keep it lazy.
setInterval(refresh, 10000);

// ---------------------------------------------------------------- views ----

// Every view the strip opens is a normal tool window (src/tools/), opened the
// same way the Tools menu opens them. Bespoke borderless windows built hidden
// and revealed with show() never appeared — see the module comment in dock.rs.
for (const btn of document.querySelectorAll("[data-tool]")) {
    btn.onclick = () => invoke("open_tool", { file: btn.dataset.tool })
        .catch((e) => console.error("open_tool failed:", e));
}
</script>
</body>
</html>
