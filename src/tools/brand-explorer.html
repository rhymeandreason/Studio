<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Explorer</title>
<!-- Foundation + kit (tokens, then kit, then page styles). -->
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<script type="module" src="../kit/components.js"></script>
<style>
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* Left: font browser. Right: the kit being built. */
  .browser {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--hairline);
  }
  .kit {
    flex: 0 0 360px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 16px;
    gap: 16px;
  }

  .browser-head {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid var(--hairline);
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--hairline-strong);
    background: var(--elevated);
    color: var(--text-muted);
    cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .font-list { overflow-y: auto; padding: 8px 16px 24px; }
  .font-card {
    padding: 12px 14px;
    border-bottom: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .font-sample { font-size: 24px; line-height: 1.1; min-width: 0; }
  .font-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .font-name { font-family: var(--sans); font-size: 11px; color: var(--text-muted); }
  .font-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .assign {
    font-size: 11px; padding: 4px 8px; height: auto;
  }
  .assign.on { background: var(--sage); border-color: var(--sage); color: #fff; }

  /* Kit panel */
  .kit h2 { font-family: var(--serif); font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .roles { display: flex; flex-direction: column; gap: 10px; }
  .role-preview {
    border: 1px dashed var(--hairline-strong);
    border-radius: var(--radius-sm);
    padding: 12px;
    min-height: 52px;
  }
  .role-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .role-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-soft); }
  .role-weight { height: 24px; font-size: 11px; padding: 0 22px 0 8px; width: auto; flex: 0 0 auto; }
  #heading-sample { font-size: 26px; line-height: 1.15; }
  #body-sample { font-size: 14px; line-height: 1.5; }

  /* Hidden Coloris trigger input (brand-explorer specific) */
  .swatch-chip__trigger {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 0;
    height: 0;
  }

  .status { font-family: var(--mono); font-size: 11px; color: var(--text-muted); min-height: 14px; }
</style>
</head>
<body>
  <div class="browser">
    <div class="browser-head">
      <input id="search" class="field" placeholder="Search fonts…" />
      <div class="chips" id="chips"></div>
    </div>
    <div class="font-list" id="font-list"></div>
  </div>

  <div class="kit">
    <div>
      <label class="label" for="kit-name">Kit name</label>
      <input id="kit-name" class="field" value="Brand kit" style="margin-top:6px;" />
    </div>
    <div>
      <h2>Fonts</h2>
      <div class="roles">
        <div class="role-preview">
          <div class="role-head">
            <div class="role-tag" id="heading-tag">Heading — none</div>
            <select class="field role-weight" id="heading-weight"></select>
          </div>
          <div id="heading-sample">Almost before we knew it</div>
        </div>
        <div class="role-preview">
          <div class="role-head">
            <div class="role-tag" id="body-tag">Body — none</div>
            <select class="field role-weight" id="body-weight"></select>
          </div>
          <div id="body-sample">The quick brown fox jumps over the lazy dog. 0123456789</div>
        </div>
      </div>
    </div>

    <div>
      <h2>Colors</h2>
      <div id="palette" class="swatch-grid"></div>
      <button class="btn btn-ghost" id="add-color" style="margin-top:8px;">
        <span class="mi mi-sm">add</span> Add color
      </button>
    </div>

    <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
      <button class="btn btn-primary" id="save" style="display:none;">Save</button>
      <button class="btn btn-secondary" id="duplicate">Save as new kit</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <script type="module">
    // ---- Curated top Google Fonts (family, category, sample weight) --------
    // Baked in: no API key, instant, offline list. Previews load from the
    // Google Fonts CDN on demand (the explorer browses Google's library).
    const FONTS = [
      // sans
      ["Inter","sans"],["Roboto","sans"],["Open Sans","sans"],["Lato","sans"],
      ["Montserrat","sans"],["Poppins","sans"],["Raleway","sans"],["Nunito","sans"],
      ["Work Sans","sans"],["Source Sans 3","sans"],["Mulish","sans"],["Rubik","sans"],
      ["DM Sans","sans"],["Manrope","sans"],["Karla","sans"],["Figtree","sans"],
      ["Outfit","sans"],["Plus Jakarta Sans","sans"],["Hanken Grotesk","sans"],
      ["Be Vietnam Pro","sans"],["Space Grotesk","sans"],["Josefin Sans","sans"],
      ["Syne","sans"],["Onest","sans"],
      ["Barlow","sans"],["Barlow Condensed","sans"],["Noto Sans","sans"],
      ["IBM Plex Sans","sans"],["Cabin","sans"],["Exo 2","sans"],
      ["Jost","sans"],["Urbanist","sans"],["Lexend","sans"],["Quicksand","sans"],
      ["Oxanium","sans"],["Albert Sans","sans"],["Instrument Sans","sans"],
      ["Geist","sans"],["Familjen Grotesk","sans"],["Schibsted Grotesk","sans"],
      ["Mona Sans","sans"],["Red Hat Display","sans"],["Encode Sans","sans"],
      ["Epilogue","sans"],["Archivo","sans"],["Chivo","sans"],
      // serif
      ["Playfair Display","serif"],["Merriweather","serif"],["Lora","serif"],
      ["PT Serif","serif"],["Source Serif 4","serif"],["Libre Baskerville","serif"],
      ["EB Garamond","serif"],["Cormorant Garamond","serif"],["Crimson Text","serif"],
      ["Bitter","serif"],["Spectral","serif"],["Newsreader","serif"],
      ["Fraunces","serif"],["Instrument Serif","serif"],["Frank Ruhl Libre","serif"],
      ["Noto Serif","serif"],["IBM Plex Serif","serif"],["Libre Caslon Text","serif"],
      ["Zilla Slab","serif"],["Rokkitt","serif"],["Arvo","serif"],
      ["Cardo","serif"],["Vollkorn","serif"],["Alegreya","serif"],
      ["Domine","serif"],["Tinos","serif"],["Gilda Display","serif"],
      ["Bodoni Moda","serif"],["DM Serif Display","serif"],["Quando","serif"],
      // display
      ["Oswald","display"],["Bebas Neue","display"],["Anton","display"],
      ["Archivo Black","display"],["Abril Fatface","display"],["Righteous","display"],
      ["Comfortaa","display"],["Unbounded","display"],
      ["Black Han Sans","display"],["Alfa Slab One","display"],["Boogaloo","display"],
      ["Lilita One","display"],["Paytone One","display"],["Russo One","display"],
      ["Dela Gothic One","display"],["Big Shoulders Display","display"],
      ["Passion One","display"],["Teko","display"],["Barlow Semi Condensed","display"],
      ["Exo","display"],["Rajdhani","display"],["Cinzel","display"],
      ["Cormorant","display"],["Yeseva One","display"],["Playfair Display SC","display"],
      ["Ultra","display"],["Titan One","display"],["Faster One","display"],
      ["Bungee","display"],["Bungee Shade","display"],
      ["Silkscreen","display"],["Black Ops One","display"],["Press Start 2P","display"],
      ["Monoton","display"],["Tourney","display"],["Sixtyfour","display"],
      // handwriting
      ["Caveat","handwriting"],["Dancing Script","handwriting"],["Pacifico","handwriting"],
      ["Lobster","handwriting"],["Satisfy","handwriting"],["Shadows Into Light","handwriting"],
      ["Great Vibes","handwriting"],["Sacramento","handwriting"],
      ["Kalam","handwriting"],["Patrick Hand","handwriting"],["Indie Flower","handwriting"],
      ["Permanent Marker","handwriting"],["Yellowtail","handwriting"],["Courgette","handwriting"],
      ["Marck Script","handwriting"],["Allura","handwriting"],
      // mono
      ["JetBrains Mono","mono"],["Roboto Mono","mono"],["Source Code Pro","mono"],
      ["Fira Code","mono"],["IBM Plex Mono","mono"],["Space Mono","mono"],
      ["Inconsolata","mono"],["DM Mono","mono"],
      ["Noto Sans Mono","mono"],["Courier Prime","mono"],["Anonymous Pro","mono"],
      ["Overpass Mono","mono"],["Red Hat Mono","mono"],["Azeret Mono","mono"],
      ["Geist Mono","mono"],["Martian Mono","mono"],
    ].map(([family, category]) => ({ family, category }));

    const CATEGORIES = ["all","sans","serif","display","handwriting","mono"];
    const WEIGHTS = [300, 400, 500, 600, 700];

    // ---- Lazy font loading (inject Google Fonts CSS per family on demand) --
    // Pass a weight to load that specific weight (for the chosen heading/body);
    // omit it to load the family's default (for browsing cards).
    const loaded = new Set();
    function loadFont(family, weight) {
      if (!family) return;
      const key = weight ? `${family}@${weight}` : family;
      if (loaded.has(key)) return;
      loaded.add(key);
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href =
        "https://fonts.googleapis.com/css2?family=" +
        family.replace(/ /g, "+") +
        (weight ? `:wght@${weight}` : "") +
        "&display=swap";
      document.head.appendChild(link);
    }

    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) {
          loadFont(e.target.dataset.family);
          io.unobserve(e.target);
        }
      }
    }, { root: document.getElementById("font-list"), rootMargin: "200px" });

    // ---- State -------------------------------------------------------------
    const state = {
      filter: "all",
      query: "",
      heading: { family: null, weight: 600 },
      body: { family: null, weight: 400 },
      colors: [
        { name: "Primary", value: "#6e6154" },
        { name: "Background", value: "#f7f5f0" },
        { name: "Text", value: "#2a2a28" },
      ],
    };

    // ---- Font browser ------------------------------------------------------
    const listEl = document.getElementById("font-list");

    function renderChips() {
      const chips = document.getElementById("chips");
      chips.innerHTML = "";
      for (const c of CATEGORIES) {
        const el = document.createElement("button");
        el.className = "chip" + (state.filter === c ? " active" : "");
        el.textContent = c;
        el.onclick = () => { state.filter = c; renderList(); };
        chips.appendChild(el);
      }
    }

    function renderList() {
      renderChips();
      listEl.innerHTML = "";
      const q = state.query.trim().toLowerCase();
      const items = FONTS.filter(
        (f) =>
          (state.filter === "all" || f.category === state.filter) &&
          (!q || f.family.toLowerCase().includes(q)),
      );
      for (const f of items) {
        const card = document.createElement("div");
        card.className = "font-card";
        card.dataset.family = f.family;

        const meta = document.createElement("div");
        meta.className = "font-meta";
        const sample = document.createElement("div");
        sample.className = "font-sample";
        sample.style.fontFamily = `"${f.family}", ${cssFallback(f.category)}`;
        sample.textContent = f.family;
        const name = document.createElement("div");
        name.className = "font-name";
        name.textContent = f.category;
        meta.append(sample, name);

        const actions = document.createElement("div");
        actions.className = "font-actions";
        actions.append(
          assignBtn("Head", f.family, "heading"),
          assignBtn("Body", f.family, "body"),
        );

        card.append(meta, actions);
        listEl.appendChild(card);
        io.observe(card);
      }
    }

    function assignBtn(label, family, role) {
      const b = document.createElement("button");
      b.className = "btn assign" + (state[role].family === family ? " on" : "");
      b.textContent = label;
      b.onclick = () => {
        state[role].family = family;
        loadFont(family, state[role].weight);
        renderRoles();
        renderList();
      };
      return b;
    }

    function cssFallback(cat) {
      return cat === "serif" ? "serif"
        : cat === "mono" ? "monospace"
        : cat === "handwriting" ? "cursive"
        : "sans-serif";
    }

    // ---- Kit panel: roles + colors ----------------------------------------
    // Populate the weight <select>s once and wire their change handlers.
    function initWeightSelects() {
      for (const role of ["heading", "body"]) {
        const sel = document.getElementById(`${role}-weight`);
        sel.innerHTML = "";
        for (const w of WEIGHTS) {
          const opt = document.createElement("option");
          opt.value = w;
          opt.textContent = w;
          sel.appendChild(opt);
        }
        sel.value = state[role].weight;
        sel.addEventListener("change", () => {
          state[role].weight = +sel.value;
          loadFont(state[role].family, state[role].weight);
          renderRoles();
        });
      }
    }

    function renderRoles() {
      const set = (role, tagId, sampleId) => {
        const { family, weight } = state[role];
        document.getElementById(tagId).textContent =
          `${role === "heading" ? "Heading" : "Body"} — ${family || "none"}`;
        document.getElementById(`${role}-weight`).value = weight;
        const s = document.getElementById(sampleId);
        s.style.fontFamily = family ? `"${family}", sans-serif` : "var(--sans)";
        s.style.fontWeight = weight;
      };
      set("heading", "heading-tag", "heading-sample");
      set("body", "body-tag", "body-sample");
    }

    const paletteEl = document.getElementById("palette");
    function renderPalette() {
      paletteEl.innerHTML = "";
      state.colors.forEach((c, i) => {
        const chip = document.createElement("div");
        chip.className = "swatch-chip";

        // Hidden input Coloris binds to.
        const trigger = document.createElement("input");
        trigger.type = "text";
        trigger.className = "swatch-chip__trigger";
        trigger.setAttribute("data-coloris", "");
        trigger.value = c.value;
        trigger.addEventListener("input", () => {
          state.colors[i].value = trigger.value;
          block.style.background = trigger.value;
          hex.textContent = trigger.value;
        });

        const block = document.createElement("div");
        block.className = "swatch-chip__block";
        block.style.background = c.value;
        block.onclick = () => trigger.click();

        const nameEl = document.createElement("input");
        nameEl.className = "swatch-chip__name";
        nameEl.value = c.name;
        nameEl.title = c.name;
        nameEl.oninput = () => (state.colors[i].name = nameEl.value);

        const hex = document.createElement("div");
        hex.className = "swatch-chip__hex";
        hex.textContent = c.value;

        const del = document.createElement("button");
        del.className = "swatch-chip__del";
        del.title = "Remove";
        del.textContent = "×";
        del.onclick = () => { state.colors.splice(i, 1); renderPalette(); };

        chip.append(trigger, block, nameEl, hex, del);
        paletteEl.appendChild(chip);
      });
    }

    // Ensure Coloris is initialized (delegated mode picks up [data-coloris] inputs).
    // We no longer use <studio-color> in the palette, so boot it manually via a
    // transient element whose connectedCallback fires ensureColoris() internally.
    function initColoris() {
      const sc = document.createElement("studio-color");
      sc.style.display = "none";
      document.body.appendChild(sc);
      requestAnimationFrame(() => sc.remove());
    }

    document.getElementById("add-color").onclick = () => {
      state.colors.push({ name: "Color", value: "#6f7d6a" });
      renderPalette();
    };

    document.getElementById("search").oninput = (e) => {
      state.query = e.target.value;
      renderList();
    };

    // ---- Save kit (JSON) ---------------------------------------------------
    const statusEl = document.getElementById("status");
    const invoke = window.__TAURI__?.core?.invoke;
    let activePath = null; // set when opened via ?artifact=

    function buildKit() {
      const name = document.getElementById("kit-name").value.trim() || "Brand kit";
      return {
        kit: {
          kind: "brand-kit",
          version: 1,
          name,
          fonts: { heading: state.heading, body: state.body },
          colors: state.colors,
          savedAt: new Date().toISOString(),
        },
        name,
      };
    }

    // Save — overwrite the artifact we opened from.
    document.getElementById("save").onclick = async () => {
      const { kit } = buildKit();
      kit.name = document.getElementById("kit-name").value.trim() || kit.name;
      const content = JSON.stringify(kit, null, 2);
      try {
        await invoke("overwrite_artifact", { path: activePath, content });
        statusEl.textContent = "Saved.";
      } catch (err) {
        statusEl.textContent = "Save failed: " + err;
      }
    };

    // Duplicate — save as a new file under the kit name.
    document.getElementById("duplicate").onclick = async () => {
      const { kit, name } = buildKit();
      const content = JSON.stringify(kit, null, 2);

      if (invoke) {
        try {
          const path = await invoke("save_artifact", {
            kind: "brand-kit",
            name,
            content,
          });
          statusEl.textContent = "Saved → " + path;
        } catch (err) {
          statusEl.textContent = "Save failed: " + err;
        }
      } else {
        // Standalone (browser): download fallback.
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([content], { type: "application/json" }));
        a.download = name.replace(/[^a-z0-9]+/gi, "-").toLowerCase() + ".json";
        a.click();
        statusEl.textContent = "Downloaded " + a.download;
      }
    };

    // Normalize a font role to { family, weight }, tolerating the old
    // string-only shape ("Family") from kits saved before weights existed.
    function normFont(f, defWeight) {
      if (!f) return { family: null, weight: defWeight };
      if (typeof f === "string") return { family: f, weight: defWeight };
      return { family: f.family || null, weight: f.weight || defWeight };
    }

    // ---- Boot (open-on-artifact via ?artifact=<path>) ----------------------
    async function boot() {
      const artifactPath = new URLSearchParams(location.search).get("artifact");
      if (artifactPath && invoke) {
        try {
          const data = JSON.parse(await invoke("read_artifact", { path: artifactPath }));
          if (data.fonts) {
            state.heading = normFont(data.fonts.heading, 600);
            state.body = normFont(data.fonts.body, 400);
          }
          if (Array.isArray(data.colors)) state.colors = data.colors;
          if (data.name) document.getElementById("kit-name").value = data.name;
          loadFont(state.heading.family, state.heading.weight);
          loadFont(state.body.family, state.body.weight);
          activePath = artifactPath;
          document.getElementById("save").style.display = "";
        } catch (e) {
          statusEl.textContent = "Couldn't load artifact: " + e;
        }
      }
      initColoris();
      initWeightSelects();
      renderList();
      renderRoles();
      renderPalette();
    }
    boot();
  </script>
</body>
</html>
