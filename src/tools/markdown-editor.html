<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Markdown Editor</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../kit/kit.css" />
  <link rel="stylesheet" href="../kit/window-chrome.css" />
  <script type="module" src="../kit/components.js"></script>
  <style>
    /* System UI instead of the Runes Futura: this is a long-form writing
       surface, and SF is built for running text at small sizes. Scoped to
       this tool by overriding the tokens, so the rest of Studio keeps Futura. */
    :root {
      --sans: system-ui, -apple-system, "SF Pro Text", sans-serif;
      --serif: var(--sans);
      /* New York — Apple's system serif, drawn for reading and metrically
         matched to SF, so the toggle swaps voice without reflowing much. It
         ships with macOS, so nothing is downloaded (never a CDN, per the
         vendored-and-offline rule) and there's no new woff2 in src/vendor/.
         The rest is a fallback ladder for non-Apple engines. */
      --doc-serif: ui-serif, "New York", "Iowan Old Style", Charter, Georgia, serif;
      /* What the document (not the chrome) is set in. The bar stays SF either
         way — the toolbar shouldn't change voice with the prose. */
      --doc-font: var(--sans);
      --doc-size: 15px;
    }
    body.font-serif {
      --doc-font: var(--doc-serif);
      /* New York runs a little smaller than SF at the same size; a point back
         keeps the two modes optically level. */
      --doc-size: 16px;
    }

    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* One row: close dot + filename on the left, actions on the right (the
       Code Editor's layout). */
    #bar { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px; flex: none; }
    #bar .tb-group { display: flex; align-items: center; gap: 6px; min-width: 0; }
    #bar .spacer { flex: 1; }
    #main { flex: 1; min-height: 0; background: var(--bg); display: flex; flex-direction: column; }

    #filename { font-size: 13px; color: var(--text); opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; padding: 2px 5px; margin-left: -5px; border-radius: 5px; }
    /* Only hint that it's editable once there's a file to rename. */
    body:not(.no-file) #filename { cursor: text; }
    body:not(.no-file) #filename:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
    /* Sized to the name so the rest of the bar doesn't shift on click. */
    #filename-edit { font-size: 13px; padding: 2px 5px; margin-left: -5px; border: none; border-radius: 5px; background: var(--surface); color: var(--text); outline: 1px solid var(--accent, #888); min-width: 8ch; }
    #dirty { width: 7px; height: 7px; border-radius: 50%; background: var(--accent, #888); opacity: 0; transition: opacity 0.2s; flex: none; }
    #dirty.on { opacity: 0.9; }

    /* Stale indicator on Refresh — same treatment as the Code Editor's, so the
       two editors signal "the file moved under you" identically. */
    #refresh-btn { position: relative; }
    #refresh-btn .stale-dot {
      position: absolute; top: 2px; right: 2px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--rose);
      opacity: 0; transition: opacity var(--dur-fast);
    }
    #refresh-btn.stale .stale-dot { opacity: 1; }
    #refresh-btn.stale .mi { animation: mde-refresh-wiggle 1.8s var(--ease-standard) infinite; }
    @keyframes mde-refresh-wiggle {
      0%, 70%, 100% { transform: rotate(0); }
      80% { transform: rotate(-16deg); }
      90% { transform: rotate(10deg); }
    }

    /* Writing surface: one centered column, Typora-style. */
    #scroller { flex: 1; overflow-y: auto; min-height: 0; }
    #editor { max-width: 680px; margin: 0 auto; padding: 28px 40px 45vh; }

    .ProseMirror { outline: none; white-space: pre-wrap; word-wrap: break-word; font-family: var(--doc-font); font-size: var(--doc-size); line-height: 1.65; color: var(--text); }
    .ProseMirror p { margin: 0 0 0.9em; }
    .ProseMirror h1, .ProseMirror h2, .ProseMirror h3,
    .ProseMirror h4, .ProseMirror h5, .ProseMirror h6 { line-height: 1.25; margin: 1.4em 0 0.5em; font-weight: 600; }
    .ProseMirror h1 { font-size: 1.9em; margin-top: 0.6em; }
    .ProseMirror h2 { font-size: 1.5em; }
    .ProseMirror h3 { font-size: 1.2em; }
    .ProseMirror h4, .ProseMirror h5, .ProseMirror h6 { font-size: 1em; }
    .ProseMirror ul, .ProseMirror ol { padding-left: 1.5em; margin: 0 0 0.9em; }
    .ProseMirror li > p { margin-bottom: 0.25em; }
    .ProseMirror blockquote { margin: 0 0 0.9em; padding: 2px 0 2px 14px; border-left: 3px solid color-mix(in srgb, var(--text) 25%, transparent); color: color-mix(in srgb, var(--text) 70%, transparent); }
    .ProseMirror code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.88em; background: color-mix(in srgb, var(--text) 8%, transparent); border-radius: 4px; padding: 1px 4px; }
    .ProseMirror pre { background: color-mix(in srgb, var(--text) 6%, transparent); border-radius: var(--radius, 8px); padding: 12px 14px; margin: 0 0 0.9em; overflow-x: auto; }
    .ProseMirror pre code { background: none; padding: 0; font-size: 0.85em; line-height: 1.5; }
    .ProseMirror hr { border: none; border-top: 1px solid color-mix(in srgb, var(--text) 18%, transparent); margin: 1.6em 0; }
    .ProseMirror a { color: var(--accent, inherit); text-decoration: underline; text-underline-offset: 2px; }
    .ProseMirror img { max-width: 100%; border-radius: 4px; }
    /* Comments / raw HTML: still in the document and still editable, but set
       apart so they read as annotations rather than as body text. The `pre`
       rule above would otherwise give them a code block's slab. */
    .ProseMirror pre.md-html {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.8em; line-height: 1.5;
      color: color-mix(in srgb, var(--text) 45%, transparent);
      background: none; border-radius: 0;
      border-left: 2px solid color-mix(in srgb, var(--text) 15%, transparent);
      padding: 1px 0 1px 10px; margin: 0 0 0.9em; white-space: pre-wrap;
    }
    .ProseMirror .md-html-inline {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.8em;
      color: color-mix(in srgb, var(--text) 45%, transparent);
      background: color-mix(in srgb, var(--text) 5%, transparent);
      border-radius: 4px; padding: 0 3px;
    }
    /* Tables may break out of the text column: sized to their content (at
       least column width), capped near the window edge, centered on the
       column via the 50%/-50% trick. */
    .ProseMirror table {
      border-collapse: collapse; margin: 0 0 0.9em;
      width: max-content; min-width: 100%; max-width: calc(100vw - 64px);
      margin-left: 50%; transform: translateX(-50%);
    }
    .ProseMirror th, .ProseMirror td { border: 1px solid color-mix(in srgb, var(--text) 18%, transparent); padding: 5px 10px; text-align: left; vertical-align: top; }
    .ProseMirror th { font-weight: 600; background: color-mix(in srgb, var(--text) 4%, transparent); }
    .ProseMirror .selectedCell { background: color-mix(in srgb, var(--accent, #888) 14%, transparent); }

    /* Git-changed blocks: same teal/blue language as the Code Editor. */
    :root { --md-add-bar: #14b8a6; }
    body.diff-committed { --md-add-bar: #2563eb; }
    .md-changed { position: relative; }
    .md-changed::before {
      content: ""; position: absolute; left: -16px; top: 2px; bottom: 2px;
      width: 3px; border-radius: 2px; background: var(--md-add-bar); opacity: 0.75;
    }

    /* Empty state (no file open). */
    #empty { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text); opacity: 0.6; }
    body.no-file #empty { display: flex; }
    #empty .empty-actions { display: flex; gap: 8px; }
    body.no-file #scroller { display: none; }
    /* Nothing to act on until a file is open — only "Open…" stays. */
    body.no-file #table-btn, body.no-file #diff-mode, body.no-file #refresh-btn,
    body.no-file #code-btn, body.no-file #font-toggle { display: none; }

    /* Each half is set in the font it selects — the letterforms say which is
       which better than any icon pair could. */
    #font-sans { font-family: var(--sans); }
    #font-serif { font-family: var(--doc-serif); }
    .seg-toggle__btn { font-size: 13px; }
  </style>
</head>
<body>
  <div id="bar" data-window-bar>
    <div class="tb-group" data-window-close>
      <span id="filename" class="text-mono">No file</span>
      <input id="filename-edit" class="text-mono" spellcheck="false" hidden />
      <span id="dirty" title="Unsaved changes"></span>
    </div>
    <span class="spacer"></span>
    <div class="tb-group">
      <button class="btn btn-icon-only" id="new-btn" title="New document"><span class="mi ph ph-plus"></span></button>
      <div class="seg-toggle" id="font-toggle">
        <button class="seg-toggle__btn is-active" id="font-sans" title="Sans">Aa</button>
        <button class="seg-toggle__btn" id="font-serif" title="Serif">Aa</button>
      </div>
      <button class="btn btn-icon-only" id="refresh-btn" title="Reload file from disk"><span class="mi ph ph-arrow-clockwise"></span><span class="stale-dot"></span></button>
      <button class="btn btn-icon-only" id="table-btn" title="Insert table"><span class="mi ph ph-table"></span></button>
      <button class="btn btn-icon-only" id="diff-mode" title="Diff: uncommitted changes"><span class="mi ph ph-git-diff"></span></button>
      <button class="btn btn-icon-only" id="code-btn" title="Open in Code Editor"><span class="mi ph ph-code"></span></button>
      <button class="btn btn-icon-only" id="open-btn" title="Open file…"><span class="mi ph ph-folder-open"></span></button>
    </div>
  </div>
  <div id="main">
    <div id="empty">
      <span class="mi ph ph-note-pencil" style="font-size:40px"></span>
      <div class="text-body">Start a new document, or open one</div>
      <div class="empty-actions">
        <button class="btn btn-primary" id="empty-new">New</button>
        <button class="btn" id="empty-open">Open…</button>
      </div>
    </div>
    <div id="scroller"><div id="editor"></div></div>
  </div>

  <script type="module">
    import "../kit/window-chrome.js";
    import { hasTauri, invoke, listen, toast } from "../kit/app.js";
    import {
      EditorState, EditorView, Plugin, PluginKey, Decoration, DecorationSet,
      schema as baseSchema, defaultMarkdownParser, defaultMarkdownSerializer,
      Schema, MarkdownParser, MarkdownSerializer,
      baseKeymap, toggleMark, keymap, history, undo, redo, chainCommands,
      inputRules, wrappingInputRule, textblockTypeInputRule, InputRule, undoInputRule,
      splitListItem, liftListItem, sinkListItem, MarkdownIt, Selection,
      tableNodes, tableEditing, goToNextCell,
    } from "../vendor/prosemirror-md.js";

    // ---------- schema: CommonMark + GFM pipe tables ----------
    // Cells hold inline content directly (markdown table cells are single-line),
    // which keeps the parser simple and the serializer lossless.
    const schema = new Schema({
      nodes: baseSchema.spec.nodes
        .append(tableNodes({
          tableGroup: "block",
          cellContent: "inline*",
          cellAttributes: {},
        }))
        // HTML comments and raw HTML. Without these markdown-it (html: false)
        // hands them over as plain *text*, so `<!-- note -->` reads as body
        // prose sitting in the middle of the document. As their own nodes they
        // can be set apart visually and still round-trip verbatim.
        .append({
          html_block: {
            content: "text*", group: "block", code: true, defining: true, marks: "",
            toDOM: () => ["pre", { class: "md-html" }, ["code", 0]],
            parseDOM: [{ tag: "pre.md-html", preserveWhitespace: "full" }],
          },
          html_inline: {
            group: "inline", inline: true, atom: true,
            attrs: { content: { default: "" } },
            toDOM: (n) => ["span", { class: "md-html-inline" }, n.attrs.content],
          },
        }),
      marks: baseSchema.spec.marks,
    });

    // Remap the default parser/serializer onto the extended schema, plus the
    // table token/node handlers. markdown-it's commonmark preset has tables
    // off; .enable("table") turns on the GFM pipe-table rule only. `html: true`
    // is what makes comments arrive as html_block / html_inline tokens instead
    // of being flattened into ordinary text.
    const mdit = MarkdownIt("commonmark", { html: true }).enable("table");
    const parser = new MarkdownParser(schema, mdit, {
      ...defaultMarkdownParser.tokens,
      table: { block: "table" },
      thead: { ignore: true },
      tbody: { ignore: true },
      tr: { block: "table_row" },
      th: { block: "table_header" },
      td: { block: "table_cell" },
      html_block: { block: "html_block", noCloseToken: true },
      html_inline: { node: "html_inline", getAttrs: (tok) => ({ content: tok.content }) },
    });
    const serializer = new MarkdownSerializer({
      ...defaultMarkdownSerializer.nodes,
      table(state, node) {
        // Each cell is serialized on its own (wrapped in a one-paragraph doc)
        // rather than into the table's serializer state — writing into `state`
        // mid-block would swallow the block separator into the first cell.
        const cellText = (cell) =>
          serializer
            .serialize(schema.nodes.doc.create(null, [schema.nodes.paragraph.create(null, cell.content)]))
            .trim()
            .replace(/\n/g, " ")
            .replace(/\|/g, "\\|");
        const rows = [];
        node.forEach((row) => {
          const cells = [];
          row.forEach((cell) => cells.push(cellText(cell)));
          rows.push(cells);
        });
        const header = rows[0] || [];
        state.write("| " + header.join(" | ") + " |\n");
        state.write("|" + header.map(() => " --- |").join("") + "\n");
        for (const r of rows.slice(1)) state.write("| " + r.join(" | ") + " |\n");
        state.closeBlock(node);
      },
      table_row() {}, table_cell() {}, table_header() {},
      // Raw, verbatim — the whole point is that a comment survives a save byte
      // for byte, so nothing here may reformat it.
      html_block(state, node) { state.write(node.textContent); state.closeBlock(node); },
      html_inline(state, node) { state.text(node.attrs.content, false); },
    }, defaultMarkdownSerializer.marks);

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const sessionProject = params.get("session") || "";  // this window's project
    const sessionKey = "mde-last:" + (sessionProject || "none");

    let currentPath = "";
    let diskText = "";          // last text known to be on disk
    let dirty = false;
    let saveTimer = null;
    let diffMode = "working";   // "working" | "committed"
    let changedLines = new Set(); // 1-based new-file line numbers from git

    // ---------- diff decorations ----------
    const diffKey = new PluginKey("git-diff");
    const diffPlugin = new Plugin({
      key: diffKey,
      state: {
        init: () => DecorationSet.empty,
        apply(tr, set) {
          const next = tr.getMeta(diffKey);
          if (next) return next;
          return set.map(tr.mapping, tr.doc);
        },
      },
      props: { decorations(state) { return diffKey.getState(state); } },
    });

    // The same markdown-it instance also supplies token line maps: after a
    // save, disk text === serialized doc, so top-level token maps pair 1:1
    // with the doc's top-level children.
    function blockLineRanges(text) {
      const toks = mdit.parse(text, {});
      const ranges = [];
      for (const t of toks) {
        if (t.level !== 0 || !t.map) continue;
        if (t.type.endsWith("_open") || ["fence", "code_block", "hr", "html_block"].includes(t.type)) {
          ranges.push(t.map); // [startLine, endLine) 0-based
        }
      }
      return ranges;
    }

    function applyDiffDecorations() {
      if (!view) return;
      const doc = view.state.doc;
      const decos = [];
      if (changedLines.size) {
        const ranges = blockLineRanges(diskText);
        // Pair top-level doc children with top-level token ranges by index;
        // bail on mismatch rather than mis-tint.
        if (ranges.length === doc.childCount) {
          let pos = 0;
          for (let i = 0; i < doc.childCount; i++) {
            const node = doc.child(i);
            const [a, b] = ranges[i];
            let hit = false;
            for (let ln = a + 1; ln <= b; ln++) if (changedLines.has(ln)) { hit = true; break; }
            if (hit) decos.push(Decoration.node(pos, pos + node.nodeSize, { class: "md-changed" }));
            pos += node.nodeSize;
          }
        }
      }
      view.dispatch(view.state.tr.setMeta(diffKey, DecorationSet.create(doc, decos)));
    }

    // Parse a unified diff into the set of changed (added) new-file lines.
    function parseDiff(diff) {
      changedLines = new Set();
      let ln = 0;
      for (const line of diff.split("\n")) {
        const h = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
        if (h) { ln = parseInt(h[1], 10); continue; }
        if (line.startsWith("+++") || line.startsWith("---")) continue;
        if (line.startsWith("+")) { changedLines.add(ln); ln++; }
        else if (!line.startsWith("-")) ln++;
      }
    }

    async function refreshDiff() {
      if (!hasTauri || !currentPath) return;
      const cmd = diffMode === "committed" ? "git_diff_file_committed" : "git_diff_file";
      try {
        parseDiff(await invoke(cmd, { path: currentPath }));
      } catch {
        changedLines = new Set(); // not a repo, etc.
      }
      applyDiffDecorations();
    }

    // ---------- input rules (the Typora feel) ----------
    function markInputRule(regexp, markType) {
      return new InputRule(regexp, (state, match, start, end) => {
        const content = match[1];
        if (!content) return null;
        const from = start + match[0].indexOf(match[0].trimStart());
        return state.tr
          .delete(from, end)
          .insertText(content, from)
          .addMark(from, from + content.length, markType.create())
          .removeStoredMark(markType);
      });
    }

    const rules = inputRules({
      rules: [
        textblockTypeInputRule(/^(#{1,6})\s$/, schema.nodes.heading, (m) => ({ level: m[1].length })),
        wrappingInputRule(/^\s*>\s$/, schema.nodes.blockquote),
        wrappingInputRule(/^\s*([-+*])\s$/, schema.nodes.bullet_list),
        wrappingInputRule(
          /^(\d+)\.\s$/, schema.nodes.ordered_list,
          (m) => ({ order: +m[1] }),
          (m, node) => node.childCount + node.attrs.order === +m[1],
        ),
        textblockTypeInputRule(/^```$/, schema.nodes.code_block),
        new InputRule(/^(?:---|\*\*\*)$/, (state, match, start, end) =>
          state.tr.replaceRangeWith(start, end, schema.nodes.horizontal_rule.create())),
        markInputRule(/\*\*([^*]+)\*\*$/, schema.marks.strong),
        markInputRule(/(?<!\*)\*([^*\s][^*]*)\*$/, schema.marks.em),
        markInputRule(/(?<![_\w])_([^_\s][^_]*)_$/, schema.marks.em),
        markInputRule(/`([^`]+)`$/, schema.marks.code),
      ],
    });

    const keys = keymap({
      "Mod-b": toggleMark(schema.marks.strong),
      "Mod-i": toggleMark(schema.marks.em),
      "Mod-`": toggleMark(schema.marks.code),
      "Mod-z": undo,
      "Shift-Mod-z": redo,
      "Mod-y": redo,
      "Backspace": undoInputRule,
      "Enter": splitListItem(schema.nodes.list_item),
      "Tab": chainCommands(goToNextCell(1), sinkListItem(schema.nodes.list_item)),
      "Shift-Tab": chainCommands(goToNextCell(-1), liftListItem(schema.nodes.list_item)),
      "Mod-s": () => { flushSave(); return true; },
    });

    // ---------- editor ----------
    let view = null;
    function makeState(doc) {
      return EditorState.create({
        doc,
        plugins: [rules, keys, keymap(baseKeymap), history(), tableEditing(), diffPlugin],
      });
    }

    function mountEditor(markdown) {
      const doc = parser.parse(markdown);
      if (view) { view.updateState(makeState(doc)); return; }
      view = new EditorView($("editor"), {
        state: makeState(doc),
        dispatchTransaction(tr) {
          view.updateState(view.state.apply(tr));
          if (tr.docChanged) { setDirty(true); scheduleSave(); }
        },
      });
    }

    function serialize() { return serializer.serialize(view.state.doc); }
    window.__mde = { serialize: () => serialize() }; // console debugging

    // The filename + dot live in the window bar, which window-chrome.js strips
    // when a tool is embedded in an iframe — hence the optional chaining.
    function setDirty(on) { dirty = on; $("dirty")?.classList.toggle("on", on); }
    function setStale(on) { $("refresh-btn")?.classList.toggle("stale", on); }

    // Take the disk version, discarding anything unsaved. Only reachable from
    // the Refresh button, so it's a deliberate act.
    async function reloadFromDisk() {
      if (!hasTauri || !currentPath) return;
      setDirty(false);          // don't let a queued save race the reload
      await loadPath(currentPath);
      setStale(false);
    }

    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flushSave, 600);
    }

    async function flushSave() {
      clearTimeout(saveTimer);
      if (!dirty || !currentPath || !view) return;
      // The serializer doesn't end with a newline; without this every save
      // would strip a well-formed file's final newline and show up in git as
      // "\ No newline at end of file".
      let text = serialize();
      if (text && !text.endsWith("\n")) text += "\n";
      if (hasTauri) {
        try { await invoke("write_text_file", { path: currentPath, content: text }); }
        catch (e) { toast("Save failed: " + e); return; }
      }
      diskText = text;
      setDirty(false);
      setStale(false);          // our own write — not an external change
      refreshDiff();
    }

    // ---------- open / load ----------
    // A path that doesn't exist yet opens as an empty document (`vim foo.md`
    // semantics) — that's how "new file" works, and nothing is written to disk
    // until the first edit. Existence is checked rather than inferred from a
    // failed read: a file that exists but can't be read is a real error, and
    // treating it as empty would autosave the emptiness over it.
    // Point the window at a path: the one place currentPath, the bar label and
    // the restored-session key move together, so a rename can't leave one of
    // them on the old name.
    function setPath(path) {
      currentPath = path;
      if ($("filename")) $("filename").textContent = path.split("/").pop();
      localStorage.setItem(sessionKey, path);
    }

    // Opens can overlap — a boot-time collect racing a ping, or two files
    // opened in quick succession — and each await below is a chance for a
    // newer one to start. Without this guard the *slower* call finishes last
    // and paints its (older) file over the newer one, which is how the editor
    // ends up showing a previous file. Same generation-counter pattern as the
    // File Directory (docs/tools.md).
    let loadGeneration = 0;

    async function loadPath(path) {
      const generation = ++loadGeneration;
      await flushSave(); // don't drop edits in the previous file
      let text = "";
      if (hasTauri) {
        // One round trip on the common path — read, and only ask whether the
        // file exists if that *fails*. Checking first cost an extra IPC hop on
        // every open, which is most of what made this feel slower than the
        // Code Editor. The distinction still has to be made: a file that
        // exists but can't be read must not open empty, or autosave would
        // write the emptiness back over it.
        try {
          text = await invoke("read_text_file", { path });
        } catch (e) {
          const exists = await invoke("path_exists", { path }).catch(() => true);
          if (exists) { toast("Couldn't open: " + e); return; }
        }
      }
      if (generation !== loadGeneration) return;   // superseded while reading
      diskText = text;
      setDirty(false);
      setStale(false);          // just synced with disk by definition
      document.body.classList.remove("no-file");
      setPath(path);
      mountEditor(text);
      try {
        const color = await invoke("git_color_for_path", { path });
        if (generation !== loadGeneration) return;  // a newer file owns the bar now
        if (color) document.documentElement.style.setProperty("--titlebar-tint", color);
      } catch {}
      refreshDiff();
      view.focus();
    }

    async function pickFile() {
      try {
        const path = await invoke("pick_text_file");
        if (path) loadPath(path);
      } catch {}
    }

    // New document: an unused Untitled.md, not created on disk until it's typed
    // into (loadPath handles the not-yet-existing path). `dest` is "project"
    // (the project root, the default) or "docs" (the repo's docs/ folder) —
    // the main window's button passes it through the mde:new-file event.
    async function newFile(dest = "project") {
      if (!hasTauri) return;
      // Flush *before* asking for a name: a pending debounced write creates the
      // current document on disk, which changes which Untitled name is free.
      // Asking first would hand back the name this save is about to take, and
      // the "new" doc would open on the document you were just editing.
      await flushSave();
      // A rejected invoke and a null result mean different things: the first is
      // a real failure (an old build without the command, most often — Rust
      // changes need a Studio restart), the second is "no project to put it
      // in". Collapsing them reports a missing command as a missing project.
      let path;
      try {
        path = await invoke("new_markdown_path", { projectPath: sessionProject, dest });
      } catch (e) {
        toast("Couldn't start a new file: " + e);
        return;
      }
      if (!path) { toast("No active project to put a new file in"); return; }
      await loadPath(path);
    }

    // ---------- rename by clicking the filename ----------
    // Safe to click even though the bar is a Tauri drag region: only the bar
    // element itself carries the attribute, so events on its children are
    // ordinary clicks.
    function startRename() {
      if (!currentPath || !hasTauri) return;
      const span = $("filename"), input = $("filename-edit");
      const name = currentPath.split("/").pop();
      input.value = name;
      span.hidden = true;
      input.hidden = false;
      input.size = Math.max(name.length, 8);
      input.focus();
      // Select the stem only — the extension is rarely what's being changed.
      const dot = name.lastIndexOf(".");
      input.setSelectionRange(0, dot > 0 ? dot : name.length);
    }

    function endRename() {
      $("filename-edit").hidden = true;
      $("filename").hidden = false;
    }

    async function commitRename() {
      const input = $("filename-edit");
      if (input.hidden) return;           // already settled (Enter, then blur)
      const current = currentPath.split("/").pop();
      let name = input.value.trim();
      endRename();
      if (!name || name === current) return;
      // Keep it a Markdown file: a stray "Notes" would otherwise stop routing
      // to this editor and lose its rendering.
      if (!/\.(md|markdown)$/i.test(name)) name += ".md";
      if (name === current) return;

      // Any debounced write must land on the old path before it moves.
      await flushSave();

      const dir = currentPath.slice(0, currentPath.length - current.length);
      const next = dir + name;
      let existed = true;
      try { existed = await invoke("path_exists", { path: currentPath }); } catch {}

      if (existed) {
        try { await invoke("fs_rename", { path: currentPath, newName: name }); }
        catch (e) { toast(String(e)); return; }
      } else {
        // A new document that hasn't been typed into yet has nothing on disk to
        // rename, so this just moves the target — but it still must not land on
        // an existing file, or the next keystroke would autosave over it.
        let taken = false;
        try { taken = await invoke("path_exists", { path: next }); } catch {}
        if (taken) { toast(`"${name}" already exists here.`); return; }
      }
      setPath(next);
      refreshDiff();   // the new name has its own git history
      view?.focus();
    }

    $("filename").addEventListener("click", startRename);
    $("filename-edit").addEventListener("blur", commitRename);
    $("filename-edit").addEventListener("keydown", (e) => {
      e.stopPropagation();               // don't reach the editor's keymap
      if (e.key === "Enter") commitRename();
      else if (e.key === "Escape") { endRename(); view?.focus(); }
    });

    // (Bare arrows: a click event as newFile's `dest` would be nonsense.)
    $("refresh-btn").addEventListener("click", reloadFromDisk);
    $("new-btn").addEventListener("click", () => newFile());
    $("empty-new").addEventListener("click", () => newFile());
    $("open-btn").addEventListener("click", pickFile);
    $("empty-open").addEventListener("click", pickFile);
    $("code-btn").addEventListener("click", async () => {
      if (!currentPath) return;
      await flushSave();
      invoke("open_md_in_code_editor", { file: currentPath });
    });
    // Insert a 2-column table (header row + one body row) at the selection.
    $("table-btn").addEventListener("click", () => {
      if (!view) return;
      const { table, table_row, table_header, table_cell } = schema.nodes;
      const cells = (type) => [type.create(), type.create()];
      const node = table.create(null, [
        table_row.create(null, cells(table_header)),
        table_row.create(null, cells(table_cell)),
      ]);
      view.dispatch(view.state.tr.replaceSelectionWith(node).scrollIntoView());
      view.focus();
    });

    $("diff-mode").addEventListener("click", () => {
      diffMode = diffMode === "working" ? "committed" : "working";
      document.body.classList.toggle("diff-committed", diffMode === "committed");
      const b = $("diff-mode");
      b.classList.toggle("active", diffMode === "committed");
      b.title = diffMode === "committed" ? "Diff: last commit" : "Diff: uncommitted changes";
      refreshDiff();
    });

    // Sans <-> serif for the document only. A reading preference, not a
    // property of any one file, so it's remembered per tool rather than per
    // project and applied before the first paint below.
    function setFont(serif) {
      document.body.classList.toggle("font-serif", serif);
      $("font-sans")?.classList.toggle("is-active", !serif);
      $("font-serif")?.classList.toggle("is-active", serif);
      localStorage.setItem("mde-font", serif ? "serif" : "sans");
    }

    // A segmented control picks a mode rather than flipping one, so each half
    // sets its own state — clicking the already-active one does nothing.
    $("font-sans").addEventListener("click", () => { setFont(false); view?.focus(); });
    $("font-serif").addEventListener("click", () => { setFont(true); view?.focus(); });

    setFont(localStorage.getItem("mde-font") === "serif");

    // Clicking the empty space below the document puts the caret at the end
    // (Typora behavior) — the editor column has tall bottom padding, so most
    // "click anywhere to write" clicks land outside the ProseMirror node.
    $("scroller").addEventListener("mousedown", (e) => {
      if (!view || e.target.closest(".ProseMirror")) return;
      e.preventDefault();
      view.dispatch(view.state.tr.setSelection(Selection.atEnd(view.state.doc)));
      view.focus();
    });

    // Pick up external edits when the window regains focus — only when clean,
    // so a re-read never clobbers in-flight typing.
    // Flag the file as changed-on-disk rather than swapping it in underneath
    // the cursor: this editor autosaves, so a silent reload could land while
    // you're mid-sentence. Checked on focus and on a slow poll, same as the
    // Code Editor.
    async function checkStale() {
      if (!hasTauri || !currentPath || document.hidden) return;
      try {
        const text = await invoke("read_text_file", { path: currentPath });
        setStale(text !== diskText);
      } catch { /* deleted or unreadable — leave the flag as it was */ }
    }

    window.addEventListener("focus", checkStale);
    window.addEventListener("blur", flushSave);
    setInterval(checkStale, 2000);

    // ---------- launch ----------
    document.body.classList.add("no-file");
    if (hasTauri) {
      const myLabel = window.__TAURI__.window.getCurrentWindow().label;

      // The file to open is stashed in Rust under this window's label; taking
      // it is what opens it. Rust pings us when it stashes one for a window
      // that's already up, and we also collect on boot — so an open can't be
      // dropped just because the ping arrived before this listener existed
      // (a booting window, or one reloading under the dev watcher).
      const collectPending = async () => {
        const p = await invoke("take_pending_open", { label: myLabel }).catch(() => null);
        if (p) await loadPath(p);
        return !!p;
      };
      await listen("mde:check-pending", (e) => {
        const hint = e?.payload?.file;
        if (!hint) return collectPending();
        // Start reading immediately; drain the stash in the background purely
        // so a later boot doesn't reopen this file as if it were pending.
        invoke("take_pending_open", { label: myLabel }).catch(() => {});
        return loadPath(hint);
      });
      // Sent to this window only (emit_to), so no label check is needed: the
      // main window's "new Markdown doc" button asks an already-open editor to
      // make the document itself, so the flush happens before the name is
      // picked.
      listen("mde:new-file", (e) => newFile(e.payload || "project"));
      // Nothing waiting for us → restore the file this window had last time.
      // `loadGeneration` guards the case where a ping landed in the gap
      // between the listener registering and this line, and already claimed
      // the stash: the restore would otherwise load the *older* session file
      // on top of the file we were just asked to open.
      const collected = await collectPending();
      if (!collected && loadGeneration === 0) {
        const last = localStorage.getItem(sessionKey);
        if (last) loadPath(last);
      }
    } else {
      // Browser preview: sample document, no disk.
      currentPath = "";
      document.body.classList.remove("no-file");
      mountEditor("# Markdown Editor\n\nType **bold**, *italic*, `code` — they render as you close the syntax.\n\n<!-- Comments sit apart from the prose, and survive a save verbatim. -->\n\n- Lists\n- Work\n\n> So do blockquotes.\n\nInline ones <!-- like this --> stay put too.\n\n| Feature | Status |\n| --- | --- |\n| Tables | **yes** |\n| Tab between cells | yes |\n");
    }
  </script>
</body>
</html>
