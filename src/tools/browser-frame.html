<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Record</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="../kit/window-chrome.css" />
<script type="module" src="../kit/components.js"></script>
<script type="module" src="../kit/window-chrome.js"></script>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--text);
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  #titlebar {
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 14px;
  }

  #body {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 4px 16px 16px;
  }

  .row { display: flex; flex-direction: column; gap: 6px; }
  .pill-tabs { align-self: flex-start; }
  .pill-tab { display: inline-flex; align-items: center; gap: 5px; }

  /* Ratio tiles: each draws its own shape, so the choice reads at a glance. */
  #ratios { display: flex; gap: 8px; }
  .ratio {
    flex: 1 1 0;
    height: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    padding: 8px 0 6px;
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-muted);
    font: 12px var(--sans);
    cursor: pointer;
  }
  .ratio:hover { color: var(--text); }
  .ratio i {
    display: block;
    border: 1.5px solid currentColor;
    border-radius: 2px;
  }
  .ratio.is-active { color: var(--text); border-color: var(--accent); background: var(--surface); }
  .ratio.is-active i { background: var(--accent); border-color: var(--accent); }

  #actions { display: flex; align-items: center; gap: 10px; margin-top: auto; }
  #go { flex: 1 1 auto; justify-content: center; }

  /* Record: the tape-deck button from Workspace modes (a dot in a ring).
     Red on hover; while recording the dot becomes a stop square and pulses. */
  #rec {
    --rec: #d9412f;
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: var(--elevated);
    border: 1.5px solid var(--hairline-strong);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #rec i {
    display: block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-soft);
    transition: transform var(--dur-fast) var(--ease-standard), border-radius var(--dur-fast), background var(--dur-fast);
  }
  #rec:hover, #rec.is-live { border-color: var(--rec); box-shadow: 0 0 0 3px rgba(217, 65, 47, 0.14); }
  #rec:hover i, #rec.is-live i { background: var(--rec); }
  #rec:active i { transform: scale(0.85); }
  #rec.is-live i { width: 10px; height: 10px; border-radius: 2px; animation: rec-pulse 0.8s ease-in-out infinite alternate; }
  #rec:disabled { cursor: default; opacity: 0.6; }
  @keyframes rec-pulse { to { opacity: 0.35; } }

  #status { min-height: 32px; font-size: 11px; line-height: 1.45; }
  #status b { font-weight: 600; color: var(--text); }
  #status.warn { color: var(--text); }
</style>
</head>
<body>
  <div id="titlebar" data-window-bar>
    <div data-window-close></div>
  </div>

  <div id="body">
    <div class="row">
      <span class="label">Browser</span>
      <div class="pill-tabs" id="browsers">
        <button class="pill-tab" data-app="Safari"><span class="mi mi-sm ph ph-compass"></span>Safari</button>
        <button class="pill-tab" data-app="Google Chrome"><span class="mi mi-sm ph ph-google-chrome-logo"></span>Chrome</button>
      </div>
    </div>

    <div class="row">
      <span class="label">Aspect ratio</span>
      <div id="ratios">
        <button class="ratio" data-ratio="16:9"><i style="width:32px;height:18px"></i>16:9</button>
        <button class="ratio" data-ratio="1:1"><i style="width:22px;height:22px"></i>1:1</button>
        <button class="ratio" data-ratio="4:5"><i style="width:20px;height:25px"></i>4:5</button>
      </div>
    </div>

    <div class="row">
      <span class="label">Page size</span>
      <div class="pill-tabs" id="sizes">
        <button class="pill-tab" data-short="720">720p</button>
        <button class="pill-tab" data-short="1080">1080p</button>
      </div>
    </div>

    <div id="actions">
      <button class="btn btn-primary" id="go"></button>
      <button id="rec" title="Record the page area"><i></i></button>
    </div>
    <div id="status" class="text-muted"></div>
  </div>

<script type="module">
  import { hasTauri, invoke, esc } from "../kit/app.js";

  // ---- Persisted choices --------------------------------------------------
  const KEY = "browser-frame";
  let prefs = { app: "Safari", ratio: "16:9", short: 1080 };
  try { prefs = { ...prefs, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch {}
  if (![720, 1080].includes(prefs.short)) prefs.short = 1080;
  const save = () => {
    const { app, ratio, short } = prefs;
    try { localStorage.setItem(KEY, JSON.stringify({ app, ratio, short })); } catch {}
  };

  const $ = (s) => document.querySelector(s);
  const goBtn = $("#go"), recBtn = $("#rec"), statusEl = $("#status");

  function pick(groupSel, attr, value) {
    for (const b of document.querySelectorAll(`${groupSel} [data-${attr}]`)) {
      b.classList.toggle("is-active", b.dataset[attr] === String(value));
    }
  }
  function render() {
    pick("#browsers", "app", prefs.app);
    pick("#ratios", "ratio", prefs.ratio);
    pick("#sizes", "short", prefs.short);
    goBtn.textContent = `Frame ${prefs.app === "Safari" ? "Safari" : "Chrome"}`;
  }
  function wire(groupSel, attr, key, cast = String) {
    $(groupSel).addEventListener("click", (e) => {
      const b = e.target.closest(`[data-${attr}]`);
      if (!b) return;
      prefs[key] = cast(b.dataset[attr]);
      save(); render();
    });
  }
  wire("#browsers", "app", "app");
  wire("#ratios", "ratio", "ratio");
  wire("#sizes", "short", "short", Number);
  render();

  function show(html, warn = false) {
    statusEl.innerHTML = html;
    statusEl.classList.toggle("warn", warn);
  }

  // ---- Measuring ----------------------------------------------------------
  // `web_area` (the webarea Swift helper, AX API) returns the browser's front
  // window, its page area (the web view minus any docked inspector) and the
  // screen's visible frame — global points, top-left origin.
  const probe = (opts = {}) => invoke("web_area", { app: prefs.app, ...opts });

  // The page must stop short of the window's bottom edge, or its rounded
  // corners clip the recording. A bottom-docked inspector fills that strip;
  // Frame opens one (the helper's --inspector) when none is docked.
  const CORNER = 24;
  const clipsCorners = (m) => m.win.y + m.win.h - (m.page.y + m.page.h) < CORNER;
  const DOCK = {
    "Safari": "the dock-to-bottom button in the inspector's toolbar",
    "Google Chrome": "DevTools' ⋮ menu › Dock side › bottom",
  };
  // m.inspector: docked in this window (then it's on the side); otherwise it
  // opened in its own window.
  const cornerHint = (m) =>
    `The window's rounded corners will clip the bottom of the page — ${m.inspector
      ? "the inspector is docked on the side"
      : "the inspector opened in its own window"}. Dock it at the bottom (${DOCK[prefs.app]}), then Frame again.`;
  const NO_PAGE = "Couldn't find the page — open a tab with a web page.";

  // ---- Frame --------------------------------------------------------------
  // Size the window so the page area is exactly the ratio at the chosen size
  // (screen points — Retina records it at 2×), centered on its screen.
  async function frame() {
    if (!hasTauri) return show("Needs Studio to run.", true);
    goBtn.disabled = true;
    try {
      let m = await probe({ activate: true, inspector: true });
      if (!m.page) return show(NO_PAGE, true);
      const cw = m.win.w - m.page.w, ch = m.win.h - m.page.h;
      const s = m.screen;

      const [rw, rh] = prefs.ratio.split(":").map(Number);
      let unit = prefs.short / Math.min(rw, rh);
      const maxUnit = Math.min((s.w - cw) / rw, (s.h - ch) / rh);
      const fitted = unit > maxUnit;
      if (fitted) unit = Math.floor(maxUnit * s.scale / 2) * 2 / s.scale;
      const tw = Math.round(rw * unit), th = Math.round(rh * unit);

      const place = (W, H) => probe({ frame: [s.x + (s.w - W) / 2, s.y + (s.h - H) / 2, W, H] });
      m = await place(tw + cw, th + ch);
      // One correction pass: some chrome (Safari's tab bar, Chrome's
      // bookmarks bar) changes size as the window resizes.
      if (m.page && (m.page.w !== tw || m.page.h !== th)) {
        m = await place(m.win.w + tw - m.page.w, m.win.h + th - m.page.h);
      }
      if (!m.page) return show(NO_PAGE, true);

      const { w, h } = m.page;
      let msg = `Page <b>${w} × ${h}</b> pt · records <b>${w * s.scale} × ${h * s.scale}</b>`;
      if (w !== tw || h !== th) msg += `<br>Couldn't hit ${tw} × ${th} exactly.`;
      if (fitted) msg += "<br>Shrunk to fit this screen.";
      const clipped = clipsCorners(m);
      if (clipped) msg += `<br>${cornerHint(m)}`;
      show(msg, clipped);
    } catch (e) {
      show(esc(String(e)), true);
    } finally {
      goBtn.disabled = false;
    }
  }

  // ---- Record -------------------------------------------------------------
  // Records the page area wherever it is right now (screenrec helper,
  // ScreenCaptureKit); the movie goes into the active project's media/.
  let recStart = 0, recTimer = null, recNote = "";

  async function moviePath() {
    const project = await invoke("get_active_project").catch(() => null);
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    const name = `Screencap ${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} at ${p(d.getHours())}.${p(d.getMinutes())}.${p(d.getSeconds())}.mov`;
    return project?.path ? `${project.path}/media/${name}` : `~/Movies/${name}`;
  }

  function setLive(live) {
    recBtn.classList.toggle("is-live", live);
    recBtn.title = live ? "Stop recording" : "Record the page area";
    goBtn.disabled = live;
    clearInterval(recTimer);
    if (!live) return;
    const tick = () => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      show(`<b>Recording</b> · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}${recNote}`, !!recNote);
    };
    tick();
    recTimer = setInterval(tick, 500);
  }

  async function record() {
    if (!hasTauri) return show("Needs Studio to run.", true);
    recBtn.disabled = true;
    try {
      const m = await probe({ activate: true });
      if (!m.page) return show(NO_PAGE, true);
      const p = m.page;
      await invoke("screenrec_start", { x: p.x, y: p.y, w: p.w, h: p.h, path: await moviePath() });
      recNote = clipsCorners(m) ? `<br>${cornerHint(m)}` : "";
      recStart = Date.now();
      setLive(true);
    } catch (e) {
      show(/declined|TCC|permission/i.test(String(e)) && !/Accessibility/.test(String(e))
        ? "Allow Studio in System Settings › Privacy & Security › Screen Recording, then restart Studio."
        : esc(String(e)), true);
    } finally {
      recBtn.disabled = false;
    }
  }

  async function stop() {
    recBtn.disabled = true;
    try {
      const path = await invoke("screenrec_stop");
      setLive(false);
      show(`Saved <b>${esc(path.split("/").pop())}</b> · <a href="#" id="reveal">Show in Finder</a>`);
      $("#reveal").addEventListener("click", (e) => { e.preventDefault(); invoke("reveal_in_finder", { path }); });
    } catch (e) {
      setLive(false);
      show(esc(String(e)), true);
    } finally {
      recBtn.disabled = false;
    }
  }

  recBtn.addEventListener("click", () => (recBtn.classList.contains("is-live") ? stop() : record()));
  // Reopened mid-recording: pick the live state back up (timer restarts at 0).
  if (hasTauri) invoke("screenrec_active").then((live) => { if (live) { recStart = Date.now(); setLive(true); } });

  goBtn.addEventListener("click", frame);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !recBtn.classList.contains("is-live")) frame();
  });
</script>
</body>
</html>
