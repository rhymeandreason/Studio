<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Directory</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../kit/kit.css" />
  <link rel="stylesheet" href="../kit/window-chrome.css" />
  <script type="module" src="../kit/components.js"></script>
  <script type="module" src="../kit/window-chrome.js"></script>
  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--sans);
      /* Transparent for the custom window's rounded corners; the title bar and
         content rows carry the paper fill (see window-chrome.css). */
      background: transparent;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #titlebar {
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }
    /* Close dot + page title grouped at the left (the dot is injected into
       [data-window-close] by window-chrome.js). */
    .fd-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Toggled on by #text-scale-toggle — scales the whole window (text,
     * icons, spacing) rather than just bumping font-size, since leaving
     * paddings/line-heights fixed while only enlarging text looks cramped. */
    body.text-large {
      zoom: 1.2;
    }


    #empty {
      padding: 16px 14px;
      color: var(--text-muted);
      font-size: 12px;
    }

    #project-picker {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 6px 8px 14px;
      background: var(--bg);   /* paper fill below the bar (body is transparent) */
      border-radius: 0 0 var(--window-radius, 10px) var(--window-radius, 10px);
    }

    #project-picker .hint {
      padding: 8px 6px 10px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .proj-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12.5px;
    }

    .proj-item:hover {
      background: var(--project-hover, var(--surface));
    }

    body.has-project-color .proj-item:hover,
    body.has-project-color .proj-item:hover .mi,
    body.has-project-color .proj-item:hover .name {
      color: #000;
    }

    .proj-item .mi {
      font-size: 16px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .proj-item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #tree {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 2px 8px 14px;
      background: var(--bg);   /* paper fill below the bar (body is transparent) */
      border-radius: 0 0 var(--window-radius, 10px) var(--window-radius, 10px);
    }

    .group {
      margin-top: 10px;
    }

    .group:first-child {
      margin-top: 0;
    }

    .group-label {
      padding: 4px 6px 3px;
    }

    .node {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      border-radius: var(--radius-sm);
      cursor: default;
      font-size: 12.5px;
      line-height: 1.3;
      white-space: nowrap;
      /* Rows are drag handles, not text — without this, starting a drag paints
         a text selection across the tree. The rename field opts back in. */
      -webkit-user-select: none;
      user-select: none;
    }

    .node .rename {
      -webkit-user-select: text;
      user-select: text;
    }

    .node:hover {
      background: var(--project-hover, var(--surface));
    }

    .node .twirl {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-soft);
      transition: transform 0.12s ease;
      cursor: pointer;
    }

    .node.open .twirl {
      transform: rotate(90deg);
    }

    .node .twirl .mi {
      font-size: 14px;
    }

    .node .icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      color: var(--text-muted);
    }

    .node .icon .mi {
      font-size: 16px;
    }

    .node.dir > .icon .mi {
      color: var(--accent);
    }

    .node.artifact > .icon .mi {
      color: var(--accent);
    }

    .node.artifact .name {
      color: var(--text);
      cursor: pointer;
    }

    .node .name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

.node.file {
max-width:350px;
}

    .node.file .name {
      color: var(--text-muted);
    }

    /* Files changed in the last 24h get a dot in the (otherwise empty)
     * twirl slot, in the project color. A dot rather than tinted text: pale
     * project colors wash out as thin type, but hold up as a filled shape —
     * the faint ring keeps even the palest ones visible on the paper. */
    .node.file.recent .twirl::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--project-hover, var(--accent));
      box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.15);
    }

    /* On a highlighted row the fill *is* the project color, so the dot
       takes the row's ink instead (see the highlighted-row rules below). */
    body.has-project-color .node.file.recent:is(:hover, .selected) .twirl::after {
      background: #000;
      box-shadow: none;
    }

    body:not(.has-project-color) .node.file.recent.selected .twirl::after {
      background: #fff;
      box-shadow: none;
    }

    .node .open-browser {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: none;
      background: none;
      color: var(--text-soft);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.12s;
    }

    .node:hover .open-browser {
      opacity: 1;
    }

    .node .open-browser:hover {
      color: var(--accent);
    }

    .node .open-browser .mi {
      font-size: 14px;
    }

    .children {
      margin-left: 14px;
      border-left: 1px solid var(--hairline);
      padding-left: 0;
    }

    .row {
      display: flex;
      flex-direction: column;
    }

    /* ── Finder-like interaction states ─────────────────────────────────── */

    .node.selected {
      background: var(--project-hover, var(--accent));
    }

    /* Hovered and selected rows sit on a solid fill: the project color, or
       the dark accent when a row is selected without one. Every piece of
       row text switches to an ink that reads on that fill — the muted
       greys (file names, folder hints, git letters) don't. Plain hover
       without a project color is a pale surface, so it keeps the greys. */
    body.has-project-color .node:is(:hover, .selected),
    body.has-project-color .node:is(:hover, .selected) :is(.twirl, .icon .mi, .name, .name b, .open-browser) {
      color: #000;
    }

    body.has-project-color .node:is(:hover, .selected) :is(.where, .git-badge) {
      color: rgb(0 0 0 / 0.55);
    }

    body:not(.has-project-color) .node.selected,
    body:not(.has-project-color) .node.selected :is(.twirl, .icon .mi, .name, .name b, .open-browser) {
      color: #fff;
    }

    body:not(.has-project-color) .node.selected :is(.where, .git-badge) {
      color: rgb(255 255 255 / 0.7);
    }

    /* The folder a drag is currently hovering — outlined rather than filled so
       it stays legible on top of a .selected fill. */
    .node.drop-target {
      outline: 1.5px solid var(--accent);
      outline-offset: -1.5px;
    }

    /* Inline rename field — sized to sit exactly where the name text was, so
       committing doesn't visibly reflow the row. */
    .node .rename {
      flex: 1 1 auto;
      min-width: 0;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 3px;
      padding: 0 3px;
      margin: -1px 0;
      outline: none;
    }

    /* ── Go-to-file filter + working set ─────────────────────────────── */

    #filter-bar {
      flex-shrink: 0;
      padding: 2px 8px 6px;
      background: var(--bg);
    }

    #filter-bar[hidden] {
      display: none;
    }

    #filter {
      height: 26px;
      font-size: 12.5px;
    }

    /* Flat rows (working set, filter results): the name, then its folder in
       small muted text, then an optional git status letter. */
    .node.flat {
      max-width: none;
    }

    .node.flat .name {
      flex: 0 1 auto;
    }

    .node .where {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 6px;
      font-size: 11px;
      color: var(--text-soft);
    }

    .node .git-badge {
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-soft);
    }

    /* Matched letters in Go-to-file results. Class-level specificity on
       purpose, so the highlighted-row inks above can recolor them. */
    .node .name b {
      font-weight: inherit;
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    #results .empty {
      padding: 8px 6px;
      color: var(--text-muted);
      font-size: 12px;
    }

    #fd-menu {
      position: fixed;
      z-index: 50;
      min-width: 168px;
      padding: 4px;
      background: var(--bg);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      box-shadow: 0 6px 24px rgb(0 0 0 / 0.28);
      font-size: 12.5px;
    }

    #fd-menu[hidden] {
      display: none;
    }

    #fd-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 5px 8px;
      border: none;
      border-radius: 3px;
      background: none;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    #fd-menu button:hover {
      background: var(--project-hover, var(--surface));
    }

    body.has-project-color #fd-menu button:hover {
      color: #000;
    }

    #fd-menu hr {
      margin: 4px 6px;
      border: none;
      border-top: 1px solid var(--hairline);
    }

  </style>
</head>

<body>
  <div id="titlebar" data-window-bar>
    <div class="fd-title" data-window-close>
      <div class="page-title" id="page-title">File Directory</div>
    </div>
    <studio-toggle id="text-scale-toggle" title="Larger text"></studio-toggle>
  </div>
  <div id="project-picker" hidden></div>
  <div id="filter-bar" hidden>
    <input id="filter" class="field" placeholder="Go to file…" spellcheck="false" autocomplete="off" />
  </div>
  <div id="tree">
    <div id="working-set"></div>
    <div id="roots"></div>
    <div id="results" hidden></div>
  </div>
  <div id="fd-menu" hidden></div>

  <script type="module">
    import { hasTauri, invoke, listen, dragFilesOut, toast, esc } from '../kit/app.js';

    const tree = document.getElementById('tree');

    // Larger-text toggle — persisted across launches (not per-project, it's
    // a display preference). Wait for the custom element to upgrade before
    // touching .checked — setting it any earlier would shadow the
    // element's own getter/setter once it does upgrade.
    const TEXT_SCALE_KEY = 'studio-file-directory-text-large';
    customElements.whenDefined('studio-toggle').then(() => {
      const textScaleToggle = document.getElementById('text-scale-toggle');
      // Absent when embedded as a tab: window-chrome.js drops the titlebar.
      if (!textScaleToggle) return;
      textScaleToggle.checked = localStorage.getItem(TEXT_SCALE_KEY) === '1';
      document.body.classList.toggle('text-large', textScaleToggle.checked);
      textScaleToggle.addEventListener('change', () => {
        document.body.classList.toggle('text-large', textScaleToggle.checked);
        localStorage.setItem(TEXT_SCALE_KEY, textScaleToggle.checked ? '1' : '0');
      });
    });

    // Editor tool + icon per artifact kind (artifacts/<kind>/<name>.json),
    // mirroring src/artifacts.js's EDITOR map.
    const ARTIFACT_EDITOR = {
      'brand-kit': 'brand-explorer.html',
      'presentation': 'slides.html',
      'theme': 'theme-editor.html',
    };
    const ARTIFACT_ICON = {
      'brand-kit': 'palette',
      'presentation': 'slideshow',
      'theme': 'styles',
    };

    // artifacts/<kind>/<name>.json → kind, else null.
    function artifactKind(path) {
      const m = path.match(/\/artifacts\/([^/]+)\/[^/]+\.json$/);
      return m ? m[1] : null;
    }

    // Extensions that aren't useful to open as text in the Code Editor —
    // these fall back to revealing in Finder instead.
    const NON_CODE_EXT = new Set([
      'png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'heic', 'ico',
      'mp4', 'mov', 'webm', 'avi',
      'mp3', 'wav', 'aiff', 'm4a',
      'woff', 'woff2', 'ttf', 'otf',
      'zip', 'tar', 'gz', 'pdf',
    ]);

    function isCodeFile(name) {
      const ext = name.split('.').pop().toLowerCase();
      return !NON_CODE_EXT.has(ext);
    }

    function iconFor(entry, open) {
      if (entry.is_dir) return open ? 'folder_open' : 'folder';
      const kind = artifactKind(entry.path);
      if (kind && ARTIFACT_ICON[kind]) return ARTIFACT_ICON[kind];
      const ext = entry.name.split('.').pop().toLowerCase();
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'heic'].includes(ext)) return 'image';
      if (['mp4', 'mov', 'webm'].includes(ext)) return 'movie';
      if (['json'].includes(ext)) return 'data_object';
      if (['md', 'txt'].includes(ext)) return 'description';
      return 'draft';
    }

    // Per-project path lists in localStorage: { [projectPath]: [path, …] }.
    let currentProjectPath = null;

    function loadList(key) {
      try {
        const store = JSON.parse(localStorage.getItem(key)) || {};
        return store[currentProjectPath] || [];
      } catch {
        return [];
      }
    }

    function saveList(key, list) {
      if (!currentProjectPath) return;
      try {
        const store = JSON.parse(localStorage.getItem(key)) || {};
        store[currentProjectPath] = list;
        localStorage.setItem(key, JSON.stringify(store));
      } catch {}
    }

    // Remembers which folders are expanded, per project, across reloads.
    const EXPANDED_STORE_KEY = 'studio-file-directory-expanded';
    let expandedSet = new Set();

    function saveExpanded() {
      saveList(EXPANDED_STORE_KEY, [...expandedSet]);
    }

    // Pinned files/folders (right-click → Pin) and the files most recently
    // opened from this tool — together with git's changed files they make up
    // the "working set" shown above the tree.
    const PINS_KEY = 'studio-file-directory-pins';
    const RECENT_KEY = 'studio-file-directory-opened';
    const RECENT_MAX = 6;
    const CHANGED_MAX = 8;
    let pins = [];
    let recents = [];

    function togglePin(path) {
      pins = pins.includes(path) ? pins.filter((p) => p !== path) : [...pins, path];
      saveList(PINS_KEY, pins);
      renderWorkingSet();
    }

    function rememberOpened(path) {
      recents = [path, ...recents.filter((p) => p !== path)].slice(0, 20);
      saveList(RECENT_KEY, recents);
      renderWorkingSet();
    }

    // Keeps pins/recents pointing at the right files after a rename or move
    // (a folder's move carries everything under it). `to` null = gone (Trash).
    function remapStored(from, to) {
      const map = (list) => list.flatMap((p) => {
        if (p !== from && !p.startsWith(from + '/')) return [p];
        return to ? [to + p.slice(from.length)] : [];
      });
      pins = map(pins);
      recents = map(recents);
      saveList(PINS_KEY, pins);
      saveList(RECENT_KEY, recents);
    }

    // Files modified within this window are flagged "recent" in the tree.
    const RECENT_SECONDS = 24 * 60 * 60;

    // ── Selection ───────────────────────────────────────────────────────────
    // Paths, not elements: the tree is torn down and rebuilt wholesale on every
    // 'fs-changed', so element identity doesn't survive but the selection does.
    const selected = new Set();
    let anchorPath = null;   // shift-click range anchor

    function selPaths() {
      return [...selected];
    }

    // Repaints .selected across the live tree. Called after every selection
    // change instead of tracking per-node, which keeps the rebuild path honest.
    function paintSelection() {
      for (const node of tree.querySelectorAll('.node[data-path]')) {
        node.classList.toggle('selected', selected.has(node.dataset.path));
      }
    }

    // Every on-screen node in DOM order — the range shift-click walks, and the
    // order arrow keys follow. A path can show twice (working set + tree) and
    // hidden sections (tree while filtering) still hold nodes, so skip those.
    function visibleNodes() {
      return [...tree.querySelectorAll('.node[data-path]')].filter((n) => n.offsetParent);
    }

    // The first on-screen node for a path.
    function nodeFor(path) {
      return visibleNodes().find((n) => n.dataset.path === path) || null;
    }

    function clickSelect(path, e) {
      if (e.metaKey) {
        if (selected.has(path)) selected.delete(path);
        else selected.add(path);
        anchorPath = path;
      } else if (e.shiftKey && anchorPath) {
        const paths = visibleNodes().map((n) => n.dataset.path);
        const a = paths.indexOf(anchorPath);
        const b = paths.indexOf(path);
        if (a >= 0 && b >= 0) {
          selected.clear();
          for (let i = Math.min(a, b); i <= Math.max(a, b); i++) selected.add(paths[i]);
        }
      } else {
        selected.clear();
        selected.add(path);
        anchorPath = path;
      }
      paintSelection();
    }

    // ── Mutations ───────────────────────────────────────────────────────────
    // Each move batch is pushed here as its inverse, so Cmd+Z is just another
    // fs_move back to where things came from.
    const undoStack = [];

    // Rebuilt lazily to dodge the temporal dead zone — main() is defined below.
    const refresh = () => main();

    async function moveInto(paths, destDir) {
      // Dropping a folder onto one of its own children is caught in Rust, but
      // dropping onto itself is common enough (fat-finger) to swallow here.
      // De-duped because the same file can appear under two roots (a project
      // and a Repo/Folder entry inside it), and moving it twice would fail the
      // second time with the source already gone.
      const targets = [...new Set(paths)].filter((p) => p !== destDir);
      if (!targets.length) return;
      try {
        const moved = await invoke('fs_move', { paths: targets, destDir });
        if (!moved.length) return;
        for (const m of moved) remapStored(m.from, m.to);
        undoStack.push(moved);
        selected.clear();
        for (const m of moved) selected.add(m.from);
        toast(moved.length === 1 ? 'Moved 1 item' : `Moved ${moved.length} items`);
        await refresh();
      } catch (err) {
        toast(String(err));
        // Rebuild on failure too — the likeliest cause of a move failing is a
        // row pointing at a file that isn't there any more, and leaving that
        // stale row on screen invites the same failed drag again.
        await refresh();
      }
    }

    async function undoMove() {
      const batch = undoStack.pop();
      if (!batch) return;
      try {
        // Group by destination folder — one fs_move call per parent.
        const byDir = new Map();
        for (const m of batch) {
          const dir = m.to.slice(0, m.to.lastIndexOf('/'));
          if (!byDir.has(dir)) byDir.set(dir, []);
          byDir.get(dir).push(m.from);
        }
        selected.clear();
        for (const [dir, paths] of byDir) {
          await invoke('fs_move', { paths, destDir: dir });
        }
        for (const m of batch) {
          remapStored(m.from, m.to);
          selected.add(m.to);
        }
        toast('Move undone');
        await refresh();
      } catch (err) {
        toast(String(err));
      }
    }

    async function trashSelection() {
      const paths = selPaths();
      if (!paths.length) return;
      try {
        await invoke('fs_trash', { paths });
        for (const p of paths) remapStored(p, null);
        selected.clear();
        toast(paths.length === 1 ? 'Moved to Trash' : `${paths.length} items to Trash`);
        await refresh();
      } catch (err) {
        toast(String(err));
      }
    }

    // The path that should own a "New Folder" — the selected folder, else the
    // selected file's parent, else the project root.
    function newFolderParent() {
      const path = selPaths()[0];
      if (!path) return currentProjectPath;
      const node = nodeFor(path);
      if (node && node.classList.contains('dir')) return path;
      return path.slice(0, path.lastIndexOf('/'));
    }

    async function newFolder(dir) {
      if (!dir) return;
      try {
        const path = await invoke('fs_new_folder', { dir, name: 'untitled folder' });
        expandedSet.add(dir);
        saveExpanded();
        selected.clear();
        selected.add(path);
        await refresh();
        // Land straight in rename, the way Finder does.
        const node = nodeFor(path);
        if (node) node._beginRename();
      } catch (err) {
        toast(String(err));
      }
    }

    async function duplicate(path) {
      try {
        const made = await invoke('fs_duplicate', { path });
        selected.clear();
        selected.add(made);
        await refresh();
      } catch (err) {
        toast(String(err));
      }
    }

    function copyPaths() {
      const paths = selPaths();
      if (!paths.length) return;
      navigator.clipboard.writeText(paths.join('\n'));
      toast(paths.length === 1 ? 'Path copied' : `${paths.length} paths copied`);
    }

    // ── Context menu ────────────────────────────────────────────────────────
    const menu = document.getElementById('fd-menu');

    function closeMenu() {
      menu.hidden = true;
      menu.innerHTML = '';
    }

    function openMenu(x, y, items) {
      menu.innerHTML = '';
      for (const item of items) {
        if (item === '-') {
          menu.appendChild(document.createElement('hr'));
          continue;
        }
        const btn = document.createElement('button');
        btn.textContent = item.label;
        btn.addEventListener('click', () => {
          closeMenu();
          item.run();
        });
        menu.appendChild(btn);
      }
      // Placed offscreen-safe: measure once visible, then nudge back inside.
      menu.hidden = false;
      menu.style.left = '0px';
      menu.style.top = '0px';
      const r = menu.getBoundingClientRect();
      menu.style.left = Math.min(x, window.innerWidth - r.width - 4) + 'px';
      menu.style.top = Math.min(y, window.innerHeight - r.height - 4) + 'px';
    }

    window.addEventListener('pointerdown', (e) => {
      if (!menu.hidden && !menu.contains(e.target)) closeMenu();
    }, true);
    window.addEventListener('blur', closeMenu);

    // Opens a file the way double-click does — its artifact editor, the Code
    // Editor, or Finder — and remembers it for the working set's Recent list.
    function openFile(path) {
      const name = path.split('/').pop();
      const kind = artifactKind(path);
      const editor = kind && ARTIFACT_EDITOR[kind];
      if (editor) {
        invoke('open_tool', {
          file: editor,
          query: 'artifact=' + encodeURIComponent(path),
        }).catch(() => {});
      } else if (isCodeFile(name)) {
        invoke('open_file_in_code_editor', { file: path }).catch(() => {});
      } else {
        invoke('reveal_in_finder', { path }).catch(() => {});
      }
      rememberOpened(path);
    }

    // `flat` rows (working set, filter results) sit outside the hierarchy:
    // they show the file's folder as a muted hint (`where`), take an optional
    // git status `badge`, and open on a single click — they're shortcuts, so
    // Cmd/Shift-click is how you select one.
    async function buildNode(entry, isRoot = false, { flat = false, where = '', badge = '' } = {}) {
      const row = document.createElement('div');
      row.className = 'row';

      const isArtifact = !entry.is_dir && !!artifactKind(entry.path);
      const isRecent = !entry.is_dir && entry.modified > 0 &&
        (Date.now() / 1000 - entry.modified) < RECENT_SECONDS;
      const node = document.createElement('div');
      node.className = 'node ' + (entry.is_dir ? 'dir' : 'file') +
        (isArtifact ? ' artifact' : '') + (isRecent ? ' recent' : '') + (flat ? ' flat' : '');
      if (isArtifact) {
        node.title = 'Open in ' + ARTIFACT_EDITOR[artifactKind(entry.path)].replace('.html', '');
      } else if (!entry.is_dir && isCodeFile(entry.name)) {
        node.title = 'Open in Code Editor';
      }

      const twirl = document.createElement('span');
      twirl.className = 'twirl';
      if (entry.is_dir) {
        twirl.innerHTML = '<span class="mi">chevron_right</span>';
      }
      node.appendChild(twirl);

      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.innerHTML = `<span class="mi">${iconFor(entry, false)}</span>`;
      node.appendChild(icon);

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = entry.name;
      node.appendChild(name);

      if (flat) {
        const whereEl = document.createElement('span');
        whereEl.className = 'where';
        whereEl.textContent = where;
        node.appendChild(whereEl);
      }
      if (badge) {
        const badgeEl = document.createElement('span');
        badgeEl.className = 'git-badge';
        badgeEl.textContent = badge;
        badgeEl.title = 'Uncommitted change (git status)';
        node.appendChild(badgeEl);
      }

      node.dataset.path = entry.path;
      node.dataset.dir = entry.is_dir ? '1' : '';
      if (selected.has(entry.path)) node.classList.add('selected');

      // Drag past a small threshold hands the real file(s) to macOS. Dropping
      // in Finder MOVES them out of the project, like dragging between two
      // Finder windows; Option-drag copies instead, also like Finder. Dropping
      // back in this tree moves them between folders (see the tauri://drag-*
      // listeners below). A drag that never passes the threshold stays a plain
      // click, so click-to-select still works.
      node.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        if (e.target.closest('.twirl, .open-browser, .rename')) return;
        const startX = e.clientX, startY = e.clientY;
        let started = false;
        const onMove = async (ev) => {
          if (started) return;
          if (Math.hypot(ev.clientX - startX, ev.clientY - startY) < 5) return;
          started = true;
          cleanup();
          // Dragging an unselected row drags just that row, Finder-style.
          if (!selected.has(entry.path)) {
            selected.clear();
            selected.add(entry.path);
            anchorPath = entry.path;
            paintSelection();
          }
          // Modifier read at drag start, not at press — you can decide to copy
          // after you've already started moving.
          const removed = await dragFilesOut(selPaths(), { move: !ev.altKey });
          if (removed.length) {
            for (const p of removed) {
              selected.delete(p);
              remapStored(p, null);
            }
            await refresh();
          }
        };
        const cleanup = () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', cleanup);
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', cleanup);
      });

      // ── Inline rename ────────────────────────────────────────────────────
      // Swaps the name span for a field in place; Enter commits, Esc/blur
      // cancels. Exposed on the node so New Folder can jump straight into it.
      node._beginRename = () => {
        if (node.querySelector('.rename')) return;
        const input = document.createElement('input');
        input.className = 'rename';
        input.value = entry.name;
        name.replaceWith(input);
        input.focus();
        // Select the stem only, leaving the extension alone.
        const dot = entry.is_dir ? -1 : entry.name.lastIndexOf('.');
        input.setSelectionRange(0, dot > 0 ? dot : entry.name.length);

        let done = false;
        const cancel = () => {
          if (done) return;
          done = true;
          input.replaceWith(name);
        };
        const commit = async () => {
          if (done) return;
          const next = input.value.trim();
          if (!next || next === entry.name) return cancel();
          done = true;
          input.replaceWith(name);
          try {
            const path = await invoke('fs_rename', { path: entry.path, newName: next });
            remapStored(entry.path, path);
            selected.delete(entry.path);
            selected.add(path);
            await refresh();
          } catch (err) {
            toast(String(err));
          }
        };
        input.addEventListener('keydown', (e) => {
          e.stopPropagation();
          if (e.key === 'Enter') commit();
          else if (e.key === 'Escape') cancel();
        });
        input.addEventListener('blur', cancel);
      };

      node.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        // Right-clicking outside the selection retargets it, like Finder.
        if (!selected.has(entry.path)) {
          selected.clear();
          selected.add(entry.path);
          anchorPath = entry.path;
          paintSelection();
        }
        const many = selected.size > 1;
        const parentDir = entry.path.slice(0, entry.path.lastIndexOf('/'));
        openMenu(e.clientX, e.clientY, [
          ...(many ? [] : [
            { label: entry.is_dir ? 'Open' : 'Open in Editor', run: toggle },
            { label: pins.includes(pinKey(entry)) ? 'Unpin' : 'Pin to Top', run: () => togglePin(pinKey(entry)) },
          ]),
          { label: 'Reveal in Finder', run: () => invoke('reveal_in_finder', { path: entry.path }).catch(() => {}) },
          '-',
          ...(many ? [] : [
            { label: 'Rename…', run: () => node._beginRename() },
            { label: 'Duplicate', run: () => duplicate(entry.path) },
          ]),
          { label: 'New Folder', run: () => newFolder(entry.is_dir ? entry.path : parentDir) },
          '-',
          { label: many ? `Copy ${selected.size} Paths` : 'Copy Path', run: copyPaths },
          { label: many ? `Move ${selected.size} Items to Trash` : 'Move to Trash', run: trashSelection },
        ]);
      });

      const isHtml = !entry.is_dir && entry.name.toLowerCase().endsWith('.html');
      if (isHtml) {
        const browserBtn = document.createElement('button');
        browserBtn.className = 'open-browser';
        browserBtn.title = 'Open in browser';
        browserBtn.innerHTML = '<span class="mi">open_in_new</span>';
        browserBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          // Prefers the repo's running dev server over a file:// path — see
          // open_in_browser in lib.rs.
          invoke('open_in_browser', { path: entry.path }).catch(() => {});
        });
        node.appendChild(browserBtn);
      }

      row.appendChild(node);

      let childrenEl = null;
      let loaded = false;

      async function toggle() {
        if (!entry.is_dir) {
          openFile(entry.path);
          return;
        }
        const isOpen = node.classList.contains('open');
        if (isOpen) {
          node.classList.remove('open');
          icon.innerHTML = `<span class="mi">${iconFor(entry, false)}</span>`;
          // Keep childrenEl cached (just detach) so reopening doesn't refetch
          // and doesn't trip over a stale `loaded` flag with no element to show.
          if (childrenEl) childrenEl.remove();
          if (!isRoot) {
            expandedSet.delete(entry.path);
            saveExpanded();
          }
          return;
        }
        node.classList.add('open');
        icon.innerHTML = `<span class="mi">${iconFor(entry, true)}</span>`;
        if (!isRoot) {
          expandedSet.add(entry.path);
          saveExpanded();
        }
        if (!loaded) {
          loaded = true;
          try {
            const entries = await invoke('list_dir', { path: entry.path });
            childrenEl = document.createElement('div');
            childrenEl.className = 'children';
            for (const child of entries) {
              childrenEl.appendChild(await buildNode(child));
            }
          } catch {
            childrenEl = document.createElement('div');
            childrenEl.className = 'children';
          }
        }
        row.appendChild(childrenEl);
      }

      // Finder's split: the disclosure triangle expands on a single click, but
      // a click on the row only selects — opening takes a double-click.
      twirl.addEventListener('click', (e) => {
        e.stopPropagation();
        toggle();
      });
      node.addEventListener('click', (e) => {
        if (flat && !e.metaKey && !e.shiftKey) {
          selected.clear();
          paintSelection();
          toggle();
          if (!entry.is_dir) endFilter();
          return;
        }
        clickSelect(entry.path, e);
      });
      node.addEventListener('dblclick', () => { if (!flat) toggle(); });
      // Exposed so buildRoot can force-open the root directly — a synthetic
      // click() on .node wouldn't reach the listeners above, which live on
      // its twirl/name children, not .node itself.
      row._toggle = toggle;
      node._toggle = toggle;

      if (!isRoot && entry.is_dir && expandedSet.has(entry.path)) {
        await toggle();
      }

      return row;
    }

    // `collapsible` roots remember their open state like any folder instead of
    // always opening — used for the project folder when a Repo leads.
    async function buildRoot(label, path, { collapsible = false } = {}) {
      const group = document.createElement('div');
      group.className = 'group';

      if (label) {
        const groupLabel = document.createElement('div');
        groupLabel.className = 'group-label label eyebrow';
        groupLabel.textContent = label;
        group.appendChild(groupLabel);
      }

      try {
        await invoke('list_dir', { path });   // throws if unreadable
        const rootEntry = { name: path.split('/').filter(Boolean).pop() || path, path, is_dir: true };
        const rootRow = await buildNode(rootEntry, !collapsible);
        group.appendChild(rootRow);
        // Fixed roots open immediately; collapsible ones restore themselves.
        if (!collapsible) await rootRow._toggle();
      } catch {
        const err = document.createElement('div');
        err.className = 'node file';
        err.textContent = `(couldn't read ${path})`;
        group.appendChild(err);
      }

      return group;
    }

    // ── Working set ─────────────────────────────────────────────────────────
    // Flat shortcuts above the tree: Pinned, Recent (opened from here), and
    // Changed (uncommitted in the Repo). A path shows in the first that has it.
    const workingSetEl = document.getElementById('working-set');
    const rootsEl = document.getElementById('roots');
    let repoPath = null;
    let roots = [];              // every root path, Repo/Folders first
    let changed = new Map();     // abs path → git status code

    // A pinned folder is stored with a trailing slash, so it can be told
    // apart from a file without touching disk (and remapStored's prefix
    // match still carries it through renames).
    const pinKey = (entry) => entry.is_dir ? entry.path + '/' : entry.path;

    // A file's folder relative to its root — the muted hint on flat rows.
    function whereOf(path) {
      const root = roots.find((r) => path.startsWith(r + '/'));
      const rel = root ? path.slice(root.length + 1) : path;
      return rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
    }

    function flatEntry(path) {
      const is_dir = path.endsWith('/');
      if (is_dir) path = path.slice(0, -1);
      return { name: path.split('/').pop(), path, is_dir };
    }

    let workingSetGeneration = 0;

    async function renderWorkingSet() {
      const generation = ++workingSetGeneration;
      const shown = new Set();
      const take = (paths, max) => {
        const out = [];
        for (const p of paths) {
          const abs = p.endsWith('/') ? p.slice(0, -1) : p;
          if (shown.has(abs) || out.length >= max) continue;
          shown.add(abs);
          out.push(p);
        }
        return out;
      };
      // A recent file that git no longer lists (deleted, moved outside Studio)
      // drops out; files outside any git root can't be checked, so they stay.
      const known = new Set(searchIndex.map((f) => f.path));
      const inGitRoot = (p) => roots.some((r) => r !== currentProjectPath && p.startsWith(r + '/'));
      const liveRecents = recents.filter((p) => known.has(p) || !inGitRoot(p));
      const changedPaths = [...changed.keys()];

      const sections = [
        ['Pinned', take(pins, Infinity), 0],
        ['Recent', take(liveRecents, RECENT_MAX), 0],
        ['Changed', take(changedPaths, CHANGED_MAX), 0],
      ];
      sections[2][2] = changedPaths.filter((p) => !shown.has(p)).length;

      const groups = [];
      for (const [label, paths, more] of sections) {
        if (!paths.length) continue;
        const group = document.createElement('div');
        group.className = 'group';
        const heading = document.createElement('div');
        heading.className = 'group-label label eyebrow';
        heading.textContent = more ? `${label} · ${more} more` : label;
        group.appendChild(heading);
        for (const p of paths) {
          const entry = flatEntry(p);
          group.appendChild(await buildNode(entry, false, {
            flat: true,
            where: whereOf(entry.path),
            badge: changed.get(entry.path) || '',
          }));
        }
        groups.push(group);
      }
      if (generation !== workingSetGeneration) return;
      workingSetEl.replaceChildren(...groups);
    }

    // ── Go to file ──────────────────────────────────────────────────────────
    // Type anywhere (or Cmd+F) to filter every file git knows about in the Repo
    // and Folders — fuzzy, filename-first. ↑↓ pick, Enter opens, Esc clears.
    const filterBar = document.getElementById('filter-bar');
    const filterInput = document.getElementById('filter');
    const resultsEl = document.getElementById('results');
    const RESULTS_MAX = 40;
    let searchIndex = [];        // { path, rel, name, lname, lrel }

    async function buildSearchIndex(gitRoots) {
      const lists = await Promise.all(gitRoots.map((root) =>
        invoke('git_ls_files', { repo: root })
          .then((rels) => rels.map((rel) => {
            const name = rel.split('/').pop();
            return { path: root + '/' + rel, rel, name, lname: name.toLowerCase(), lrel: rel.toLowerCase() };
          }))
          .catch(() => [])));   // not a git repo — nothing to index
      return lists.flat();
    }

    // Greedy subsequence match of q in s, scoring runs and word starts.
    // Returns { score, idx } (matched positions) or null.
    function matchIn(q, s) {
      let score = 0, prev = -2, j = 0;
      const idx = [];
      for (let i = 0; i < s.length && j < q.length; i++) {
        if (s[i] !== q[j]) continue;
        let pts = 1;
        if (i === prev + 1) pts += 4;
        if (i === 0 || '/-_. '.includes(s[i - 1])) pts += 3;
        score += pts;
        idx.push(i);
        prev = i;
        j++;
      }
      return j === q.length ? { score, idx } : null;
    }

    // Filename matches outrank path-only matches; shorter paths break ties,
    // and files already in the working set float up.
    function scoreFile(q, f) {
      let hit = matchIn(q, f.lname);
      let score;
      if (hit) {
        score = 40 + hit.score + (f.lname.startsWith(q) ? 25 : 0);
      } else {
        hit = matchIn(q, f.lrel);
        if (!hit) return null;
        score = hit.score;
        hit.idx = [];   // matched across the path — nothing to mark in the name
      }
      const r = recents.indexOf(f.path);
      if (pins.includes(f.path)) score += 15;
      if (r >= 0) score += 12 - Math.min(r, 10);
      if (changed.has(f.path)) score += 5;
      return { score: score - f.rel.length * 0.02, idx: hit.idx };
    }

    function markName(name, idx) {
      const hits = new Set(idx);
      return [...name].map((ch, i) => hits.has(i) ? `<b>${esc(ch)}</b>` : esc(ch)).join('');
    }

    function showingResults(on) {
      workingSetEl.hidden = on;
      rootsEl.hidden = on;
      resultsEl.hidden = !on;
    }

    let resultsGeneration = 0;

    async function renderResults() {
      const generation = ++resultsGeneration;
      const q = filterInput.value.toLowerCase().replace(/\s+/g, '');
      if (!q) {
        showingResults(false);
        resultsEl.replaceChildren();
        return;
      }
      const hits = [];
      for (const f of searchIndex) {
        const m = scoreFile(q, f);
        if (m) hits.push({ f, ...m });
      }
      hits.sort((a, b) => b.score - a.score);

      const rows = [];
      for (const { f, idx } of hits.slice(0, RESULTS_MAX)) {
        const row = await buildNode({ name: f.name, path: f.path, is_dir: false }, false, {
          flat: true,
          where: whereOf(f.path),
          badge: changed.get(f.path) || '',
        });
        row.querySelector('.name').innerHTML = markName(f.name, idx);
        rows.push(row);
      }
      if (generation !== resultsGeneration) return;
      if (!rows.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = searchIndex.length
          ? 'No matching files'
          : 'Nothing to search — Go to file covers the project’s Repo and Folders';
        rows.push(empty);
      }
      resultsEl.replaceChildren(...rows);
      showingResults(true);
      // The top hit is pre-selected, so Enter opens it straight away.
      selected.clear();
      if (hits.length) selected.add(hits[0].f.path);
      paintSelection();
      tree.scrollTop = 0;
    }

    function endFilter() {
      if (!filterInput.value && document.activeElement !== filterInput) return;
      filterInput.value = '';
      filterInput.blur();
      selected.clear();
      renderResults();
    }

    filterInput.addEventListener('input', renderResults);
    // The document handler below steps aside for this field, so the tree's
    // own shortcuts (Enter = rename, arrows) don't also fire.
    filterInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        endFilter();
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const nodes = visibleNodes();
        if (!nodes.length) return;
        const i = nodes.findIndex((n) => selected.has(n.dataset.path));
        const next = nodes[Math.max(0, Math.min(nodes.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
        selected.clear();
        selected.add(next.dataset.path);
        paintSelection();
        next.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const path = selPaths()[0];
        if (!path || resultsEl.hidden) return;
        openFile(path);
        endFilter();
      }
    });

    const picker = document.getElementById('project-picker');

    async function showProjectPicker() {
      tree.hidden = true;
      filterBar.hidden = true;
      rootsEl.innerHTML = '';
      workingSetEl.innerHTML = '';
      searchIndex = [];
      picker.hidden = false;
      picker.innerHTML = '';
      document.body.style.removeProperty('--project-hover');
      document.body.classList.remove('has-project-color');

      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = 'No active Studio project — pick one:';
      picker.appendChild(hint);

      let projects = [];
      try {
        projects = await invoke('list_projects');
      } catch {}

      if (!projects.length) {
        const empty = document.createElement('div');
        empty.id = 'empty';
        empty.textContent = 'No projects found.';
        picker.appendChild(empty);
        return;
      }

      for (const p of projects) {
        const item = document.createElement('div');
        item.className = 'proj-item';
        item.innerHTML = `<span class="mi">folder</span><span class="name">${p.name}</span>`;
        item.addEventListener('click', async () => {
          await invoke('open_project', { path: p.path }).catch(() => {});
          main();
        });
        picker.appendChild(item);
      }
    }

    const pageTitle = document.getElementById('page-title');

    // Guards against overlapping main() runs (e.g. the initial call racing a
    // 'project-activated' event fired while the first is still mid-await) —
    // without this, both runs append their own root groups and the tree
    // ends up duplicated.
    let mainGeneration = 0;

    async function main() {
      const generation = ++mainGeneration;
      const project = await invoke('get_active_project').catch(() => null);
      if (generation !== mainGeneration) return;
      if (!project) {
        if (pageTitle) pageTitle.textContent = 'File Directory';
        await showProjectPicker();
        return;
      }

      if (pageTitle) pageTitle.textContent = project.name;
      picker.hidden = true;
      tree.hidden = false;
      filterBar.hidden = false;

      currentProjectPath = project.path;
      expandedSet = new Set(loadList(EXPANDED_STORE_KEY));
      pins = loadList(PINS_KEY);
      recents = loadList(RECENT_KEY);

      const workspace = await invoke('read_workspace', { path: project.path }).catch(() => ({}));
      if (generation !== mainGeneration) return;

      // Hover backgrounds use the project's accent color when set (same
      // accent used to tint Git/Code Editor windows for this project),
      // with black text/icons for contrast against it.
      if (workspace.color) {
        document.body.style.setProperty('--project-hover', workspace.color);
        document.body.classList.add('has-project-color');
      } else {
        document.body.style.removeProperty('--project-hover');
        document.body.classList.remove('has-project-color');
      }

      // Where the code lives is what gets browsed, so a Repo leads and the
      // project folder (notes, media, artifacts) folds up underneath it.
      repoPath = workspace.repo || null;
      const gitRoots = [...(repoPath ? [repoPath] : []), ...(workspace.folders || [])];
      roots = [...gitRoots, project.path];
      const [index, status] = await Promise.all([
        buildSearchIndex(gitRoots),
        repoPath ? invoke('git_status', { repo: repoPath }).catch(() => null) : null,
      ]);
      if (generation !== mainGeneration) return;
      searchIndex = index;
      changed = new Map();
      for (const f of status?.files || []) {
        if (f.path.endsWith('/') || f.status.includes('D')) continue;   // dirs, deletions
        changed.set(repoPath + '/' + f.path, f.status.trim());
      }

      const groups = [];
      if (repoPath) groups.push(await buildRoot('Repo', repoPath));
      for (const folder of workspace.folders || []) groups.push(await buildRoot('Folder', folder));
      groups.push(await buildRoot(repoPath ? 'Project' : null, project.path, { collapsible: !!repoPath }));
      if (generation !== mainGeneration) return;
      rootsEl.replaceChildren(...groups);
      await renderWorkingSet();
      if (filterInput.value.trim()) await renderResults();

      // The global watcher only covers ~/Projects; extend it to the Repo and
      // Folder entries (often elsewhere) so edits there also fire 'fs-changed'.
      if (hasTauri) {
        const extra = [...(workspace.repo ? [workspace.repo] : []), ...(workspace.folders || [])];
        invoke('watch_extra_paths', { paths: extra }).catch(() => {});
      }
    }

    // ── Dropping in ─────────────────────────────────────────────────────────
    // One path for both cases: a drag started in this tree leaves the window as
    // a real macOS drag and comes back as an OS drop, so Finder drops and
    // internal moves land in the same handler.

    let dropNode = null;      // the .node currently highlighted
    let springTimer = null;   // spring-loaded folder: hover to auto-expand

    // Drag positions arrive relative to the WINDOW's content area. Tauri types
    // them as PhysicalPosition, but on macOS wry passes AppKit points straight
    // through (`convertPoint:fromView:nil` in wry's drag_drop.rs) — they're
    // already CSS pixels, so dividing by devicePixelRatio would land the drop
    // half a window too high. When this page is the Files tab it's an iframe
    // partway down the main window, so subtract its offset as well.
    function toCss(position) {
      let x = position.x, y = position.y;
      const frame = window.frameElement;
      if (frame) {
        const box = frame.getBoundingClientRect();
        x -= box.left;
        y -= box.top;
      }
      return { x, y };
    }

    // The folder a drop at this point lands in: a folder row itself, a file
    // row's parent, or — over empty tree space — the project root.
    function dropDirAt(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el || !tree.contains(el)) return null;
      const node = el.closest('.node[data-path]');
      if (!node) return currentProjectPath;
      if (node.dataset.dir) return node.dataset.path;
      return node.dataset.path.slice(0, node.dataset.path.lastIndexOf('/'));
    }

    function highlightDrop(dir) {
      const next = dir ? nodeFor(dir) : null;
      if (next === dropNode) return;
      if (dropNode) dropNode.classList.remove('drop-target');
      dropNode = next;
      clearTimeout(springTimer);
      if (!dropNode) return;
      dropNode.classList.add('drop-target');
      // Hovering a closed folder for a beat opens it, so you can drill down
      // mid-drag without letting go.
      if (dropNode.dataset.dir && !dropNode.classList.contains('open')) {
        const target = dropNode;
        springTimer = setTimeout(() => target._toggle && target._toggle(), 700);
      }
    }

    function clearDrop() {
      clearTimeout(springTimer);
      if (dropNode) dropNode.classList.remove('drop-target');
      dropNode = null;
    }

    // ── Keyboard ────────────────────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.target === filterInput) return;      // has its own handler
      if (e.target.closest('.rename')) return;   // rename field owns its keys
      const paths = selPaths();

      if (!filterBar.hidden) {
        // Type to filter: a plain printable key anywhere starts a search.
        if (e.key.length === 1 && e.key !== ' ' && !e.metaKey && !e.ctrlKey && !e.altKey) {
          e.preventDefault();
          closeMenu();
          filterInput.focus();
          filterInput.value += e.key;
          renderResults();
          return;
        }
        if (e.metaKey && ['f', 'p'].includes(e.key.toLowerCase()) && !e.shiftKey) {
          e.preventDefault();
          filterInput.focus();
          filterInput.select();
          return;
        }
      }

      if (e.key === 'Escape') {
        selected.clear();
        paintSelection();
        closeMenu();
        return;
      }
      if (e.metaKey && e.key === 'z') {
        e.preventDefault();
        undoMove();
        return;
      }
      if (e.metaKey && (e.key === 'Backspace' || e.key === 'Delete')) {
        e.preventDefault();
        trashSelection();
        return;
      }
      if (e.metaKey && e.altKey && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        copyPaths();
        return;
      }
      if (e.metaKey && e.shiftKey && e.key.toLowerCase() === 'n') {
        e.preventDefault();
        newFolder(newFolderParent());
        return;
      }
      if (!paths.length) return;
      const node = nodeFor(paths[paths.length - 1]);
      if (!node) return;

      if (e.key === 'Enter') {
        e.preventDefault();
        node._beginRename();
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const nodes = visibleNodes();
        const i = nodes.indexOf(node);
        const next = nodes[i + (e.key === 'ArrowDown' ? 1 : -1)];
        if (next) {
          clickSelect(next.dataset.path, e);
          next.scrollIntoView({ block: 'nearest' });
        }
      } else if (e.key === 'ArrowRight' && node.dataset.dir && !node.classList.contains('open')) {
        e.preventDefault();
        node._toggle();
      } else if (e.key === 'ArrowLeft' && node.classList.contains('open')) {
        e.preventDefault();
        node._toggle();
      }
    });

    // Clicking empty tree space deselects; right-clicking it offers New Folder
    // at the project root.
    tree.addEventListener('click', (e) => {
      if (e.target.closest('.node')) return;
      selected.clear();
      paintSelection();
    });
    tree.addEventListener('contextmenu', (e) => {
      if (e.target.closest('.node')) return;
      e.preventDefault();
      openMenu(e.clientX, e.clientY, [
        { label: 'New Folder', run: () => newFolder(currentProjectPath) },
      ]);
    });

    main();

    if (hasTauri) {
      listen('tauri://drag-over', (e) => {
        const { x, y } = toCss(e.payload.position);
        highlightDrop(dropDirAt(x, y));
      });
      listen('tauri://drag-leave', clearDrop);
      listen('tauri://drag-drop', async (e) => {
        const { x, y } = toCss(e.payload.position);
        const dir = dropDirAt(x, y);
        clearDrop();
        const paths = e.payload.paths || [];
        if (dir && paths.length) await moveInto(paths, dir);
      });

      listen('project-activated', () => main());
      // Studio's recursive watcher over ~/Projects broadcasts this on any
      // relevant change; rebuild the tree (expanded folders persist via
      // expandedSet/localStorage, so this doesn't reset the view).
      listen('fs-changed', () => main());
    }
  </script>
</body>

</html>
