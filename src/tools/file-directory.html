<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Directory</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../kit/kit.css" />
  <link rel="stylesheet" href="../kit/window-chrome.css" />
  <script type="module" src="../kit/components.js"></script>
  <script type="module" src="../kit/window-chrome.js"></script>
  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--sans);
      /* Transparent for the custom window's rounded corners; the title bar and
         content rows carry the paper fill (see window-chrome.css). */
      background: transparent;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #titlebar {
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }
    /* Close dot + page title grouped at the left (the dot is injected into
       [data-window-close] by window-chrome.js). */
    .fd-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Toggled on by #text-scale-toggle — scales the whole window (text,
     * icons, spacing) rather than just bumping font-size, since leaving
     * paddings/line-heights fixed while only enlarging text looks cramped. */
    body.text-large {
      zoom: 1.2;
    }


    #empty {
      padding: 16px 14px;
      color: var(--text-muted);
      font-size: 12px;
    }

    #project-picker {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 6px 8px 14px;
      background: var(--bg);   /* paper fill below the bar (body is transparent) */
      border-radius: 0 0 var(--window-radius, 10px) var(--window-radius, 10px);
    }

    #project-picker .hint {
      padding: 8px 6px 10px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .proj-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12.5px;
    }

    .proj-item:hover {
      background: var(--project-hover, var(--surface));
    }

    body.has-project-color .proj-item:hover,
    body.has-project-color .proj-item:hover .mi,
    body.has-project-color .proj-item:hover .name {
      color: #000;
    }

    .proj-item .mi {
      font-size: 16px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .proj-item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #tree {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 2px 8px 14px;
      background: var(--bg);   /* paper fill below the bar (body is transparent) */
      border-radius: 0 0 var(--window-radius, 10px) var(--window-radius, 10px);
    }

    .group {
      margin-top: 10px;
    }

    .group:first-child {
      margin-top: 0;
    }

    .group-label {
      padding: 4px 6px 3px;
    }

    .node {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      border-radius: var(--radius-sm);
      cursor: default;
      font-size: 12.5px;
      line-height: 1.3;
      white-space: nowrap;
    }

    .node:hover {
      background: var(--project-hover, var(--surface));
    }

    body.has-project-color .node:hover,
    body.has-project-color .node:hover .twirl,
    body.has-project-color .node:hover .icon .mi,
    body.has-project-color .node:hover .name,
    body.has-project-color .node:hover .open-browser {
      color: #000;
    }

    .node .twirl {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-soft);
      transition: transform 0.12s ease;
      cursor: pointer;
    }

    .node.open .twirl {
      transform: rotate(90deg);
    }

    .node .twirl .mi {
      font-size: 14px;
    }

    .node .icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      color: var(--text-muted);
    }

    .node .icon .mi {
      font-size: 16px;
    }

    .node.dir > .icon .mi {
      color: var(--accent);
    }

    .node.artifact > .icon .mi {
      color: var(--accent);
    }

    .node.artifact .name {
      color: var(--text);
      cursor: pointer;
    }

    .node .name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

.node.file {
max-width:350px;
}

    .node.file .name {
      color: var(--text-muted);
    }

    /* Files changed in the last 24h — flagged with the same tint used for
     * hover, so they stand out while browsing the tree. */
    .node.file.recent .name {
      color: var(--project-hover, orange);
    }

    .node .open-browser {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: none;
      background: none;
      color: var(--text-soft);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.12s;
    }

    .node:hover .open-browser {
      opacity: 1;
    }

    .node .open-browser:hover {
      color: var(--accent);
    }

    .node .open-browser .mi {
      font-size: 14px;
    }

    .children {
      margin-left: 14px;
      border-left: 1px solid var(--hairline);
      padding-left: 0;
    }

    .row {
      display: flex;
      flex-direction: column;
    }

  </style>
</head>

<body>
  <div id="titlebar" data-window-bar>
    <div class="fd-title" data-window-close>
      <div class="page-title" id="page-title">File Directory</div>
    </div>
    <studio-toggle id="text-scale-toggle" title="Larger text"></studio-toggle>
  </div>
  <div id="project-picker" hidden></div>
  <div id="tree"></div>

  <script type="module">
    import { hasTauri, invoke, listen, dragFilesOut } from '../kit/app.js';

    const tree = document.getElementById('tree');

    // Larger-text toggle — persisted across launches (not per-project, it's
    // a display preference). Wait for the custom element to upgrade before
    // touching .checked — setting it any earlier would shadow the
    // element's own getter/setter once it does upgrade.
    const TEXT_SCALE_KEY = 'studio-file-directory-text-large';
    customElements.whenDefined('studio-toggle').then(() => {
      const textScaleToggle = document.getElementById('text-scale-toggle');
      // Absent when embedded as a tab: window-chrome.js drops the titlebar.
      if (!textScaleToggle) return;
      textScaleToggle.checked = localStorage.getItem(TEXT_SCALE_KEY) === '1';
      document.body.classList.toggle('text-large', textScaleToggle.checked);
      textScaleToggle.addEventListener('change', () => {
        document.body.classList.toggle('text-large', textScaleToggle.checked);
        localStorage.setItem(TEXT_SCALE_KEY, textScaleToggle.checked ? '1' : '0');
      });
    });

    // Editor tool + icon per artifact kind (artifacts/<kind>/<name>.json),
    // mirroring src/artifacts.js's EDITOR map.
    const ARTIFACT_EDITOR = {
      'brand-kit': 'brand-explorer.html',
      'presentation': 'slides.html',
      'theme': 'theme-editor.html',
    };
    const ARTIFACT_ICON = {
      'brand-kit': 'palette',
      'presentation': 'slideshow',
      'theme': 'styles',
    };

    // artifacts/<kind>/<name>.json → kind, else null.
    function artifactKind(path) {
      const m = path.match(/\/artifacts\/([^/]+)\/[^/]+\.json$/);
      return m ? m[1] : null;
    }

    // Extensions that aren't useful to open as text in the Code Editor —
    // these fall back to revealing in Finder instead.
    const NON_CODE_EXT = new Set([
      'png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'heic', 'ico',
      'mp4', 'mov', 'webm', 'avi',
      'mp3', 'wav', 'aiff', 'm4a',
      'woff', 'woff2', 'ttf', 'otf',
      'zip', 'tar', 'gz', 'pdf',
    ]);

    function isCodeFile(name) {
      const ext = name.split('.').pop().toLowerCase();
      return !NON_CODE_EXT.has(ext);
    }

    function iconFor(entry, open) {
      if (entry.is_dir) return open ? 'folder_open' : 'folder';
      const kind = artifactKind(entry.path);
      if (kind && ARTIFACT_ICON[kind]) return ARTIFACT_ICON[kind];
      const ext = entry.name.split('.').pop().toLowerCase();
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'heic'].includes(ext)) return 'image';
      if (['mp4', 'mov', 'webm'].includes(ext)) return 'movie';
      if (['json'].includes(ext)) return 'data_object';
      if (['md', 'txt'].includes(ext)) return 'description';
      return 'draft';
    }

    // Remembers which folders are expanded, per project, across reloads.
    const EXPANDED_STORE_KEY = 'studio-file-directory-expanded';
    let currentProjectPath = null;
    let expandedSet = new Set();

    function loadExpanded(projectPath) {
      try {
        const store = JSON.parse(localStorage.getItem(EXPANDED_STORE_KEY)) || {};
        return new Set(store[projectPath] || []);
      } catch {
        return new Set();
      }
    }

    function saveExpanded() {
      if (!currentProjectPath) return;
      try {
        const store = JSON.parse(localStorage.getItem(EXPANDED_STORE_KEY)) || {};
        store[currentProjectPath] = [...expandedSet];
        localStorage.setItem(EXPANDED_STORE_KEY, JSON.stringify(store));
      } catch {}
    }

    // Files modified within this window are flagged "recent" in the tree.
    const RECENT_SECONDS = 24 * 60 * 60;

    async function buildNode(entry, isRoot = false) {
      const row = document.createElement('div');
      row.className = 'row';

      const isArtifact = !entry.is_dir && !!artifactKind(entry.path);
      const isRecent = !entry.is_dir && entry.modified > 0 &&
        (Date.now() / 1000 - entry.modified) < RECENT_SECONDS;
      const node = document.createElement('div');
      node.className = 'node ' + (entry.is_dir ? 'dir' : 'file') +
        (isArtifact ? ' artifact' : '') + (isRecent ? ' recent' : '');
      if (isArtifact) {
        node.title = 'Open in ' + ARTIFACT_EDITOR[artifactKind(entry.path)].replace('.html', '');
      } else if (!entry.is_dir && isCodeFile(entry.name)) {
        node.title = 'Open in Code Editor';
      }

      const twirl = document.createElement('span');
      twirl.className = 'twirl';
      if (entry.is_dir) {
        twirl.innerHTML = '<span class="mi">chevron_right</span>';
      }
      node.appendChild(twirl);

      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.innerHTML = `<span class="mi">${iconFor(entry, false)}</span>`;
      node.appendChild(icon);

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = entry.name;
      node.appendChild(name);

      // Option-drag drags the real file/folder OUT to Finder, a file picker, or
      // a web "drop here" zone. Plain click still opens/expands.
      node.addEventListener('pointerdown', (e) => {
        if (!e.altKey || e.button !== 0) return;
        e.preventDefault();
        dragFilesOut([entry.path]);
      });

      const isHtml = !entry.is_dir && entry.name.toLowerCase().endsWith('.html');
      if (isHtml) {
        const browserBtn = document.createElement('button');
        browserBtn.className = 'open-browser';
        browserBtn.title = 'Open in browser';
        browserBtn.innerHTML = '<span class="mi">open_in_new</span>';
        browserBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          // Prefers the repo's running dev server over a file:// path — see
          // open_in_browser in lib.rs.
          invoke('open_in_browser', { path: entry.path }).catch(() => {});
        });
        node.appendChild(browserBtn);
      }

      row.appendChild(node);

      let childrenEl = null;
      let loaded = false;

      async function toggle() {
        if (!entry.is_dir) {
          const kind = artifactKind(entry.path);
          const editor = kind && ARTIFACT_EDITOR[kind];
          if (editor) {
            invoke('open_tool', {
              file: editor,
              query: 'artifact=' + encodeURIComponent(entry.path),
            }).catch(() => {});
          } else if (isCodeFile(entry.name)) {
            invoke('open_file_in_code_editor', { file: entry.path }).catch(() => {});
          } else {
            invoke('reveal_in_finder', { path: entry.path }).catch(() => {});
          }
          return;
        }
        const isOpen = node.classList.contains('open');
        if (isOpen) {
          node.classList.remove('open');
          icon.innerHTML = `<span class="mi">${iconFor(entry, false)}</span>`;
          // Keep childrenEl cached (just detach) so reopening doesn't refetch
          // and doesn't trip over a stale `loaded` flag with no element to show.
          if (childrenEl) childrenEl.remove();
          if (!isRoot) {
            expandedSet.delete(entry.path);
            saveExpanded();
          }
          return;
        }
        node.classList.add('open');
        icon.innerHTML = `<span class="mi">${iconFor(entry, true)}</span>`;
        if (!isRoot) {
          expandedSet.add(entry.path);
          saveExpanded();
        }
        if (!loaded) {
          loaded = true;
          try {
            const entries = await invoke('list_dir', { path: entry.path });
            childrenEl = document.createElement('div');
            childrenEl.className = 'children';
            for (const child of entries) {
              childrenEl.appendChild(await buildNode(child));
            }
          } catch {
            childrenEl = document.createElement('div');
            childrenEl.className = 'children';
          }
        }
        row.appendChild(childrenEl);
      }

      twirl.addEventListener('click', toggle);
      name.addEventListener('click', toggle);
      // Exposed so buildRoot can force-open the root directly — a synthetic
      // click() on .node wouldn't reach the listeners above, which live on
      // its twirl/name children, not .node itself.
      row._toggle = toggle;

      if (!isRoot && entry.is_dir && expandedSet.has(entry.path)) {
        await toggle();
      }

      return row;
    }

    async function buildRoot(label, path) {
      const group = document.createElement('div');
      group.className = 'group';

      if (label) {
        const groupLabel = document.createElement('div');
        groupLabel.className = 'group-label label eyebrow';
        groupLabel.textContent = label;
        group.appendChild(groupLabel);
      }

      try {
        const entries = await invoke('list_dir', { path });
        const rootEntry = { name: path.split('/').filter(Boolean).pop() || path, path, is_dir: true };
        const rootRow = await buildNode(rootEntry, true);
        group.appendChild(rootRow);
        // Auto-expand the root so its contents are visible immediately.
        await rootRow._toggle();
      } catch {
        const err = document.createElement('div');
        err.className = 'node file';
        err.textContent = `(couldn't read ${path})`;
        group.appendChild(err);
      }

      return group;
    }

    const picker = document.getElementById('project-picker');

    async function showProjectPicker() {
      tree.hidden = true;
      tree.innerHTML = '';
      picker.hidden = false;
      picker.innerHTML = '';
      document.body.style.removeProperty('--project-hover');
      document.body.classList.remove('has-project-color');

      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = 'No active Studio project — pick one:';
      picker.appendChild(hint);

      let projects = [];
      try {
        projects = await invoke('list_projects');
      } catch {}

      if (!projects.length) {
        const empty = document.createElement('div');
        empty.id = 'empty';
        empty.textContent = 'No projects found.';
        picker.appendChild(empty);
        return;
      }

      for (const p of projects) {
        const item = document.createElement('div');
        item.className = 'proj-item';
        item.innerHTML = `<span class="mi">folder</span><span class="name">${p.name}</span>`;
        item.addEventListener('click', async () => {
          await invoke('open_project', { path: p.path }).catch(() => {});
          main();
        });
        picker.appendChild(item);
      }
    }

    const pageTitle = document.getElementById('page-title');

    // Guards against overlapping main() runs (e.g. the initial call racing a
    // 'project-activated' event fired while the first is still mid-await) —
    // without this, both runs append their own root groups and the tree
    // ends up duplicated.
    let mainGeneration = 0;

    async function main() {
      const generation = ++mainGeneration;
      const project = await invoke('get_active_project').catch(() => null);
      if (generation !== mainGeneration) return;
      if (!project) {
        if (pageTitle) pageTitle.textContent = 'File Directory';
        await showProjectPicker();
        return;
      }

      if (pageTitle) pageTitle.textContent = project.name;
      picker.hidden = true;
      tree.hidden = false;
      tree.innerHTML = '';

      currentProjectPath = project.path;
      expandedSet = loadExpanded(project.path);

      const workspace = await invoke('read_workspace', { path: project.path }).catch(() => ({}));
      if (generation !== mainGeneration) return;

      // Hover backgrounds use the project's accent color when set (same
      // accent used to tint Git/Code Editor windows for this project),
      // with black text/icons for contrast against it.
      if (workspace.color) {
        document.body.style.setProperty('--project-hover', workspace.color);
        document.body.classList.add('has-project-color');
      } else {
        document.body.style.removeProperty('--project-hover');
        document.body.classList.remove('has-project-color');
      }

      const root = await buildRoot(null, project.path);
      if (generation !== mainGeneration) return;
      tree.appendChild(root);

      if (workspace.repo) {
        const repoRoot = await buildRoot('Repo', workspace.repo);
        if (generation !== mainGeneration) return;
        tree.appendChild(repoRoot);
      }
      for (const folder of workspace.folders || []) {
        const folderRoot = await buildRoot('Folder', folder);
        if (generation !== mainGeneration) return;
        tree.appendChild(folderRoot);
      }

      // The global watcher only covers ~/Projects; extend it to the Repo and
      // Folder entries (often elsewhere) so edits there also fire 'fs-changed'.
      if (hasTauri) {
        const extra = [...(workspace.repo ? [workspace.repo] : []), ...(workspace.folders || [])];
        invoke('watch_extra_paths', { paths: extra }).catch(() => {});
      }
    }

    main();

    if (hasTauri) {
      listen('project-activated', () => main());
      // Studio's recursive watcher over ~/Projects broadcasts this on any
      // relevant change; rebuild the tree (expanded folders persist via
      // expandedSet/localStorage, so this doesn't reset the view).
      listen('fs-changed', () => main());
    }
  </script>
</body>

</html>
