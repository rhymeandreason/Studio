<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAM Overview</title>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #efece5;
    --border: #2a2a28;
    --hairline: rgba(42, 42, 40, 0.1);
    --text: #2a2a28;
    --text-muted: #8a8678;
    --mono: "SF Mono", Menlo, monospace;
    --sans: "Futura", "Futura PT", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #header {
    padding: 34px 18px 10px;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 600;
  }

  #current {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-family: var(--mono);
    font-size: 12px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
  }

  #list-wrap {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 6px 18px 14px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
  }

  th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 500;
    padding: 4px 0;
    border-bottom: 1px solid var(--hairline);
    position: sticky;
    top: 0;
    background: var(--bg);
  }

  td {
    padding: 3px 0;
    border-bottom: 1px solid var(--hairline);
  }

  th:last-child, td:last-child {
    text-align: right;
  }
</style>
</head>
<body>
  <div id="header" data-tauri-drag-region>RAM overview</div>
  <div id="current">Loading…</div>
  <div id="list-wrap">
    <table>
      <thead>
        <tr><th>Process</th><th>RAM</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;

    async function refresh() {
      const current = document.getElementById("current");
      const list = document.getElementById("list");
      try {
        const [stats, procs] = await Promise.all([
          invoke("get_memory_stats"),
          invoke("get_top_processes"),
        ]);

        const lines = [
          `Memory: ${stats.system_used_gb.toFixed(1)} / ${stats.system_total_gb.toFixed(0)} GB`,
          `Studio app: ${stats.app_mb.toFixed(0)} MB`,
          `Swap used: ${stats.swap_used_mb.toFixed(0)} MB`,
        ];
        if (stats.dev_server_mb) {
          lines.push(`Dev server: ${stats.dev_server_mb.toFixed(0)} MB`);
        }
        current.innerHTML = "";
        for (const line of lines) {
          const div = document.createElement("div");
          div.textContent = line;
          current.append(div);
        }

        list.innerHTML = "";
        for (const p of procs) {
          const tr = document.createElement("tr");
          const label = p.count > 1 ? `${p.name} (${p.count})` : p.name;
          const tdName = document.createElement("td");
          tdName.textContent = label;
          const tdMb = document.createElement("td");
          tdMb.textContent = `${p.mb.toFixed(0)} MB`;
          tr.append(tdName, tdMb);
          list.append(tr);
        }
      } catch (err) {
        current.textContent = `Error: ${err}`;
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
  <script type="module">
    import { initDevInspect } from "../devinspect.js";
    initDevInspect();
  </script>
</body>
</html>
