<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotlight</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    height: 100vh;
    overflow: hidden;
    font-family: var(--font-ui, "Futura PT", sans-serif);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
    outline: none;
  }

  #hexagon {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 620px;
    height: 540px;
    transform: translate(-50%, -50%);
    background: #0047ab;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
    z-index: 0;
  }

  #list {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    -webkit-app-region: no-drag;
    max-height: 460px;
    overflow-y: auto;
  }

  #list::-webkit-scrollbar { display: none; }

  .tool {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: rgba(255, 255, 255, 0.45);
    transition: opacity 0.12s, color 0.12s, transform 0.12s;
    white-space: nowrap;
  }

  .tool.active {
    color: #fff;
    transform: scale(1.04);
  }

  .tool:focus { outline: none; }

  #empty {
    position: relative;
    z-index: 1;
    font-size: 22px;
    color: rgba(255, 255, 255, 0.6);
    -webkit-app-region: no-drag;
  }
</style>
</head>
<body tabindex="-1">
  <div id="hexagon"></div>
  <div id="list"></div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;
    const win = getCurrentWindow();

    const listEl = document.getElementById('list');

    // Drive window size from JS so it can be tuned with a reload (no restart).
    const { LogicalSize } = window.__TAURI__.dpi;
    win.setSize(new LogicalSize(900, 660)).then(() => win.center()).catch(() => {});

    let tools = [];
    let activeIndex = 0;

    async function loadTools() {
      tools = await invoke('list_tools').catch(() => []);
      tools.sort((a, b) => a.name.localeCompare(b.name));
      activeIndex = 0;
      render();
    }

    function render() {
      listEl.innerHTML = '';
      if (!tools.length) {
        const empty = document.createElement('div');
        empty.id = 'empty';
        empty.tabIndex = 0;
        empty.style.outline = 'none';
        empty.textContent = 'No tools';
        listEl.appendChild(empty);
        empty.focus();
        return;
      }
      tools.forEach((tool, i) => {
        const el = document.createElement('div');
        el.className = 'tool' + (i === activeIndex ? ' active' : '');
        el.tabIndex = 0;
        el.textContent = tool.name;
        listEl.appendChild(el);
      });
      focusActive();
    }

    function setActive(i) {
      if (i === activeIndex) return;
      activeIndex = i;
      [...listEl.children].forEach((el, idx) => el.classList.toggle('active', idx === i));
      focusActive();
    }

    function focusActive() {
      (listEl.children[activeIndex] || listEl.firstElementChild)?.focus();
    }

    async function launch(tool) {
      if (!tool) return;
      await invoke('open_tool', { file: tool.file, query: null }).catch(() => {});
      await win.hide();
    }

    document.addEventListener('keydown', async (e) => {
      if (e.key === 'Escape') {
        await win.hide();
        return;
      }
      if (!tools.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        setActive((activeIndex + 1) % tools.length);
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        setActive((activeIndex - 1 + tools.length) % tools.length);
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        launch(tools[activeIndex]);
      }
    });

    // Built once, then hidden/shown — pull fresh tools each time it opens.
    // Re-center on show in case window-state restored an old position.
    listen('spotlight-shown', () => { loadTools(); win.center(); });
    window.addEventListener('focus', focusActive);

    loadTools();
  </script>
</body>
</html>
