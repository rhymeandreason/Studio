<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Briefing</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../kit/kit.css" />
  <link rel="stylesheet" href="../kit/window-chrome.css" />
  <script type="module" src="../kit/components.js"></script>
  <script type="module" src="../kit/window-chrome.js"></script>
  <script src="../vendor/marked.min.js"></script>
  <style>
    /* Spacing scale — tokens.css/kit.css don't define --space-*, so set them
         here (matching the kit's px rhythm) instead of letting them collapse. */
    :root {
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 18px;
      --space-5: 28px;
      --space-6: 40px;
    }


    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    #titlebar {
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 14px;
    }

    .tb-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* The scroll container (was body); carries the paper fill so the
       window's rounded corners work (body stays transparent). */
    #scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: clamp(28px, 6vw, 56px);
      padding-top: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      background: var(--bg);
    }

    /* ── Top section: date, body, meetings — all centered ─────────── */
    .brief-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: var(--space-5);
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
      line-height: 5em;
margin-bottom: 80px;
    }

    .brief-masthead {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brief-weekday {
      font-family: var(--sans);
      font-weight: 600;
      line-height: 0.92;
      letter-spacing: -0.02em;
      font-size: clamp(40px, 8vw, 68px);
      text-transform: uppercase;
    }

    .brief-date {
      margin-top: var(--space-2);
      font-size: clamp(13px, 2vw, 16px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ── Section framing ────────────────────────────────────────── */
    .brief-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      width: 100%;
    }

    .brief-section.is-hidden {
      display: none;
    }

    /* ── Meetings — centered single line per meeting ───────────────── */
    .brief-list {
      display: flex;
      flex-direction: column;
      //border-top: 1px solid var(--hairline-strong);
      padding-top: var(--space-5);
    }

    .meeting {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: var(--space-3);
padding: var(--space-6) 0;
font-size: 20px;
background-color: white;
border-radius: var(--radius-lg);
    }

    .meeting__time {
      flex: 0 0 auto;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .meeting__title {
      line-height: 1.25;
    }

    .meeting__loc {
      color: var(--text-muted);
      font-size: 0.7em;
    }

    /* ── Freeform Markdown body (poster scale, centered) ──────────── */
    .md-body {
      font-size: clamp(19px, 2.6vw, 26px);
      line-height: 3em;
      letter-spacing: -0.005em;
    }

    .md-body.is-loading {
      opacity: 0.4;
    }

    .md-body> :first-child {
      margin-top: 0;
    }

    .md-body> :last-child {
      margin-bottom: 0;
    }

    .md-body>*+* {
      margin-top: 0.7em;
    }

    .md-body h1,
    .md-body h2,
    .md-body h3 {
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-top: 0.6em;
    }

    .md-body h1 {
      font-size: 1.7em;
    }

    .md-body h2 {
      font-size: 1.3em;
    }

    .md-body h3 {
      font-size: 1.1em;
    }

    .md-body ul,
    .md-body ol {
      padding-left: 0;
      list-style-position: inside;
    }

    .md-body li+li {
      margin-top: 0.3em;
    }

    .md-body a {
      color: var(--accent);
      text-underline-offset: 3px;
    }

    .md-body strong {
      font-weight: 600;
    }

    .md-body em {
      font-style: italic;
      color: var(--text-muted);
    }

    .md-body blockquote {
      border-left: 3px solid var(--accent-soft);
      padding-left: var(--space-4);
      color: var(--text-muted);
      font-style: italic;
      text-align: left;
    }

    .md-body pre {
      background: var(--surface);
      padding: var(--space-3);
      border-radius: var(--radius);
      overflow-x: auto;
      font-size: 0.7em;
      text-align: left;
    }

    .md-body code {
      font-family: var(--mono);
    }

    .md-body hr {
      border: none;
      border-top: 1px solid var(--hairline-strong);
      margin: 1em 0;
    }

    .brief-empty {
      opacity: 0.55;
    }

    .brief-error {
      color: var(--rose);
      white-space: pre-wrap;
      font-size: 15px;
      text-align: left;
    }

    /* ── Gallery: simple 3-column flex row ──────────────────────── */
    .gallery-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
padding-botton:100px;
    }

    .gallery-row {
      display: flex;
      gap: var(--space-4);
    }

    .gallery-card {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .gallery-card img {
      width: 100%;
      //aspect-ratio: 4 / 3;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: var(--radius);
      display: block;
      background: var(--surface);
    }

    .gallery-card__blurb {
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .gallery-card__blurb a {
      color: var(--accent);
    }

    /* ── Settings — floating overlay (Tab to toggle) ───────────────── */
    .settings {
      display: none;
      flex-direction: column;
      gap: var(--space-3);
      position: fixed;
      top: var(--space-4);
      right: var(--space-4);
      width: 320px;
      z-index: 10;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
    }

    .settings.is-open {
      display: flex;
    }

    #status {
      text-align: center;
    }

  </style>
</head>

<body>
  <div id="titlebar" data-window-bar>
    <div class="tb-title" data-window-close><span class="eyebrow">Daily Briefing</span></div>
  </div>
  <div id="scroll">
  <div id="settings" class="settings card">
    <label class="label" for="sources">Briefing prompt</label>
    <textarea id="sources" class="field" rows="4" placeholder="Anything — e.g. a warm morning briefing with top news, or 'Write a haiku about today's weather in Woodacre, CA.'"></textarea>
    <label class="label" for="weather-location">Weather location</label>
    <input id="weather-location" class="field" type="text" placeholder="Blank = auto-detect from IP — e.g. Woodacre, CA" />
    <div style="display:flex; align-items:center; justify-content:space-between; gap: var(--space-2);">
      <span class="text-xs text-muted">Saved to ~/Projects/briefing-prompt.txt · output is Markdown</span>
      <button id="run-prompt-btn" class="btn btn-primary">
        <span class="material-symbols-rounded">bolt</span> Run with this prompt
      </button>
    </div>
  </div>

  <div class="brief-top">
    <div class="brief-masthead">
      <div id="weekday" class="brief-weekday"></div>
      <div id="date" class="brief-date"></div>
    </div>

    <div id="body" class="md-body is-loading">Loading…</div>

    <div id="meetings-section" class="brief-section is-hidden">
      <div id="meetings" class="brief-list"></div>
    </div>
  </div>

  <div class="gallery-section">
    <div id="gallery" class="gallery-row"></div>
  </div>

  <div id="status" class="text-xs text-muted"></div>
  </div>

  <script type="module">
    import { hasTauri, invoke, esc } from "../kit/app.js";

    // Used when ~/Projects/briefing-prompt.txt is empty.
    const DEFAULT_PROMPT =
      "Write a warm, concise morning briefing: a one-line greeting, then the " +
      "top 3 Hacker News stories with one-line summaries, then one design or " +
      "engineering article worth reading today (with links).";
    const MODEL = "haiku";
    // Cache is a global file at ~/Projects/today.json (the "briefing" store);
    // the editable prompt is ~/Projects/briefing-prompt.txt (the
    // "briefing-prompt" store). Both via read_store/save_store.

    const $ = (id) => document.getElementById(id);

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function renderMeetings(meetings) {
      const section = $("meetings-section");
      const box = $("meetings");
      box.innerHTML = "";
      // Calendar-driven section, independent of the prompt — hide it entirely
      // when there's nothing today so a non-briefing prompt isn't cluttered.
      if (!meetings || meetings.length === 0) {
        section.classList.add("is-hidden");
        return;
      }
      section.classList.remove("is-hidden");
      for (const m of meetings) {
        const row = document.createElement("div");
        row.className = "meeting";
        const loc = m.location ? `<span class="meeting__loc">· ${esc(m.location)}</span>` : "";
        row.innerHTML =
          `<span class="meeting__time">${esc(m.time || "")}</span>` +
          `<span class="meeting__title">${esc(m.title || "")} ${loc}</span>`;
        box.appendChild(row);
      }
    }

    function renderBody(markdown) {
      const el = $("body");
      el.classList.remove("is-loading");
      el.innerHTML = window.marked ?
        window.marked.parse(markdown || "", {
          breaks: true
        }) :
        esc(markdown || "");
    }

    // Gallery is a generic strip of { imageUrl, blurb, pageUrl, source }
    // items — the Wikimedia picture of the day is the first source, with
    // room for more (e.g. media-of-the-day from other feeds) later.
    function renderGallery(items) {
      const box = $("gallery");
      box.innerHTML = "";
      for (const item of items || []) {
        if (!item || !item.imageUrl) continue;
        const card = document.createElement("div");
        card.className = "gallery-card";
        const blurb = esc(item.blurb || "");
        const sourceLabel = esc(item.source || "Source");
        const img = `<img src="${esc(item.imageUrl)}" alt="${sourceLabel}" />`;
        const blurbHtml = item.pageUrl ?
          `${blurb} — <a href="${esc(item.pageUrl)}" target="_blank" rel="noreferrer">${sourceLabel}</a>` :
          blurb;
        card.innerHTML =
          (item.pageUrl ?
            `<a href="${esc(item.pageUrl)}" target="_blank" rel="noreferrer">${img}</a>` :
            img) +
          `<div class="gallery-card__blurb">${blurbHtml}</div>`;
        box.appendChild(card);
      }
    }

    function buildPrompt(userPrompt, meetings, weather) {
      const lines = [
        `Today is ${new Date().toLocaleDateString(undefined, {
            weekday: "long", month: "long", day: "numeric", year: "numeric",
          })}.`,
      ];
      if (weather) {
        lines.push(
          "",
          `Current weather in ${weather.label}: ${weather.tempF}°F, ` +
          `${weather.condition.toLowerCase()}, wind ${weather.windMph} mph. ` +
          "Treat this as fact — don't look up or guess weather elsewhere.",
        );
      }
      if (meetings.length) {
        lines.push("", "My calendar today (use only if relevant to the request):");
        lines.push(...meetings.map((m) => `- ${m.time} ${m.title}`));
      }
      lines.push(
        "",
        userPrompt,
        "",
        "Respond in Markdown. Output only the content itself — no preamble, no explanation, no code fence around the whole thing.",
      );
      return lines.join("\n");
    }

    function setStatus(text) {
      $("status").textContent = text;
    }

    // Fetched fresh on every open/refresh, independent of the briefing-text
    // cache gate below — it's cheap, real data with no LLM involved, so
    // there's no reason to ever show a stale gallery just because today's
    // text briefing was already cached.
    async function refreshGallery() {
      const items = [];
      try {
        const potd = JSON.parse(await invoke("get_picture_of_day"));
        if (potd && potd.imageUrl) {
          items.push({
            ...potd,
            source: "Wikimedia Commons"
          });
        }
      } catch {}
      try {
        const colossal = JSON.parse(await invoke("get_colossal_items"));
        for (const item of colossal || []) {
          if (item && item.imageUrl) items.push({
            ...item,
            source: "Colossal"
          });
        }
      } catch {}
      renderGallery(items);
      return items;
    }

    let refreshing = false;

    async function refresh() {
      if (!hasTauri || refreshing) return;
      refreshing = true;
      setStatus("Refreshing…");

      // Meetings are fast — render them first.
      let meetings = [];
      try {
        meetings = JSON.parse(await invoke("day_agenda"));
      } catch {}
      renderMeetings(meetings);

      let weather = null;
      try {
        weather = JSON.parse(await invoke("get_weather", {
          location: $("weather-location").value || ""
        }));
      } catch {}

      const gallery = await refreshGallery();

      const prompt = ($("sources").value || DEFAULT_PROMPT).trim();
      try {
        const markdown = await invoke("run_claude_prompt", {
          projectPath: "",
          prompt: buildPrompt(prompt, meetings, weather),
          model: MODEL,
        });
        renderBody(markdown);
        await invoke("save_store", {
          name: "briefing",
          data: JSON.stringify({
            date: todayStr(),
            markdown,
            meetings,
            gallery
          }, null, 2),
        });
        setStatus(`Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`);
      } catch (e) {
        setStatus("");
        $("body").classList.remove("is-loading");
        $("body").innerHTML =
          `<div class="brief-error">Couldn't generate briefing:\n${esc(e.message || String(e))}</div>`;
      } finally {
        refreshing = false;
      }
    }

    // Render the cached briefing if present. Returns true only when today's
    // briefing already exists — the signal that we should NOT regenerate.
    async function loadCache() {
      if (!hasTauri) return false;
      try {
        const raw = await invoke("read_store", { name: "briefing" });
        const cached = raw ? JSON.parse(raw) : null;
        if (cached && typeof cached.markdown === "string") {
          renderMeetings(cached.meetings || []);
          renderBody(cached.markdown);
          renderGallery(cached.gallery || []);
          if (cached.date === todayStr()) {
            setStatus("");
            return true;
          }
          setStatus("Yesterday's briefing — refresh to update.");
        }
      } catch {}
      return false;
    }

    // Masthead date
    $("weekday").textContent = new Date().toLocaleDateString(undefined, {
      weekday: "long"
    });
    $("date").textContent = new Date().toLocaleDateString(undefined, {
      month: "long",
      day: "numeric",
      year: "numeric",
    });

    // Settings — Tab toggles the floating panel (and focuses the prompt when
    // opening). Closing while the textarea has focus blurs it, which fires
    // the change handler that saves the prompt.
    function toggleSettings() {
      const open = $("settings").classList.toggle("is-open");
      if (open) $("sources").focus();
      else $("sources").blur();
    }
    window.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        toggleSettings();
      }
    });
    if (hasTauri) {
      invoke("read_store", { name: "briefing-prompt" })
        .then((v) => {
          $("sources").value = v || "";
        })
        .catch(() => {});
      invoke("read_store", { name: "weather-location" })
        .then((v) => {
          $("weather-location").value = v || "";
        })
        .catch(() => {});
    }
    $("sources").addEventListener("change", () => {
      if (hasTauri) invoke("save_store", {
        name: "briefing-prompt",
        data: $("sources").value
      }).catch(() => {});
    });
    $("weather-location").addEventListener("change", () => {
      if (hasTauri) invoke("save_store", {
        name: "weather-location",
        data: $("weather-location").value
      }).catch(() => {});
    });
    // Force a regenerate with the current prompt (saving it first so the file
    // matches what just ran).
    $("run-prompt-btn").addEventListener("click", async () => {
      if (hasTauri) {
        await invoke("save_store", {
          name: "briefing-prompt",
          data: $("sources").value
        }).catch(() => {});
        await invoke("save_store", {
          name: "weather-location",
          data: $("weather-location").value
        }).catch(() => {});
      }
      refresh();
    });

    if (hasTauri) {
      const {
        getCurrentWindow
      } = window.__TAURI__.window;
      const {
        LogicalSize
      } = window.__TAURI__.dpi;
      getCurrentWindow().setSize(new LogicalSize(820, 880));
    }

    // The scheduled morning open generates the day's briefing; every later
    // open just displays it. Only generate when today's doesn't exist yet
    // (so the scheduled 7am open — the first of the day — is what generates).
    (async () => {
      const cachedToday = await loadCache();
      if (!cachedToday) {
        refresh();
      } else {
        // refresh() already covers the gallery when it runs; when the cache
        // short-circuits it, fetch a live one anyway.
        refreshGallery();
      }
    })();

  </script>
</body>

</html>
