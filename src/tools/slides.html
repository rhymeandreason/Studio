<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slides</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<script type="module" src="../kit/components.js"></script>
<script src="../vendor/marked.min.js"></script>
<style>
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* Three columns: slide reel · stage · inspector. */
  .reel {
    flex: 0 0 168px;
    border-right: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .reel-head {
    padding: 12px;
    border-bottom: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .reel-list { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .thumb {
    position: relative;
    flex: 0 0 auto;        /* keep 16:9; don't compress when the reel is tall */
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-sm);
    overflow: hidden;
    cursor: pointer;
    background: #fff;
  }
  .thumb.active { outline: 2px solid var(--accent); outline-offset: 1px; }
  .thumb__num {
    position: absolute; top: 3px; left: 5px; z-index: 2;
    font-size: 10px; font-family: var(--mono); color: var(--text-soft);
  }
  .thumb__del {
    position: absolute; top: 2px; right: 3px; z-index: 2;
    border: none; background: transparent; cursor: pointer;
    color: var(--text-soft); font-size: 14px; line-height: 1; opacity: 0;
  }
  .thumb:hover .thumb__del { opacity: 1; }
  /* The scaled-down render lives in here. */
  .thumb__stage { position: absolute; top: 0; left: 0; transform-origin: top left; }

  .stage-wrap {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .stage-bar {
    padding: 10px 14px;
    border-bottom: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stage-bar .title { font-family: var(--serif); font-size: 13px; flex: 1 1 auto; min-width: 0; }
  .stage-bar input.title {
    border: none; background: transparent; color: var(--text);
    font-family: var(--serif); font-size: 13px;
  }
  .stage-scroll { flex: 1 1 auto; overflow: auto; display: grid; place-items: center; padding: 28px; }
  /* The editing canvas: a fixed-size 1280×720 slide, scaled to fit. */
  .canvas {
    width: 1280px; height: 720px;
    transform-origin: center;
    box-shadow: 0 6px 30px rgba(0,0,0,.18);
    border-radius: 4px;
    overflow: hidden;
  }

  .inspector {
    flex: 0 0 300px;
    border-left: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .insp-sec { padding: 14px; border-bottom: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 10px; }
  .insp-sec h3 { font-family: var(--serif); font-size: 12px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .insp-sec textarea.field { min-height: 64px; resize: vertical; line-height: 1.4; }
  .field-label { font-size: 11px; color: var(--text-soft); margin-bottom: 3px; display: block; }
  input, textarea, select, .field { font-family: system-ui, sans-serif; }
  .slot--unused { opacity: .45; }
  .slot--unused:focus-within { opacity: 1; }

  .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .layout-cell { display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
  .layout-opt {
    aspect-ratio: 16 / 9; border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-sm); position: relative;
    background: var(--elevated); overflow: hidden;
  }
  .layout-cell.active .layout-opt { outline: 2px solid var(--accent); outline-offset: 1px; }
  .layout-opt svg { width: 100%; height: 100%; display: block; }
  .layout-cell__name { text-align: center; font-size: 10px; color: var(--text-soft); }
  .layout-cell.active .layout-cell__name { color: var(--accent); }

  /* Theme presets as brand-kit-style preview cards */
  .theme-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .theme-card { border: 1px solid var(--hairline-strong); border-radius: var(--radius-sm); overflow: hidden; cursor: pointer; background: var(--surface); }
  .theme-card.active { outline: 2px solid var(--accent); outline-offset: 1px; }
  .theme-card__type { padding: 10px 10px 8px; }
  .theme-card__h { font-size: 18px; line-height: 1.05; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .theme-card__b { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .theme-card__sw { display: flex; }
  .theme-card__sw span { flex: 1 1 0; height: 18px; }

  .swatch-row { display: flex; align-items: center; gap: 8px; }
  .swatch-row .swatch-block { width: 26px; height: 26px; border-radius: var(--radius-sm); border: 1px solid var(--hairline-strong); cursor: pointer; flex: 0 0 auto; }
  .swatch-row label { font-size: 11px; color: var(--text-muted); flex: 1; }
  .coloris-trigger { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .status { font-family: var(--mono); font-size: 11px; color: var(--text-muted); min-height: 14px; padding: 0 14px 12px; }
  .img-row { display: flex; gap: 6px; align-items: center; }
  .img-row .field { flex: 1; min-width: 0; }
  .img-row .preview { width: 40px; height: 28px; object-fit: cover; border-radius: 3px; border: 1px solid var(--hairline); background: var(--elevated); flex: 0 0 auto; }
  .img-row .btn-icon { flex: 0 0 auto; }
  .img-name { flex: 1; min-width: 0; font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .img-name--empty { color: var(--text-soft); font-style: italic; }

  /* Media picker overlay */
  .picker-overlay { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(3px); display: flex; flex-direction: column; }
  .picker-bar { padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--hairline); }
  .picker-bar h3 { font-family: var(--serif); font-size: 14px; flex: 1; }
  .picker-grid { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: 112px; gap: 12px; align-content: start; }
  .picker-tile { height: 112px; border: 1px solid var(--hairline-strong); border-radius: var(--radius-sm); overflow: hidden; cursor: pointer; background: var(--elevated); position: relative; }
  .picker-tile:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
  .picker-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .picker-tile span { position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 6px; font-size: 10px; background: linear-gradient(transparent, rgba(0,0,0,.6)); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .picker-empty { padding: 40px; text-align: center; color: var(--text-muted); grid-column: 1 / -1; }
  body.dropping::after { content: "Drop to add image"; position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, transparent); border: 3px dashed var(--accent); color: var(--accent); font-family: var(--serif); font-size: 22px; pointer-events: none; }

  /* ---- The slide renderer's own styles (shared by canvas + thumbs + export) ----
     Scoped under .slide so they can be serialized into exports verbatim. */
  .slide { width: 1280px; height: 720px; position: relative; box-sizing: border-box;
           display: flex; flex-direction: column; overflow: hidden;
           --pad: 96px; }
  .slide__inner { flex: 1; display: flex; flex-direction: column; padding: var(--pad); min-height: 0; }
  .slide h1 { font-family: var(--deck-heading); font-weight: var(--deck-heading-w); margin: 0; line-height: 1.05; }
  .slide .kicker { font-family: var(--deck-body); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; font-size: 22px; opacity: .7; margin: 0 0 18px; }
  .slide .deck-body { font-family: var(--deck-body); font-weight: var(--deck-body-w); line-height: 1.45; font-size: 34px; }
  .slide .deck-body p { margin: 0 0 .6em; }
  .slide .deck-body ul { margin: 0; padding-left: 1.1em; }
  .slide .deck-body li { margin: 0 0 .5em; }
  .slide .deck-body strong { color: var(--deck-accent); }
  .slide .deck-body a { color: var(--deck-accent); }
  .l-title { justify-content: center; align-items: flex-start; }
  .l-title h1 { font-size: 96px; }
  .l-title .subtitle { font-family: var(--deck-body); font-size: 38px; margin-top: 24px; opacity: .8; }
  .l-section { justify-content: center; align-items: flex-start; }
  .l-section h1 { font-size: 84px; }
  .l-section, .l-section .deck-body { color: var(--deck-bg); }
  .l-title-body h1 { font-size: 64px; margin-bottom: 28px; }
  .l-two-col .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; flex: 1; min-height: 0; }
  .l-two-col h1 { font-size: 60px; margin-bottom: 28px; }
  .l-quote { justify-content: center; }
  .l-quote blockquote { font-family: var(--deck-heading); font-weight: var(--deck-heading-w); font-size: 64px; line-height: 1.15; margin: 0; }
  .l-quote .attr { font-family: var(--deck-body); font-size: 30px; margin-top: 32px; opacity: .7; }
  .l-quote blockquote::before { content: "“"; }
  .l-quote blockquote::after { content: "”"; }
  .l-image-full { padding: 0; }
  .l-image-full .full-img { width: 100%; height: 100%; object-fit: cover; }
  .l-image-full .cap { position: absolute; bottom: 0; left: 0; right: 0; padding: 28px 96px; font-family: var(--deck-body); font-size: 26px; background: linear-gradient(transparent, rgba(0,0,0,.6)); color: #fff; }
  .l-image-text .split { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; flex: 1; min-height: 0; align-items: center; }
  .l-image-text h1 { font-size: 56px; margin-bottom: 24px; }
  .l-image-text .split-img { width: 100%; height: 100%; max-height: 528px; object-fit: cover; border-radius: 8px; }
  .img-placeholder { display: grid; place-items: center; width: 100%; height: 100%; min-height: 200px; background: color-mix(in srgb, var(--deck-text) 8%, transparent); color: var(--deck-text); opacity: .4; font-family: var(--deck-body); font-size: 24px; border-radius: 8px; }
</style>
</head>
<body>
  <div class="reel">
    <div class="reel-head">
      <button class="btn btn-primary" id="add-slide"><span class="mi mi-sm">add</span> Slide</button>
    </div>
    <div class="reel-list" id="reel-list"></div>
  </div>

  <div class="stage-wrap">
    <div class="stage-bar">
      <input class="title" id="deck-name" value="Untitled deck" spellcheck="false" />
      <button class="btn btn-ghost" id="export-web"><span class="mi mi-sm">public</span> Web</button>
      <button class="btn btn-secondary" id="save-as">Save as…</button>
    </div>
    <div class="stage-scroll">
      <div class="canvas" id="canvas"></div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="inspector" id="inspector"></div>

  <script type="module">
    const marked = window.marked;
    const invoke = window.__TAURI__?.core?.invoke;

    // ---------- Layouts ----------
    // Each layout declares the slots it edits. Slots are markdown-capable text
    // unless type:"image". This list is the contract Claude follows (mirrored in
    // the studio-artifacts skill).
    const LAYOUTS = {
      "title":      { name: "Title",      slots: [["title","Title"],["subtitle","Subtitle"]] },
      "section":    { name: "Section",    slots: [["title","Section title"]] },
      "title-body": { name: "Title + Body", slots: [["title","Title"],["body","Body","md"]] },
      "two-col":    { name: "Two column", slots: [["title","Title"],["left","Left","md"],["right","Right","md"]] },
      "quote":      { name: "Quote",      slots: [["quote","Quote"],["attribution","Attribution"]] },
      "image-full": { name: "Image full", slots: [["image","Image","image"],["caption","Caption"]] },
      "image-text": { name: "Image + Text", slots: [["title","Title"],["image","Image","image"],["body","Body","md"]] },
    };

    // The union of every slot across layouts, in a stable order. The inspector
    // shows all of these so values aren't lost (or hidden) when you switch
    // layouts — the chosen layout just decides which ones actually render.
    const ALL_SLOTS = [
      ["title","Title"], ["subtitle","Subtitle"],
      ["quote","Quote"], ["attribution","Attribution"],
      ["body","Body","md"], ["left","Left","md"], ["right","Right","md"],
      ["image","Image","image"], ["caption","Caption"],
    ];

    // The primary prose slot for each layout — used to carry body text across a
    // layout change (e.g. title-body's `body` ↔ two-col's `left`).
    const PRIMARY_BODY = {
      "title-body": "body", "two-col": "left", "image-text": "body", "quote": "quote",
    };

    // Switch a slide's layout, moving its main text into the new layout's primary
    // prose slot when that slot is empty (so converting doesn't lose the content).
    function convertLayout(slide, next) {
      if (slide.layout === next) return;
      const from = PRIMARY_BODY[slide.layout], to = PRIMARY_BODY[next];
      if (from && to && from !== to && slide[from] && !slide[to]) slide[to] = slide[from];
      slide.layout = next;
    }

    // ---------- Theme presets ----------
    const PRESETS = [
      { name: "Runes", fonts:{heading:{family:"Fraunces",weight:600},body:{family:"Newsreader",weight:400}},
        colors:{bg:"#f7f5f0",text:"#2a2a28",accent:"#a85a4a"} },
      { name: "Mono", fonts:{heading:{family:"Space Grotesk",weight:600},body:{family:"Inter",weight:400}},
        colors:{bg:"#ffffff",text:"#111111",accent:"#2563eb"} },
      { name: "Editorial", fonts:{heading:{family:"Playfair Display",weight:700},body:{family:"Lora",weight:400}},
        colors:{bg:"#fbf9f4",text:"#1b1b1a",accent:"#7a5c3e"} },
      { name: "Night", fonts:{heading:{family:"Manrope",weight:700},body:{family:"Manrope",weight:400}},
        colors:{bg:"#16161a",text:"#f4f4f5",accent:"#c4f042"} },
      { name: "Warm", fonts:{heading:{family:"DM Serif Display",weight:400},body:{family:"DM Sans",weight:400}},
        colors:{bg:"#fdf3e7",text:"#3a2a1e",accent:"#d2693a"} },
    ];

    // ---------- State ----------
    let state = {
      name: "Untitled deck",
      theme: structuredClone(PRESETS[0]),
      slides: [ { layout: "title", title: "Your title", subtitle: "A subtitle" } ],
    };
    let current = 0;
    let activePath = null;       // set when opened via ?artifact=
    let projectRoot = null;      // derived from artifact path; for resolving images
    const imgCache = new Map();  // project-relative path -> data URL

    // ---------- Fonts (lazy Google Fonts) ----------
    const loaded = new Set();
    function loadFont(family, weight) {
      if (!family) return;
      const key = `${family}@${weight||""}`;
      if (loaded.has(key)) return; loaded.add(key);
      const l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=" + family.replace(/ /g,"+") +
               (weight ? `:wght@${weight}` : "") + "&display=swap";
      document.head.appendChild(l);
    }
    function loadThemeFonts(t) {
      loadFont(t.fonts.heading.family, t.fonts.heading.weight);
      loadFont(t.fonts.body.family, t.fonts.body.weight);
    }

    // ---------- Image resolution ----------
    // Slides store images as project-relative paths (e.g. "media/x.png"). The
    // tool window can't load project files directly, so fetch a data URL via Rust.
    async function resolveImage(rel) {
      if (!rel) return null;
      if (/^data:|^https?:/.test(rel)) return rel;
      if (imgCache.has(rel)) return imgCache.get(rel);
      if (!invoke || !projectRoot) return null;
      try {
        const abs = projectRoot + "/" + rel.replace(/^\//, "");
        const url = await invoke("read_image_data", { path: abs });
        imgCache.set(rel, url);
        return url;
      } catch { return null; }
    }

    // Convert an absolute path (returned by import_media / list_media / paste_image)
    // to the project-relative form we store on slides.
    function toRel(abs) {
      if (!abs) return abs;
      if (projectRoot && abs.startsWith(projectRoot + "/")) return abs.slice(projectRoot.length + 1);
      return abs;
    }

    // Set the current slide's image (used by drop + paste). Stores even when the
    // active layout has no image slot — the always-visible Image field surfaces it.
    function setCurrentImage(rel) {
      const slide = state.slides[current];
      if (!slide) return;
      slide.image = rel;
      renderAll();
      statusEl.textContent = "Image set: " + rel;
    }

    // ---------- Media picker ----------
    // Grid of the active project's media/ images; click one to pick it.
    async function openMediaPicker(onPick) {
      if (!invoke || !projectRoot) { statusEl.textContent = "No active project — type a media path instead."; return; }
      const overlay = document.createElement("div"); overlay.className = "picker-overlay";
      overlay.innerHTML = `<div class="picker-bar"><h3>Project media</h3><button class="btn btn-secondary" id="pk-close">Close</button></div><div class="picker-grid" id="pk-grid"></div>`;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.querySelector("#pk-close").onclick = close;
      overlay.onclick = (e) => { if (e.target === overlay) close(); };
      const grid = overlay.querySelector("#pk-grid");
      let items = [];
      try { items = (await invoke("list_media", { path: projectRoot })).filter(m => m.kind === "image"); }
      catch (e) { grid.innerHTML = `<div class="picker-empty">Couldn't read media: ${e}</div>`; return; }
      if (!items.length) { grid.innerHTML = `<div class="picker-empty">No images in this project's media/ folder yet. Drop or paste one onto a slide, or add via Studio's Media tab.</div>`; return; }
      for (const m of items) {
        const tile = document.createElement("div"); tile.className = "picker-tile";
        tile.innerHTML = `<span>${m.name}</span>`;
        const rel = toRel(m.path);
        resolveImage(rel).then(u => { if (u) { const img = document.createElement("img"); img.src = u; tile.prepend(img); } });
        tile.onclick = () => { onPick(rel); close(); };
        grid.appendChild(tile);
      }
    }

    // ---------- Slide rendering ----------
    // Returns an .slide element for a given slide + theme. `resolved` maps image
    // refs to data URLs (or web paths in export mode).
    function md(s) { return marked.parse(s || "", { breaks: true }); }

    function renderSlide(slide, theme, resolved = {}) {
      const t = theme;
      const el = document.createElement("div");
      el.className = "slide";
      el.style.setProperty("--deck-bg", t.colors.bg);
      el.style.setProperty("--deck-text", t.colors.text);
      el.style.setProperty("--deck-accent", t.colors.accent);
      el.style.setProperty("--deck-heading", `"${t.fonts.heading.family}", serif`);
      el.style.setProperty("--deck-heading-w", t.fonts.heading.weight);
      el.style.setProperty("--deck-body", `"${t.fonts.body.family}", sans-serif`);
      el.style.setProperty("--deck-body-w", t.fonts.body.weight);
      // Section slides are full-bleed accent; paint it on the slide root so the
      // color always fills the whole frame (not just the inner content box).
      if (slide.layout === "section") {
        el.style.background = t.colors.accent;
        el.style.color = t.colors.bg;
      } else {
        el.style.background = t.colors.bg;
        el.style.color = t.colors.text;
      }

      const fit = slide.imageFit || "cover";   // how the image sits in its frame
      const img = (ref, ph) => {
        const url = resolved[ref] ?? (ref && imgCache.get(ref));
        return url ? `<img src="${url}" style="object-fit:${fit}">` : `<div class="img-placeholder">${ph}</div>`;
      };

      let inner = "";
      switch (slide.layout) {
        case "title":
          inner = `<div class="slide__inner l-title"><h1>${esc(slide.title)}</h1>${slide.subtitle?`<div class="subtitle">${esc(slide.subtitle)}</div>`:""}</div>`; break;
        case "section":
          inner = `<div class="slide__inner l-section"><h1>${esc(slide.title)}</h1></div>`; break;
        case "title-body":
          { const cols = slide.columns === 2 ? ` style="column-count:2;column-gap:56px"` : "";
            inner = `<div class="slide__inner l-title-body"><h1>${esc(slide.title)}</h1><div class="deck-body"${cols}>${md(slide.body)}</div></div>`; }
          break;
        case "two-col":
          inner = `<div class="slide__inner l-two-col"><h1>${esc(slide.title)}</h1><div class="cols"><div class="deck-body">${md(slide.left)}</div><div class="deck-body">${md(slide.right)}</div></div></div>`; break;
        case "quote":
          inner = `<div class="slide__inner l-quote"><blockquote>${esc(slide.quote)}</blockquote>${slide.attribution?`<div class="attr">— ${esc(slide.attribution)}</div>`:""}</div>`; break;
        case "image-full":
          { const url = resolved[slide.image] ?? (slide.image && imgCache.get(slide.image));
            inner = `<div class="slide__inner l-image-full" style="position:absolute;inset:0;">${url?`<img class="full-img" src="${url}" style="object-fit:${fit}">`:`<div class="img-placeholder" style="height:100%">No image</div>`}${slide.caption?`<div class="cap">${esc(slide.caption)}</div>`:""}</div>`; }
          break;
        case "image-text":
          inner = `<div class="slide__inner l-image-text"><h1>${esc(slide.title)}</h1><div class="split"><div>${img(slide.image,"No image").replace("<img","<img class=\"split-img\"")}</div><div class="deck-body">${md(slide.body)}</div></div></div>`; break;
        default:
          inner = `<div class="slide__inner"><h1>${esc(slide.title||"")}</h1></div>`;
      }
      el.innerHTML = inner;
      return el;
    }
    function esc(s){ return (s??"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

    // ---------- Stage (current slide, scaled to fit) ----------
    const canvas = document.getElementById("canvas");
    function renderStage() {
      const slide = state.slides[current];
      canvas.innerHTML = "";
      if (!slide) return;
      // pre-resolve image then render
      const node = renderSlide(slide, state.theme);
      canvas.appendChild(node);
      fitCanvas();
      // If this slide has an image we haven't cached yet, fetch it then re-render
      // once (the cache hit on the next pass means no loop).
      const ref = slide.image;
      if (ref && !imgCache.has(ref) && !/^data:|^https?:/.test(ref)) {
        resolveImage(ref).then(url => { if (url) renderStage(); });
      }
    }
    function fitCanvas() {
      const wrap = canvas.parentElement;
      const scale = Math.min((wrap.clientWidth-56)/1280, (wrap.clientHeight-56)/720, 1);
      canvas.style.transform = `scale(${scale})`;
      canvas.style.width = "1280px"; canvas.style.height = "720px";
      canvas.style.margin = `${(720*scale-720)/2}px ${(1280*scale-1280)/2}px`;
    }
    window.addEventListener("resize", fitCanvas);

    // ---------- Reel (thumbnails) ----------
    const reel = document.getElementById("reel-list");
    function renderReel() {
      reel.innerHTML = "";
      state.slides.forEach((slide, i) => {
        const thumb = document.createElement("div");
        thumb.className = "thumb" + (i===current?" active":"");
        thumb.innerHTML = `<div class="thumb__num">${i+1}</div><button class="thumb__del" title="Delete">×</button>`;
        const stage = document.createElement("div");
        stage.className = "thumb__stage";
        stage.appendChild(renderSlide(slide, state.theme));
        thumb.appendChild(stage);
        thumb.onclick = (e) => { if (e.target.classList.contains("thumb__del")) return; current=i; renderAll(); };
        thumb.querySelector(".thumb__del").onclick = (e) => {
          e.stopPropagation();
          if (state.slides.length<=1) return;
          state.slides.splice(i,1); current=Math.min(current, state.slides.length-1); renderAll();
        };
        reel.appendChild(thumb);
        // scale the 1280-wide render down to the thumb width
        requestAnimationFrame(() => {
          const w = thumb.clientWidth; const s = w/1280;
          stage.style.transform = `scale(${s})`;
        });
        // async image for thumbs — fetch uncached refs, then re-render once
        if (slide.image && !imgCache.has(slide.image) && !/^data:|^https?:/.test(slide.image)) {
          resolveImage(slide.image).then(u => { if (u) renderReel(); });
        }
      });
    }

    // ---------- Inspector ----------
    const inspector = document.getElementById("inspector");
    function renderInspector() {
      const slide = state.slides[current];
      inspector.innerHTML = "";

      // Layout picker
      const layoutSec = sec("Layout");
      const grid = document.createElement("div"); grid.className = "layout-grid";
      for (const [key, def] of Object.entries(LAYOUTS)) {
        const cell = document.createElement("div");
        cell.className = "layout-cell" + (slide.layout===key?" active":"");
        cell.innerHTML = `<div class="layout-opt">${layoutIcon(key)}</div><div class="layout-cell__name">${def.name}</div>`;
        cell.onclick = () => { convertLayout(slide, key); renderAll(); };
        grid.appendChild(cell);
      }
      layoutSec.appendChild(grid);
      inspector.appendChild(layoutSec);

      // Content slots — show every field, dimming ones the current layout hides.
      const content = sec("Content");
      const used = new Set(LAYOUTS[slide.layout].slots.map(s => s[0]));
      for (const [key, label, kind] of ALL_SLOTS) {
        const inLayout = used.has(key);
        const wrap = document.createElement("div");
        wrap.className = "slot" + (inLayout ? "" : " slot--unused");
        const lab = document.createElement("label"); lab.className="field-label"; lab.textContent=label;
        if (!inLayout) lab.textContent += " · hidden in this layout";
        wrap.appendChild(lab);
        if (kind === "image") {
          const row = document.createElement("div"); row.className="img-row";
          const prev = document.createElement("img"); prev.className="preview";
          resolveImage(slide[key]).then(u=>{ if(u) prev.src=u; });
          const nameEl = document.createElement("div"); nameEl.className="img-name";
          nameEl.textContent = slide[key] ? slide[key].split("/").pop() : "No image";
          if (!slide[key]) nameEl.classList.add("img-name--empty");
          const browse = document.createElement("button");
          browse.className = "btn btn-ghost btn-icon"; browse.title = "Choose from media"; browse.innerHTML = `<span class="mi mi-sm">photo_library</span>`;
          browse.onclick = () => openMediaPicker(rel => { slide[key]=rel; renderAll(); });
          row.append(prev, nameEl, browse); wrap.appendChild(row);
          // Fit: how the image sits in its frame.
          const fitSel = document.createElement("select"); fitSel.className="field"; fitSel.style.marginTop="6px";
          for (const [v,t] of [["cover","Fill frame (crop)"],["contain","Fit whole image"]]) {
            const o=document.createElement("option"); o.value=v; o.textContent=t; fitSel.appendChild(o);
          }
          fitSel.value = slide.imageFit || "cover";
          fitSel.onchange = () => { slide.imageFit = fitSel.value; scheduleRender(); };
          wrap.appendChild(fitSel);
        } else {
          const ta = document.createElement(kind==="md"?"textarea":"input");
          ta.className = "field"; ta.value = slide[key]||"";
          if (kind==="md") ta.placeholder="Markdown — **bold**, lists, links";
          ta.oninput = () => { slide[key]=ta.value; scheduleRender(); };
          wrap.appendChild(ta);
        }
        content.appendChild(wrap);
      }
      // Columns control — title-body flows its single body into 1 or 2 columns.
      if (slide.layout === "title-body") {
        const wrap = document.createElement("div");
        const lab = document.createElement("label"); lab.className="field-label"; lab.textContent="Columns";
        const sel = document.createElement("select"); sel.className="field";
        for (const n of [1,2]) { const o=document.createElement("option"); o.value=n; o.textContent=`${n} column${n>1?"s":""}`; sel.appendChild(o); }
        sel.value = slide.columns === 2 ? 2 : 1;
        sel.onchange = () => { slide.columns = +sel.value; scheduleRender(); };
        wrap.append(lab, sel); content.appendChild(wrap);
      }
      inspector.appendChild(content);

      // Theme
      inspector.appendChild(themeSection());
    }

    function sec(title){ const s=document.createElement("div"); s.className="insp-sec"; const h=document.createElement("h3"); h.textContent=title; s.appendChild(h); return s; }

    function themeSection() {
      const s = sec("Theme");
      // presets — brand-kit-style preview cards (type sample + swatch strip)
      const presetWrap = document.createElement("div"); presetWrap.className="theme-cards";
      PRESETS.forEach(p => {
        loadFont(p.fonts.heading.family, p.fonts.heading.weight);
        loadFont(p.fonts.body.family, p.fonts.body.weight);
        const isActive = p.colors.bg===state.theme.colors.bg && p.fonts.heading.family===state.theme.fonts.heading.family;
        const card = document.createElement("div");
        card.className = "theme-card" + (isActive?" active":"");
        card.title = p.name;
        const h = `<div class="theme-card__h" style="font-family:'${p.fonts.heading.family}',serif;font-weight:${p.fonts.heading.weight}">${p.name}</div>`;
        const b = `<div class="theme-card__b" style="font-family:'${p.fonts.body.family}',sans-serif;font-weight:${p.fonts.body.weight}">${p.fonts.heading.family} · ${p.fonts.body.family}</div>`;
        const sw = `<div class="theme-card__sw">${["bg","text","accent"].map(k=>`<span style="background:${p.colors[k]}"></span>`).join("")}</div>`;
        card.innerHTML = `<div class="theme-card__type">${h}${b}</div>${sw}`;
        card.onclick = () => { state.theme = structuredClone(p); loadThemeFonts(state.theme); renderAll(); };
        presetWrap.appendChild(card);
      });
      s.appendChild(presetWrap);
      return s;
    }

    // tiny inline schematic per layout
    function layoutIcon(key){
      const a="var(--accent)", g="var(--hairline-strong)";
      const box=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${f}"/>`;
      let g2="";
      switch(key){
        case "title": g2=box(14,40,50,8,a)+box(14,52,38,5,g); break;
        case "section": g2=`<rect x="0" y="0" width="100" height="56" fill="${a}" opacity=".25"/>`+box(14,24,48,8,a); break;
        case "title-body": g2=box(14,12,40,7,a)+box(14,26,72,4,g)+box(14,34,72,4,g)+box(14,42,52,4,g); break;
        case "two-col": g2=box(14,10,40,6,a)+box(14,24,32,4,g)+box(14,32,32,4,g)+box(54,24,32,4,g)+box(54,32,32,4,g); break;
        case "quote": g2=box(20,20,60,7,a)+box(20,32,40,7,a)+box(20,46,24,4,g); break;
        case "image-full": g2=box(0,0,100,56,g); break;
        case "image-text": g2=box(10,16,38,30,g)+box(54,16,34,6,a)+box(54,28,34,4,g)+box(54,36,28,4,g); break;
      }
      return `<svg viewBox="0 0 100 56" preserveAspectRatio="none">${g2}</svg>`;
    }

    // ---------- Render orchestration ----------
    let renderTimer;
    function scheduleRender(){ clearTimeout(renderTimer); renderTimer=setTimeout(()=>{ renderStage(); renderReel(); }, 120); scheduleSave(); }
    function renderAll(){ renderStage(); renderReel(); renderInspector(); scheduleSave(); }

    // ---------- Defaults for new slides ----------
    const SLIDE_DEFAULTS = {
      "title": { title:"Title", subtitle:"Subtitle" },
      "section": { title:"Section" },
      "title-body": { title:"Title", body:"Your content here." },
      "two-col": { title:"Title", left:"- Point one\n- Point two", right:"- Point three\n- Point four" },
      "quote": { quote:"A memorable line.", attribution:"Source" },
      "image-full": { image:"", caption:"" },
      "image-text": { title:"Title", image:"", body:"Describe the image." },
    };
    document.getElementById("add-slide").onclick = () => {
      const layout = state.slides[current]?.layout || "title-body";
      state.slides.splice(current+1, 0, { layout, ...structuredClone(SLIDE_DEFAULTS[layout]) });
      current++; renderAll();
    };

    document.getElementById("deck-name").oninput = e => { state.name = e.target.value; scheduleSave(); };

    // ---------- Save (artifact JSON) ----------
    const statusEl = document.getElementById("status");
    function buildDoc(){
      return { kind:"presentation", version:1, name:state.name||"Untitled deck",
               theme:state.theme, slides:state.slides, savedAt:new Date().toISOString() };
    }

    // Debounced auto-save: overwrites the active artifact once the deck has a
    // file (a brand-new deck is created on first edit, or via "Save as…").
    let booted = false, saveTimer = null, saving = false, saveAgain = false, lastSaved = "";
    // Content fingerprint (sans savedAt) so navigation/re-renders don't churn the file.
    function snapshot(){ return JSON.stringify({ name: state.name, theme: state.theme, slides: state.slides }); }
    function scheduleSave(){
      if (!booted || !invoke) return;
      if (snapshot() === lastSaved) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(autoSave, 700);
    }
    async function autoSave(){
      if (saving) { saveAgain = true; return; }   // coalesce edits during a write
      saving = true;
      const snap = snapshot();
      try {
        const content = JSON.stringify(buildDoc(), null, 2);
        if (activePath) {
          await invoke("overwrite_artifact", { path: activePath, content });
        } else {
          // First save of a new deck — create the file and adopt it.
          const p = await invoke("save_artifact", { kind:"presentation", name: state.name||"Untitled deck", content });
          activePath = p; deriveProjectRoot(p);
        }
        lastSaved = snap;
        statusEl.textContent = "Saved " + new Date().toLocaleTimeString();
      } catch(e){ statusEl.textContent = "Save failed: " + e; }
      saving = false;
      if (saveAgain) { saveAgain = false; autoSave(); }
    }

    document.getElementById("save-as").onclick = async () => {
      const name = state.name||"Untitled deck";
      const content = JSON.stringify(buildDoc(),null,2);
      if (invoke) {
        try { const p = await invoke("save_artifact", { kind:"presentation", name, content });
              // adopt the new file so auto-save overwrites it from here on
              activePath = p; deriveProjectRoot(p); statusEl.textContent="Saved → "+p; }
        catch(e){ statusEl.textContent="Save failed: "+e; }
      } else {
        const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([content],{type:"application/json"}));
        a.download=name.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".json"; a.click();
      }
    };

    // ---------- Export: build a standalone HTML deck ----------
    // Resolve every image, then emit a self-contained navigable HTML document.
    // `mode`: "inline" embeds images as data URLs; "assets" rewrites refs to
    // assets/<file> and returns the asset copy list for save_export_dir.
    async function buildDeckHtml(mode){
      const assets = []; const seen = new Map();
      const resolved = {};
      for (const s of state.slides) {
        if (s.image) {
          if (mode==="assets") {
            if (!seen.has(s.image)) {
              const base = s.image.split("/").pop().replace(/[^a-z0-9._-]/gi,"_");
              let name = base, n=1;
              const used = new Set(seen.values());
              while (used.has(name)) name = (n++)+"-"+base;
              seen.set(s.image, name);
              assets.push({ name, source: projectRoot ? projectRoot+"/"+s.image.replace(/^\//,"") : s.image });
            }
            resolved[s.image] = "assets/"+seen.get(s.image);
          } else {
            resolved[s.image] = await resolveImage(s.image);
          }
        }
      }
      const t = state.theme;
      const slideHtml = state.slides.map(s => renderSlide(s, t, resolved).outerHTML).join("\n");
      // Grab only the slide-renderer rules (the last block in our <style>),
      // starting exactly at `.slide {` so no comment fragment corrupts the
      // first selector when serialized into the export.
      const styleText = document.querySelector("style").textContent;
      const css = styleText.slice(styleText.indexOf(".slide {"));
      const fontHref = "https://fonts.googleapis.com/css2?family=" +
        [t.fonts.heading, t.fonts.body].map(f=>f.family.replace(/ /g,"+")+":wght@"+f.weight).join("&family=") + "&display=swap";
      return { html: deckShell(state.name, css, fontHref, slideHtml, t), assets };
    }

    function deckShell(name, css, fontHref, slides, t){
      return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>${esc(name)}</title>
<link rel="stylesheet" href="${fontHref}">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:${t.colors.bg};font-family:sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .deck{position:relative}
  .scaler{transform-origin:center}
  .slide{display:none!important}
  .slide.show{display:flex!important}
  ${css}
  /* print: one slide per page for Save-as-PDF */
  @media print{
    @page{size:1280px 720px;margin:0}
    body{display:block;background:#fff}
    .nav{display:none}
    .slide{display:flex!important;page-break-after:always;box-shadow:none;border-radius:0}
  }
  .nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;font-family:sans-serif;background:rgba(0,0,0,.45);padding:5px;border-radius:999px;backdrop-filter:blur(6px)}
  .nav button{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:16px;line-height:1}
  .nav button:hover{background:rgba(255,255,255,.32)}
  .nav .count{color:#fff;opacity:.85;align-self:center;font-size:13px;padding:0 6px}
</style></head>
<body>
<div class="deck"><div class="scaler" id="scaler">${slides}</div></div>
<div class="nav"><button id="prev">‹</button><span class="count" id="count"></span><button id="next">›</button></div>
<script>
  const slides=[...document.querySelectorAll('.slide')]; let i=0;
  const scaler=document.getElementById('scaler');
  function fit(){ const s=Math.min(innerWidth/1280, innerHeight/720); scaler.style.transform='scale('+s+')'; scaler.style.width='1280px'; scaler.style.height='720px'; }
  function show(n){ i=(n+slides.length)%slides.length; slides.forEach((s,k)=>s.classList.toggle('show',k===i)); document.getElementById('count').textContent=(i+1)+' / '+slides.length; }
  addEventListener('resize',fit); fit(); show(0);
  document.getElementById('next').onclick=()=>show(i+1); document.getElementById('prev').onclick=()=>show(i-1);
  addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')show(i+1); if(e.key==='ArrowLeft')show(i-1); });
<\/script>
</body></html>`;
    }

    document.getElementById("export-web").onclick = async () => {
      statusEl.textContent = "Building web export…";
      try {
        const { html, assets } = await buildDeckHtml("assets");
        if (invoke) {
          const folder = (state.name||"deck").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
          const p = await invoke("save_export_dir", { folder, html, assets });
          statusEl.textContent = "Web deck → " + p;
        } else {
          const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([html],{type:"text/html"})); a.download="deck.html"; a.click();
        }
      } catch(e){ statusEl.textContent = "Export failed: "+e; }
    };

    // ---------- Coloris ----------
    function initColoris(){ const sc=document.createElement("studio-color"); sc.style.display="none"; document.body.appendChild(sc); requestAnimationFrame(()=>sc.remove()); }

    // ---------- Drop + paste to import an image into the project's media/ ----
    // Drop a file anywhere on the window, or Cmd/Ctrl+V a copied image; the file
    // lands in media/ (via Studio's import_media / paste_image) and is set on the
    // current slide. The OS drop overlay is handled by Tauri's drag-drop event.
    function initImageImport(){
      if (!invoke || !window.__TAURI__?.event) return;
      const { listen } = window.__TAURI__.event;
      listen("tauri://drag-enter", () => document.body.classList.add("dropping"));
      listen("tauri://drag-leave", () => document.body.classList.remove("dropping"));
      listen("tauri://drag-drop", async (e) => {
        document.body.classList.remove("dropping");
        if (!projectRoot) { statusEl.textContent = "Save the deck first so images have a project to import into."; return; }
        const paths = (e.payload && e.payload.paths) || [];
        if (!paths.length) return;
        try {
          const imported = await invoke("import_media", { projectPath: projectRoot, files: paths });
          if (imported && imported.length) setCurrentImage(toRel(imported[imported.length - 1]));
          else statusEl.textContent = "No image in the dropped files.";
        } catch(err){ statusEl.textContent = "Import failed: " + err; }
      });
      // Cmd/Ctrl+V — paste a clipboard image (ignore when typing in a field).
      window.addEventListener("keydown", async (e) => {
        if (!((e.metaKey || e.ctrlKey) && e.key === "v")) return;
        const t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
        if (!projectRoot) return;
        try {
          const p = await invoke("paste_image", { projectPath: projectRoot });
          setCurrentImage(toRel(p));
        } catch { /* no image on clipboard — ignore */ }
      });
    }

    // ---------- Boot ----------
    function deriveProjectRoot(p){ const m=p.match(/^(.*)\/artifacts\//); projectRoot = m? m[1] : null; }
    async function boot(){
      const path = new URLSearchParams(location.search).get("artifact");
      if (path && invoke) {
        try {
          const data = JSON.parse(await invoke("read_artifact", { path }));
          if (data.theme) state.theme = data.theme;
          if (Array.isArray(data.slides) && data.slides.length) state.slides = data.slides;
          if (data.name) state.name = data.name;
          activePath = path; deriveProjectRoot(path);
        } catch(e){ statusEl.textContent="Couldn't load deck: "+e; }
      }
      document.getElementById("deck-name").value = state.name;
      loadThemeFonts(state.theme);
      initColoris();
      initImageImport();
      renderAll();
      // Mark the loaded (or default) state as already-saved, then enable auto-save.
      lastSaved = snapshot();
      booted = true;
    }
    boot();
  </script>
</body>
</html>
