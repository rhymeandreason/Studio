<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slides</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="../deck/render.css" />
<script type="module" src="../kit/components.js"></script>
<script src="../vendor/marked.min.js"></script>
<style>
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* Three columns: slide reel · stage · inspector. */
  .reel {
    flex: 0 0 200px;
    border-right: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .reel-head {
    padding: 12px;
    border-bottom: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .reel-list { overflow-y: auto; padding: 14px 14px 14px 2px; display: flex; flex-direction: column; gap: 8px; }
  .reel-row { display: flex; align-items: center; gap: 8px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .reel-num { flex: 0 0 16px; text-align: right; font-size: 11px; font-family: var(--mono); color: var(--text-soft); }
  .thumb {
    position: relative;
    flex: 1 1 auto;        /* fills the row beside the number */
    min-width: 0;
    aspect-ratio: 16 / 9;
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-sm);
    overflow: hidden;
    cursor: pointer;
    background: #fff;
  }
  .thumb.selected { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
  .thumb.active { outline: 2px solid var(--accent); outline-offset: 1px; }
  body.reordering { cursor: grabbing; }
  body.reordering .reel-row { pointer-events: none; }
  .drop-line { height: 0; border-top: 2px solid var(--accent); margin: -5px 0 3px; border-radius: 2px; }
  /* The scaled-down render lives in here. */
  .thumb__stage { position: absolute; top: 0; left: 0; transform-origin: top left; }

  .stage-wrap {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .stage-bar {
    padding: 12px 14px;
    border-bottom: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stage-bar .title { font-family: var(--serif); font-size: 13px; flex: 1 1 auto; min-width: 0; }
  .stage-bar input.title {
    border: none; background: transparent; color: var(--text);
    font-family: var(--serif); font-size: 13px;
  }
  /* Contextual control bar above the canvas — only the current layout's controls. */
  .stage-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 9px 14px; border-bottom: 1px solid var(--hairline); min-height: 0; }
  .stage-controls:empty { display: none; }
  .stage-ctl { display: flex; align-items: center; gap: 6px; }
  .stage-ctl > .label { font-size: 11px; color: var(--text-soft); }
  .stage-ctl select.field { height: 28px; padding: 0 24px 0 8px; font-size: 12px; width: auto; }
  .stage-ctl input.field { height: 28px; padding: 0 8px; font-size: 12px; width: 160px; }
  .stage-ctl .img-name { font-size: 12px; max-width: 140px; flex: 0 1 auto; }
  .stage-ctl .preview { width: 38px; height: 24px; object-fit: cover; border-radius: 3px; border: 1px solid var(--hairline); background: var(--elevated); flex: 0 0 auto; }
  .stage-ctl .btn-icon { flex: 0 0 auto; }
  .stage-divider { width: 1px; align-self: stretch; background: var(--hairline-strong); margin: -2px 4px; }
  .stage-scroll { flex: 1 1 auto; overflow: auto; display: grid; place-items: center; padding: 28px; }
  /* Click-to-edit text regions on the canvas. Ring uses currentColor (the
     slide's text color) so it stays visible on light and dark backgrounds. */
  .canvas .editable { cursor: text; outline: none; border-radius: 3px; transition: box-shadow .12s; user-select: none; }
  .canvas .editable:focus { user-select: text; }
  .canvas .editable:hover { box-shadow: 0 0 0 1px color-mix(in srgb, currentColor 28%, transparent); }
  .canvas .editable:focus { box-shadow: 0 0 0 1.5px color-mix(in srgb, currentColor 50%, transparent); }
  /* The editing canvas: a fixed-size 1280×720 slide, scaled to fit. */
  .canvas {
    width: 1280px; height: 720px;
    transform-origin: center;
    box-shadow: 0 6px 30px rgba(0,0,0,.18);
    border-radius: 4px;
  }
  /* In the editor, let overflowing content spill below the slide (the export
     still clips). A veil dims the spill so it reads as "off-slide". */
  .canvas .slide { overflow: visible; }
  .canvas .slide::after {
    content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 1400px;
    background: var(--bg); opacity: .6; pointer-events: none;
  }

  .inspector {
    flex: 0 0 300px;
    border-left: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .insp-tabs { display: flex; border-bottom: 1px solid var(--hairline); position: sticky; top: 0; background: var(--bg); z-index: 1; padding-top:16px;}
  .insp-tab { flex: 1; padding: 11px 0; border: none; background: transparent; cursor: pointer; font-family: var(--sans); font-size: 12px; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .insp-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .insp-sec { padding: 14px; border-bottom: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 10px; }
  .insp-sec h3 { font-family: var(--serif); font-size: 12px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .insp-sec textarea.field { min-height: 64px; resize: vertical; line-height: 1.4; }
  .field-label { font-size: 11px; color: var(--text-soft); margin-bottom: 3px; display: block; letter-spacing:.05em;}
  input, textarea, select, .field { font-family: system-ui, sans-serif; }
  .slot--unused { opacity: .45; }
  .slot--unused:focus-within { opacity: 1; }

  .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 12px; }
  .layout-cell { display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
  .layout-opt {
    aspect-ratio: 16 / 9; border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-sm); position: relative;
    background: var(--elevated); overflow: hidden;
  }
  .layout-cell.active .layout-opt { outline: 2px solid var(--accent); outline-offset: 1px; }
  .layout-opt svg { width: 100%; height: 100%; display: block; }
  .layout-cell__name { text-align: center; font-size: 10px; color: var(--text-muted); font-family:system-ui;}
  .layout-cell.active .layout-cell__name { color: var(--accent); }

  /* Theme presets as mini Title-slide preview cards */
  .theme-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 12px; align-items: start; }
  .theme-card { cursor: pointer; }
  .theme-card__preview { aspect-ratio: 16 / 9; border: 1px solid var(--hairline-strong); border-radius: var(--radius-sm); overflow: hidden; position: relative; background: #fff; }
  .theme-card.active .theme-card__preview { outline: 2px solid var(--accent); outline-offset: 1px; }
  .theme-card__edit { position: absolute; top: 4px; right: 4px; z-index: 2; width: 24px; height: 24px; display: grid; place-items: center; border: none; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; cursor: pointer; opacity: 0; }
  .theme-card:hover .theme-card__edit { opacity: 1; }
  .theme-card__stage { position: absolute; top: 0; left: 0; transform-origin: top left; }
  /* Stack name over chips so every card's meta is the same height (even grid). */
  .theme-card__meta { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; margin-top: 8px; }
  .theme-card__name { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-family:system-ui;}
  .theme-card.active .theme-card__name { color: var(--accent); }
  .theme-card__chips { display: flex; gap: 3px; flex: 0 0 auto; }
  .theme-card__chips span { width: 9px; height: 9px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); }

  .scheme-chips { display: flex; gap: 8px; }
  .scheme-chip { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hairline-strong); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .scheme-chip span { font-family: var(--serif); font-size: 15px; line-height: 1; }
  .scheme-chip.active { outline: 2px solid var(--accent); outline-offset: 2px; }

  .swatch-row { display: flex; align-items: center; gap: 8px; }
  .swatch-row .swatch-block { width: 26px; height: 26px; border-radius: var(--radius-sm); border: 1px solid var(--hairline-strong); cursor: pointer; flex: 0 0 auto; }
  .swatch-row label { font-size: 11px; color: var(--text-muted); flex: 1; }
  .coloris-trigger { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .status { font-family: var(--mono); font-size: 11px; color: var(--text-muted); min-height: 14px; padding: 0 14px 12px; }
  .img-row { display: flex; gap: 6px; align-items: center; }
  .img-row .field { flex: 1; min-width: 0; }
  .img-row .preview { width: 40px; height: 28px; object-fit: cover; border-radius: 3px; border: 1px solid var(--hairline); background: var(--elevated); flex: 0 0 auto; }
  .img-row .btn-icon { flex: 0 0 auto; }
  .img-name { flex: 1; min-width: 0; font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .img-name--empty { color: var(--text-soft); font-style: italic; }

  /* Media picker overlay */
  .picker-overlay { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(3px); display: flex; flex-direction: column; }
  .picker-bar { padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--hairline); }
  .picker-bar h3 { font-family: var(--serif); font-size: 14px; flex: 1; }
  .picker-grid { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: 112px; gap: 12px; align-content: start; }
  .picker-tile { height: 112px; border: 1px solid var(--hairline-strong); border-radius: var(--radius-sm); overflow: hidden; cursor: pointer; background: var(--elevated); position: relative; }
  .picker-tile:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
  .picker-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .picker-tile span { position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 6px; font-size: 10px; background: linear-gradient(transparent, rgba(0,0,0,.6)); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .picker-empty { padding: 40px; text-align: center; color: var(--text-muted); grid-column: 1 / -1; }
  body.dropping::after { content: "Drop to add image"; position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, transparent); border: 3px dashed var(--accent); color: var(--accent); font-family: var(--serif); font-size: 22px; pointer-events: none; }
  /* Slide-renderer styles (.slide, .l-*) live in ../deck/render.css. */
</style>
</head>
<body>
  <div class="reel">
    <div class="reel-head">
      <button class="btn btn-primary" id="add-slide"><span class="mi mi-sm">add</span> Slide</button>
    </div>
    <div class="reel-list" id="reel-list"></div>
  </div>

  <div class="stage-wrap">
    <div class="stage-bar">
      <input class="title" id="deck-name" value="Untitled deck" spellcheck="false" />
      <button class="btn btn-ghost" id="export-web"><span class="mi mi-sm">public</span> Web</button>
      <button class="btn btn-secondary" id="save-as">Save as…</button>
    </div>
    <div class="stage-controls" id="stage-controls"></div>
    <div class="stage-scroll">
      <div class="canvas" id="canvas"></div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="inspector" id="inspector"></div>

  <script type="module">
    import { initDevInspect } from "../devinspect.js";
    import { renderSlide as renderSlideBase, colorScheme, SCHEMES, HEADING_DEFAULT } from "../deck/render.js";
    const marked = window.marked;
    const invoke = window.__TAURI__?.core?.invoke;
    const esc = (s) => (s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

    // ---------- Layouts ----------
    // Each layout declares the slots it edits. Slots are markdown-capable text
    // unless type:"image". This list is the contract Claude follows (mirrored in
    // the studio-artifacts skill).
    const LAYOUTS = {
      "title":      { name: "Title",      slots: [["title","Title"],["subtitle","Subtitle"]] },
      "section":    { name: "Section",    slots: [["title","Section title"],["image","Background image","image"]] },
      "title-body": { name: "Title + Body", slots: [["title","Title"],["body","Body","md"]] },
      "two-col":    { name: "Two column", slots: [["title","Title"],["left","Left","md"],["right","Right","md"]] },
      "three-col":  { name: "Three column", slots: [["title","Title"],["left","Left","md"],["middle","Middle","md"],["right","Right","md"]] },
      "quote":      { name: "Quote",      slots: [["quote","Quote"],["attribution","Attribution"]] },
      "image-full": { name: "Image full", slots: [["image","Image","image"],["caption","Caption"]] },
      "image-text": { name: "Image + Text", slots: [["title","Title"],["image","Image","image"],["body","Body","md"]] },
    };

    // The union of every slot across layouts, in a stable order. The inspector
    // shows all of these so values aren't lost (or hidden) when you switch
    // layouts — the chosen layout just decides which ones actually render.
    const ALL_SLOTS = [
      ["title","Title"], ["subtitle","Subtitle"],
      ["quote","Quote"], ["attribution","Attribution"],
      ["body","Body","md"], ["left","Left","md"], ["middle","Middle","md"], ["right","Right","md"],
      ["image","Image","image"], ["caption","Caption"],
    ];

    // The primary prose slot for each layout — used to carry body text across a
    // layout change (e.g. title-body's `body` ↔ two-col's `left`).
    const PRIMARY_BODY = {
      "title-body": "body", "two-col": "left", "three-col": "left", "image-text": "body", "quote": "quote",
    };

    // HEADING_DEFAULT, colorScheme, SCHEMES, and renderSlide come from
    // ../deck/render.js (shared with the theme editor + Artifacts preview).
    // Size-scale multipliers also live there.

    // Switch a slide's layout, moving its main text into the new layout's primary
    // prose slot when that slot is empty (so converting doesn't lose the content).
    function convertLayout(slide, next) {
      if (slide.layout === next) return;
      const from = PRIMARY_BODY[slide.layout], to = PRIMARY_BODY[next];
      if (from && to && from !== to && slide[from] && !slide[to]) slide[to] = slide[from];
      slide.layout = next;
    }

    // ---------- Theme presets ----------
    // colors: { bg, surface, text, muted, accent, accent2 } — a 6-role palette
    // (surface = subtle panel bg, muted = secondary text, accent/accent2 = two
    // accent colors, each usable as a full-slide background scheme).
    const PRESETS = [
      { name: "Runes", fonts:{heading:{family:"Fraunces",weight:600},body:{family:"Newsreader",weight:400}}, bodySize:24, headingSize:56,
        colors:{bg:"#f7f5f0",surface:"#efece5",text:"#2a2a28",muted:"#6e6154",accent:"#a85a4a",accent2:"#3f5e5a"} },
      { name: "Mono", fonts:{heading:{family:"Space Grotesk",weight:600},body:{family:"Inter",weight:400}}, bodySize:24, headingSize:56,
        colors:{bg:"#ffffff",surface:"#f3f4f6",text:"#111111",muted:"#6b7280",accent:"#2563eb",accent2:"#7c3aed"} },
      { name: "Editorial", fonts:{heading:{family:"Playfair Display",weight:700},body:{family:"Lora",weight:400}}, bodySize:24, headingSize:56,
        colors:{bg:"#fbf9f4",surface:"#f1ece1",text:"#1b1b1a",muted:"#7c736a",accent:"#7a5c3e",accent2:"#3d5a40"} },
      { name: "Night", fonts:{heading:{family:"Manrope",weight:700},body:{family:"Manrope",weight:400}}, bodySize:24, headingSize:56,
        colors:{bg:"#16161a",surface:"#23232a",text:"#f4f4f5",muted:"#a1a1aa",accent:"#c4f042",accent2:"#f0723e"} },
      { name: "Warm", fonts:{heading:{family:"DM Serif Display",weight:400},body:{family:"DM Sans",weight:400}}, bodySize:24, headingSize:56,
        colors:{bg:"#fdf3e7",surface:"#f7e6d2",text:"#3a2a1e",muted:"#9a7a5e",accent:"#d2693a",accent2:"#6b4a8f"} },
      { name: "Design Class", fonts:{heading:{family:"Plus Jakarta Sans",weight:600},body:{family:"Plus Jakarta Sans",weight:400}}, bodySize:24, headingSize:56,
        colors:{bg:"#f7f5f0",surface:"#ecebe6",text:"#3a2a1e",muted:"#7a6f63",accent:"#2563eb",accent2:"#e0653a"} },
    ];

    // ---------- State ----------
    let state = {
      name: "Untitled deck",
      theme: structuredClone(PRESETS[0]),
      slides: [ { layout: "title", title: "Your title", subtitle: "A subtitle" } ],
    };
    let current = 0;
    let selected = new Set([0]);   // indices of selected slides (multi-select)
    let selAnchor = 0;             // anchor for shift-range selection
    let inspectorTab = "slide";   // "slide" (layout + content) | "theme"
    let activePath = null;       // set when opened via ?artifact=
    let projectRoot = null;      // derived from artifact path; for resolving images
    const imgCache = new Map();  // project-relative path -> data URL

    // ---------- Fonts (lazy Google Fonts) ----------
    const loaded = new Set();
    function loadFont(family, weight) {
      if (!family) return;
      const key = `${family}@${weight||""}`;
      if (loaded.has(key)) return; loaded.add(key);
      const l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=" + family.replace(/ /g,"+") +
               (weight ? `:wght@${weight}` : "") + "&display=swap";
      document.head.appendChild(l);
    }
    function loadThemeFonts(t) {
      loadFont(t.fonts.heading.family, t.fonts.heading.weight);
      loadFont(t.fonts.body.family, t.fonts.body.weight);
    }

    // ---------- Image resolution ----------
    // Slides store images as project-relative paths (e.g. "media/x.png"). The
    // tool window can't load project files directly, so fetch a data URL via Rust.
    async function resolveImage(rel) {
      if (!rel) return null;
      if (/^data:|^https?:/.test(rel)) return rel;
      if (imgCache.has(rel)) return imgCache.get(rel);
      if (!invoke || !projectRoot) return null;
      try {
        const abs = projectRoot + "/" + rel.replace(/^\//, "");
        const url = await invoke("read_image_data", { path: abs });
        imgCache.set(rel, url);
        return url;
      } catch { return null; }
    }

    // Convert an absolute path (returned by import_media / list_media / paste_image)
    // to the project-relative form we store on slides.
    function toRel(abs) {
      if (!abs) return abs;
      if (projectRoot && abs.startsWith(projectRoot + "/")) return abs.slice(projectRoot.length + 1);
      return abs;
    }

    // Set the current slide's image (used by drop + paste). Stores even when the
    // active layout has no image slot — the always-visible Image field surfaces it.
    function setCurrentImage(rel) {
      const slide = state.slides[current];
      if (!slide) return;
      slide.image = rel;
      renderAll();
      statusEl.textContent = "Image set: " + rel;
    }

    // ---------- Media picker ----------
    // Grid of the active project's media/ images; click one to pick it.
    async function openMediaPicker(onPick) {
      if (!invoke || !projectRoot) { statusEl.textContent = "No active project — type a media path instead."; return; }
      const overlay = document.createElement("div"); overlay.className = "picker-overlay";
      overlay.innerHTML = `<div class="picker-bar"><h3>Project media</h3><button class="btn btn-secondary" id="pk-close">Close</button></div><div class="picker-grid" id="pk-grid"></div>`;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.querySelector("#pk-close").onclick = close;
      overlay.onclick = (e) => { if (e.target === overlay) close(); };
      const grid = overlay.querySelector("#pk-grid");
      let items = [];
      try { items = (await invoke("list_media", { path: projectRoot })).filter(m => m.kind === "image"); }
      catch (e) { grid.innerHTML = `<div class="picker-empty">Couldn't read media: ${e}</div>`; return; }
      if (!items.length) { grid.innerHTML = `<div class="picker-empty">No images in this project's media/ folder yet. Drop or paste one onto a slide, or add via Studio's Media tab.</div>`; return; }
      for (const m of items) {
        const tile = document.createElement("div"); tile.className = "picker-tile";
        tile.innerHTML = `<span>${m.name}</span>`;
        const rel = toRel(m.path);
        resolveImage(rel).then(u => { if (u) { const img = document.createElement("img"); img.src = u; tile.prepend(img); } });
        tile.onclick = () => { onPick(rel); close(); };
        grid.appendChild(tile);
      }
    }

    // ---------- Slide rendering ----------
    // renderSlide lives in ../deck/render.js (pure: images come from a `resolved`
    // map). This wrapper feeds it the tool's imgCache for project-relative refs
    // unless the caller passes an explicit `resolved` map (e.g. export).
    function renderSlide(slide, theme, resolved) {
      if (!resolved) {
        resolved = {};
        if (slide.image && imgCache.has(slide.image)) resolved[slide.image] = imgCache.get(slide.image);
      }
      return renderSlideBase(slide, theme, resolved);
    }

    // ---------- Stage (current slide, scaled to fit) ----------
    const canvas = document.getElementById("canvas");
    // Clicking anywhere off a text region (slide margin, stage background, or
    // outside the canvas entirely) commits and deselects the active edit.
    document.addEventListener("mousedown", (e) => {
      const ae = document.activeElement;
      if (ae?.classList?.contains("editable") && !e.target.closest(".editable")) ae.blur();
    });
    function renderStage() {
      const slide = state.slides[current];
      canvas.innerHTML = "";
      if (!slide) return;
      // pre-resolve image then render
      const node = renderSlide(slide, state.theme);
      canvas.appendChild(node);
      makeEditable(node, slide);
      fitCanvas();
      // If this slide has an image we haven't cached yet, fetch it then re-render
      // once (the cache hit on the next pass means no loop).
      const ref = slide.image;
      if (ref && !imgCache.has(ref) && !/^data:|^https?:/.test(ref)) {
        resolveImage(ref).then(url => { if (url) renderStage(); });
      }
    }

    // Make the canvas's text regions click-to-edit. Markdown slots show their raw
    // source while focused and re-render (formatted) on blur. We avoid re-rendering
    // the canvas on each keystroke so the caret isn't lost — only the reel + save.
    const MD_SLOTS = new Set(["body","left","right"]);
    function makeEditable(node, slide){
      node.querySelectorAll("[data-slot]").forEach(elm => {
        const slot = elm.dataset.slot;
        const isMd = MD_SLOTS.has(slot);
        elm.classList.add("editable");
        elm.contentEditable = "true";
        elm.spellcheck = false;
        // Read markdown slots via innerText so on-canvas line breaks (Enter)
        // survive as newlines; plain slots stay single-line via textContent.
        if (isMd) {
          elm.addEventListener("focus", () => { elm.textContent = slide[slot] || ""; elm.style.whiteSpace = "pre-wrap"; });
          elm.addEventListener("blur", () => { slide[slot] = elm.innerText; renderAll(); });
        } else {
          elm.addEventListener("blur", () => { slide[slot] = elm.textContent.trim(); renderAll(); });
        }
        elm.addEventListener("input", () => { slide[slot] = isMd ? elm.innerText : elm.textContent.trim(); renderReel(); scheduleSave(); });
        // Enter commits for single-line (plain) slots; Esc blurs anywhere.
        elm.addEventListener("keydown", (e) => {
          if (e.key === "Escape") { e.preventDefault(); elm.blur(); }
          if (e.key === "Enter" && !isMd) { e.preventDefault(); elm.blur(); }
        });
      });
    }
    function fitCanvas() {
      const wrap = canvas.parentElement;
      const scale = Math.min((wrap.clientWidth-56)/1280, (wrap.clientHeight-56)/720, 1);
      canvas.style.transform = `scale(${scale})`;
      canvas.style.width = "1280px"; canvas.style.height = "720px";
      canvas.style.margin = `${(720*scale-720)/2}px ${(1280*scale-1280)/2}px`;
    }
    window.addEventListener("resize", fitCanvas);

    // ---------- Reel (thumbnails) ----------
    const reel = document.getElementById("reel-list");
    function renderReel() {
      reel.innerHTML = "";
      state.slides.forEach((slide, i) => {
        const row = document.createElement("div");
        row.className = "reel-row";
        const num = document.createElement("div");
        num.className = "reel-num"; num.textContent = i+1;
        const thumb = document.createElement("div");
        thumb.className = "thumb" + (i===current?" active":"") + (selected.has(i)?" selected":"");
        const stage = document.createElement("div");
        stage.className = "thumb__stage";
        stage.appendChild(renderSlide(slide, state.theme));
        thumb.appendChild(stage);
        row.append(num, thumb);
        row.addEventListener("pointerdown", (e) => startThumbDrag(e, i));
        reel.appendChild(row);
        // scale the 1280-wide render down to the thumb width
        requestAnimationFrame(() => {
          const w = thumb.clientWidth; const s = w/1280;
          stage.style.transform = `scale(${s})`;
        });
        // async image for thumbs — fetch uncached refs, then re-render once
        if (slide.image && !imgCache.has(slide.image) && !/^data:|^https?:/.test(slide.image)) {
          resolveImage(slide.image).then(u => { if (u) renderReel(); });
        }
      });
    }

    // Click selection: plain = single, cmd/ctrl = toggle, shift = range.
    function selectThumb(i, e){
      if (e.shiftKey) {
        selected = new Set();
        const lo = Math.min(selAnchor,i), hi = Math.max(selAnchor,i);
        for (let k=lo;k<=hi;k++) selected.add(k);
        current = i;
      } else if (e.metaKey || e.ctrlKey) {
        if (selected.has(i) && selected.size>1) { selected.delete(i); if (current===i) current=[...selected][0]; }
        else { selected.add(i); current=i; }
        selAnchor = i;
      } else {
        selected = new Set([i]); current = i; selAnchor = i;
      }
      renderAll();
    }

    // Pointer-based drag reorder (HTML5 drag is swallowed in Tauri windows).
    // Dragging an unselected thumb first selects just it; dragging a selected one
    // moves the whole selection. A click (no movement) falls through to select.
    function startThumbDrag(e, i){
      if (e.button !== 0) return;
      if (!selected.has(i)) { selected = new Set([i]); current=i; selAnchor=i; renderAll(); }
      const startY = e.clientY;
      let dragging = false;
      const moving = [...selected].sort((a,b)=>a-b).map(k=>state.slides[k]);
      const onMove = (ev) => {
        if (!dragging) { if (Math.abs(ev.clientY-startY) < 5) return; dragging = true; document.body.classList.add("reordering"); }
        clearDropLine();
        showDropLine(dropIndexAt(ev.clientY));
      };
      const onUp = (ev) => {
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        if (dragging) {
          const target = dropIndexAt(ev.clientY);
          clearDropLine(); document.body.classList.remove("reordering");
          reorderTo(moving, target);
        } else {
          selectThumb(i, ev);   // treat as a click
        }
      };
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    }
    // Insertion index (0..n) from a pointer Y over the reel.
    function dropIndexAt(y){
      const rows = [...reel.querySelectorAll(".reel-row")];
      for (let k=0;k<rows.length;k++){
        const r = rows[k].getBoundingClientRect();
        if (y < r.top + r.height/2) return k;
      }
      return rows.length;
    }
    function showDropLine(idx){
      const line = document.createElement("div"); line.className="drop-line"; line.id="drop-line";
      const rows = reel.querySelectorAll(".reel-row");
      reel.insertBefore(line, rows[idx] || null);
    }
    function clearDropLine(){ document.getElementById("drop-line")?.remove(); }
    // Move the given slide objects so they sit at insertion index `target`
    // (in the pre-move array's coordinates), preserving their relative order.
    function reorderTo(moving, target){
      const set = new Set(moving);
      const before = state.slides.slice(0, target).filter(s => set.has(s)).length;
      const remaining = state.slides.filter(s => !set.has(s));
      remaining.splice(target - before, 0, ...moving);
      state.slides = remaining;
      selected = new Set(moving.map(s => state.slides.indexOf(s)));
      current = state.slides.indexOf(moving[0]);
      selAnchor = current;
      renderAll();
    }

    // Delete the selected slides (Backspace/Delete). Keeps at least one slide.
    function deleteSelected(){
      if (!selected.size) return;
      const keep = state.slides.filter((s,k) => !selected.has(k));
      if (!keep.length) return;   // never empty the deck
      const first = Math.min(...selected);
      state.slides = keep;
      current = Math.min(first, state.slides.length-1);
      selected = new Set([current]); selAnchor = current;
      renderAll();
    }
    window.addEventListener("keydown", (e) => {
      if (e.key !== "Backspace" && e.key !== "Delete") return;
      const t = e.target;
      if (t && (t.isContentEditable || t.tagName==="INPUT" || t.tagName==="TEXTAREA")) return;
      e.preventDefault();
      deleteSelected();
    });

    // ---------- Inspector ----------
    const inspector = document.getElementById("inspector");
    function renderInspector() {
      const slide = state.slides[current];
      inspector.innerHTML = "";

      // Tab bar — Slide (layout + content) vs Theme.
      const tabs = document.createElement("div"); tabs.className = "insp-tabs";
      for (const [id, label] of [["slide","Slide"],["theme","Theme"]]) {
        const b = document.createElement("button");
        b.className = "insp-tab" + (inspectorTab===id?" active":"");
        b.textContent = label;
        b.onclick = () => { inspectorTab = id; renderInspector(); };
        tabs.appendChild(b);
      }
      inspector.appendChild(tabs);

      if (inspectorTab === "theme") { inspector.appendChild(themeSection()); return; }

      // Layout picker
      const layoutSec = sec("Layout");
      const grid = document.createElement("div"); grid.className = "layout-grid";
      for (const [key, def] of Object.entries(LAYOUTS)) {
        const cell = document.createElement("div");
        cell.className = "layout-cell" + (slide.layout===key?" active":"");
        cell.innerHTML = `<div class="layout-opt">${layoutIcon(key)}</div><div class="layout-cell__name">${def.name}</div>`;
        cell.onclick = () => { convertLayout(slide, key); renderAll(); };
        grid.appendChild(cell);
      }
      layoutSec.appendChild(grid);
      inspector.appendChild(layoutSec);

      // Color scheme — light / dark / accent, shown as swatches of each scheme's
      // background color (derived from the deck theme).
      const colorSec = sec("Color");
      const chips = document.createElement("div"); chips.className="scheme-chips";
      const activeScheme = slide.colorScheme || (slide.layout === "section" ? "accent" : "light");
      for (const v of SCHEMES) {
        const pal = colorScheme(state.theme.colors, v);
        const chip = document.createElement("button");
        chip.className = "scheme-chip" + (v===activeScheme?" active":"");
        chip.title = v[0].toUpperCase()+v.slice(1);
        chip.style.background = pal.bg;
        chip.innerHTML = `<span style="color:${pal.text}">A</span>`;
        chip.onclick = () => { slide.colorScheme = v; renderAll(); };
        chips.appendChild(chip);
      }
      colorSec.appendChild(chips);
      inspector.appendChild(colorSec);

      // Content slots — text fields only. Image + sizing/style controls live in
      // the stage control bar above the canvas. Show all, dimming hidden ones.
      const content = sec("Content");
      const used = new Set(LAYOUTS[slide.layout].slots.map(s => s[0]));
      for (const [key, label, kind] of ALL_SLOTS) {
        if (kind === "image" || key === "caption") continue;   // these live in the stage control bar
        const inLayout = used.has(key);
        const wrap = document.createElement("div");
        wrap.className = "slot" + (inLayout ? "" : " slot--unused");
        const lab = document.createElement("label"); lab.className="field-label"; lab.textContent=label;
        if (!inLayout) lab.textContent += " · hidden in this layout";
        wrap.appendChild(lab);
        const ta = document.createElement(kind==="md"?"textarea":"input");
        ta.className = "field"; ta.value = slide[key]||"";
        if (kind==="md") ta.placeholder="Markdown — **bold**, lists, links";
        ta.oninput = () => { slide[key]=ta.value; scheduleRender(); };
        wrap.appendChild(ta);
        content.appendChild(wrap);
      }
      inspector.appendChild(content);
    }

    // ---------- Stage control bar (contextual controls above the canvas) -------
    // Only the controls whose slot/feature the current layout actually uses.
    const ctlBar = document.getElementById("stage-controls");
    function renderStageControls(){
      const slide = state.slides[current];
      ctlBar.innerHTML = "";
      if (!slide) return;
      const slots = LAYOUTS[slide.layout].slots;
      const hasBody = slots.some(s => s[2] === "md");
      const hasHeading = slots.some(s => s[0] === "title" || s[0] === "quote");
      const imgSlot = slots.find(s => s[2] === "image");

      const addSelect = (label, opts, value, onchange) => {
        const ctl = document.createElement("div"); ctl.className = "stage-ctl";
        const lab = document.createElement("span"); lab.className = "label"; lab.textContent = label;
        const sel = document.createElement("select"); sel.className = "field";
        for (const [v,t] of opts) { const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); }
        sel.value = value; sel.onchange = () => onchange(sel.value);
        ctl.append(lab, sel); ctlBar.appendChild(ctl);
      };

      if (imgSlot) {
        const key = imgSlot[0];
        const ctl = document.createElement("div"); ctl.className = "stage-ctl";
        const tag = document.createElement("span"); tag.className = "label"; tag.textContent = imgSlot[1];
        ctl.appendChild(tag);
        const prev = document.createElement("img"); prev.className = "preview";
        resolveImage(slide[key]).then(u => { if (u) prev.src = u; });
        const nameEl = document.createElement("div"); nameEl.className = "img-name";
        nameEl.textContent = slide[key] ? slide[key].split("/").pop() : "No image";
        if (!slide[key]) nameEl.classList.add("img-name--empty");
        const browse = document.createElement("button");
        browse.className = "btn btn-ghost btn-icon"; browse.title = "Choose image";
        browse.innerHTML = `<span class="mi mi-sm">photo_library</span>`;
        browse.onclick = () => openMediaPicker(rel => { slide[key] = rel; renderAll(); });
        ctl.append(prev, nameEl, browse); ctlBar.appendChild(ctl);
        addSelect("Fit", [["cover","Fill"],["contain","Fit"]], slide.imageFit || "cover", v => { slide.imageFit = v; scheduleRender(); });
        // Optional caption — travels with the image on any image layout; only
        // renders on the slide when it has text.
        const cc = document.createElement("div"); cc.className = "stage-ctl";
        const clab = document.createElement("span"); clab.className = "label"; clab.textContent = "Caption";
        const inp = document.createElement("input"); inp.className = "field"; inp.placeholder = "optional"; inp.value = slide.caption || "";
        inp.oninput = () => { slide.caption = inp.value; scheduleRender(); };
        cc.append(clab, inp); ctlBar.appendChild(cc);
        // Divider separating the image controls from the text controls.
        if (hasHeading || hasBody) ctlBar.appendChild(Object.assign(document.createElement("div"), { className: "stage-divider" }));
      }
      if (hasHeading) addSelect("Heading", [["s","S"],["m","M"],["l","L"],["xl","XL"]], slide.headingSize || HEADING_DEFAULT[slide.layout] || "m", v => { slide.headingSize = v; scheduleRender(); });
      if (hasBody) addSelect("Body", [["s","S"],["m","M"],["l","L"]], slide.bodySize || "m", v => { slide.bodySize = v; scheduleRender(); });
      if (slide.layout === "title-body") addSelect("Columns", [["1","1"],["2","2"]], String(slide.columns === 2 ? 2 : 1), v => { slide.columns = +v; scheduleRender(); });
      if (hasBody) addSelect("List", [["bullets","Bullets"],["cards","Cards"]], slide.listStyle || "bullets", v => { slide.listStyle = v; scheduleRender(); });
    }

    function sec(title){ const s=document.createElement("div"); s.className="insp-sec"; const h=document.createElement("h3"); h.textContent=title; s.appendChild(h); return s; }

    // Sample slide used for a theme card's mini preview (the deck's own first
    // slide if it's a title card, else a generic title sample).
    function themeSampleSlide(){
      const first = state.slides[0];
      return first && first.layout === "title"
        ? { layout:"title", title:first.title||"Title", subtitle:first.subtitle||"" }
        : { layout:"title", title:"Title", subtitle:"Subtitle" };
    }
    // Build a theme card. `editPath` (an artifact path) adds an Edit button.
    function themeCard(p, editPath){
      loadFont(p.fonts.heading.family, p.fonts.heading.weight);
      loadFont(p.fonts.body.family, p.fonts.body.weight);
      const isActive = p.colors.bg===state.theme.colors.bg && p.fonts.heading.family===state.theme.fonts.heading.family;
      const card = document.createElement("div");
      card.className = "theme-card" + (isActive?" active":"");
      card.title = p.name;
      const preview = document.createElement("div"); preview.className = "theme-card__preview";
      const stage = document.createElement("div"); stage.className = "theme-card__stage";
      stage.appendChild(renderSlide(themeSampleSlide(), p));
      preview.appendChild(stage);
      if (editPath) {
        const edit = document.createElement("button");
        edit.className = "theme-card__edit"; edit.title = "Edit theme";
        edit.innerHTML = `<span class="mi mi-sm">edit</span>`;
        edit.onclick = (e) => { e.stopPropagation(); invoke?.("open_tool", { file:"theme-editor.html", query:"artifact="+encodeURIComponent(editPath) }); };
        preview.appendChild(edit);
      }
      const meta = document.createElement("div"); meta.className = "theme-card__meta";
      meta.innerHTML = `<div class="theme-card__name">${p.name}</div><div class="theme-card__chips">${["bg","surface","text","muted","accent","accent2"].filter(k=>p.colors[k]).map(k=>`<span style="background:${p.colors[k]}"></span>`).join("")}</div>`;
      card.append(preview, meta);
      card.onclick = () => { state.theme = structuredClone(p); loadThemeFonts(state.theme); renderAll(); };
      requestAnimationFrame(() => { stage.style.transform = `scale(${preview.clientWidth/1280})`; });
      return card;
    }

    function themeSection() {
      const s = sec("Theme");
      // Edit the deck's current theme — opens the theme editor seeded with it.
      const editBtn = document.createElement("button");
      editBtn.className = "btn btn-secondary"; editBtn.innerHTML = `<span class="mi mi-sm">edit</span> Edit theme`;
      editBtn.onclick = () => invoke?.("open_tool", { file:"theme-editor.html", query:"theme="+encodeURIComponent(JSON.stringify(state.theme)) });
      s.appendChild(editBtn);
      const newBtn = document.createElement("button");
      newBtn.className = "btn btn-secondary"; newBtn.innerHTML = `<span class="mi mi-sm">add</span> New theme`;
      newBtn.onclick = () => invoke?.("open_tool", { file:"theme-editor.html", query:null });
      s.appendChild(newBtn);

      // Project themes (saved theme artifacts), loaded async.
      const projWrap = document.createElement("div"); projWrap.className = "theme-cards";
      s.appendChild(projWrap);
      loadProjectThemes(projWrap);

      const lab = document.createElement("div"); lab.className = "field-label"; lab.textContent = "Presets"; lab.style.marginTop = "4px";
      s.appendChild(lab);
      const presetWrap = document.createElement("div"); presetWrap.className = "theme-cards";
      PRESETS.forEach(p => presetWrap.appendChild(themeCard(p)));
      s.appendChild(presetWrap);
      return s;
    }

    // Read the project's theme artifacts and render a card for each.
    async function loadProjectThemes(container){
      if (!invoke || !projectRoot) return;
      let items = [];
      try { items = (await invoke("list_artifacts", { projectPath: projectRoot })).filter(a => a.kind === "theme"); }
      catch { return; }
      for (const it of items) {
        try {
          const data = JSON.parse(it.content);
          if (!data.fonts || !data.colors) continue;
          container.appendChild(themeCard(data, it.path));
        } catch {}
      }
    }

    // tiny inline schematic per layout
    function layoutIcon(key){
      const a="var(--accent)", g="var(--hairline-strong)";
      const box=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${f}"/>`;
      let g2="";
      const w="rgba(255,255,255,.9)";   // light bar over a filled background
      switch(key){
        // title — large left-aligned heading, vertically centered, subtitle under.
        case "title": g2=box(12,22,52,9,a)+box(12,35,32,5,g); break;
        // section — full background (supports an optional background image),
        // centered heading in light text.
        case "section": g2=box(0,0,100,56,g)+box(12,23,50,10,w); break;
        // title-body — heading top, three body lines.
        case "title-body": g2=box(12,11,42,7,a)+box(12,27,76,4,g)+box(12,35,76,4,g)+box(12,43,56,4,g); break;
        // two-col — heading over two columns of lines.
        case "two-col": g2=box(12,11,42,7,a)+box(12,26,32,4,g)+box(12,34,32,4,g)+box(12,42,22,4,g)+box(52,26,34,4,g)+box(52,34,34,4,g)+box(52,42,26,4,g); break;
        // three-col — heading over three columns.
        case "three-col": g2=box(12,11,42,7,a)+[12,40,68].map(x=>box(x,26,20,4,g)+box(x,34,20,4,g)+box(x,42,14,4,g)).join(""); break;
        // quote — two large quote bars, attribution under.
        case "quote": g2=box(16,18,68,8,a)+box(16,30,48,8,a)+box(16,45,22,4,g); break;
        // image-full — full-bleed image.
        case "image-full": g2=box(0,0,100,56,g); break;
        // image-text — image left, heading + lines right.
        case "image-text": g2=box(10,10,38,36,g)+box(54,16,34,7,a)+box(54,29,34,4,g)+box(54,37,26,4,g); break;
      }
      return `<svg viewBox="0 0 100 56" preserveAspectRatio="none">${g2}</svg>`;
    }

    // ---------- Render orchestration ----------
    let renderTimer;
    function scheduleRender(){ clearTimeout(renderTimer); renderTimer=setTimeout(()=>{ renderStage(); renderReel(); }, 120); scheduleSave(); }
    function renderAll(){ renderStage(); renderStageControls(); renderReel(); renderInspector(); scheduleSave(); }

    // ---------- Defaults for new slides ----------
    const SLIDE_DEFAULTS = {
      "title": { title:"Title", subtitle:"Subtitle" },
      "section": { title:"Section" },
      "title-body": { title:"Title", body:"Your content here." },
      "two-col": { title:"Title", left:"- Point one\n- Point two", right:"- Point three\n- Point four" },
      "three-col": { title:"Title", left:"**One**\n\nFirst point.", middle:"**Two**\n\nSecond point.", right:"**Three**\n\nThird point." },
      "quote": { quote:"A memorable line.", attribution:"Source" },
      "image-full": { image:"", caption:"" },
      "image-text": { title:"Title", image:"", body:"Describe the image." },
    };
    document.getElementById("add-slide").onclick = () => {
      const layout = state.slides[current]?.layout || "title-body";
      state.slides.splice(current+1, 0, { layout, ...structuredClone(SLIDE_DEFAULTS[layout]) });
      current++; selected = new Set([current]); selAnchor = current; renderAll();
    };

    document.getElementById("deck-name").oninput = e => { state.name = e.target.value; scheduleSave(); };

    // ---------- Save (artifact JSON) ----------
    const statusEl = document.getElementById("status");
    function buildDoc(){
      return { kind:"presentation", version:1, name:state.name||"Untitled deck",
               theme:state.theme, slides:state.slides, savedAt:new Date().toISOString() };
    }

    // Debounced auto-save: overwrites the active artifact once the deck has a
    // file (a brand-new deck is created on first edit, or via "Save as…").
    let booted = false, saveTimer = null, saving = false, saveAgain = false, lastSaved = "";
    // Content fingerprint (sans savedAt) so navigation/re-renders don't churn the file.
    function snapshot(){ return JSON.stringify({ name: state.name, theme: state.theme, slides: state.slides }); }
    function scheduleSave(){
      if (!booted || !invoke) return;
      if (snapshot() === lastSaved) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(autoSave, 700);
    }
    async function autoSave(){
      if (saving) { saveAgain = true; return; }   // coalesce edits during a write
      saving = true;
      const snap = snapshot();
      try {
        const content = JSON.stringify(buildDoc(), null, 2);
        if (activePath) {
          await invoke("overwrite_artifact", { path: activePath, content });
        } else {
          // First save of a new deck — create the file and adopt it.
          const p = await invoke("save_artifact", { kind:"presentation", name: state.name||"Untitled deck", content });
          activePath = p; deriveProjectRoot(p);
        }
        lastSaved = snap;
        statusEl.textContent = "Saved " + new Date().toLocaleTimeString();
      } catch(e){ statusEl.textContent = "Save failed: " + e; }
      saving = false;
      if (saveAgain) { saveAgain = false; autoSave(); }
    }

    document.getElementById("save-as").onclick = async () => {
      const name = state.name||"Untitled deck";
      const content = JSON.stringify(buildDoc(),null,2);
      if (invoke) {
        try { const p = await invoke("save_artifact", { kind:"presentation", name, content });
              // adopt the new file so auto-save overwrites it from here on
              activePath = p; deriveProjectRoot(p); statusEl.textContent="Saved → "+p; }
        catch(e){ statusEl.textContent="Save failed: "+e; }
      } else {
        const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([content],{type:"application/json"}));
        a.download=name.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".json"; a.click();
      }
    };

    // ---------- Export: build a standalone HTML deck ----------
    // Fetch the shared slide-renderer CSS once (for embedding into exports).
    let _renderCss = null;
    async function loadRenderCss(){
      if (_renderCss == null) _renderCss = await fetch(new URL("../deck/render.css", location.href)).then(r => r.text());
      return _renderCss;
    }
    // Resolve every image, then emit a self-contained navigable HTML document.
    // `mode`: "inline" embeds images as data URLs; "assets" rewrites refs to
    // assets/<file> and returns the asset copy list for save_export_dir.
    async function buildDeckHtml(mode){
      const assets = []; const seen = new Map();
      const resolved = {};
      for (const s of state.slides) {
        if (s.image) {
          if (mode==="assets") {
            if (!seen.has(s.image)) {
              const base = s.image.split("/").pop().replace(/[^a-z0-9._-]/gi,"_");
              let name = base, n=1;
              const used = new Set(seen.values());
              while (used.has(name)) name = (n++)+"-"+base;
              seen.set(s.image, name);
              assets.push({ name, source: projectRoot ? projectRoot+"/"+s.image.replace(/^\//,"") : s.image });
            }
            resolved[s.image] = "assets/"+seen.get(s.image);
          } else {
            resolved[s.image] = await resolveImage(s.image);
          }
        }
      }
      const t = state.theme;
      const slideHtml = state.slides.map(s => renderSlide(s, t, resolved).outerHTML).join("\n");
      // The slide-renderer CSS for the standalone export comes from render.css.
      const css = await loadRenderCss();
      const fontHref = "https://fonts.googleapis.com/css2?family=" +
        [t.fonts.heading, t.fonts.body].map(f=>f.family.replace(/ /g,"+")+":wght@"+f.weight).join("&family=") + "&display=swap";
      return { html: deckShell(state.name, css, fontHref, slideHtml, t), assets };
    }

    function deckShell(name, css, fontHref, slides, t){
      return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>${esc(name)}</title>
<link rel="stylesheet" href="${fontHref}">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:${t.colors.bg};font-family:sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .deck{position:relative}
  .scaler{transform-origin:center}
  .slide{display:none!important}
  .slide.show{display:flex!important}
  ${css}
  /* print: one slide per page for Save-as-PDF */
  @media print{
    @page{size:1280px 720px;margin:0}
    body{display:block;background:#fff}
    .nav{display:none}
    .slide{display:flex!important;page-break-after:always;box-shadow:none;border-radius:0}
  }
  .nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;font-family:sans-serif;background:rgba(0,0,0,.45);padding:5px;border-radius:999px;backdrop-filter:blur(6px)}
  .nav button{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:16px;line-height:1}
  .nav button:hover{background:rgba(255,255,255,.32)}
  .nav .count{color:#fff;opacity:.85;align-self:center;font-size:13px;padding:0 6px}
</style></head>
<body>
<div class="deck"><div class="scaler" id="scaler">${slides}</div></div>
<div class="nav"><button id="prev">‹</button><span class="count" id="count"></span><button id="next">›</button></div>
<script>
  const slides=[...document.querySelectorAll('.slide')]; let i=0;
  const scaler=document.getElementById('scaler');
  function fit(){ const s=Math.min(innerWidth/1280, innerHeight/720); scaler.style.transform='scale('+s+')'; scaler.style.width='1280px'; scaler.style.height='720px'; }
  function show(n){ i=(n+slides.length)%slides.length; slides.forEach((s,k)=>s.classList.toggle('show',k===i)); document.getElementById('count').textContent=(i+1)+' / '+slides.length; }
  addEventListener('resize',fit); fit(); show(0);
  document.getElementById('next').onclick=()=>show(i+1); document.getElementById('prev').onclick=()=>show(i-1);
  addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')show(i+1); if(e.key==='ArrowLeft')show(i-1); });
<\/script>
</body></html>`;
    }

    document.getElementById("export-web").onclick = async () => {
      statusEl.textContent = "Building web export…";
      try {
        const { html, assets } = await buildDeckHtml("assets");
        if (invoke) {
          const folder = (state.name||"deck").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
          const p = await invoke("save_export_dir", { folder, html, assets });
          statusEl.textContent = "Web deck → " + p;
        } else {
          const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([html],{type:"text/html"})); a.download="deck.html"; a.click();
        }
      } catch(e){ statusEl.textContent = "Export failed: "+e; }
    };

    // ---------- Coloris ----------
    function initColoris(){ const sc=document.createElement("studio-color"); sc.style.display="none"; document.body.appendChild(sc); requestAnimationFrame(()=>sc.remove()); }

    // ---------- Drop + paste to import an image into the project's media/ ----
    // Drop a file anywhere on the window, or Cmd/Ctrl+V a copied image; the file
    // lands in media/ (via Studio's import_media / paste_image) and is set on the
    // current slide. The OS drop overlay is handled by Tauri's drag-drop event.
    function initImageImport(){
      if (!invoke || !window.__TAURI__?.event) return;
      const { listen } = window.__TAURI__.event;
      listen("tauri://drag-enter", () => document.body.classList.add("dropping"));
      listen("tauri://drag-leave", () => document.body.classList.remove("dropping"));
      listen("tauri://drag-drop", async (e) => {
        document.body.classList.remove("dropping");
        if (!projectRoot) { statusEl.textContent = "Save the deck first so images have a project to import into."; return; }
        const paths = (e.payload && e.payload.paths) || [];
        if (!paths.length) return;
        try {
          const imported = await invoke("import_media", { projectPath: projectRoot, files: paths });
          if (imported && imported.length) setCurrentImage(toRel(imported[imported.length - 1]));
          else statusEl.textContent = "No image in the dropped files.";
        } catch(err){ statusEl.textContent = "Import failed: " + err; }
      });
      // Cmd/Ctrl+V — paste a clipboard image (ignore when typing in a field).
      window.addEventListener("keydown", async (e) => {
        if (!((e.metaKey || e.ctrlKey) && e.key === "v")) return;
        const t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
        if (!projectRoot) return;
        try {
          const p = await invoke("paste_image", { projectPath: projectRoot });
          setCurrentImage(toRel(p));
        } catch { /* no image on clipboard — ignore */ }
      });
    }

    // ---------- Boot ----------
    function deriveProjectRoot(p){ const m=p.match(/^(.*)\/artifacts\//); projectRoot = m? m[1] : null; }

    // Reload the deck when its file changes on disk externally (e.g. Studio Claude
    // edits the artifact). Studio's recursive watcher broadcasts "fs-changed".
    // Guarded so we never clobber in-progress edits or react to our own saves.
    function initArtifactWatch(){
      if (!invoke || !window.__TAURI__?.event) return;
      window.__TAURI__.event.listen("fs-changed", async () => {
        if (!activePath || saving) return;
        if (snapshot() !== lastSaved) return;     // local has unsaved edits — don't overwrite
        let data;
        try { data = JSON.parse(await invoke("read_artifact", { path: activePath })); }
        catch { return; }
        const fileSnap = JSON.stringify({ name: data.name, theme: data.theme, slides: data.slides });
        if (fileSnap === lastSaved) return;       // no external change (our own write / unrelated)
        // Adopt the on-disk version.
        if (data.theme) state.theme = data.theme;
        if (Array.isArray(data.slides) && data.slides.length) state.slides = data.slides;
        if (data.name != null) state.name = data.name;
        current = Math.min(current, state.slides.length-1);
        selected = new Set([current]); selAnchor = current;
        lastSaved = snapshot();
        document.getElementById("deck-name").value = state.name;
        loadThemeFonts(state.theme);
        renderAll();
        statusEl.textContent = "Reloaded from disk " + new Date().toLocaleTimeString();
      });
    }

    async function boot(){
      const path = new URLSearchParams(location.search).get("artifact");
      if (path && invoke) {
        try {
          const data = JSON.parse(await invoke("read_artifact", { path }));
          if (data.theme) state.theme = data.theme;
          if (Array.isArray(data.slides) && data.slides.length) state.slides = data.slides;
          if (data.name) state.name = data.name;
          activePath = path; deriveProjectRoot(path);
        } catch(e){ statusEl.textContent="Couldn't load deck: "+e; }
      }
      document.getElementById("deck-name").value = state.name;
      loadThemeFonts(state.theme);
      initColoris();
      initImageImport();
      initArtifactWatch();
      initDevInspect();
      renderAll();
      // Mark the loaded (or default) state as already-saved, then enable auto-save.
      lastSaved = snapshot();
      booted = true;
    }
    boot();
  </script>
</body>
</html>
