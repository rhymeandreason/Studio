<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Editor</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --line-h: 19px;
    --code-font: 12px/var(--line-h) var(--mono);
    --add-bg: rgba(20, 184, 166, 0.20);    /* bright teal tint for changed lines */
    --add-bar: #14b8a6;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- toolbar ---- */
  #toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--hairline);
    background: var(--bg);
    z-index:20;
  }
  #toolbar .spacer { flex: 1; }
  #file-info{
      background:var(--surface);
      z-index:20;
      padding:3px 8px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      justify-content: space-between;
  }
  #filename {
    font: var(--code-font);
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: rtl;          /* keep the basename visible when truncating */
    text-align: left;
    margin-top:3px;
  }
  #dirty {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--rose);
    opacity: 0;
    transition: opacity var(--dur-fast);
  }
  #dirty.on { opacity: 1; }
  #diff-status { font: var(--code-font); color: var(--text-soft); }

  /* ---- main 4-column row ---- */
  #main {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
  }

  /* DOM tree (left) */
  #tree-col {
    flex: 0 0 240px;
    border-right: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg);
    width:250px;
  }
  .col-head {
    flex: 0 0 auto;
    padding: 7px 12px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
    border-bottom: 1px solid var(--hairline);
    background: var(--surface);
  }
  #styles-heading{
      border-top:1px solid var(--hairline-strong);
  }
  #tree {
    flex: 1 1 auto;
    overflow: auto;
    padding: 6px 0 12px;
    font: var(--code-font);
  }
  .node { white-space: nowrap; }
  .node .tag {
    display: inline-block;
    padding: 1px 6px 1px 6px;
    cursor: default;
    border-radius: var(--radius-sm);
  }
  .node .tag:hover { background: var(--accent-ring); }
  .node .tag.sel { background: var(--accent-soft); }
  .tname { color: var(--accent); }
  .tid { color: var(--sage); }
  .tcls { color: var(--text-muted); }
  .twrap { padding-left: 14px; }

  /* editor (center) */
  #editor-col { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #editor {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    position: relative;
    background: var(--elevated);
  }
  #gutter {
    flex: 0 0 auto;
    /* overflow clipping handled by #codebox */
    text-align: right;
    color: var(--text-soft);
    font: var(--code-font);
    padding: 8px 0px 8px 0;
    background:var(--bg);
    user-select: none;
  }
  #gutter .gl {
      height: var(--line-h);
      position: relative;
      background:var(--bg);
      padding: 0px 10px;
      border-right: 1px solid var(--hairline);
  }
  #gutter .gl.chg::after {
    content: "";
    position: absolute;
    right: -2px; top: 0; bottom: 0;
    width: 4px;
    background: var(--add-bar);
  }
  /* Deletion: a small red triangle pointing at the spot where lines were
     removed (no added line to tint in the new file). */
  #gutter .gl.del::before {
    content: "";
    position: absolute;
    right: -10px; top: -4px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 6px solid #e5484d;
  }
  #codebox { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; }
  #hl, #code {
    position: absolute;
    inset: 0;
    padding: 8px 12px;
    font: var(--code-font);
    border: 0;
    margin: 0;
    white-space: pre;
    tab-size: 2;
  }
  #hl {
    pointer-events: none;
    color: var(--text);
    z-index: 0;
  }
  /* Syntax token colors (Prism types), bright colors. */
  .tok-comment, .tok-prolog, .tok-doctype, .tok-cdata { color: #9aa0a6; font-style: italic; }
  .tok-tag, .tok-keyword, .tok-atrule, .tok-selector, .tok-important, .tok-boolean, .tok-rule { color: #d6336c; }
  .tok-attr-name, .tok-property, .tok-class-name, .tok-function, .tok-symbol { color: #1c7ed6; }
  .tok-attr-value, .tok-string, .tok-template-string, .tok-char, .tok-regex, .tok-url { color: #2f9e44; }
  .tok-number, .tok-unit, .tok-color, .tok-constant, .tok-entity, .tok-hexcode { color: #e8590c; }
  .tok-punctuation, .tok-operator { color: #868e96; }
  #hl .hline { min-height: var(--line-h); }
  /* Soft-wrap: lines flow instead of scrolling horizontally. The highlight
     layer carries the (transparent) line text so it wraps identically; gutter
     row heights are synced to it in JS. */
  body.soft-wrap #code, body.soft-wrap #hl { white-space: pre-wrap; word-break: break-word; }
  .btn.active { background: var(--accent-soft); color: var(--text); }
  #hl .hline.chg { background: var(--add-bg); box-shadow: -12px 0 0 var(--add-bg), 9999px 0 0 var(--add-bg); }
  #code {
    z-index: 1;
    background: transparent;
    color: transparent;            /* text is drawn by #hl; caret stays visible */
    resize: none;
    outline: none;
    caret-color: var(--accent);
  }
  #code::selection { background: var(--accent-ring); }

  /* minimap */
  #minimap {
    flex: 0 0 14px;
    position: relative;
    background: var(--surface);
    border-left: 1px solid var(--hairline);
    cursor: pointer;
  }
  #minimap .mm {
    position: absolute;
    left: 2px; right: 2px;
    min-height: 2px;
    background: var(--add-bar);
    border-radius: 1px;
  }
  #minimap .mm-view {
    position: absolute;
    left: 0; right: 0;
    background: var(--accent-ring);
    pointer-events: none;
  }

  /* inspector (bottom of the left column) */
  #inspector {
    flex: 0 0 auto;
    max-height: 45%;
    overflow: auto;
    background: var(--bg);
    padding: 10px 12px;
    font: var(--code-font);
  }
  #inspector .ins-sel { color: var(--accent); margin-bottom: 6px;}
  .chip {
    display: inline-block;
    padding: 1px 7px;
    margin: 0 4px 4px 0;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--text);
  }
  .rule { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--hairline); }
  .rule .rsel { color: var(--sage); }
  .clk { cursor: pointer; }
  .chip.clk:hover { background: var(--accent); color: var(--elevated); }
  .rsel.clk:hover { text-decoration: underline; }
  .rule .rdecl { color: var(--text-muted); padding-left: 12px; }
  .empty { color: var(--text-soft); }

  /* Markdown mode: left column is a heading browser, not DOM + Styles. */
  #sections-heading, #sections { display: none; }
  body.is-markdown #dom-heading,
  body.is-markdown #tree,
  body.is-markdown #styles-heading,
  body.is-markdown #inspector { display: none; }
  body.is-markdown #sections-heading,
  body.is-markdown #sections { display: block; }
  #sections { flex: 1 1 auto; overflow: auto; padding: 6px 0 12px; font: var(--code-font); }
  .sec {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: none;
    cursor: pointer;
    color: var(--text);
    padding: 3px 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-radius: var(--radius-sm);
  }
  .sec:hover { background: var(--accent-ring); }
  .sec.lvl1 { font-weight: 650; }
  .sec.lvl2 { padding-left: 24px; }
  .sec.lvl3 { padding-left: 36px; color: var(--text-muted); }
  .sec.lvl4, .sec.lvl5, .sec.lvl6 { padding-left: 48px; color: var(--text-soft); }

  /* Inline Markdown preview: hidden by default; the Code/Preview toggle and the
     separate-window button only apply to Markdown. */
  #md-view { display: none; flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; background: #fff; }
  #view-toggle { display: none; }
  body.is-markdown #view-toggle { display: inline-flex; }
  body.is-markdown #preview-btn { display: none; }
  body.md-preview #editor { display: none; }
  body.md-preview #md-view { display: block; }

  /* Rendered Markdown typography (scoped to the inline view). */
  .md-body { max-width: 740px; margin: 0 auto; padding: 32px 32px 80px;
    font: 16px/1.65 -apple-system, system-ui, "Segoe UI", sans-serif; color: #2a2a28; }
  .md-body h1, .md-body h2, .md-body h3, .md-body h4 { line-height: 1.25; margin: 1.6em 0 .5em; font-weight: 650; }
  .md-body h1 { font-size: 2em; border-bottom: 1px solid #e5e2db; padding-bottom: .3em; }
  .md-body h2 { font-size: 1.5em; border-bottom: 1px solid #eee; padding-bottom: .25em; }
  .md-body h3 { font-size: 1.22em; } .md-body h4 { font-size: 1.05em; }
  .md-body p, .md-body ul, .md-body ol, .md-body blockquote, .md-body table, .md-body pre { margin: 0 0 1em; }
  .md-body a { color: #1c6cd6; } .md-body li { margin: .25em 0; }
  .md-body code { font: 0.88em var(--mono); background: #f1efe9; padding: .15em .4em; border-radius: 4px; }
  .md-body pre { background: #f6f4ef; padding: 14px 16px; border-radius: 8px; overflow: auto; }
  .md-body pre code { background: none; padding: 0; }
  .md-body blockquote { border-left: 3px solid #d8d3c8; padding: .2em 0 .2em 1em; color: #6b6658; }
  .md-body table { border-collapse: collapse; }
  .md-body th, .md-body td { border: 1px solid #e0dcd2; padding: 6px 12px; }
  .md-body th { background: #f3f1ea; } .md-body img { max-width: 100%; }
  .md-body hr { border: 0; border-top: 1px solid #e5e2db; margin: 2em 0; }
</style>
</head>
<body>
  <div id="toolbar">
    <div>
        <button class="btn" id="open"><span class="mi">folder_open</span>Open</button>
        <button class="btn btn-primary" id="save"><span class="mi">save</span>Save</button>
    </div>
    <div>
        <button class="btn btn-secondary" id="prettify"><span class="mi">format_align_left</span>Prettify</button>
        <button class="btn btn-secondary" id="wrap-btn"><span class="mi">wrap_text</span>Wrap</button>
    </div>
    <div>
        <button class="btn btn-secondary" id="refresh-btn" title="Reload file from disk"><span class="mi">refresh</span>Refresh</button>
        <button class="btn btn-secondary" id="view-toggle" title="Toggle code / preview"><span class="mi">visibility</span>Preview</button>
        <button class="btn btn-primary" id="preview-btn"><span class="mi">open_in_new</span>Preview</button>
    </div>



  </div>

  <div id="main">
    <div id="tree-col">
      <div class="col-head" id="dom-heading">DOM</div>
      <div id="tree"><div class="empty" style="padding:8px 12px">Open an HTML file</div></div>
      <div class="col-head" id="styles-heading">Styles</div>
      <div id="inspector"><span class="empty">Select an element in the DOM tree.</span></div>
      <!-- Markdown files show a heading browser here instead of DOM/Styles. -->
      <div class="col-head" id="sections-heading">Sections</div>
      <div id="sections"><span class="empty" style="padding:8px 12px">No headings</span></div>
    </div>

    <div id="editor-col">
       <div id="file-info">
           <span id="filename">No file</span>
           <div>
            <span id="dirty" title="Unsaved changes"></span>
            <span class="spacer"></span>
            <span id="diff-status"></span>
           </div>
       </div>
      <div id="editor">
        <div id="gutter"></div>
        <div id="codebox">
          <div id="hl"></div>
          <textarea id="code" spellcheck="false" wrap="off"></textarea>
        </div>
        <div id="minimap"><div class="mm-view"></div></div>
      </div>
      <!-- Inline rendered preview, shown in place of the code panel when a
           Markdown file is in Preview mode. A plain scrollable div (not an
           iframe) so scrolling stays reliable across show/hide. -->
      <div id="md-view"></div>
    </div>
  </div>

  <!-- Offscreen iframe: parses the document so the DOM tree + inspector work
       even when the preview window is closed. Never shown. -->
  <iframe id="parser" sandbox="allow-same-origin allow-scripts"
          style="position:absolute;left:-9999px;top:0;width:1024px;height:768px;border:0"></iframe>
  <input type="file" id="fallback-file" hidden />

<script src="../vendor/marked.min.js"></script>   <!-- window.marked (Markdown preview) -->
<script type="module">
import "../vendor/beautify.js";        // window.js_beautify
import "../vendor/beautify-css.js";    // window.css_beautify
import "../vendor/beautify-html.js";   // window.html_beautify (needs the two above)
import "../vendor/prism.js";           // window.Prism (markup + css + js)
import "../vendor/prism-markdown.min.js"; // adds Prism.languages.markdown

const TAURI = window.__TAURI__;
const invoke = TAURI ? TAURI.core.invoke : null;
const evt = TAURI ? TAURI.event : null;

// Wider window for the 4-column layout.
if (TAURI) {
  const { getCurrentWindow } = TAURI.window;
  const { LogicalSize } = TAURI.dpi;
  getCurrentWindow().setSize(new LogicalSize(1060, 760));
}

const $ = (id) => document.getElementById(id);
const code = $("code"), hl = $("hl"), gutter = $("gutter"), minimap = $("minimap");
const treeEl = $("tree"), inspector = $("inspector"), parser = $("parser");
const sectionsEl = $("sections"), mdView = $("md-view");
let mdHeadings = [];   // parsed ATX headings { level, text, line } for the section browser
const filenameEl = $("filename"), dirtyEl = $("dirty"), diffStatus = $("diff-status");

let currentPath = null;
let changedLines = new Set();   // 1-based line numbers (new file) marked as added/changed
let deletedAt = new Set();      // lines where preceding content was deleted (triangle marker)
let prettifySnapshot = null;    // { before, after } for one-level Prettify undo
let dirty = false;

// ---------- file open / save ----------
$("open").addEventListener("click", openFile);
$("save").addEventListener("click", saveFile);
$("refresh-btn").addEventListener("click", reloadFromDisk);
$("prettify").addEventListener("click", prettify);

async function openFile() {
  if (invoke) {
    const path = await invoke("pick_text_file");
    if (!path) return;
    await loadPath(path);
  } else {
    $("fallback-file").click();   // browser test fallback
  }
}

// Load a specific file by absolute path (used by Open and by "Open in Studio
// Code Editor" from a Git window).
async function loadPath(path) {
  if (!invoke) return;
  const text = await invoke("read_text_file", { path });
  currentPath = path;
  loadText(text);
  await refreshDiff();
}
if (evt) evt.listen("ce:open-file", (e) => { if (e.payload) loadPath(e.payload); });
$("fallback-file").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { currentPath = f.name; loadText(r.result); changedLines = new Set(); paint(); };
  r.readAsText(f);
});

function loadText(text) {
  code.value = text;
  setDirty(false);
  const base = currentPath ? currentPath.split("/").pop() : "untitled";
  filenameEl.textContent = "‎" + (currentPath || base);
  applyMode();
  render();
  paint();
  persist();
}

async function saveFile() {
  if (!currentPath) return;
  if (invoke) {
    await invoke("write_text_file", { path: currentPath, content: code.value });
    setDirty(false);
    persist();
    await refreshDiff();
  } else {
    const blob = new Blob([code.value], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = currentPath; a.click();
    setDirty(false);
  }
}

// Re-read the current file from disk (picks up external edits) and refresh diff.
async function reloadFromDisk() {
  if (!invoke || !currentPath) return;
  const text = await invoke("read_text_file", { path: currentPath });
  loadText(text);
  await refreshDiff();
}

function ext() { return (currentPath || "").split(".").pop().toLowerCase(); }

function prettify() {
  const opts = { indent_size: 2, end_with_newline: true };
  let out;
  try {
    if (ext() === "css") out = window.css_beautify(code.value, opts);
    else if (ext() === "js" || ext() === "mjs") out = window.js_beautify(code.value, opts);
    else out = window.html_beautify(code.value, opts);
  } catch (e) { console.error(e); return; }
  // Fast whole-value replace + a one-level snapshot so Cmd+Z can revert the
  // Prettify (execCommand-based replace is too slow on large files).
  prettifySnapshot = { before: code.value, after: out };
  code.value = out;
  setDirty(true);
  render(); paint();
}

function setDirty(v) { dirty = v; dirtyEl.classList.toggle("on", v); }

// Persist the open file + current text so a window reload (e.g. Tauri's dev
// watcher reloads all webviews when a frontend file is saved) restores it
// instead of coming back empty.
function persist() {
  try { localStorage.setItem("ce:session", JSON.stringify({ path: currentPath, value: code.value, dirty })); } catch {}
}

// ---------- editor: gutter + highlight + minimap ----------
code.addEventListener("input", () => { setDirty(true); paint(); persist(); scheduleRender(); });
code.addEventListener("scroll", syncScroll);

function lineCount() { return code.value.split("\n").length; }

// ---------- syntax highlighting (Prism) ----------
function isMarkdown() { const e = ext(); return e === "md" || e === "markdown"; }

function grammar() {
  const e = ext();
  if (e === "css") return ["css", Prism.languages.css];
  if (e === "js" || e === "mjs") return ["js", Prism.languages.javascript];
  if (isMarkdown()) return ["markdown", Prism.languages.markdown];
  return ["markup", Prism.languages.markup];
}

// Flatten Prism's nested token stream into [cssClass, text] pairs.
function flatten(tokens, parentType, out) {
  for (const t of tokens) {
    if (typeof t === "string") { out.push([parentType, t]); continue; }
    const type = Array.isArray(t.alias) ? t.alias[0] : (t.alias || t.type);
    if (Array.isArray(t.content)) flatten(t.content, type, out);
    else if (typeof t.content === "string") out.push([type, t.content]);
    else flatten([t.content], type, out);
  }
}

// Highlight the whole document, then split the token stream into one HTML
// string per source line (so the per-line diff/wrap layer keeps working).
function highlightLines(text) {
  let flat;
  try {
    const [, gram] = grammar();
    flat = [];
    flatten(Prism.tokenize(text, gram), "", flat);
  } catch (e) {
    return text.split("\n").map((l) => esc(l));   // fallback: plain
  }
  const out = [];
  let cur = "";
  for (const [type, txt] of flat) {
    const parts = txt.split("\n");
    for (let k = 0; k < parts.length; k++) {
      if (k > 0) { out.push(cur); cur = ""; }
      const piece = parts[k];
      if (piece) cur += type ? `<span class="tok tok-${type}">${esc(piece)}</span>` : esc(piece);
    }
  }
  out.push(cur);
  return out;
}

function paint() {
  const n = lineCount();
  const hi = highlightLines(code.value);
  // gutter
  let g = "";
  for (let i = 1; i <= n; i++) g += `<div class="gl${changedLines.has(i) ? " chg" : ""}${deletedAt.has(i) ? " del" : ""}">${i}</div>`;
  gutter.innerHTML = g;
  // highlight layer — colored tokens; wraps exactly like the textarea so the
  // diff row backgrounds and soft-wrap line heights stay aligned.
  let h = "";
  for (let i = 1; i <= n; i++) h += `<div class="hline${changedLines.has(i) ? " chg" : ""}">${hi[i - 1] || "&#8203;"}</div>`;
  hl.innerHTML = h;
  syncWrap();
  paintMinimap(n);
  syncScroll();
  if (isMarkdown()) buildSections();
}

// When wrapping, match each gutter row's height to its (possibly multi-row)
// highlight line so numbers and change-bars stay aligned.
function syncWrap() {
  const on = document.body.classList.contains("soft-wrap");
  const gls = gutter.children, hls = hl.children;
  for (let i = 0; i < gls.length; i++) {
    gls[i].style.height = on ? hls[i].offsetHeight + "px" : "";
  }
}

function paintMinimap(n) {
  minimap.querySelectorAll(".mm").forEach((e) => e.remove());
  for (const ln of changedLines) {
    const d = document.createElement("div");
    d.className = "mm";
    d.style.top = ((ln - 0.5) / n * 100) + "%";
    d.style.height = Math.max(2, 100 / n) + "%";
    minimap.appendChild(d);
  }
  updateViewport();
}

function syncScroll() {
  // #gutter/#hl are overflow:hidden, so translate their content instead of
  // scrolling. Padding-top matches the textarea's, so they stay aligned.
  const y = -code.scrollTop;
  gutter.style.transform = `translateY(${y}px)`;
  hl.style.transform = `translate(${-code.scrollLeft}px, ${y}px)`;
  updateViewport();
}

function updateViewport() {
  const view = minimap.querySelector(".mm-view");
  const total = code.scrollHeight || 1;
  view.style.top = (code.scrollTop / total * 100) + "%";
  view.style.height = (code.clientHeight / total * 100) + "%";
}

minimap.addEventListener("click", (e) => {
  const frac = (e.clientY - minimap.getBoundingClientRect().top) / minimap.clientHeight;
  code.scrollTop = frac * code.scrollHeight - code.clientHeight / 2;
  syncScroll();
});

// ---------- git diff ----------
async function refreshDiff() {
  changedLines = new Set();
  deletedAt = new Set();
  diffStatus.textContent = "";
  if (!invoke || !currentPath) { paint(); return; }
  try {
    const diff = await invoke("git_diff_file", { path: currentPath });
    parseDiff(diff);
    const parts = [];
    if (changedLines.size) parts.push(`${changedLines.size} changed`);
    if (deletedAt.size) parts.push(`${deletedAt.size} deletion${deletedAt.size > 1 ? "s" : ""}`);
    diffStatus.textContent = parts.join(", ") || "no changes";
  } catch (e) {
    diffStatus.textContent = "not in git";
  }
  paint();
}

function parseDiff(diff) {
  let newLine = 0, pendingDel = false;
  for (const line of diff.split("\n")) {
    const m = line.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
    if (m) { newLine = parseInt(m[1], 10); pendingDel = false; continue; }
    if (newLine === 0) continue;          // header lines before first hunk
    if (line.startsWith("+")) { changedLines.add(newLine); newLine++; pendingDel = false; }
    else if (line.startsWith("-")) { pendingDel = true; }   // deletion: marked on the next kept line
    else if (line.startsWith("\\")) { /* "No newline" marker */ }
    else {                                 // context line
      if (pendingDel) { deletedAt.add(newLine); pendingDel = false; }
      newLine++;
    }
  }
  // Deletion at end of file: mark the last line.
  if (pendingDel) deletedAt.add(Math.max(1, newLine - 1));
}

// ---------- DOM tree + inspector (offscreen parser iframe) ----------
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 250); }

// The HTML shown in the preview / parsed for the tree. For Markdown files this
// is marked-rendered HTML wrapped in a readable stylesheet; otherwise the raw
// source (which is already HTML/CSS/JS).
function renderedHTML() {
  if (isMarkdown() && window.marked) return mdWrap(window.marked.parse(code.value, { breaks: true }));
  return code.value;
}

const MD_CSS = `
  :root { color-scheme: light; }
  body { max-width: 740px; margin: 0 auto; padding: 40px 32px 80px;
    font: 16px/1.65 -apple-system, system-ui, "Segoe UI", sans-serif; color: #2a2a28; }
  h1, h2, h3, h4 { line-height: 1.25; margin: 1.6em 0 0.5em; font-weight: 650; }
  h1 { font-size: 2em; border-bottom: 1px solid #e5e2db; padding-bottom: .3em; }
  h2 { font-size: 1.5em; border-bottom: 1px solid #eee; padding-bottom: .25em; }
  h3 { font-size: 1.22em; } h4 { font-size: 1.05em; }
  p, ul, ol, blockquote, table, pre { margin: 0 0 1em; }
  a { color: #1c6cd6; } li { margin: .25em 0; }
  code { font: 0.88em var(--mono, ui-monospace, Menlo, monospace);
    background: #f1efe9; padding: .15em .4em; border-radius: 4px; }
  pre { background: #f6f4ef; padding: 14px 16px; border-radius: 8px; overflow: auto; }
  pre code { background: none; padding: 0; }
  blockquote { border-left: 3px solid #d8d3c8; padding: .2em 0 .2em 1em; color: #6b6658; }
  table { border-collapse: collapse; } th, td { border: 1px solid #e0dcd2; padding: 6px 12px; }
  th { background: #f3f1ea; } img { max-width: 100%; }
  hr { border: 0; border-top: 1px solid #e5e2db; margin: 2em 0; }`;

function mdWrap(body) {
  return `<!doctype html><html><head><meta charset="utf-8"><style>${MD_CSS}</style></head><body>${body}</body></html>`;
}

// Re-parse into the offscreen iframe (rebuilds the tree) and push to the
// preview window if it's open.
function render() {
  parser.srcdoc = renderedHTML();
  if (isMarkdown() && window.marked) {             // keep inline preview current
    mdView.innerHTML = `<div class="md-body">${window.marked.parse(code.value, { breaks: true })}</div>`;
  }
  pushPreview();
}

// ---------- Markdown section browser + inline preview ----------
// Toggle the left column between DOM/Styles (HTML) and the heading list (md).
function applyMode() {
  const md = isMarkdown();
  document.body.classList.toggle("is-markdown", md);
  document.body.classList.remove("md-preview");            // start in Code view
  $("view-toggle").innerHTML = `<span class="mi">visibility</span>Preview`;
}

// Code/Preview toggle (Markdown only) — keeps scroll position by syncing to the
// nearest preceding heading between the two views.
$("view-toggle").addEventListener("click", () => {
  const goingToPreview = !inPreview();
  const idx = goingToPreview ? currentCodeSectionIdx() : currentPreviewSectionIdx();
  const on = document.body.classList.toggle("md-preview");
  $("view-toggle").innerHTML = on
    ? `<span class="mi">code</span>Code`
    : `<span class="mi">visibility</span>Preview`;
  requestAnimationFrame(() => {
    if (on) scrollPreviewToSection(idx);
    else if (idx >= 0 && mdHeadings[idx]) scrollCodeToLine(mdHeadings[idx].line);
    else { code.scrollTop = 0; syncScroll(); }
  });
});
function inPreview() { return document.body.classList.contains("md-preview"); }

function previewHeadings() { return mdView.querySelectorAll("h1, h2, h3, h4, h5, h6"); }

// Index of the last heading at or above the code panel's current top.
function currentCodeSectionIdx() {
  const top = code.scrollTop;
  let topLine = 1;
  for (let i = 0; i < hl.children.length; i++) {
    if (hl.children[i].offsetTop >= top - 1) { topLine = i + 1; break; }
  }
  let idx = -1;
  for (let i = 0; i < mdHeadings.length && mdHeadings[i].line <= topLine; i++) idx = i;
  return idx;
}

// Index of the last rendered heading at or above the inline preview's top.
function currentPreviewSectionIdx() {
  const hs = previewHeadings();
  const top = mdView.scrollTop;
  let idx = -1;
  for (let i = 0; i < hs.length && hs[i].offsetTop <= top + 4; i++) idx = i;
  return idx;
}

// Scroll the inline preview to the idx-th heading (top-aligned).
function scrollPreviewToSection(idx) {
  const hs = previewHeadings();
  mdView.scrollTop = (idx >= 0 && hs[idx]) ? hs[idx].offsetTop : 0;
}

function scrollCodeToLine(line) {
  const row = hl.children[line - 1];
  if (row) code.scrollTop = row.offsetTop;
  syncScroll();
}

// Parse ATX headings (#…######) from the source, skipping fenced code blocks.
function buildSections() {
  const lines = code.value.split("\n");
  const items = [];
  let inFence = false;
  for (let i = 0; i < lines.length; i++) {
    if (/^\s*(```|~~~)/.test(lines[i])) { inFence = !inFence; continue; }
    if (inFence) continue;
    const m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(lines[i]);
    if (m) items.push({ level: m[1].length, text: m[2], line: i + 1 });
  }
  mdHeadings = items;
  if (!items.length) {
    sectionsEl.innerHTML = '<span class="empty" style="padding:8px 12px">No headings</span>';
    return;
  }
  sectionsEl.innerHTML = "";
  items.forEach((it, idx) => {
    const b = document.createElement("button");
    b.className = "sec lvl" + it.level;
    b.textContent = it.text;
    b.title = it.text;
    // In preview mode, scroll the rendered heading into view; otherwise jump to
    // the source line.
    b.addEventListener("click", () => inPreview() ? revealPreviewHeading(idx) : revealLine(it.line));
    sectionsEl.append(b);
  });
}

// Scroll the inline preview to its idx-th heading (same order as the source
// headings, since both come from the same Markdown).
function revealPreviewHeading(idx, behavior = "smooth") {
  const hs = previewHeadings();
  if (hs[idx]) mdView.scrollTo({ top: hs[idx].offsetTop, behavior });
}

// Scroll the code panel to a 1-based source line and select it.
function revealLine(line) {
  let start = 0;
  for (let i = 1; i < line; i++) start = code.value.indexOf("\n", start) + 1;
  const end = code.value.indexOf("\n", start);
  revealRange(start, (end < 0 ? code.value.length : end) - start);
}

// Build on load (after sync scripts) and again shortly after, to catch DOM
// that page scripts add asynchronously (DOMContentLoaded handlers, timers).
parser.addEventListener("load", () => { buildTree(); setTimeout(buildTree, 120); });

let nodeFor = new WeakMap();   // parser element -> its tree tag span
function buildTree() {
  nodeFor = new WeakMap();
  let doc;
  try { doc = parser.contentDocument; } catch { return; }
  if (!doc || !doc.body) { treeEl.innerHTML = '<div class="empty" style="padding:8px 12px">No DOM</div>'; return; }
  treeEl.innerHTML = "";
  treeEl.appendChild(renderNode(doc.body));
}

function renderNode(el) {
  const wrap = document.createElement("div");
  wrap.className = "node";

  const tag = document.createElement("span");
  tag.className = "tag";
  let label = `<span class="tname">${el.tagName.toLowerCase()}</span>`;
  if (el.id) label += `<span class="tid"> #${el.id}</span>`;
  if (el.classList.length) label += `<span class="tcls"> .${[...el.classList].join(".")}</span>`;
  tag.innerHTML = label;
  nodeFor.set(el, tag);
  tag.addEventListener("click", () => selectElement(el, tag));
  tag.addEventListener("mouseenter", () => { if (evt) evt.emit("ce:hover", elPath(el)); });
  tag.addEventListener("mouseleave", () => { if (evt) evt.emit("ce:hover", null); });
  wrap.appendChild(tag);

  const kids = [...el.children];
  if (kids.length) {
    const sub = document.createElement("div");
    sub.className = "twrap";
    for (const k of kids) sub.appendChild(renderNode(k));
    wrap.appendChild(sub);
  }
  return wrap;
}

// Child-index path from <body> — stable across the parser iframe and the
// preview window since both render identical HTML.
function elPath(el) {
  const doc = parser.contentDocument;
  const p = [];
  while (el && el !== doc.body) {
    p.push([...el.parentElement.children].indexOf(el));
    el = el.parentElement;
  }
  return p.reverse();
}

function selectElement(el, tagSpan) {
  treeEl.querySelectorAll(".tag.sel").forEach((t) => t.classList.remove("sel"));
  tagSpan.classList.add("sel");
  tagSpan.scrollIntoView({ block: "nearest" });
  showInspector(el);
  revealElementSource(el);                          // scroll code panel to its markup
  if (evt) evt.emit("ce:highlight", elPath(el));   // highlight in preview window
}

// Click in the preview window -> select the matching tree node here.
function resolveParser(path) {
  const doc = parser.contentDocument;
  if (!doc || !doc.body) return null;
  let el = doc.body;
  for (const i of path) { if (!el.children[i]) return null; el = el.children[i]; }
  return el;
}
if (evt) evt.listen("ce:select", (e) => {
  const el = resolveParser(e.payload || []);
  const tag = el && nodeFor.get(el);
  if (tag) selectElement(el, tag);
});

// ---------- soft wrap ----------
$("wrap-btn").addEventListener("click", () => {
  const on = document.body.classList.toggle("soft-wrap");
  $("wrap-btn").classList.toggle("active", on);
  code.setAttribute("wrap", on ? "soft" : "off");  // attribute overrides CSS
  paint();
});
window.addEventListener("resize", () => { if (document.body.classList.contains("soft-wrap")) paint(); });

// ---------- preview window ----------
let previewOpen = false;
$("preview-btn").addEventListener("click", () => { if (invoke) invoke("open_code_preview"); });
if (evt) {
  evt.listen("ce:ready", () => { previewOpen = true; pushPreview(); });
  evt.listen("ce:closed", () => { previewOpen = false; });
}
function pushPreview() {
  if (evt && previewOpen) evt.emit("ce:html", renderedHTML());
}

function showInspector(el) {
  const doc = parser.contentDocument;
  let sel = el.tagName.toLowerCase();
  if (el.id) sel += "#" + el.id;
  let html = `<div class="ins-sel">${sel}${el.classList.length ? "." + [...el.classList].join(".") : ""}</div>`;

  const chips = [];
  if (el.id) chips.push(`<span class="chip clk" data-find="#${el.id}">#${el.id}</span>`);
  for (const c of el.classList) chips.push(`<span class="chip clk" data-find=".${c}">.${c}</span>`);
  html += chips.length ? chips.join("") : `<span class="empty">No classes</span>`;

  // Matched CSS rules from the document's stylesheets.
  const matches = [];
  for (const sheet of doc.styleSheets) {
    let rules;
    try { rules = sheet.cssRules; } catch { continue; }
    for (const rule of rules) {
      if (rule.selectorText) {
        try { if (el.matches(rule.selectorText)) matches.push(rule); } catch {}
      }
    }
  }
  if (matches.length) {
    for (const rule of matches) {
      const decls = [...rule.style].map((p) => `${p}: ${rule.style.getPropertyValue(p)};`).join("\n");
      html += `<div class="rule"><div class="rsel clk" data-find="${esc(rule.selectorText)}">${esc(rule.selectorText)} {</div><div class="rdecl">${esc(decls)}</div><div class="rsel">}</div></div>`;
    }
  }
  inspector.innerHTML = html;
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>"); }

// ---------- scroll the code panel to source ----------
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// Scroll the textarea so [start, start+len) is centered, and select it. Uses the
// highlight layer's row offset so it's correct in soft-wrap mode too.
function revealRange(start, len) {
  code.focus();
  code.setSelectionRange(start, start + len);
  const line = code.value.slice(0, start).split("\n").length;
  const row = hl.children[line - 1];
  if (row) code.scrollTop = Math.max(0, row.offsetTop - code.clientHeight / 2 + row.offsetHeight / 2);
  syncScroll();
}

// Find an element's opening tag in the source: the Nth `<tag`, where N is the
// element's ordinal among same-tag elements (DOM order == source order).
function revealElementSource(el) {
  const tag = el.tagName.toLowerCase();
  const re = new RegExp("<" + escapeRe(tag) + "(?=[\\s/>])", "gi");
  const at = [];
  let m;
  while ((m = re.exec(code.value))) at.push(m.index);
  if (!at.length) return;

  // The element's opening tag text in source, for matching by id/class.
  const openTag = (idx) => {
    const gt = code.value.indexOf(">", idx);
    return code.value.slice(idx, gt < 0 ? idx + 300 : gt + 1);
  };

  // Prefer an unambiguous match by id, then by all classes; otherwise fall
  // back to the DOM ordinal, clamped (DOM may have more nodes than the source
  // has literal tags — script-created or auto-inserted elements).
  let pick = null;
  if (el.id) {
    pick = at.find((i) => new RegExp("\\bid\\s*=\\s*['\"]?" + escapeRe(el.id) + "['\"]?").test(openTag(i)));
  }
  if (pick == null && el.classList.length) {
    const cls = [...el.classList];
    pick = at.find((i) => { const t = openTag(i); return cls.every((c) => new RegExp("\\b" + escapeRe(c) + "\\b").test(t)); });
  }
  if (pick == null) {
    const same = [...parser.contentDocument.getElementsByTagName(tag)];
    let ord = same.indexOf(el);
    if (ord < 0) ord = 0;
    pick = at[Math.min(ord, at.length - 1)];
  }

  const gt = code.value.indexOf(">", pick);
  revealRange(pick, gt >= 0 ? gt - pick + 1 : tag.length + 1);
}

// Find a class/id token or full selector text in the source (e.g. an inline
// <style> block) and scroll to it.
function findInSource(token) {
  if (/^[.#]/.test(token)) {
    const m = new RegExp(escapeRe(token) + "(?![\\w-])").exec(code.value);
    if (m) revealRange(m.index, m[0].length);
  } else {
    const idx = code.value.indexOf(token);
    if (idx >= 0) revealRange(idx, token.length);
  }
}

inspector.addEventListener("click", (e) => {
  const t = e.target.closest("[data-find]");
  if (t) findInSource(t.dataset.find);
});

// Cmd+S to save.
window.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); saveFile(); return; }
  // Cmd+Z right after a Prettify (nothing typed since) reverts it; otherwise
  // let the textarea's native undo handle it.
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key === "z" &&
      prettifySnapshot && code.value === prettifySnapshot.after) {
    e.preventDefault();
    code.value = prettifySnapshot.before;
    prettifySnapshot = null;
    setDirty(true); render(); paint(); persist();
  }
});

// Restore the previous session (file + unsaved text) if there is one, so a
// window reload doesn't lose the open file. Falls back to empty otherwise.
(function restore() {
  let s;
  try { s = JSON.parse(localStorage.getItem("ce:session") || "null"); } catch {}
  if (s && s.path) {
    currentPath = s.path;
    code.value = s.value || "";
    filenameEl.textContent = "‎" + currentPath;
    setDirty(!!s.dirty);
    applyMode();
    render();
    paint();
    refreshDiff();
  } else {
    paint();
  }
})();

// If this window was launched to open a specific file (Git window → "Studio
// Code Editor"), load it, overriding any restored session.
if (invoke) invoke("take_pending_open").then((p) => { if (p) loadPath(p); });

import("../devinspect.js").then((m) => m.initDevInspect()).catch(() => {});
</script>
</body>
</html>
