<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Editor</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="../kit/window-chrome.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --line-h: 19px;
    --code-font: 12px/var(--line-h) var(--mono);
    --add-bg: rgba(20, 184, 166, 0.20);    /* bright teal tint for changed lines */
    --add-bar: #14b8a6;
  }

  html, body { height: 100%; }
  body {
    /* Transparent so the window's rounded corners (clipped by window-chrome.css)
       reveal the desktop — an opaque body/html background propagates to the
       square viewport and ignores border-radius. The content rows below carry
       the paper fill instead. */
    background: transparent;
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- toolbar (doubles as the draggable title bar; chrome from kit) ---- */
  #toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 12px;
    z-index: 20;
  }
  .tb-group { display: flex; align-items: center; gap: 6px; }
  #toolbar .spacer { flex: 1; }
.window-close{
    margin-right:16px;
}

  /* Filename + status live in the title bar (alongside the buttons). */
  #filename {
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
    margin-left: 4px;
  }
  #dirty {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--rose);
    opacity: 0;
    transition: opacity var(--dur-fast);
    flex: 0 0 auto;
  }
  #dirty.on { opacity: 1; }
  #refresh-btn { position: relative; }
  #refresh-btn .stale-dot {
    position: absolute; top: 2px; right: 2px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--rose);
    opacity: 0;
    transition: opacity var(--dur-fast);
  }
  #refresh-btn.stale .stale-dot { opacity: 1; }
  /* When the file on disk has changes not yet loaded, periodically wiggle the
     refresh icon to draw the eye (brief twist, then rest). */
  #refresh-btn.stale .mi { animation: ce-refresh-wiggle 1.8s var(--ease-standard) infinite; }
  @keyframes ce-refresh-wiggle {
    0%, 70%, 100% { transform: rotate(0); }
    80% { transform: rotate(-16deg); }
    90% { transform: rotate(16deg); }
  }

  /* ---- main row: cards floating on the tinted window background ---- */
  #main {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    gap: 10px;
    padding: 0 10px 10px;
    /* The tint fills the window (and is the opaque fill the rounded corners
       clip against). Buttons/cards sit on top of it. Round its own bottom
       corners so the window's bottom is rounded (the toolbar rounds the top). */
    background: var(--titlebar-tint, var(--bg));
    border-radius: 0 0 var(--window-radius, 10px) var(--window-radius, 10px);
  }

  /* Left column: a stack of cards (DOM, Styles / Sections, Links). */
  #tree-col {
    flex: 0 0 250px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  .panel-card {
    /* Translucent white over the tint → the soft tinted-card look (à la the
       Git window; --card from window-chrome.css). The code card stays solid
       white for legibility. */
    background: var(--card);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  /* DOM is capped so Styles gets the rest of the column; the tree scrolls
     inside its card when it's taller than the cap. */
  #dom-card { flex: 0 1 auto; max-height: 60%; }
  #styles-card { flex: 1 1 auto; }
  #sections-card { flex: 1 1 auto; }
  #links-card { flex: 0 1 auto; max-height: 40%; }

  .col-head {
    flex: 0 0 auto;
    padding: 8px 12px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--hairline);
  }
  #tree {
    flex: 1 1 auto;
    overflow: auto;
    padding: 6px 0 12px;
    font: var(--code-font);
  }
  .node { white-space: nowrap; }
  .node .tag {
    display: inline-block;
    padding: 1px 6px 1px 6px;
    cursor: default;
    border-radius: var(--radius-sm);
  }
  .node .tag:hover { background: var(--accent-ring); }

  .tname { color: var(--accent); }
  .tid { color: var(--rose); }   /* element id (distinct from tag/class) */
  .tcls { color: var(--text-muted); font-weight:bold;}
  .twrap { padding-left: 14px; }
  .node .tag.sel { background: var(--text); color:var(--window-color, var(--surface));}
  .tag.sel .tcls, .tag.sel .tid{
      color:var(--window-color, var(--surface));
  }
.tag.sel .tname {
      color:var(--surface);
  }

  /* editor (center) — its own rounded card on the tint */
  #editor-col {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
    background: var(--elevated);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  /* Find bar (Cmd+F) */
  #find-bar {
    position: absolute;
    top: 6px; right: 24px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px;
    background: var(--elevated);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
  }
  #find-bar[hidden] { display: none; }
  #find-input {
    border: 0; outline: none; background: transparent;
    font: var(--code-font); color: var(--text);
    width: 180px; padding: 2px 4px;
  }
  #find-count { font: var(--code-font); color: var(--text-soft); min-width: 44px; text-align: right; }

  /* Find match highlight layer (between #hl and the textarea). */
  #find-layer {
    position: absolute; inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;                 /* behind the syntax text + transparent textarea */
  }
  .find-mark {
    position: absolute;
    height: var(--line-h);
    background: rgba(255, 213, 0, 0.55);
    border-radius: 2px;
  }
  .find-mark.cur { background: rgba(255, 145, 0, 0.85); outline: 1px solid #e8590c; }
  #editor {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    position: relative;
    background: var(--elevated);
  }
  #gutter {
    flex: 0 0 auto;
    /* overflow clipping handled by #codebox */
    text-align: right;
    color: var(--text-soft);
    font: var(--code-font);
    padding: 8px 0px 8px 0;
    background:var(--bg);
    user-select: none;
  }
  #gutter .gl {
      height: var(--line-h);
      position: relative;
      background:var(--bg);
      padding: 0px 10px;
      border-right: 1px solid var(--hairline);
  }
  #gutter .gl.chg::after {
    content: "";
    position: absolute;
    right: -2px; top: 0; bottom: 0;
    width: 4px;
    background: var(--add-bar);
  }
  /* Deletion: a small red triangle pointing at the spot where lines were
     removed (no added line to tint in the new file). */
  #gutter .gl.del::before {
    content: "";
    position: absolute;
    right: -10px; top: -4px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 6px solid #e5484d;
  }
  #codebox { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; }
  #hl, #code {
    position: absolute;
    inset: 0;
    padding: 8px 12px;
    font: var(--code-font);
    border: 0;
    margin: 0;
    white-space: pre;
    tab-size: 2;
  }
  #hl {
    pointer-events: none;
    color: var(--text);
    z-index: 1;
  }
  /* Syntax token colors (Prism types), bright colors. */
  .tok-comment, .tok-prolog, .tok-doctype, .tok-cdata { color: #9aa0a6; font-style: italic; }
  .tok-tag, .tok-keyword, .tok-atrule, .tok-selector, .tok-important, .tok-boolean, .tok-rule { color: #d6336c; }
  .tok-attr-name, .tok-property, .tok-class-name, .tok-function, .tok-symbol { color: #1c7ed6; }
  .tok-attr-value, .tok-string, .tok-template-string, .tok-char, .tok-regex, .tok-url { color: #2f9e44; }
  .tok-number, .tok-unit, .tok-color, .tok-constant, .tok-entity, .tok-hexcode { color: #e8590c; }
  .tok-punctuation, .tok-operator { color: #868e96; }
  #hl .hline { min-height: var(--line-h); }
  /* Soft-wrap: lines flow instead of scrolling horizontally. The highlight
     layer carries the (transparent) line text so it wraps identically; gutter
     row heights are synced to it in JS. */
  body.soft-wrap #code, body.soft-wrap #hl { white-space: pre-wrap; word-break: break-word; }
  .btn.active { background: var(--accent-soft); color: var(--text); }
  #hl .hline.chg { background: var(--add-bg); box-shadow: -12px 0 0 var(--add-bg), 9999px 0 0 var(--add-bg); }
  /* "Last commit" diff mode: changes shown in blue instead of teal. */
  body.diff-committed { --add-bg: rgba(37, 99, 235, 0.20); --add-bar: #2563eb; }
  #code {
    z-index: 2;
    background: transparent;
    color: transparent;            /* text is drawn by #hl; caret stays visible */
    resize: none;
    outline: none;
    caret-color: var(--accent);
  }
  #code::selection { background: var(--accent-ring); }

  /* minimap */
  #minimap {
    flex: 0 0 14px;
    position: relative;
    background: var(--surface);
    border-left: 1px solid var(--hairline);
    cursor: pointer;
  }
  #minimap .mm {
    position: absolute;
    left: 2px; right: 2px;
    min-height: 2px;
    background: var(--add-bar);
    border-radius: 1px;
  }
  #minimap .mm-view {
    position: absolute;
    left: 0; right: 0;
    background: var(--accent-ring);
    pointer-events: none;
  }

  /* inspector (bottom of the left column) */
  #inspector {
    flex: 1 1 auto;
    overflow: auto;
    padding: 10px 12px;
    font: var(--code-font);
  }
  /* Layout only — color comes from the kit `.tint-dark` utility on the chip. */
  .chip {
    display: inline-block;
    padding: 1px 7px;
    margin: 0 4px 4px 0;
    border-radius: 999px;
  }
  .rule { margin-top: 8px; padding-top: 6px;  }
  .rule .rsel { color: var(--rose); }
  .clk { cursor: pointer; }
  .rsel.clk:hover { text-decoration: underline; }
  .rule .rdecl { color: var(--text-muted); padding-left: 12px; }
  .empty { color: var(--text-soft); }

  /* Markdown mode: left column shows a heading/link browser, not DOM + Styles.
     Toggle whole cards (each .panel-card lays its header + body out as flex). */
  #sections-card, #links-card { display: none; }
  body.is-markdown #dom-card,
  body.is-markdown #styles-card { display: none; }
  body.is-markdown #sections-card,
  body.is-markdown #links-card { display: flex; }
  #sections { flex: 1 1 auto; overflow: auto; padding: 6px 0 12px; font: var(--code-font); }
  #links { flex: 0 1 auto; max-height: 40%; overflow: auto; padding: 6px 0 12px; font: var(--code-font); }
  .lnk {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    cursor: pointer; color: #1c6cd6; padding: 3px 12px 3px 30px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: var(--radius-sm);
    position: relative;
  }
  .lnk:hover { background: var(--accent-ring); }
  .lnk .mi { position: absolute; left: 9px; top: 3px; font-size: 15px; color: var(--text-soft); }
  .sec {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: none;
    cursor: pointer;
    color: var(--text);
    padding: 3px 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-radius: var(--radius-sm);
  }
  .sec:hover { background: var(--accent-ring); }
  .sec.lvl1 { font-weight: 650; }
  .sec.lvl2 { padding-left: 24px; }
  .sec.lvl3 { padding-left: 36px; color: var(--text-muted); }
  .sec.lvl4, .sec.lvl5, .sec.lvl6 { padding-left: 48px; color: var(--text-soft); }

  /* Inline Markdown preview: hidden by default; the Code/Preview toggle and the
     separate-window button only apply to Markdown. */
  #md-view { display: none; flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; background: var(--elevated); }

  /* The Code | Preview toggle is a kit <studio-icon-toggle> (.icon-toggle). */
  #view-toggle { display: none; }
  body.is-markdown #view-toggle { display: inline-flex; }
  body.is-markdown #preview-btn { display: none; }
  body.md-preview #editor { display: none; }
  body.md-preview #md-view { display: block; }

  /* Rendered Markdown typography (scoped to the inline view). */
  .md-body { max-width: 740px; margin: 0 auto; padding: 32px 32px 80px;
    font: 16px/1.65 -apple-system, system-ui, "Segoe UI", sans-serif; color: var(--text); }
  .md-body h1, .md-body h2, .md-body h3, .md-body h4 { line-height: 1.25; margin: 1.6em 0 .5em; font-weight: 650; }
  .md-body h1 { font-size: 2em; border-bottom: 1px solid #e5e2db; padding-bottom: .3em; }
  .md-body h2 { font-size: 1.5em; border-bottom: 1px solid #eee; padding-bottom: .25em; }
  .md-body h3 { font-size: 1.22em; } .md-body h4 { font-size: 1.05em; }
  .md-body p, .md-body ul, .md-body ol, .md-body blockquote, .md-body table, .md-body pre { margin: 0 0 1em; }
  .md-body a { color: #1c6cd6; } .md-body li { margin: .25em 0; }
  .md-body code { font: 0.88em var(--mono); background: #f1efe9; padding: .15em .4em; border-radius: 4px; }
  .md-body pre { background: #f6f4ef; padding: 14px 16px; border-radius: 8px; overflow: auto; }
  .md-body pre code { background: none; padding: 0; }
  .md-body blockquote { border-left: 3px solid #d8d3c8; padding: .2em 0 .2em 1em; color: #6b6658; }
  .md-body table { border-collapse: collapse; }
  .md-body th, .md-body td { border: 1px solid #e0dcd2; padding: 6px 12px; }
  .md-body th { background: #f3f1ea; } .md-body img { max-width: 100%; }
  .md-body hr { border: 0; border-top: 1px solid #e5e2db; margin: 2em 0; }
</style>
</head>
<body>
  <div id="toolbar" data-window-bar>
    <div class="tb-group" data-window-close>
        <button class="btn btn-icon-only" id="back-btn" title="Back" disabled><span class="mi">arrow_back</span></button>
        <button class="btn btn-icon-only" id="forward-btn" title="Forward" disabled><span class="mi">arrow_forward</span></button>
        <button class="btn btn-icon-only" id="open" title="Open file"><span class="mi">folder_open</span></button>
        <button class="btn btn-icon-only" id="save" title="Save (Cmd+S)"><span class="mi">save</span></button>
        <span id="filename">No file</span>
        <span id="dirty" title="Unsaved changes"></span>
    </div>
    <div class="tb-group">
        <button class="btn btn-ghost" id="prettify"><span class="mi">format_align_left</span>Prettify</button>
        <button class="btn btn-ghost" id="wrap-btn"><span class="mi">wrap_text</span>Wrap</button>
    </div>
    <div class="tb-group">
        <button class="btn btn-icon-only" id="refresh-btn" title="Reload file from disk"><span class="mi">refresh</span><span class="stale-dot"></span></button>
        <button class="btn btn-icon-only" id="diff-mode" title="Diff: uncommitted changes"><span class="mi">difference</span></button>
        <studio-icon-toggle id="view-toggle" value="code">
            <button value="code" data-icon="code" title="Show source"></button>
            <button value="preview" data-icon="visibility" title="Show rendered preview"></button>
        </studio-icon-toggle>
        <button class="btn-round btn-round-filled" id="preview-btn" title="Preview"><span class="mi mi-sm">play_arrow</span></button>
    </div>
  </div>

  <div id="main">
    <div id="tree-col">
      <div class="panel-card" id="dom-card">
        <div class="col-head" id="dom-heading">DOM</div>
        <div id="tree"><div class="empty" style="padding:8px 12px">Open an HTML file</div></div>
      </div>
      <div class="panel-card" id="styles-card">
        <div class="col-head" id="styles-heading">Styles</div>
        <div id="inspector"><span class="empty">Select an element in the DOM tree.</span></div>
      </div>
      <!-- Markdown files show these two cards instead of DOM/Styles. -->
      <div class="panel-card" id="sections-card">
        <div class="col-head" id="sections-heading">Sections</div>
        <div id="sections"><span class="empty" style="padding:8px 12px">No headings</span></div>
      </div>
      <div class="panel-card" id="links-card">
        <div class="col-head" id="links-heading">Linked Files</div>
        <div id="links"><span class="empty" style="padding:8px 12px">No links</span></div>
      </div>
    </div>

    <div id="editor-col">
      <div id="editor">
        <div id="gutter"></div>
        <div id="codebox">
          <div id="hl"></div>
          <div id="find-layer"></div>
          <textarea id="code" spellcheck="false" wrap="off"></textarea>
        </div>
        <div id="minimap"><div class="mm-view"></div></div>
      </div>
      <!-- Inline rendered preview, shown in place of the code panel when a
           Markdown file is in Preview mode. A plain scrollable div (not an
           iframe) so scrolling stays reliable across show/hide. -->
      <div id="md-view"></div>

      <div id="find-bar" hidden>
        <input id="find-input" type="text" placeholder="Find" spellcheck="false" />
        <span id="find-count"></span>
        <button class="btn btn-icon" id="find-prev" title="Previous (Shift+Enter)"><span class="mi">keyboard_arrow_up</span></button>
        <button class="btn btn-icon" id="find-next" title="Next (Enter)"><span class="mi">keyboard_arrow_down</span></button>
        <button class="btn btn-icon" id="find-close" title="Close (Esc)"><span class="mi">close</span></button>
      </div>
    </div>
  </div>

  <!-- Offscreen iframe: parses the document so the DOM tree + inspector work
       even when the preview window is closed. Never shown. -->
  <iframe id="parser" sandbox="allow-same-origin allow-scripts"
          style="position:absolute;left:-9999px;top:0;width:1024px;height:768px;border:0"></iframe>
  <input type="file" id="fallback-file" hidden />

<script src="../vendor/marked.min.js"></script>   <!-- window.marked (Markdown preview) -->
<script type="module">
import "../vendor/beautify.js";        // window.js_beautify
import "../vendor/beautify-css.js";    // window.css_beautify
import "../vendor/beautify-html.js";   // window.html_beautify (needs the two above)
import "../vendor/prism.js";           // window.Prism (markup + css + js)
import "../vendor/prism-markdown.min.js"; // adds Prism.languages.markdown
import "../kit/window-chrome.js";         // custom title bar: drag, close dot, tint
import "../kit/components.js";            // <studio-*> kit components (icon toggle)

const TAURI = window.__TAURI__;
const invoke = TAURI ? TAURI.core.invoke : null;
const evt = TAURI ? TAURI.event : null;

// Wider window for the 4-column layout.
if (TAURI) {
  const { getCurrentWindow } = TAURI.window;
  const { LogicalSize } = TAURI.dpi;
  getCurrentWindow().setSize(new LogicalSize(1060, 760));
  // Custom window chrome (draggable bar, close dot, Cmd+W, rounded corners) is
  // provided by kit/window-chrome.js, imported below. Re-tint on launch even
  // before a file is opened (it retints per open file via applyTitleColor).
  setTimeout(() => applyTitleColor(), 0);
}

const $ = (id) => document.getElementById(id);

// Tint the title bar to match the Git-window color of the open file's repo
// (independent of the active project), and mirror it to the preview window.
let titleColor = "";
async function applyTitleColor() {
  if (!invoke) return;
  titleColor = currentPath ? await invoke("git_color_for_path", { path: currentPath }) : "";
  // No file (or file outside any known repo) → fall back to the active project's color.
  if (!titleColor) titleColor = await invoke("active_git_color");
  // Tint our custom title bar (the toolbar); empty string clears to paper.
  document.documentElement.style.setProperty("--titlebar-tint", titleColor || "");
  if (evt) evt.emit("ce:color", titleColor);
}

const code = $("code"), hl = $("hl"), gutter = $("gutter"), minimap = $("minimap");
const treeEl = $("tree"), inspector = $("inspector"), parser = $("parser");
const sectionsEl = $("sections"), mdView = $("md-view"), linksEl = $("links");
let mdHeadings = [];   // parsed ATX headings { level, text, line } for the section browser
const filenameEl = $("filename"), dirtyEl = $("dirty");

let currentPath = null;
let diskText = null;   // file contents as last synced with disk (loaded/saved/reloaded)
const refreshBtn = $("refresh-btn");
function setStale(v) { refreshBtn.classList.toggle("stale", v); }
let changedLines = new Set();   // 1-based line numbers (new file) marked as added/changed
let deletedAt = new Set();      // lines where preceding content was deleted (triangle marker)
// In-editor undo/redo. WKWebView's native textarea undo is flaky and resets, so
// we keep our own stack of states ({value, selection}), coalescing typing
// bursts into one step. `undoStack`'s last entry is always the current state.
let undoStack = [], redoStack = [], undoTimer = null;
function snap() { return { value: code.value, s: code.selectionStart, e: code.selectionEnd }; }
function seedUndo() { undoStack = [snap()]; redoStack = []; clearTimeout(undoTimer); }
function commitUndo() {                 // capture current state as a new step
  clearTimeout(undoTimer);
  if (!undoStack.length || undoStack[undoStack.length - 1].value !== code.value) {
    undoStack.push(snap());
    if (undoStack.length > 200) undoStack.shift();
    redoStack = [];
  }
}
function scheduleUndo() {                // coalesce a burst, then commit on pause
  clearTimeout(undoTimer);
  undoTimer = setTimeout(commitUndo, 350);
}
function applySnap(sp) {
  const keepScroll = code.scrollTop;     // don't jump the viewport on undo/redo
  code.value = sp.value;
  code.setSelectionRange(sp.s, sp.e);    // (this would auto-scroll to the caret)
  setDirty(true); render(); paint(); persist();
  code.scrollTop = keepScroll;
  syncScroll();
}
function undo() {
  commitUndo();                          // fold any uncommitted burst
  if (undoStack.length < 2) return;
  redoStack.push(undoStack.pop());       // move current onto redo
  applySnap(undoStack[undoStack.length - 1]);
}
function redo() {
  if (!redoStack.length) return;
  const sp = redoStack.pop();
  undoStack.push(sp);
  applySnap(sp);
}
let dirty = false;

// ---------- file open / save ----------
$("open").addEventListener("click", openFile);
$("save").addEventListener("click", saveFile);
$("refresh-btn").addEventListener("click", reloadFromDisk);
$("prettify").addEventListener("click", prettify);

// Back/Forward navigation history of opened file paths.
let history = [], histIdx = -1;
$("back-btn").addEventListener("click", () => { if (histIdx > 0) loadPath(history[--histIdx], false); });
$("forward-btn").addEventListener("click", () => { if (histIdx < history.length - 1) loadPath(history[++histIdx], false); });
function updateNav() {
  $("back-btn").disabled = histIdx <= 0;
  $("forward-btn").disabled = histIdx >= history.length - 1;
}

async function openFile() {
  if (invoke) {
    const path = await invoke("pick_text_file");
    if (!path) return;
    await loadPath(path);
  } else {
    $("fallback-file").click();   // browser test fallback
  }
}

// Load a specific file by absolute path. `push` (default) records it in the
// nav history; Back/Forward pass false so they don't re-record.
async function loadPath(path, push = true) {
  if (!invoke) return;
  const text = await invoke("read_text_file", { path });
  currentPath = path;
  diskText = text;
  setStale(false);
  if (push && history[histIdx] !== path) {
    history = history.slice(0, histIdx + 1);   // drop forward entries
    history.push(path);
    histIdx = history.length - 1;
  }
  updateNav();
  loadText(text);
  await refreshDiff();
}
if (evt) evt.listen("ce:open-file", (e) => { if (e.payload) loadPath(e.payload); });
$("fallback-file").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { currentPath = f.name; loadText(r.result); changedLines = new Set(); paint(); };
  r.readAsText(f);
});

function loadText(text) {
  code.value = text;
  setDirty(false);
  const base = currentPath ? currentPath.split("/").pop() : "untitled";
  filenameEl.textContent = "‎" + base;
  filenameEl.title = currentPath || "";
  applyMode();
  applyTitleColor();
  render();
  paint();
  persist();
  seedUndo();
}

async function saveFile() {
  if (!currentPath) return;
  if (invoke) {
    await invoke("write_text_file", { path: currentPath, content: code.value });
    diskText = code.value;
    setStale(false);
    setDirty(false);
    persist();
    pushPreview();              // ensure the preview reflects the saved content
    await refreshDiff();
  } else {
    const blob = new Blob([code.value], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = currentPath; a.click();
    setDirty(false);
  }
}

// Re-read the current file from disk (picks up external edits) and refresh diff.
async function reloadFromDisk() {
  if (!invoke || !currentPath) return;
  const text = await invoke("read_text_file", { path: currentPath });
  diskText = text;
  setStale(false);
  loadText(text);
  await refreshDiff();
}

// Poll the open file for external changes (e.g. saved from another editor) and
// flag the Refresh button with a dot rather than silently clobbering local edits.
setInterval(async () => {
  if (!invoke || !currentPath || document.hidden) return;
  let text;
  try { text = await invoke("read_text_file", { path: currentPath }); } catch { return; }
  setStale(text !== diskText);
}, 2000);

function ext() { return (currentPath || "").split(".").pop().toLowerCase(); }

function prettify() {
  const opts = { indent_size: 2, end_with_newline: true };
  let out;
  try {
    if (ext() === "css") out = window.css_beautify(code.value, opts);
    else if (ext() === "js" || ext() === "mjs") out = window.js_beautify(code.value, opts);
    else out = window.html_beautify(code.value, opts);
  } catch (e) { console.error(e); return; }
  commitUndo();                 // checkpoint pre-Prettify state
  code.value = out;
  commitUndo();                 // and the result, so Cmd+Z reverts it
  setDirty(true);
  render(); paint(); persist();
}

function setDirty(v) { dirty = v; dirtyEl.classList.toggle("on", v); }

// Persist the open file + current text + scroll/cursor position so a window
// reload (e.g. Tauri's dev watcher reloads all webviews when a frontend file
// is saved) restores it exactly where you left off, instead of coming back
// empty and scrolled to the top.
function persist() {
  try {
    localStorage.setItem("ce:session", JSON.stringify({
      path: currentPath, value: code.value, dirty,
      scrollTop: code.scrollTop, selStart: code.selectionStart, selEnd: code.selectionEnd,
    }));
  } catch {}
}

// ---------- editor: gutter + highlight + minimap ----------
code.addEventListener("input", () => { setDirty(true); paint(); persist(); scheduleRender(); scheduleUndo(); });
let scrollPersistScheduled = false;
code.addEventListener("scroll", () => {
  syncScroll();
  if (scrollPersistScheduled) return;
  scrollPersistScheduled = true;
  requestAnimationFrame(() => { scrollPersistScheduled = false; persist(); });
});

function lineCount() { return code.value.split("\n").length; }

// ---------- syntax highlighting (Prism) ----------
function isMarkdown() { const e = ext(); return e === "md" || e === "markdown"; }

function grammar() {
  const e = ext();
  if (e === "css") return ["css", Prism.languages.css];
  if (e === "js" || e === "mjs") return ["js", Prism.languages.javascript];
  if (isMarkdown()) return ["markdown", Prism.languages.markdown];
  return ["markup", Prism.languages.markup];
}

// Flatten Prism's nested token stream into [cssClass, text] pairs.
function flatten(tokens, parentType, out) {
  for (const t of tokens) {
    if (typeof t === "string") { out.push([parentType, t]); continue; }
    const type = Array.isArray(t.alias) ? t.alias[0] : (t.alias || t.type);
    if (Array.isArray(t.content)) flatten(t.content, type, out);
    else if (typeof t.content === "string") out.push([type, t.content]);
    else flatten([t.content], type, out);
  }
}

// Highlight the whole document, then split the token stream into one HTML
// string per source line (so the per-line diff/wrap layer keeps working).
function highlightLines(text) {
  let flat;
  try {
    const [, gram] = grammar();
    flat = [];
    flatten(Prism.tokenize(text, gram), "", flat);
  } catch (e) {
    return text.split("\n").map((l) => esc(l));   // fallback: plain
  }
  const out = [];
  let cur = "";
  for (const [type, txt] of flat) {
    const parts = txt.split("\n");
    for (let k = 0; k < parts.length; k++) {
      if (k > 0) { out.push(cur); cur = ""; }
      const piece = parts[k];
      if (piece) cur += type ? `<span class="tok tok-${type}">${esc(piece)}</span>` : esc(piece);
    }
  }
  out.push(cur);
  return out;
}

function paint() {
  const n = lineCount();
  const hi = highlightLines(code.value);
  // gutter
  let g = "";
  for (let i = 1; i <= n; i++) g += `<div class="gl${changedLines.has(i) ? " chg" : ""}${deletedAt.has(i) ? " del" : ""}">${i}</div>`;
  gutter.innerHTML = g;
  // highlight layer — colored tokens; wraps exactly like the textarea so the
  // diff row backgrounds and soft-wrap line heights stay aligned.
  let h = "";
  for (let i = 1; i <= n; i++) h += `<div class="hline${changedLines.has(i) ? " chg" : ""}">${hi[i - 1] || "&#8203;"}</div>`;
  hl.innerHTML = h;
  syncWrap();
  paintMinimap(n);
  syncScroll();
  if (isMarkdown()) { buildSections(); buildLinks(); }
}

// When wrapping, match each gutter row's height to its (possibly multi-row)
// highlight line so numbers and change-bars stay aligned.
function syncWrap() {
  const on = document.body.classList.contains("soft-wrap");
  const gls = gutter.children, hls = hl.children;
  for (let i = 0; i < gls.length; i++) {
    gls[i].style.height = on ? hls[i].offsetHeight + "px" : "";
  }
}

function paintMinimap(n) {
  minimap.querySelectorAll(".mm").forEach((e) => e.remove());
  for (const ln of changedLines) {
    const d = document.createElement("div");
    d.className = "mm";
    d.style.top = ((ln - 0.5) / n * 100) + "%";
    d.style.height = Math.max(2, 100 / n) + "%";
    minimap.appendChild(d);
  }
  updateViewport();
}

function syncScroll() {
  // #gutter/#hl are overflow:hidden, so translate their content instead of
  // scrolling. Padding-top matches the textarea's, so they stay aligned.
  const y = -code.scrollTop;
  gutter.style.transform = `translateY(${y}px)`;
  hl.style.transform = `translate(${-code.scrollLeft}px, ${y}px)`;
  // Find marks are positioned from live text geometry (which already reflects
  // #hl's transform), so the layer itself isn't transformed — recompute on scroll.
  if (!findBar.hidden) renderFindMarks();
  updateViewport();
}

function updateViewport() {
  const view = minimap.querySelector(".mm-view");
  const total = code.scrollHeight || 1;
  view.style.top = (code.scrollTop / total * 100) + "%";
  view.style.height = (code.clientHeight / total * 100) + "%";
}

minimap.addEventListener("click", (e) => {
  const frac = (e.clientY - minimap.getBoundingClientRect().top) / minimap.clientHeight;
  code.scrollTop = frac * code.scrollHeight - code.clientHeight / 2;
  syncScroll();
});

// ---------- git diff ----------
// "working" = uncommitted changes vs HEAD (teal); "committed" = what the last
// commit changed, HEAD~1..HEAD (blue).
let diffMode = "working";
$("diff-mode").addEventListener("click", () => {
  diffMode = diffMode === "working" ? "committed" : "working";
  document.body.classList.toggle("diff-committed", diffMode === "committed");
  const dm = $("diff-mode");
  dm.classList.toggle("active", diffMode === "committed");
  dm.title = diffMode === "committed" ? "Diff: last commit" : "Diff: uncommitted changes";
  refreshDiff();
});

async function refreshDiff() {
  changedLines = new Set();
  deletedAt = new Set();
  if (!invoke || !currentPath) { paint(); return; }
  const cmd = diffMode === "committed" ? "git_diff_file_committed" : "git_diff_file";
  try {
    const diff = await invoke(cmd, { path: currentPath });
    parseDiff(diff);   // populates the gutter bars + minimap marks
  } catch (e) {
    // not a git repo / no previous commit — just leave the diff empty
  }
  paint();
}

function parseDiff(diff) {
  let newLine = 0, pendingDel = false;
  for (const line of diff.split("\n")) {
    const m = line.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
    if (m) { newLine = parseInt(m[1], 10); pendingDel = false; continue; }
    if (newLine === 0) continue;          // header lines before first hunk
    if (line.startsWith("+")) { changedLines.add(newLine); newLine++; pendingDel = false; }
    else if (line.startsWith("-")) { pendingDel = true; }   // deletion: marked on the next kept line
    else if (line.startsWith("\\")) { /* "No newline" marker */ }
    else {                                 // context line
      if (pendingDel) { deletedAt.add(newLine); pendingDel = false; }
      newLine++;
    }
  }
  // Deletion at end of file: mark the last line.
  if (pendingDel) deletedAt.add(Math.max(1, newLine - 1));
}

// ---------- DOM tree + inspector (offscreen parser iframe) ----------
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 250); }

// The HTML shown in the preview / parsed for the tree. For Markdown files this
// is marked-rendered HTML wrapped in a readable stylesheet; otherwise the raw
// source (which is already HTML/CSS/JS).
async function renderedHTML() {
  const raw = (isMarkdown() && window.marked)
    ? mdWrap(window.marked.parse(code.value, { breaks: true }))
    : code.value;
  return await resolveAssets(raw);
}

const convertFileSrc = TAURI ? TAURI.core.convertFileSrc : null;
const isLocalRef = (v) => v && !/^[a-z][a-z0-9+.-]*:/i.test(v) && !v.startsWith("//") && !v.startsWith("#") && !v.startsWith("data:");

// Rewrite a CSS string's relative url(...) refs to asset:// URLs, resolved
// against the stylesheet's own absolute path (so @font-face fonts load).
function rewriteCssUrls(css, cssAbsPath) {
  return css.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, ref) => {
    if (!isLocalRef(ref)) return m;
    const abs = resolveRelative(cssAbsPath, ref.split("#")[0].split("?")[0]);
    return `url("${convertFileSrc(abs)}")`;
  });
}

// Make the previewed file's relative assets load in the preview. Scripts/images
// get convertFileSrc URLs; stylesheets are inlined with their url() refs (e.g.
// @font-face) rewritten too — convertFileSrc percent-encodes the path, so
// relative url() inside an external sheet can't resolve on its own.
async function resolveAssets(html) {
  if (!convertFileSrc || !currentPath || !invoke) return html;
  let doc;
  try { doc = new DOMParser().parseFromString(html, "text/html"); } catch { return html; }

  // Inline local stylesheets with rewritten url()s.
  for (const link of [...doc.querySelectorAll('link[rel~="stylesheet"][href]')]) {
    const href = link.getAttribute("href");
    if (!isLocalRef(href)) continue;
    const abs = resolveRelative(currentPath, href.split("#")[0].split("?")[0]);
    try {
      const css = await invoke("read_text_file", { path: abs });
      const style = doc.createElement("style");
      style.textContent = rewriteCssUrls(css, abs);
      link.replaceWith(style);
    } catch {}
  }
  // Rewrite remaining relative src/href (scripts, images, …).
  for (const node of doc.querySelectorAll("[src], [href]")) {
    const attr = node.hasAttribute("src") ? "src" : "href";
    const v = node.getAttribute(attr);
    if (!isLocalRef(v)) continue;
    const abs = resolveRelative(currentPath, v.split("#")[0].split("?")[0]);
    try { node.setAttribute(attr, convertFileSrc(abs)); } catch {}
  }
  // Inline <style> blocks: rewrite their url()s against the file's own path.
  for (const style of doc.querySelectorAll("style")) {
    if (style.textContent.includes("url(")) style.textContent = rewriteCssUrls(style.textContent, currentPath);
  }
  return "<!doctype html>" + doc.documentElement.outerHTML;
}

const MD_CSS = `
  :root { color-scheme: light; }
  body { max-width: 740px; margin: 0 auto; padding: 40px 32px 80px;
    font: 16px/1.65 -apple-system, system-ui, "Segoe UI", sans-serif; color: #2a2a28; }
  h1, h2, h3, h4 { line-height: 1.25; margin: 1.6em 0 0.5em; font-weight: 650; }
  h1 { font-size: 2em; border-bottom: 1px solid #e5e2db; padding-bottom: .3em; }
  h2 { font-size: 1.5em; border-bottom: 1px solid #eee; padding-bottom: .25em; }
  h3 { font-size: 1.22em; } h4 { font-size: 1.05em; }
  p, ul, ol, blockquote, table, pre { margin: 0 0 1em; }
  a { color: #1c6cd6; } li { margin: .25em 0; }
  code { font: 0.88em var(--mono, ui-monospace, Menlo, monospace);
    background: #f1efe9; padding: .15em .4em; border-radius: 4px; }
  pre { background: #f6f4ef; padding: 14px 16px; border-radius: 8px; overflow: auto; }
  pre code { background: none; padding: 0; }
  blockquote { border-left: 3px solid #d8d3c8; padding: .2em 0 .2em 1em; color: #6b6658; }
  table { border-collapse: collapse; } th, td { border: 1px solid #e0dcd2; padding: 6px 12px; }
  th { background: #f3f1ea; } img { max-width: 100%; }
  hr { border: 0; border-top: 1px solid #e5e2db; margin: 2em 0; }`;

function mdWrap(body) {
  return `<!doctype html><html><head><meta charset="utf-8"><style>${MD_CSS}</style></head><body>${body}</body></html>`;
}

// Re-parse into the offscreen iframe (rebuilds the tree) and push to the
// preview window if it's open.
let lastRendered = "";
async function render() {
  if (isMarkdown() && window.marked) {             // keep inline preview current
    mdView.innerHTML = `<div class="md-body">${window.marked.parse(code.value, { breaks: true })}</div>`;
  }
  lastRendered = await renderedHTML();
  parser.srcdoc = lastRendered;
  pushPreview();
}

// ---------- Markdown section browser + inline preview ----------
// Toggle the left column between DOM/Styles (HTML) and the heading list (md).
function applyMode() {
  const md = isMarkdown();
  document.body.classList.toggle("is-markdown", md);
  document.body.classList.toggle("md-preview", md);        // Markdown opens in Preview
  setViewToggle(md);   // Markdown opens in Preview, so offer "show source"
}
// Icon-only Code/Preview toggle: icon + tooltip reflect what the click will do.
// Reflect the current view on the Code | Preview toggle (without firing change).
function setViewToggle(showingPreview) {
  $("view-toggle").value = showingPreview ? "preview" : "code";
}

// Switch views (Markdown only), keeping scroll position by syncing to the
// nearest preceding heading between the two views.
function setView(toPreview) {
  if (toPreview === inPreview()) return;
  const idx = toPreview ? currentCodeSectionIdx() : currentPreviewSectionIdx();
  document.body.classList.toggle("md-preview", toPreview);
  setViewToggle(toPreview);
  requestAnimationFrame(() => {
    if (toPreview) scrollPreviewToSection(idx);
    else if (idx >= 0 && mdHeadings[idx]) scrollCodeToLine(mdHeadings[idx].line);
    else { code.scrollTop = 0; syncScroll(); }
  });
}
$("view-toggle").addEventListener("change", (e) => setView(e.target.value === "preview"));
function inPreview() { return document.body.classList.contains("md-preview"); }

// Clicking a link in the rendered Markdown: in-page anchors scroll; relative
// paths open that file in this editor; external URLs are left alone.
mdView.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (!a) return;
  const href = a.getAttribute("href") || "";
  if (!href) return;
  e.preventDefault();
  if (href.startsWith("#")) {
    const t = mdView.querySelector("#" + CSS.escape(decodeURIComponent(href.slice(1))));
    if (t) mdView.scrollTo({ top: t.offsetTop, behavior: "smooth" });
    return;
  }
  if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith("//")) return;   // external scheme
  if (!currentPath || !invoke) return;
  const rel = decodeURIComponent(href.split("#")[0].split("?")[0]);
  loadPath(resolveRelative(currentPath, rel)).catch(() => {
    console.warn("can't open " + rel);
  });
});

// Resolve a relative href against the current file's absolute path.
function resolveRelative(base, rel) {
  if (rel.startsWith("/")) return rel;
  const dir = base.slice(0, base.lastIndexOf("/"));
  const out = [];
  for (const p of (dir + "/" + rel).split("/")) {
    if (p === "" || p === ".") continue;
    if (p === "..") out.pop();
    else out.push(p);
  }
  return "/" + out.join("/");
}

function previewHeadings() { return mdView.querySelectorAll("h1, h2, h3, h4, h5, h6"); }

// Index of the last heading at or above the code panel's current top.
function currentCodeSectionIdx() {
  const top = code.scrollTop;
  let topLine = 1;
  for (let i = 0; i < hl.children.length; i++) {
    if (hl.children[i].offsetTop >= top - 1) { topLine = i + 1; break; }
  }
  let idx = -1;
  for (let i = 0; i < mdHeadings.length && mdHeadings[i].line <= topLine; i++) idx = i;
  return idx;
}

// Index of the last rendered heading at or above the inline preview's top.
function currentPreviewSectionIdx() {
  const hs = previewHeadings();
  const top = mdView.scrollTop;
  let idx = -1;
  for (let i = 0; i < hs.length && hs[i].offsetTop <= top + 4; i++) idx = i;
  return idx;
}

// Scroll the inline preview to the idx-th heading (top-aligned).
function scrollPreviewToSection(idx) {
  const hs = previewHeadings();
  mdView.scrollTop = (idx >= 0 && hs[idx]) ? hs[idx].offsetTop : 0;
}

function scrollCodeToLine(line) {
  const row = hl.children[line - 1];
  if (row) code.scrollTop = row.offsetTop;
  syncScroll();
}

// Parse ATX headings (#…######) from the source, skipping fenced code blocks.
function buildSections() {
  const lines = code.value.split("\n");
  const items = [];
  let inFence = false;
  for (let i = 0; i < lines.length; i++) {
    if (/^\s*(```|~~~)/.test(lines[i])) { inFence = !inFence; continue; }
    if (inFence) continue;
    const m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(lines[i]);
    if (m) items.push({ level: m[1].length, text: m[2], line: i + 1 });
  }
  mdHeadings = items;
  if (!items.length) {
    sectionsEl.innerHTML = '<span class="empty" style="padding:8px 12px">No headings</span>';
    return;
  }
  sectionsEl.innerHTML = "";
  items.forEach((it, idx) => {
    const b = document.createElement("button");
    b.className = "sec lvl" + it.level;
    b.textContent = it.text;
    b.title = it.text;
    // In preview mode, scroll the rendered heading into view; otherwise jump to
    // the source line.
    b.addEventListener("click", () => inPreview() ? revealPreviewHeading(idx) : revealLine(it.line));
    sectionsEl.append(b);
  });
}

// Scroll the inline preview to its idx-th heading (same order as the source
// headings, since both come from the same Markdown).
function revealPreviewHeading(idx, behavior = "smooth") {
  const hs = previewHeadings();
  if (hs[idx]) mdView.scrollTo({ top: hs[idx].offsetTop, behavior });
}

// Scroll the code panel to a 1-based source line and select it.
function revealLine(line) {
  let start = 0;
  for (let i = 1; i < line; i++) start = code.value.indexOf("\n", start) + 1;
  const end = code.value.indexOf("\n", start);
  revealRange(start, (end < 0 ? code.value.length : end) - start);
}

// List the relative-path files linked from the Markdown source (inline links),
// deduped, .md files first then alphabetical. Clicking opens the file.
function buildLinks() {
  const seen = new Set(), items = [];
  for (const m of code.value.matchAll(/\[[^\]]*\]\(\s*<?([^)\s>]+)>?(?:\s+[^)]*)?\)/g)) {
    let target = m[1];
    if (/^[a-z][a-z0-9+.-]*:/i.test(target) || target.startsWith("#") || target.startsWith("//")) continue;
    target = target.split("#")[0].split("?")[0];
    if (!target || seen.has(target)) continue;
    seen.add(target);
    items.push(target);
  }
  const isMd = (t) => /\.(md|markdown)$/i.test(t);
  items.sort((a, b) => (isMd(b) - isMd(a)) || a.localeCompare(b));
  if (!items.length) {
    linksEl.innerHTML = '<span class="empty" style="padding:8px 12px">No links</span>';
    return;
  }
  linksEl.innerHTML = "";
  for (const t of items) {
    const b = document.createElement("button");
    b.className = "lnk";
    b.title = t;
    b.innerHTML = `<span class="mi">${isMd(t) ? "description" : "draft"}</span>${t.split("/").pop()}`;
    b.addEventListener("click", () => {
      if (currentPath) loadPath(resolveRelative(currentPath, t)).catch(() => { console.warn("can't open " + t); });
    });
    linksEl.append(b);
  }
}

// Build on load (after sync scripts) and again shortly after, to catch DOM
// that page scripts add asynchronously (DOMContentLoaded handlers, timers).
parser.addEventListener("load", () => { buildTree(); setTimeout(buildTree, 120); });

let nodeFor = new WeakMap();   // parser element -> its tree tag span
function buildTree() {
  nodeFor = new WeakMap();
  let doc;
  try { doc = parser.contentDocument; } catch { return; }
  if (!doc || !doc.body) { treeEl.innerHTML = '<div class="empty" style="padding:8px 12px">No DOM</div>'; return; }
  treeEl.innerHTML = "";
  treeEl.appendChild(renderNode(doc.body));
}

function renderNode(el) {
  const wrap = document.createElement("div");
  wrap.className = "node";

  const tag = document.createElement("span");
  tag.className = "tag";
  let label = `<span class="tname">${el.tagName.toLowerCase()}</span>`;
  if (el.id) label += `<span class="tid"> #${el.id}</span>`;
  if (el.classList.length) label += `<span class="tcls"> .${[...el.classList].join(".")}</span>`;
  tag.innerHTML = label;
  nodeFor.set(el, tag);
  tag.addEventListener("click", () => selectElement(el, tag));
  tag.addEventListener("mouseenter", () => { if (evt) evt.emit("ce:hover", elPath(el)); });
  tag.addEventListener("mouseleave", () => { if (evt) evt.emit("ce:hover", null); });
  wrap.appendChild(tag);

  const kids = [...el.children];
  if (kids.length) {
    const sub = document.createElement("div");
    sub.className = "twrap";
    for (const k of kids) sub.appendChild(renderNode(k));
    wrap.appendChild(sub);
  }
  return wrap;
}

// Child-index path from <body> — stable across the parser iframe and the
// preview window since both render identical HTML.
function elPath(el) {
  const doc = parser.contentDocument;
  const p = [];
  while (el && el !== doc.body) {
    p.push([...el.parentElement.children].indexOf(el));
    el = el.parentElement;
  }
  return p.reverse();
}

function selectElement(el, tagSpan) {
  treeEl.querySelectorAll(".tag.sel").forEach((t) => t.classList.remove("sel"));
  tagSpan.classList.add("sel");
  tagSpan.scrollIntoView({ block: "nearest" });
  showInspector(el);
  revealElementSource(el);                          // scroll code panel to its markup
  if (evt) evt.emit("ce:highlight", elPath(el));   // highlight in preview window
}

// Click in the preview window -> select the matching tree node here.
function resolveParser(path) {
  const doc = parser.contentDocument;
  if (!doc || !doc.body) return null;
  let el = doc.body;
  for (const i of path) { if (!el.children[i]) return null; el = el.children[i]; }
  return el;
}
if (evt) evt.listen("ce:select", (e) => {
  const el = resolveParser(e.payload || []);
  const tag = el && nodeFor.get(el);
  if (tag) selectElement(el, tag);
});

// ---------- soft wrap ----------
$("wrap-btn").addEventListener("click", () => {
  const on = document.body.classList.toggle("soft-wrap");
  $("wrap-btn").classList.toggle("active", on);
  code.setAttribute("wrap", on ? "soft" : "off");  // attribute overrides CSS
  paint();
});
window.addEventListener("resize", () => { if (document.body.classList.contains("soft-wrap")) paint(); });

// ---------- preview window ----------
let previewOpen = false;
$("preview-btn").addEventListener("click", () => { if (invoke) invoke("open_code_preview", { color: titleColor }); });
if (evt) {
  evt.listen("ce:ready", () => { previewOpen = true; pushPreview(); evt.emit("ce:color", titleColor); });
  evt.listen("ce:closed", () => { previewOpen = false; });
}
// Emit regardless of the tracked open state: if the editor reloaded while the
// preview stayed open, `previewOpen` is stale (no fresh ce:ready), so gating on
// it would silently stop updates. Emitting to no listener is harmless.
function pushPreview() {
  if (evt) evt.emit("ce:html", lastRendered);
}

function showInspector(el) {
  const doc = parser.contentDocument;
  let html = "";

  const chips = [];
  if (el.id) chips.push(`<span class="chip tint-dark clk" data-find="#${el.id}">#${el.id}</span>`);
  for (const c of el.classList) chips.push(`<span class="chip tint-dark clk" data-find=".${c}">.${c}</span>`);
  html += chips.length ? chips.join("") : `<span class="empty">No classes</span>`;

  // Matched CSS rules from the document's stylesheets.
  const matches = [];
  for (const sheet of doc.styleSheets) {
    let rules;
    try { rules = sheet.cssRules; } catch { continue; }
    for (const rule of rules) {
      if (rule.selectorText) {
        try { if (el.matches(rule.selectorText)) matches.push(rule); } catch {}
      }
    }
  }
  if (matches.length) {
    for (const rule of matches) {
      const decls = [...rule.style].map((p) => `${p}: ${rule.style.getPropertyValue(p)};`).join("\n");
      html += `<div class="rule"><div class="rsel clk" data-find="${esc(rule.selectorText)}">${esc(rule.selectorText)} {</div><div class="rdecl">${esc(decls)}</div><div class="rsel">}</div></div>`;
    }
  }
  inspector.innerHTML = html;
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>"); }

// ---------- scroll the code panel to source ----------
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// Scroll the textarea so [start, start+len) is centered, and select it. Uses the
// highlight layer's row offset so it's correct in soft-wrap mode too.
function revealRange(start, len) {
  code.focus();
  code.setSelectionRange(start, start + len);
  const line = code.value.slice(0, start).split("\n").length;
  const row = hl.children[line - 1];
  if (row) code.scrollTop = Math.max(0, row.offsetTop - code.clientHeight / 2 + row.offsetHeight / 2);
  syncScroll();
}

// Find an element's opening tag in the source: the Nth `<tag`, where N is the
// element's ordinal among same-tag elements (DOM order == source order).
function revealElementSource(el) {
  const tag = el.tagName.toLowerCase();
  const re = new RegExp("<" + escapeRe(tag) + "(?=[\\s/>])", "gi");
  const at = [];
  let m;
  while ((m = re.exec(code.value))) at.push(m.index);
  if (!at.length) return;

  // The element's opening tag text in source, for matching by id/class.
  const openTag = (idx) => {
    const gt = code.value.indexOf(">", idx);
    return code.value.slice(idx, gt < 0 ? idx + 300 : gt + 1);
  };

  const id = el.id;
  const cls = [...el.classList];
  // Does a source opening tag carry this element's id + every class?
  const matchesSig = (t) =>
    (!id || new RegExp("\\bid\\s*=\\s*['\"]?" + escapeRe(id) + "(['\"\\s>]|$)").test(t)) &&
    cls.every((c) => new RegExp("class\\s*=\\s*['\"][^'\"]*\\b" + escapeRe(c) + "\\b").test(t));

  // Source occurrences matching the element's id+classes (all of them if it has
  // neither). Among the DOM elements with the *same* signature, find this one's
  // position, then pick that occurrence — resolves duplicates to the right one.
  const cands = at.filter((i) => matchesSig(openTag(i)));
  const sameSig = (e) =>
    e.id === id && e.classList.length === cls.length && cls.every((c) => e.classList.contains(c));
  const peers = [...parser.contentDocument.getElementsByTagName(tag)].filter(sameSig);
  const ord = Math.max(0, peers.indexOf(el));

  const pool = cands.length ? cands : at;
  const pick = pool[Math.min(ord, pool.length - 1)];

  const gt = code.value.indexOf(">", pick);
  revealRange(pick, gt >= 0 ? gt - pick + 1 : tag.length + 1);
}

// Find a class/id token or full selector text in the source (e.g. an inline
// <style> block) and scroll to it.
function findInSource(token) {
  if (/^[.#]/.test(token)) {
    const m = new RegExp(escapeRe(token) + "(?![\\w-])").exec(code.value);
    if (m) revealRange(m.index, m[0].length);
  } else {
    const idx = code.value.indexOf(token);
    if (idx >= 0) revealRange(idx, token.length);
  }
}

inspector.addEventListener("click", (e) => {
  const t = e.target.closest("[data-find]");
  if (t) findInSource(t.dataset.find);
});

// Cmd+S to save.
// ---------- find (Cmd+F) ----------
const findBar = $("find-bar"), findInput = $("find-input"), findCount = $("find-count");
const findLayer = $("find-layer");
let findMatches = [], findIdx = -1;

// A DOM Range over columns [c0, c1) within a rendered #hl line, walking its
// token text nodes — so positions are exact (tabs, wrapping, any font).
function rowRange(row, c0, c1) {
  const r = document.createRange();
  const walk = document.createTreeWalker(row, NodeFilter.SHOW_TEXT);
  let acc = 0, set0 = false, n;
  while ((n = walk.nextNode())) {
    const len = n.textContent.length;
    if (!set0 && acc + len >= c0) { r.setStart(n, c0 - acc); set0 = true; }
    if (set0 && acc + len >= c1) { r.setEnd(n, c1 - acc); return r; }
    acc += len;
  }
  return null;
}

// Draw a highlight box over every match (current one emphasized), placed from
// the live text geometry of the #hl layer.
function renderFindMarks() {
  findLayer.innerHTML = "";
  if (findBar.hidden || !findMatches.length) return;
  const len = findInput.value.length, text = code.value;
  const base = findLayer.getBoundingClientRect();
  findMatches.forEach((start, i) => {
    const lineStart = text.lastIndexOf("\n", start - 1) + 1;
    const line = text.slice(0, start).split("\n").length;
    const row = hl.children[line - 1];
    if (!row) return;
    const r = rowRange(row, start - lineStart, start - lineStart + len);
    if (!r) return;
    const rect = r.getBoundingClientRect();
    if (!rect.width && !rect.height) return;
    const m = document.createElement("div");
    m.className = "find-mark" + (i === findIdx ? " cur" : "");
    m.style.top = (rect.top - base.top) + "px";
    m.style.left = (rect.left - base.left) + "px";
    m.style.width = rect.width + "px";
    m.style.height = rect.height + "px";
    findLayer.append(m);
  });
}

function openFind() {
  if (inPreview()) {                 // find operates on the source; leave preview
    document.body.classList.remove("md-preview");
    setViewToggle(false);
  }
  findBar.hidden = false;
  const sel = code.value.slice(code.selectionStart, code.selectionEnd);
  if (sel && !sel.includes("\n")) findInput.value = sel;
  findInput.focus();
  findInput.select();
  runFind(code.selectionStart);
}
function closeFind() { findBar.hidden = true; renderFindMarks(); code.focus(); }

// Recompute matches for the current query; select the one at/after `from`.
function runFind(from = 0) {
  const q = findInput.value;
  findMatches = [];
  if (q) {
    const t = code.value.toLowerCase(), s = q.toLowerCase();
    for (let i = t.indexOf(s); i !== -1; i = t.indexOf(s, i + Math.max(1, s.length))) findMatches.push(i);
  }
  if (!findMatches.length) { findIdx = -1; findCount.textContent = q ? "0/0" : ""; renderFindMarks(); return; }
  findIdx = findMatches.findIndex((i) => i >= from);
  if (findIdx < 0) findIdx = 0;
  gotoMatch();
}
function stepFind(dir) {
  if (!findMatches.length) return;
  findIdx = (findIdx + dir + findMatches.length) % findMatches.length;
  gotoMatch();
}
function gotoMatch() {
  const start = findMatches[findIdx], len = findInput.value.length;
  code.setSelectionRange(start, start + len);   // shown as a (gray) selection while the bar holds focus
  const line = code.value.slice(0, start).split("\n").length;
  const row = hl.children[line - 1];
  if (row) code.scrollTop = Math.max(0, row.offsetTop - code.clientHeight / 2 + row.offsetHeight / 2);
  syncScroll();
  renderFindMarks();
  findCount.textContent = `${findIdx + 1}/${findMatches.length}`;
}

findInput.addEventListener("input", () => runFind(code.selectionStart));
findInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); }
  else if (e.key === "Escape") { e.preventDefault(); closeFind(); }
});
$("find-next").addEventListener("click", () => stepFind(1));
$("find-prev").addEventListener("click", () => stepFind(-1));
$("find-close").addEventListener("click", closeFind);

window.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); saveFile(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === "f") { e.preventDefault(); openFind(); return; }
  // Undo / redo via our own stack (Cmd+Z, Cmd+Shift+Z or Cmd+Y).
  if ((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z")) {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "y") { e.preventDefault(); redo(); return; }
});

// Restore the previous session (file + unsaved text) if there is one, so a
// window reload doesn't lose the open file. Falls back to empty otherwise.
(function restore() {
  let s;
  try { s = JSON.parse(localStorage.getItem("ce:session") || "null"); } catch {}
  if (s && s.path) {
    currentPath = s.path;
    code.value = s.value || "";
    filenameEl.textContent = "‎" + currentPath.split("/").pop();
    filenameEl.title = currentPath;
    setDirty(!!s.dirty);
    history = [s.path]; histIdx = 0; updateNav();   // seed nav history
    if (invoke) invoke("read_text_file", { path: s.path }).then((t) => { diskText = t; }).catch(() => {});
    applyMode();
    applyTitleColor();
    render();
    paint();
    refreshDiff();
    seedUndo();
    if (typeof s.selStart === "number") {
      code.setSelectionRange(s.selStart, s.selEnd ?? s.selStart);
    }
    if (typeof s.scrollTop === "number") {
      requestAnimationFrame(() => { code.scrollTop = s.scrollTop; syncScroll(); });
    }
  } else {
    paint();
  }
})();

// If this window was launched to open a specific file (Git window → "Studio
// Code Editor"), load it, overriding any restored session.
if (invoke) invoke("take_pending_open").then((p) => { if (p) loadPath(p); });

import("../devinspect.js").then((m) => m.initDevInspect()).catch(() => {});
</script>
</body>
</html>
