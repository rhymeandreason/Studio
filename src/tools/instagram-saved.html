<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Saved</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../kit/kit.css" />
  <link rel="stylesheet" href="../kit/window-chrome.css" />
  <script type="module" src="../kit/components.js"></script>
  <script type="module" src="../kit/window-chrome.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100vh; }
    body {
      font-family: var(--sans);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- window bar: title only (window-chrome drops it when embedded) ---- */
    #bar {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--hairline);
    }
    #bar .brand {
      display: flex; align-items: center; gap: 7px;
      font-weight: 600; font-size: 15px; margin-right: auto;
    }
    #bar .brand .mi { color: var(--accent); }

    /* ---- everything below the bar is opaque (rounded-corner quirk) ---- */
    #main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; background: var(--bg); }

    #filters {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 10px 14px;
      border-bottom: 1px solid var(--hairline);
    }
    #filters .field { width: 200px; margin-left: auto; }
    .chip .count { opacity: .6; }
    #status { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

    /* Flex-wrap with pixel-sized tiles, not CSS grid: WKWebView sized the grid
       rows to ~18px whatever the card's aspect-ratio / padding / image said,
       stacking every card over the next. `--tile` is set by a ResizeObserver
       (see fitTiles) from the available width; nothing here is intrinsic. */
    #grid {
      flex: 1 1 auto; overflow-y: auto;
      padding: 14px;
      display: flex; flex-wrap: wrap; align-content: flex-start;
      gap: 10px;
      --tile: 168px;
    }
    .post {
      position: relative;
      flex: 0 0 auto;
      width: var(--tile);
      height: calc(var(--tile) * 1.25);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      cursor: pointer;
      border: 1px solid var(--hairline);
    }
    .post img, .post .no-thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .post .badge {
      position: absolute; top: 8px; right: 8px;
      color: #fff; font-size: 18px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
    }
    .post .meta {
      position: absolute; inset: auto 0 0 0;
      padding: 22px 10px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,.65));
      color: #fff; font-size: 11px; line-height: 1.35;
      opacity: 0; transition: opacity var(--dur-fast);
    }
    .post:hover .meta { opacity: 1; }
    .post .meta b { display: block; font-weight: 600; }
    .post .meta span {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .post .actions {
      position: absolute; top: 8px; left: 8px; display: flex; gap: 4px;
      opacity: 0; transition: opacity var(--dur-fast);
    }
    .post:hover .actions { opacity: 1; }
    .post .actions .btn-icon-s:hover { background: var(--elevated); color: var(--rose); }
    .post .no-thumb {
      display: flex; align-items: center; justify-content: center;
      color: var(--text-soft); font-size: 32px;
    }

    /* ---- empty / sign-in state ---- */
    #empty {
      flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 40px;
    }
    #empty .card { max-width: 380px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    #empty .mi { font-size: 40px; color: var(--accent); }
    #empty p { margin: 0; }

    /* ---- viewer modal ---- */
    #viewer {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(20, 18, 14, .78);
      display: flex; align-items: center; justify-content: center;
      padding: 28px;
    }
    #viewer .frame {
      position: relative;
      display: flex; flex-direction: column;
      max-width: min(920px, 100%); max-height: 100%;
      background: var(--elevated); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md); overflow: hidden;
    }
    #viewer .stage {
      position: relative; background: #000;
      display: flex; align-items: center; justify-content: center;
      min-height: 200px;
    }
    #viewer .stage img {
      display: block; max-width: 100%; max-height: calc(100vh - 56px - 160px);
      object-fit: contain; transition: filter .2s;
    }
    #viewer .stage img.low { filter: blur(0px); }
    #viewer .nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.85); border: none; border-radius: 50%;
      width: 34px; height: 34px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; color: var(--text);
    }
    #viewer .nav.prev { left: 10px; } #viewer .nav.next { right: 10px; }
    #viewer .dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
    #viewer .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); }
    #viewer .dots i.on { background: #fff; }
    #viewer .info {
      display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px;
      border-top: 1px solid var(--hairline);
    }
    #viewer .info .text { flex: 1; min-width: 0; font-size: 12px; line-height: 1.4; }
    #viewer .info .text b { display: block; }
    #viewer a.handle { color: var(--accent); cursor: pointer; }
    #viewer a.handle:hover { text-decoration: underline; }
    #viewer .info .text b a.handle { color: inherit; }
    #viewer .info .text span {
      /* Full caption, keeping its line breaks; long ones scroll in place. */
      display: block; white-space: pre-wrap; overflow-wrap: anywhere;
      max-height: 7em; overflow-y: auto;
      color: var(--text-muted);
    }
    #viewer .info .btns { display: flex; gap: 6px; flex: 0 0 auto; }
    #viewer .close { position: absolute; top: 10px; right: 10px; z-index: 1; }

    /* ---- pull progress ---- */
    #progress {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-top: 1px solid var(--hairline);
      font-size: 12px; color: var(--text-muted);
    }
    #progress .track { flex: 1; height: 3px; border-radius: 2px; background: var(--hairline); overflow: hidden; }
    #progress .fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    #progress .fill.indeterminate { width: 30%; animation: slide 1.1s ease-in-out infinite alternate; }
    @keyframes slide { from { margin-left: 0 } to { margin-left: 70% } }
  </style>
</head>

<body>
  <div id="bar" data-window-bar>
    <div class="brand" data-window-close><span class="mi ph ph-bookmark-simple"></span> Instagram Saved</div>
    <label class="text-xs text-muted" style="display:flex;align-items:center;gap:6px" title="Run batches back to back until everything is pulled">
      <studio-toggle id="auto-toggle"></studio-toggle> Keep going
    </label>
    <button class="btn btn-primary" id="btn-pull-recent" title="Fetch just your newest saves (up to 50); skips the full library and collections"><span class="mi mi-sm ph ph-clock-counter-clockwise"></span> Pull recent</button>
    <button class="btn" id="btn-pull"><span class="mi mi-sm ph ph-arrows-clockwise"></span> Pull next 100</button>
    <button class="btn" id="btn-stop" hidden>Stop</button>
    <button class="btn" id="btn-instagram" title="Open Instagram (sign in / sign out here)">
      <span class="mi mi-sm ph ph-arrow-square-out"></span> Instagram
    </button>
  </div>

  <div id="main">
    <div id="filters" hidden>
      <button class="chip is-active" data-col="">All</button>
      <span id="chips"></span>
      <span id="status"></span>
      <input class="field" id="search" type="search" placeholder="Search captions, users" />
    </div>
    <div id="empty" hidden>
      <div class="card">
        <span class="mi ph ph-bookmark-simple"></span>
        <p class="text-body" id="empty-text">Sign in to Instagram to pull your saved posts.</p>
        <p class="text-xs text-muted" id="empty-sub">Your session stays inside Studio's own web view — nothing is sent anywhere else.</p>
        <button class="btn btn-primary" id="btn-empty-action">Sign in</button>
      </div>
    </div>
    <div id="grid" hidden></div>
    <div id="viewer" hidden>
      <div class="frame">
        <button class="btn btn-icon-s close" id="v-close" title="Close (Esc)"><span class="mi mi-sm ph ph-x"></span></button>
        <div class="stage">
          <img id="v-img" alt="" />
          <button class="nav prev" id="v-prev" hidden><span class="mi ph ph-caret-left"></span></button>
          <button class="nav next" id="v-next" hidden><span class="mi ph ph-caret-right"></span></button>
          <div class="dots" id="v-dots"></div>
        </div>
        <div class="info">
          <div class="text"><b id="v-user"></b><span id="v-caption"></span></div>
          <div class="btns">
            <button class="btn" id="v-save" title="Save full-size to the active project's media/instagram"><span class="mi mi-sm ph ph-download-simple"></span> Save</button>
            <button class="btn" id="v-delete" title="Delete from this grid (stays saved on Instagram) · Delete key"><span class="mi mi-sm ph ph-trash"></span> Delete</button>
            <button class="btn" id="v-open"><span class="mi mi-sm ph ph-arrow-square-out"></span> Instagram</button>
          </div>
        </div>
      </div>
    </div>
    <div id="progress" hidden>
      <span id="progress-note">Pulling…</span>
      <div class="track"><div class="fill" id="progress-fill"></div></div>
      <span id="progress-count"></span>
    </div>
  </div>

  <script type="module">
    import { hasTauri, invoke, listen, esc, toast } from '../kit/app.js';

    const $ = (id) => document.getElementById(id);
    const grid = $('grid'), empty = $('empty'), filters = $('filters'), progress = $('progress');
    const convert = hasTauri ? window.__TAURI__.core.convertFileSrc : (p) => p;

    let doc = { items: [], collections: [] };
    let session = { logged_in: false, login_window_open: false };
    let activeCollection = '';
    let query = '';
    let pulling = false;
    let project = null;
    let lastError = '';
    let autoContinue = localStorage.getItem('ig-auto-continue') === '1';

    // ---- state → view -------------------------------------------------------
    function render() {
      const has = doc.items.length > 0;
      filters.hidden = !has;
      grid.hidden = !has;
      empty.hidden = has;
      const done = doc.cursor?.phase === 'done';
      const bp = $('btn-pull');
      if (bp) {
        bp.disabled = pulling || !session.logged_in;
        bp.innerHTML = `<span class="mi mi-sm ph ph-arrows-clockwise"></span> ${pulling ? 'Pulling…' : !doc.cursor ? 'Pull saved posts' : done ? 'Pull new' : `Pull next ${BATCH}`}`;
      }
      if ($('btn-stop')) $('btn-stop').hidden = !pulling;
      if ($('btn-pull-recent')) $('btn-pull-recent').disabled = pulling || !session.logged_in;

      if (!has) {
        const text = $('empty-text'), sub = $('empty-sub'), btn = $('btn-empty-action');
        if (!session.logged_in) {
          text.textContent = 'Sign in to Instagram to pull your saved posts.';
          sub.textContent = session.login_window_open
            ? 'Waiting for you to finish signing in in the Instagram window…'
            : "Your session stays inside Studio's own web view — nothing is sent anywhere else.";
          btn.textContent = 'Sign in';
          btn.onclick = openLogin;
        } else {
          text.textContent = 'Signed in. Pull your saved posts to build the library.';
          sub.textContent = `Fetches ${BATCH} posts per run and saves as it goes, so you can pull in sittings; turn on "Keep going" to run to the end.`;
          btn.textContent = 'Pull saved posts';
          btn.onclick = () => pull(true);
        }
        if (lastError) { sub.textContent = lastError; sub.style.color = 'var(--rose)'; }
        else sub.style.color = '';
        btn.disabled = pulling;
        return;
      }

      // collection chips
      $('chips').innerHTML = doc.collections
        .map((c) => `<button class="chip${activeCollection === c.name ? ' is-active' : ''}" data-col="${esc(c.name)}">${esc(c.name)} <span class="count">${c.count}</span></button>`)
        .join('');
      filters.querySelector('[data-col=""]').classList.toggle('is-active', activeCollection === '');

      const q = query.trim().toLowerCase();
      const kept = doc.items.filter((it) => !it.deleted);
      const shown = kept.filter((it) =>
        (!activeCollection || it.collections.includes(activeCollection)) &&
        (!q || it.caption.toLowerCase().includes(q) || it.username.toLowerCase().includes(q)));

      const when = doc.pulled_at ? new Date(doc.pulled_at * 1000).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
      const cur = doc.cursor;
      const stage = !cur || cur.phase === 'done' ? (when ? `up to date ${when}` : '')
        : cur.phase === 'posts' ? 'more to pull' : `collections ${cur.col_index}/${doc.collections.length}`;
      $('status').textContent = `${shown.length}${shown.length !== kept.length ? ` of ${kept.length}` : ''} posts${stage ? ` · ${stage}` : ''}`;

      grid.innerHTML = shown.map(card).join('');
    }

    function card(it) {
      const badge = it.media_type === 8 ? 'copy-simple' : it.media_type === 2 ? 'play-circle' : '';
      const thumb = it.thumb
        ? `<img loading="lazy" src="${esc(convert(it.thumb))}" alt="" />`
        : `<div class="no-thumb"><span class="mi ph ph-image"></span></div>`;
      return `<div class="post" data-id="${esc(it.id)}">
        ${thumb}
        ${badge ? `<span class="mi badge ph ph-${badge}"></span>` : ''}
        <div class="actions">
          <button class="btn btn-icon-s" data-act="delete" title="Delete from this grid (stays saved on Instagram)"><span class="mi mi-sm ph ph-trash"></span></button>
        </div>
        <div class="meta"><b>@${esc(it.username)}</b><span>${esc(it.caption)}</span></div>
      </div>`;
    }

    // ---- Instagram client (all endpoint knowledge lives here, not in Rust) ---
    // These are the same /api/v1 calls instagram.com's own JS makes; Rust just
    // attaches the session cookies (`instagram_fetch`) and writes files
    // (`instagram_download`). Change endpoints/parsing here and reload.
    const PAGE_DELAY = 450;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    async function igJson(path) {
      const body = await invoke('instagram_fetch', { path });
      try { return JSON.parse(body); }
      catch {
        const head = body.trim().slice(0, 160);
        if (/<html|<!doctype/i.test(head)) throw new Error(`Instagram returned a page instead of JSON for ${path} — sign in again, or wait if you were rate-limited.`);
        throw new Error(`bad JSON from ${path}: ${head}`);
      }
    }

    // Smallest candidate ≥ 480px wide (thumb) and the largest (full).
    function imageCandidates(media) {
      const cands = media?.image_versions2?.candidates || [];
      let thumb = null, large = null;
      for (const c of cands) {
        if (!c.url) continue;
        if (!large || c.width > large.width) large = c;
        if (c.width >= 480 && (!thumb || c.width < thumb.width)) thumb = c;
      }
      return { thumb: (thumb || large)?.url || '', large: large?.url || '' };
    }

    function parseMedia(m) {
      if (!m?.pk || !m?.code) return null;
      const carousel = m.carousel_media || [];
      const imgs = m.media_type === 8 ? imageCandidates(carousel[0]) : imageCandidates(m);
      return {
        id: String(m.pk), code: m.code, url: `https://www.instagram.com/p/${m.code}/`,
        taken_at: m.taken_at || 0, media_type: m.media_type || 1,
        caption: m.caption?.text || '', username: m.user?.username || '', user_pic: m.user?.profile_pic_url || '',
        thumb: '', thumb_url: imgs.thumb, image_url: imgs.large,
        video_url: m.video_versions?.[0]?.url || null,
        carousel_count: carousel.length, like_count: m.like_count || 0, collections: [],
      };
    }

    const mediaInPage = (page) => (page.items || []).map((it) => it.media || it);

    // Page a saved-style feed. `known` short-circuits an incremental pull: stop
    // once a whole page is already in the store (feeds are newest-saved first).
    async function pageFeed(base, known, onPage) {
      const out = [];
      let maxId = '';
      for (;;) {
        const sep = base.includes('?') ? '&' : '?';
        const page = await igJson(maxId ? `${base}${sep}max_id=${encodeURIComponent(maxId)}` : base);
        const medias = mediaInPage(page);
        let allKnown = medias.length > 0;
        for (const m of medias) {
          const it = parseMedia(m);
          if (!it) continue;
          if (!known || !known.has(it.id)) allKnown = false;
          out.push(it);
        }
        onPage?.(out.length);
        if (!page.more_available || !page.next_max_id || (known && allKnown)) break;
        maxId = page.next_max_id;
        await sleep(PAGE_DELAY);
      }
      return out;
    }

    // Resumable pull. The store keeps a cursor so each run fetches the next
    // BATCH posts and stops; the grid fills in as it goes and a restart
    // loses nothing. Phases: posts (flat saved feed) → collections (each
    // walked in turn) → done. Saves after every page.
    const BATCH = 100;
    let stopRequested = false;

    function saveDoc() { return invoke('save_store', { name: 'instagram-saved', data: JSON.stringify(doc) }); }

    // Fetch thumbnails for items that don't have one yet (only the given ids).
    async function cacheThumbs(ids) {
      const dir = await invoke('instagram_cache_dir');
      const byId = new Map(doc.items.map((i) => [i.id, i]));
      const todo = ids.map((id) => byId.get(id)).filter((it) => it && !it.thumb && it.thumb_url);
      for (const [i, it] of todo.entries()) {
        const dest = `${dir}/${it.id}.jpg`;
        try { await invoke('instagram_download', { url: it.thumb_url, dest }); it.thumb = dest; }
        catch { /* placeholder in the grid */ }
        if (i % 5 === 4 || i + 1 === todo.length) {
          setProgress({ done: i + 1, total: todo.length, note: 'Caching thumbnails' });
          render();
        }
        if (i % 10 === 9) await sleep(120);
      }
    }

    async function fetchPage(base, maxId) {
      const sep = base.includes('?') ? '&' : '?';
      return igJson(maxId ? `${base}${sep}max_id=${encodeURIComponent(maxId)}` : base);
    }

    // One batch: up to BATCH new posts (or collection members), then stop.
    // `full` restarts the walk from the top (removed saves drop out at the end).
    async function pullBatch(full) {
      // "Pull new" after a finished walk: start from the top again but stop
      // as soon as a whole page is already known (feed is newest-saved first).
      const incremental = !full && doc.cursor?.phase === 'done';
      if (full || incremental || !doc.cursor) {
        doc.cursor = { phase: 'posts', max_id: '', col_index: 0, col_max_id: '', seen: [], incremental };
        doc.collections = [];
      }
      const cur = doc.cursor;
      const byId = new Map(doc.items.map((i) => [i.id, i]));
      const batchIds = [];

      if (cur.phase === 'posts') {
        setProgress({ done: 0, total: 0, note: 'Fetching saved posts' });
        while (batchIds.length < BATCH && !stopRequested) {
          const page = await fetchPage('/api/v1/feed/saved/posts/', cur.max_id);
          let allKnown = true;
          for (const m of mediaInPage(page)) {
            const it = parseMedia(m);
            if (!it) continue;
            cur.seen.push(it.id);
            const prev = byId.get(it.id);
            if (!prev) allKnown = false;
            if (prev) { Object.assign(prev, { ...it, thumb: prev.thumb, collections: prev.collections }); }
            else { doc.items.push(it); byId.set(it.id, it); }
            batchIds.push(it.id);
          }
          const pos = new Map(cur.seen.map((id, i) => [id, i]));
          doc.items.sort((a, b) => (pos.get(a.id) ?? 1e9) - (pos.get(b.id) ?? 1e9));
          setProgress({ done: doc.items.length, total: 0, note: 'Fetching saved posts' });
          render();
          const more = page.more_available && page.next_max_id;
          if (more && !(cur.incremental && allKnown)) { cur.max_id = page.next_max_id; }
          else {
            if (!more) {
              // Full walk finished: anything not seen this walk is no longer saved.
              const seen = new Set(cur.seen);
              doc.items = doc.items.filter((i) => seen.has(i.id));
            }
            for (const i of doc.items) i.collections = [];
            cur.phase = 'collections'; cur.col_index = 0; cur.col_max_id = '';
            break;
          }
          await saveDoc();
          await sleep(PAGE_DELAY);
        }
        await saveDoc();
        await cacheThumbs(batchIds);
        await saveDoc();
        if (batchIds.length >= BATCH || stopRequested) return;
      }

      if (cur.phase === 'collections') {
        if (!doc.collections.length) {
          const list = await igJson('/api/v1/feed/collections/list/?collection_types=%5B%22MEDIA%22%5D&include_public_only=0&get_cover_media_lists=false');
          doc.collections = (list.items || [])
            .filter((c) => c.collection_id && c.collection_name)
            .map((c) => ({ id: String(c.collection_id), name: c.collection_name, count: 0 }));
          await saveDoc();
        }
        let n = 0;
        while (cur.col_index < doc.collections.length && n < BATCH && !stopRequested) {
          const col = doc.collections[cur.col_index];
          setProgress({ done: cur.col_index + 1, total: doc.collections.length, note: `Collection ${cur.col_index + 1}/${doc.collections.length}: ${col.name}` });
          const page = await fetchPage(`/api/v1/feed/collection/${col.id}/posts/`, cur.col_max_id);
          for (const m of mediaInPage(page)) {
            const it = parseMedia(m);
            if (!it) continue;
            let entry = byId.get(it.id);
            if (!entry) { doc.items.push(it); byId.set(it.id, it); entry = it; batchIds.push(it.id); }
            if (!entry.collections.includes(col.name)) { entry.collections.push(col.name); col.count++; }
            n++;
          }
          if (page.more_available && page.next_max_id) { cur.col_max_id = page.next_max_id; }
          else { cur.col_index++; cur.col_max_id = ''; }
          await saveDoc();
          render();
          await sleep(PAGE_DELAY);
        }
        await cacheThumbs(batchIds);
        if (cur.col_index >= doc.collections.length) {
          cur.phase = 'done';
          doc.pulled_at = Math.floor(Date.now() / 1000);
        }
        await saveDoc();
      }
    }

    // Quick pull: just the newest saves from the top of the feed. Leaves the
    // resumable cursor and collections alone; stops at RECENT posts or at the
    // first page that's all already known.
    const RECENT = 50;
    async function pullRecent() {
      const byId = new Map(doc.items.map((i) => [i.id, i]));
      const top = [];
      let maxId = '';
      setProgress({ done: 0, total: 0, note: 'Fetching recent saves' });
      while (top.length < RECENT && !stopRequested) {
        const page = await fetchPage('/api/v1/feed/saved/posts/', maxId);
        let allKnown = true;
        for (const m of mediaInPage(page)) {
          const it = parseMedia(m);
          if (!it) continue;
          const prev = byId.get(it.id);
          if (prev) Object.assign(prev, { ...it, thumb: prev.thumb, collections: prev.collections });
          else { allKnown = false; doc.items.push(it); byId.set(it.id, it); }
          top.push(it.id);
        }
        // Newest saves first, everything else keeps its order.
        const pos = new Map(top.map((id, i) => [id, i]));
        doc.items.sort((a, b) => (pos.get(a.id) ?? 1e9) - (pos.get(b.id) ?? 1e9));
        setProgress({ done: top.length, total: 0, note: 'Fetching recent saves' });
        render();
        if (allKnown || !page.more_available || !page.next_max_id) break;
        maxId = page.next_max_id;
        await sleep(PAGE_DELAY);
      }
      // A full walk in progress orders the grid by (and, when it finishes,
      // keeps only) the ids it has seen. Saves newer than its start sit above
      // where it began, so it would never see them: count them as seen, first.
      const cur = doc.cursor;
      if (cur?.phase === 'posts') {
        const seen = new Set(cur.seen);
        cur.seen = [...top.filter((id) => !seen.has(id)), ...cur.seen];
      }
      await saveDoc();
      await cacheThumbs(top);
      await saveDoc();
    }

    // ---- actions --------------------------------------------------------------
    async function openLogin() {
      try { await invoke('instagram_open_login'); }
      catch (e) { toast(`Couldn't open Instagram: ${e}`, 5000); console.error(e); return; }
      session.login_window_open = true;
      render();
      watchLogin();
    }

    // While the login window is open, poll the cookie jar until a session appears.
    let loginTimer = null;
    function watchLogin() {
      clearInterval(loginTimer);
      loginTimer = setInterval(async () => {
        await refreshSession();
        if (session.logged_in) {
          clearInterval(loginTimer);
          await invoke('instagram_close_login');
          session.login_window_open = false;
          toast('Signed in to Instagram');
          render();
          if (!doc.items.length) pull(true);
        } else if (!session.login_window_open) {
          clearInterval(loginTimer);
          render();
        }
      }, 1500);
    }

    async function refreshSession() {
      if (!hasTauri) return;
      try { session = await invoke('instagram_session'); }
      catch (e) { session = { logged_in: false, login_window_open: false }; }
    }

    async function pull(full, recent) {
      if (pulling) return;
      pulling = true; stopRequested = false;
      progress.hidden = false;
      lastError = '';
      render();
      try {
        if (recent) { const n = doc.items.length; await pullRecent(); toast(`${doc.items.length - n} new saved posts`); }
        else {
          do { await pullBatch(full); full = false; }
          while (autoContinue && !stopRequested && doc.cursor?.phase !== 'done');
          if (doc.cursor?.phase === 'done') toast(`Up to date · ${doc.items.length} saved posts`);
        }
      } catch (e) {
        lastError = `Pull failed: ${e.message || e}`;
        console.error(e);
        toast(lastError, 6000);
        if (/sign in/i.test(lastError)) { session.logged_in = false; }
      } finally {
        pulling = false; stopRequested = false;
        progress.hidden = true;
        render();
      }
    }

    function setProgress({ phase, done, total, note }) {
      $('progress-note').textContent = note;
      const fill = $('progress-fill');
      phase ??= '';
      if (total > 0) {
        fill.classList.remove('indeterminate');
        fill.style.width = `${Math.round((done / total) * 100)}%`;
        $('progress-count').textContent = `${done} / ${total}`;
      } else {
        fill.classList.add('indeterminate');
        $('progress-count').textContent = phase === 'posts' ? `${done} posts` : '';
      }
    }

    // Full-size image(s)/video into the project's media/instagram/. Re-resolves
    // the post first since cached CDN URLs expire.
    async function saveMedia(id) {
      if (!project) return toast('Activate a project first');
      toast('Saving…');
      try {
        const info = await igJson(`/api/v1/media/${id}/info/`);
        const media = mediaInPage(info)[0];
        if (!media) throw new Error('Instagram returned no media for that post');
        const children = media.carousel_media || [media];
        let n = 0;
        for (const [i, child] of children.entries()) {
          const suffix = children.length > 1 ? `-${i + 1}` : '';
          const video = child.video_versions?.[0]?.url;
          const url = video || imageCandidates(child).large;
          if (!url) continue;
          await invoke('instagram_download', { url, dest: `${project.path}/media/instagram/${media.code}${suffix}.${video ? 'mp4' : 'jpg'}` });
          n++;
        }
        toast(`Saved ${n} file${n === 1 ? '' : 's'} to media/instagram`);
      } catch (e) { toast(String(e.message || e), 5000); }
    }

    // ---- viewer ----------------------------------------------------------------
    // Opens on the cached thumb immediately, then swaps in the full-size image:
    // cached under <cache>/<id>-full[-n].jpg. If the stored CDN URL has expired
    // the post is re-resolved via /media/<id>/info/, which also yields carousel
    // children (the store only keeps the first frame's URLs).
    const viewer = $('viewer');
    let vItem = null, vFrames = [], vIndex = 0, vGen = 0;

    async function resolveFrames(it) {
      // [{ url }] per frame — one for photos/videos, N for carousels.
      try {
        const info = await igJson(`/api/v1/media/${it.id}/info/`);
        const media = mediaInPage(info)[0];
        const children = media?.carousel_media || (media ? [media] : []);
        const frames = children.map((c) => ({ url: imageCandidates(c).large })).filter((f) => f.url);
        if (frames.length) return frames;
      } catch (e) { console.warn('info failed, using stored url', e); }
      return it.image_url ? [{ url: it.image_url }] : [];
    }

    async function showFrame() {
      const gen = vGen;
      const img = $('v-img');
      const frame = vFrames[vIndex];
      $('v-prev').hidden = $('v-next').hidden = vFrames.length < 2;
      $('v-dots').innerHTML = vFrames.length > 1 ? vFrames.map((_, i) => `<i class="${i === vIndex ? 'on' : ''}"></i>`).join('') : '';
      if (frame?.local) { img.src = convert(frame.local); return; }
      // Interim: the cached thumb for frame 0, nothing for other frames.
      img.src = vIndex === 0 && vItem.thumb ? convert(vItem.thumb) : '';
      if (!frame?.url) return;
      const dir = await invoke('instagram_cache_dir');
      const dest = `${dir}/${vItem.id}-full${vFrames.length > 1 ? `-${vIndex + 1}` : ''}.jpg`;
      try {
        await invoke('instagram_download', { url: frame.url, dest });
        frame.local = dest;
        if (gen === vGen) img.src = convert(dest) + `?${Date.now()}`;
      } catch (e) { console.warn('full-size fetch failed', e); }
    }

    // @handles → profile links (opened in the default browser on click).
    const linkHandles = (text) => esc(text).replace(/(^|[^\w.@])@([A-Za-z0-9._]*[A-Za-z0-9_])/g,
      (_, pre, h) => `${pre}<a class="handle" data-handle="${h}">@${h}</a>`);

    async function openViewer(it) {
      vItem = it; vIndex = 0; vFrames = []; const gen = ++vGen;
      $('v-user').innerHTML = linkHandles(`@${it.username}`);
      $('v-caption').innerHTML = linkHandles(it.caption);
      $('v-save').disabled = !project;
      viewer.hidden = false;
      $('v-img').src = it.thumb ? convert(it.thumb) : '';
      const frames = await resolveFrames(it);
      if (gen !== vGen) return;
      vFrames = frames;
      showFrame();
    }
    // Local-only delete: the post stays in the store flagged `deleted` (pulls
    // keep the flag, so it never comes back) and just drops out of the grid.
    function deletePost(it) {
      it.deleted = true;
      if (vItem === it) closeViewer();
      saveDoc();
      render();
      toast('Deleted from grid');
    }

    function closeViewer() { viewer.hidden = true; vItem = null; vGen++; }
    function stepFrame(d) {
      if (vFrames.length < 2) return;
      vIndex = (vIndex + d + vFrames.length) % vFrames.length;
      showFrame();
    }
    viewer.addEventListener('click', (e) => { if (e.target === viewer) closeViewer(); });
    $('v-close').onclick = closeViewer;
    $('v-prev').onclick = () => stepFrame(-1);
    $('v-next').onclick = () => stepFrame(1);
    // `open` on a URL → default browser; tool-* windows aren't granted opener:allow-open-url.
    $('v-open').onclick = () => vItem && invoke('open_path', { path: vItem.url });
    $('viewer').addEventListener('click', (e) => {
      const a = e.target.closest('a.handle');
      if (a) invoke('open_path', { path: `https://www.instagram.com/${a.dataset.handle}/` });
    });
    $('v-delete').onclick = () => vItem && deletePost(vItem);
    $('v-save').onclick = () => vItem && saveMedia(vItem.id);
    document.addEventListener('keydown', (e) => {
      if (viewer.hidden) return;
      if (e.key === 'Escape') closeViewer();
      else if (e.key === 'Delete' || e.key === 'Backspace') vItem && deletePost(vItem);
      else if (e.key === 'ArrowLeft') stepFrame(-1);
      else if (e.key === 'ArrowRight') stepFrame(1);
    });

    // Tile width from the available width: as many ≥168px columns as fit.
    function fitTiles() {
      const w = grid.clientWidth - 28; // padding
      const cols = Math.max(2, Math.floor((w + 10) / (168 + 10)));
      grid.style.setProperty('--tile', `${Math.floor((w - (cols - 1) * 10) / cols)}px`);
    }
    new ResizeObserver(fitTiles).observe(grid);

    // ---- wiring ----------------------------------------------------------------
    // Bar buttons are absent when embedded (window-chrome.js drops the bar).
    const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    on('btn-instagram', openLogin);
    on('btn-pull', () => pull(doc.cursor?.phase === 'done'));
    on('btn-pull-recent', () => pull(false, true));
    on('btn-stop', () => { stopRequested = true; toast('Stopping after this page'); });
    customElements.whenDefined('studio-toggle').then(() => {
      const tg = $('auto-toggle');
      if (!tg) return;
      tg.checked = autoContinue;
      tg.addEventListener('change', () => { autoContinue = tg.checked; localStorage.setItem('ig-auto-continue', autoContinue ? '1' : '0'); });
    });
    $('search').addEventListener('input', (e) => { query = e.target.value; render(); });
    filters.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      activeCollection = chip.dataset.col;
      render();
    });
    grid.addEventListener('click', (e) => {
      const post = e.target.closest('.post');
      if (!post) return;
      const it = doc.items.find((i) => i.id === post.dataset.id);
      if (!it) return;
      const act = e.target.closest('[data-act]');
      if (act) { e.stopPropagation(); deletePost(it); return; }
      openViewer(it);
    });

    listen('project-activated', async () => { project = await invoke('get_active_project'); render(); });

    async function main() {
      // Browser preview: `?demo` fills the grid with placeholder tiles so the
      // layout can be checked outside Studio (kit CSS needs an http origin).
      if (!hasTauri && location.search.includes('demo')) {
        doc = { items: Array.from({ length: 14 }, (_, i) => ({ id: String(i), code: 'x', url: '#', media_type: [1, 2, 8][i % 3],
          caption: 'Placeholder caption for layout checks', username: 'demo', thumb: i % 5 ? `https://picsum.photos/seed/${i}/400/500` : '', collections: [] })),
          collections: [{ id: '1', name: 'Ceramics', count: 3 }], cursor: { phase: 'posts' } };
        session.logged_in = true;
        render();
        return;
      }
      try { doc = JSON.parse(await invoke('read_store', { name: 'instagram-saved' })); } catch {}
      doc.items ||= []; doc.collections ||= [];
      try { project = await invoke('get_active_project'); } catch {}
      await refreshSession();
      render();
      if (session.login_window_open) watchLogin();
    }
    main();
  </script>
</body>

</html>
