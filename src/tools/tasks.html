<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../kit/kit.css" />
  <script type="module" src="../kit/components.js"></script>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border, rgba(255,255,255,0.08));
    }
    header .title { font-size: 18px; font-weight: 600; margin-right: auto; }

    #list {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 8px 20px 24px;
    }

    .day-head {
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 18px 0 6px;
    }

    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border, rgba(255,255,255,0.08));
      border-radius: var(--radius, 10px);
      margin-bottom: 8px;
      background: var(--surface, rgba(255,255,255,0.03));
    }
    .task .when {
      flex: 0 0 70px;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: var(--text);
    }
    .task .body { flex: 1 1 auto; min-width: 0; }
    .task .name { font-size: 14px; font-weight: 500; }
    .task .meta {
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .task .meta a { color: var(--accent); text-decoration: none; }
    .task .meta a:hover { text-decoration: underline; }

    .badge {
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255,255,255,0.08);
      color: var(--text-muted);
    }
    .badge.online { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }

    .task .lead {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .task .lead input {
      width: 48px;
      padding: 3px 6px;
      text-align: right;
    }
    .task .actions { flex: 0 0 auto; display: flex; gap: 4px; }

    #empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 60px 20px;
    }

    /* Inline manual-add form */
    #addForm {
      display: none;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border, rgba(255,255,255,0.08));
      flex-wrap: wrap;
    }
    #addForm.open { display: flex; }
    #addForm .field { flex: 1 1 160px; }
    #addForm input[type="datetime-local"] { flex: 0 0 auto; }

    #settingsForm {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border, rgba(255,255,255,0.08));
    }
    #settingsForm.open { display: flex; }
    /* kit .field is width:100%; constrain so the row lays out side by side */
    #settingsForm #cfgOrigin { flex: 1 1 260px; min-width: 0; width: auto; }
    #settingsForm #cfgMode { flex: 0 0 auto; width: auto; }
    #settingsForm #cfgBuffer { width: 56px; }
    #settingsForm #cfgSave { flex: 0 0 auto; }
  </style>
</head>

<body>
  <header>
    <span class="title">Tasks</span>
    <button class="btn btn-ghost" id="addBtn"><span class="material-symbols-rounded">add</span>Task</button>
    <button class="btn btn-ghost" id="settingsBtn" title="Transit settings"><span class="material-symbols-rounded">tune</span></button>
    <button class="btn btn-ghost" id="refreshBtn"><span class="material-symbols-rounded">refresh</span>Sync</button>
  </header>

  <div id="settingsForm">
    <input class="field" id="cfgOrigin" placeholder="Home / origin address (for in-person travel time)" />
    <select class="field" id="cfgMode">
      <option value="driving">Driving</option>
      <option value="walking">Walking</option>
    </select>
    <label class="text-xs" style="display:flex;align-items:center;gap:6px;color:var(--text-muted)">
      Buffer <input type="number" class="field" id="cfgBuffer" min="0" style="width:56px" /> min
    </label>
    <button class="btn btn-primary" id="cfgSave">Save</button>
  </div>

  <div id="addForm">
    <input class="field" id="addTitle" placeholder="Title" />
    <input class="field" id="addUrl" placeholder="Link or location (optional)" />
    <input type="datetime-local" class="field" id="addWhen" />
    <button class="btn btn-primary" id="addSave">Add</button>
    <button class="btn btn-ghost" id="addCancel">Cancel</button>
  </div>

  <div id="list"><div id="empty">Loading…</div></div>

  <script type="module">
    import { el, genId } from "../dom.js";

    const hasTauri = !!window.__TAURI__;
    const invoke = hasTauri ? window.__TAURI__.core.invoke : null;

    // Default lead time (minutes) for a calendar-derived online meeting.
    const DEFAULT_LEAD = 2;
    // Where Meet/Zoom/Teams join links live in an event.
    const JOIN_RE = /(https?:\/\/[^\s)]*(?:meet\.google\.com|zoom\.us\/j\/|zoom\.us\/my\/|teams\.microsoft\.com|teams\.live\.com)[^\s)]*)/i;

    // EKEvent identifiers contain ':' and '/', which the Rust store rejects.
    // Slugify to a stable, file-safe id (same input → same id, for dedup).
    const calId = (eventId) => "cal-" + eventId.replace(/[^a-zA-Z0-9_-]/g, "_");

    function findJoinLink(ev) {
      for (const f of [ev.url, ev.notes, ev.location]) {
        const m = (f || "").match(JOIN_RE);
        if (m) return m[1];
      }
      return null;
    }

    // Turn a calendar event into a Task object (online if a join link is found,
    // else in-person if it has a location). Returns null for events we skip.
    function taskFromEvent(ev) {
      if (ev.allDay) return null;
      const join = findJoinLink(ev);
      const actions = [];
      if (join) actions.push({ kind: "url", target: join });
      const inPerson = !join && ev.location && ev.location.trim();
      return {
        id: calId(ev.id),
        source: "calendar",
        eventId: ev.id,
        title: ev.title || "(untitled)",
        start: ev.start,
        end: ev.end,
        location: ev.location || "",
        actions,
        online: !!join,
        inPerson: !!inPerson,
        notify: { leadMinutes: DEFAULT_LEAD, reason: "" },
      };
    }

    // Pull calendar → reconcile with stored Tasks. Calendar Tasks are
    // disposable (regenerated each sync), but we preserve any user-edited lead
    // time. Manual Tasks are never touched. Cancelled events' Tasks are removed.
    async function syncCalendar(stored) {
      let events = [];
      try { events = JSON.parse(await invoke("cal_read")); }
      catch (e) { console.warn("cal_read failed", e); return; }

      const byId = Object.fromEntries(stored.map((t) => [t.id, t]));
      const liveIds = new Set();

      for (const ev of events) {
        const t = taskFromEvent(ev);
        if (!t) continue;
        liveIds.add(t.id);
        const prev = byId[t.id];
        // Keep a lead time the user changed, or one we computed from transit,
        // so a resync doesn't reset it to the default.
        if (prev?.notify?.leadEdited || prev?.notify?.transitKey) t.notify = prev.notify;
        await invoke("save_task", { id: t.id, data: JSON.stringify(t) });
      }

      // Remove calendar Tasks whose event no longer exists (cancelled / aged out).
      for (const t of stored) {
        if (t.source === "calendar" && !liveIds.has(t.id)) {
          await invoke("delete_task", { id: t.id });
        }
      }
    }

    async function loadTasks() {
      try { return JSON.parse(await invoke("list_tasks")); }
      catch (e) { console.warn("list_tasks failed", e); return []; }
    }

    // Transit settings (origin/mode/buffer) for in-person lead times.
    let config = { origin: "", mode: "driving", buffer: 5 };
    async function loadConfig() {
      try { config = { origin: "", mode: "driving", buffer: 5, ...JSON.parse(await invoke("read_tasks_config")) }; }
      catch (e) { console.warn("read_tasks_config failed", e); }
    }

    // For in-person Tasks, estimate travel time from the configured origin and
    // set lead time = ETA + buffer. Cached per origin/mode (notify.transitKey)
    // so we geocode once; skipped if the user hand-edited the lead time.
    async function applyTransit(tasks) {
      if (!config.origin) return;
      for (const t of tasks) {
        const isInPerson = t.inPerson || (t.location && !t.online);
        if (!isInPerson || !t.location || t.notify?.leadEdited) continue;
        // Key includes the destination so editing an address recomputes.
        const key = `${config.origin}|${config.mode}|${t.location}`;
        if (t.notify?.transitKey === key) continue; // already computed for this trip
        try {
          const res = JSON.parse(await invoke("transit_eta",
            { from: config.origin, to: t.location, mode: config.mode }));
          const buffer = config.buffer || 0;
          if (typeof res.minutes === "number") {
            t.notify = {
              ...(t.notify || {}),
              leadMinutes: res.minutes + buffer,
              reason: `${res.minutes} min ${config.mode} + ${buffer} min buffer`,
              transitKey: key,
            };
          } else {
            // Couldn't resolve the address — surface it, and cache so we don't
            // re-query every sync (a new address changes the key and retries).
            t.notify = { ...(t.notify || {}), reason: "couldn't estimate travel — check the address", transitKey: key };
          }
          t.inPerson = true;
          await invoke("save_task", { id: t.id, data: JSON.stringify(t) });
        } catch (e) { console.warn("transit failed for", t.title, e); }
      }
    }

    const dayFmt = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "short", day: "numeric" });
    const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
    const dayKey = (d) => d.toDateString();

    function render(tasks) {
      const list = document.getElementById("list");
      list.innerHTML = "";

      const upcoming = tasks
        .filter((t) => t.start && new Date(t.start) >= new Date(Date.now() - 60 * 60 * 1000))
        .sort((a, b) => new Date(a.start) - new Date(b.start));

      if (!upcoming.length) {
        list.appendChild(el("div", "", { id: "empty", textContent: "No upcoming tasks." }));
        return;
      }

      let lastDay = null;
      for (const t of upcoming) {
        const start = new Date(t.start);
        const key = dayKey(start);
        if (key !== lastDay) {
          list.appendChild(el("div", "day-head", { textContent: dayFmt.format(start) }));
          lastDay = key;
        }
        list.appendChild(taskRow(t, start));
      }
    }

    function taskRow(t, start) {
      const row = el("div", "task");
      row.appendChild(el("div", "when", { textContent: timeFmt.format(start) }));

      const body = el("div", "body");
      body.appendChild(el("div", "name", { textContent: t.title }));
      const meta = el("div", "meta");

      if (t.online) {
        meta.appendChild(el("span", "badge online", { textContent: "Online" }));
        const link = t.actions?.find((a) => a.kind === "url")?.target;
        if (link) {
          const a = el("a", "", { textContent: "Join link", href: "#" });
          a.addEventListener("click", (e) => {
            e.preventDefault();
            // Use open_path (the `open` command), not the opener plugin —
            // tool-* windows aren't granted opener:allow-open-url.
            invoke("open_path", { path: link }).catch((err) => console.warn(err));
          });
          meta.appendChild(a);
        }
      } else if (t.inPerson || t.location) {
        meta.appendChild(el("span", "badge", { textContent: "In person" }));
        if (t.location) meta.appendChild(el("span", "", { textContent: t.location }));
      } else if (t.source === "manual") {
        meta.appendChild(el("span", "badge", { textContent: "Manual" }));
      }
      if (t.notify?.reason) meta.appendChild(el("span", "", { textContent: t.notify.reason }));
      body.appendChild(meta);
      row.appendChild(body);

      // Editable lead time.
      const lead = el("div", "lead");
      const input = el("input", "field");
      input.type = "number";
      input.min = "0";
      input.value = t.notify?.leadMinutes ?? DEFAULT_LEAD;
      input.addEventListener("change", async () => {
        const v = Math.max(0, parseInt(input.value, 10) || 0);
        t.notify = { ...(t.notify || {}), leadMinutes: v, leadEdited: true };
        await invoke("save_task", { id: t.id, data: JSON.stringify(t) });
      });
      lead.appendChild(input);
      lead.appendChild(el("span", "", { textContent: "min before" }));
      row.appendChild(lead);

      const actions = el("div", "actions");
      const del = el("button", "btn btn-icon");
      del.innerHTML = '<span class="material-symbols-rounded">delete</span>';
      del.title = "Delete task";
      del.addEventListener("click", async () => {
        await invoke("delete_task", { id: t.id });
        refresh();
      });
      actions.appendChild(del);
      row.appendChild(actions);
      return row;
    }

    let busy = false;
    async function refresh() {
      if (!hasTauri || busy) return;
      busy = true;
      try {
        const stored = await loadTasks();
        await syncCalendar(stored);
        await applyTransit(await loadTasks());
        render(await loadTasks());
      } finally {
        busy = false;
      }
    }

    // Manual add.
    const form = document.getElementById("addForm");
    document.getElementById("addBtn").addEventListener("click", () => form.classList.toggle("open"));
    document.getElementById("addCancel").addEventListener("click", () => form.classList.remove("open"));
    document.getElementById("addSave").addEventListener("click", async () => {
      const title = document.getElementById("addTitle").value.trim();
      const raw = document.getElementById("addUrl").value.trim();
      const when = document.getElementById("addWhen").value;
      if (!title || !when) return;
      const isUrl = /^https?:\/\//i.test(raw);
      const t = {
        id: "man-" + genId(),
        source: "manual",
        title,
        start: new Date(when).toISOString(),
        location: isUrl ? "" : raw,
        actions: isUrl ? [{ kind: "url", target: raw }] : [],
        online: isUrl,
        inPerson: !!raw && !isUrl,
        notify: { leadMinutes: DEFAULT_LEAD, reason: "" },
      };
      await invoke("save_task", { id: t.id, data: JSON.stringify(t) });
      document.getElementById("addTitle").value = "";
      document.getElementById("addUrl").value = "";
      document.getElementById("addWhen").value = "";
      form.classList.remove("open");
      refresh();
    });

    document.getElementById("refreshBtn").addEventListener("click", refresh);

    // Transit settings.
    const settingsForm = document.getElementById("settingsForm");
    document.getElementById("settingsBtn").addEventListener("click", () => settingsForm.classList.toggle("open"));
    document.getElementById("cfgSave").addEventListener("click", async () => {
      config = {
        origin: document.getElementById("cfgOrigin").value.trim(),
        mode: document.getElementById("cfgMode").value,
        buffer: Math.max(0, parseInt(document.getElementById("cfgBuffer").value, 10) || 0),
      };
      await invoke("save_tasks_config", { data: JSON.stringify(config) });
      settingsForm.classList.remove("open");
      refresh(); // recompute transit with the new origin/mode/buffer
    });
    function fillSettings() {
      document.getElementById("cfgOrigin").value = config.origin || "";
      document.getElementById("cfgMode").value = config.mode || "driving";
      document.getElementById("cfgBuffer").value = config.buffer ?? 5;
    }

    if (hasTauri) {
      loadConfig().then(() => { fillSettings(); refresh(); });
    } else {
      document.getElementById("list").innerHTML =
        '<div id="empty">Open inside Studio to read your calendar.</div>';
    }
  </script>
</body>

</html>
