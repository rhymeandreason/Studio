<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../kit/kit.css" />
  <script type="module" src="../kit/components.js"></script>
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 12px;
      // border-bottom: 1px solid var(--hairline, rgba(0, 0, 0, 0.08));
      margin-top: -16px;
    }

    header .title {
      font-size: 18px;
      font-weight: 600;
      margin-right: auto;
      opacity: 0;
    }

    /* Round filled "add" button. */
    #addBtn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      padding: 0;
      flex: 0 0 auto;
    }

    #addBtn .mi {
      font-size: 20px;
    }

    #list {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 0px 20px 24px;
      margin-top: -30px;
    }

    .day-head {
      font-size: 16px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 30px 0 10px;
      font-weight: 600;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg, 12px);
      margin-bottom: 12px;
      background: var(--elevated);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: box-shadow var(--dur-fast, .15s) var(--ease-standard, ease),
        transform var(--dur-fast, .15s) var(--ease-standard, ease);
    }

    .flip:hover .face.front {
      box-shadow: var(--shadow-md);
    }

    /* Flip card: front = task display, back = inline editor. The container's
       height is set in JS (front height normally, back height when flipped) so
       it expands only when the editor needs more room. */
    .flip {
      position: relative;
      margin-bottom: 12px;
      perspective: 1600px;
      transition: height 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .flip-inner {
      position: relative;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .flip.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .flip .face {
      position: absolute;
      inset: 0 0 auto 0;
      /* top/left/right; height grows with content */
      margin-bottom: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip .face.back {
      transform: rotateY(180deg);
    }

    /* Back face holds a wrapping editor form. */
    .edit-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    .edit-form .field {
      flex: 1 1 160px;
    }

    .edit-form input[type="date"],
    .edit-form input[type="time"] {
      flex: 0 0 auto;
    }

    .edit-form .edit-delete {
      margin-left: auto;
      color: var(--danger, #d9534f);
    }

    .edit-form .form-hint {
      flex-basis: 100%;
    }

    .edit-form .form-hint:empty {
      display: none;
    }

    .task .when {
      flex: 0 0 78px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: var(--text);
    }

    .task .body {
      flex: 1 1 auto;
      min-width: 0;
    }

    .task .name {
      font-size: 14px;
      font-weight: 500;
    }

    .task .meta {
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .task .meta a {
      color: var(--accent);
      text-decoration: none;
    }

    .task .meta a:hover {
      text-decoration: underline;
    }

    .badge {
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .badge.online {
      background: color-mix(in srgb, var(--accent) 22%, transparent);
      color: var(--accent);
    }

    .badge.inperson {
      background: color-mix(in srgb, var(--warning, #e0a458) 26%, transparent);
      color: var(--warning, #e0a458);
    }

    .cal-mark {
      display: inline-flex;
      align-items: center;
      color: var(--text-muted);
    }

    .cal-mark .mi {
      font-size: 15px;
    }

    /* Card-reveal animation: a 10px dot widens to a full-width line, holds, then
       grows to full height. Two runtime values come in as custom properties:
       --reveal-h (the card's natural height) and --reveal-scale (10 / width, so
       the dot is ~10px wide). Everything else is declarative here. Because CSS
       animations outrank normal declarations, the keyframes override even
       #addForm's id styles; with no fill, the card reverts to its base styles
       when the animation ends. JS only sets the two vars + toggles .revealing. */
    .revealing {
      overflow: hidden;
      box-sizing: border-box;
      transform-origin: top center;
      animation: card-reveal 800ms;
    }

    .revealing>* {
      animation: card-reveal-fade 800ms ease-out;
    }

    @keyframes card-reveal {
      0% {
        height: 10px;
        padding-top: 0;
        padding-bottom: 0;
        transform: scaleX(var(--reveal-scale));
        border-radius: 10px;
        border-color: transparent;
        box-shadow: none;
        animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1);
        /* widen */
      }

      45%,
      55% {
        height: 10px;
        padding-top: 0;
        padding-bottom: 0;
        transform: scaleX(1);
        border-radius: 10px;
        border-color: transparent;
        box-shadow: none;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        /* then grow */
      }

      100% {
        height: var(--reveal-h);
        padding-top: 16px;
        padding-bottom: 16px;
        transform: scaleX(1);
        border-radius: var(--radius-lg, 12px);
        border-color: var(--hairline);
        box-shadow: var(--shadow-sm);
      }
    }

    @keyframes card-reveal-fade {

      0%,
      60% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .revealing,
      .revealing>* {
        animation: none;
      }
    }

    .task .lead {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .task .lead input {
      width: 48px;
      padding: 3px 6px;
      text-align: right;
    }

    .task .actions {
      flex: 0 0 auto;
      display: flex;
      gap: 4px;
    }

    #empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 60px 20px;
    }

    /* Add / edit editor, styled as a card that reveals into the list. */
    #addForm {
      display: none;
      gap: 8px;
      margin: 16px 20px 4px;
      padding: 16px 18px;
      background: var(--elevated);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg, 12px);
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
    }

    #addForm.open {
      display: flex;
      flex-wrap: wrap;
    }

    #addForm .field {
      flex: 1 1 160px;
    }

    #addForm input[type="date"],
    #addForm input[type="time"] {
      flex: 0 0 auto;
    }

    #formHint {
      flex-basis: 100%;
    }

    #formHint:empty {
      display: none;
    }

    #settingsForm {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border, rgba(255, 255, 255, 0.08));
    }

    #settingsForm.open {
      display: flex;
    }

    /* kit .field is width:100%; constrain so the row lays out side by side */
    #settingsForm #cfgOrigin {
      flex: 1 1 260px;
      min-width: 0;
      width: auto;
    }

    #settingsForm #cfgMode {
      flex: 0 0 auto;
      width: auto;
    }

    #settingsForm #cfgBuffer {
      width: 56px;
    }

    #settingsForm #cfgSave {
      flex: 0 0 auto;
    }

  </style>
</head>

<body>
  <header>
    <span class="title">Tasks</span>
    <button class="btn btn-ghost btn-icon" id="settingsBtn" title="Transit settings"><span class="mi">tune</span></button>
    <button class="btn btn-ghost btn-icon" id="refreshBtn" title="Sync calendar"><span class="mi">refresh</span></button>
    <button class="btn btn-primary" id="addBtn" title="Add task"><span class="mi">add</span></button>
  </header>

  <div id="settingsForm">
    <input class="field" id="cfgOrigin" placeholder="Home / origin address (for in-person travel time)" />
    <select class="field" id="cfgMode">
      <option value="driving">Driving</option>
      <option value="walking">Walking</option>
    </select>
    <label class="text-xs" style="display:flex;align-items:center;gap:6px;color:var(--text-muted)">
      Buffer <input type="number" class="field" id="cfgBuffer" min="0" style="width:56px" /> min
    </label>
    <button class="btn btn-primary" id="cfgSave">Save</button>
  </div>

  <div id="addForm">
    <input class="field" id="addTitle" placeholder="Title" />
    <input class="field" id="addUrl" placeholder="Link or location (optional)" />
    <input type="date" class="field" id="addDate" />
    <input type="time" class="field" id="addTime" />
    <button class="btn btn-primary" id="addSave">Add</button>
    <button class="btn btn-ghost" id="addCancel">Cancel</button>
    <div id="formHint" class="text-xs text-muted"></div>
  </div>

  <div id="list">
    <div id="empty">Loading…</div>
  </div>

  <script type="module">
    import {
      el,
      genId
    } from "../dom.js";

    const hasTauri = !!window.__TAURI__;
    const invoke = hasTauri ? window.__TAURI__.core.invoke : null;

    // Default lead time (minutes) for a calendar-derived online meeting.
    const DEFAULT_LEAD = 2;
    // Where Meet/Zoom/Teams join links live in an event.
    const JOIN_RE = /(https?:\/\/[^\s)]*(?:meet\.google\.com|zoom\.us\/j\/|zoom\.us\/my\/|teams\.microsoft\.com|teams\.live\.com)[^\s)]*)/i;

    // EKEvent identifiers contain ':' and '/', which the Rust store rejects.
    // Slugify to a stable, file-safe id (same input → same id, for dedup).
    const calId = (eventId) => "cal-" + eventId.replace(/[^a-zA-Z0-9_-]/g, "_");

    function findJoinLink(ev) {
      for (const f of [ev.url, ev.notes, ev.location]) {
        const m = (f || "").match(JOIN_RE);
        if (m) return m[1];
      }
      return null;
    }

    // Turn a calendar event into a Task object (online if a join link is found,
    // else in-person if it has a location). Returns null for events we skip.
    function taskFromEvent(ev) {
      if (ev.allDay) return null;
      const join = findJoinLink(ev);
      const actions = [];
      if (join) actions.push({
        kind: "url",
        target: join
      });
      const inPerson = !join && ev.location && ev.location.trim();
      return {
        id: calId(ev.id),
        source: "calendar",
        eventId: ev.id,
        title: ev.title || "(untitled)",
        start: ev.start,
        end: ev.end,
        location: ev.location || "",
        actions,
        online: !!join,
        inPerson: !!inPerson,
        notify: {
          leadMinutes: DEFAULT_LEAD,
          reason: ""
        },
      };
    }

    // Pull calendar → reconcile with stored Tasks. Calendar Tasks are
    // disposable (regenerated each sync), but we preserve any user-edited lead
    // time. Manual Tasks are never touched. Cancelled events' Tasks are removed.
    async function syncCalendar(stored) {
      let events = [];
      try {
        events = JSON.parse(await invoke("cal_read"));
      } catch (e) {
        console.warn("cal_read failed", e);
        return;
      }

      const byId = Object.fromEntries(stored.map((t) => [t.id, t]));
      const liveIds = new Set();

      for (const ev of events) {
        const t = taskFromEvent(ev);
        if (!t) continue;
        liveIds.add(t.id);
        const prev = byId[t.id];
        // If the user edited this event in the tool, they've taken manual
        // control — leave their version untouched (it stays "live" so it isn't
        // deleted, but the event's fields don't overwrite it).
        if (prev?.userEdited) continue;
        // Keep a lead time the user changed, or one we computed from transit,
        // so a resync doesn't reset it to the default.
        if (prev?.notify?.leadEdited || prev?.notify?.transitKey) t.notify = prev.notify;
        await invoke("save_task", {
          id: t.id,
          data: JSON.stringify(t)
        });
      }

      // Remove calendar Tasks whose event no longer exists (cancelled / aged out).
      for (const t of stored) {
        if (t.source === "calendar" && !liveIds.has(t.id)) {
          await invoke("delete_task", {
            id: t.id
          });
        }
      }
    }

    async function loadTasks() {
      try {
        return JSON.parse(await invoke("list_tasks"));
      } catch (e) {
        console.warn("list_tasks failed", e);
        return [];
      }
    }

    // Transit settings (origin/mode/buffer) for in-person lead times.
    let config = {
      origin: "",
      mode: "driving",
      buffer: 5
    };
    async function loadConfig() {
      try {
        config = {
          origin: "",
          mode: "driving",
          buffer: 5,
          ...JSON.parse(await invoke("read_tasks_config"))
        };
      } catch (e) {
        console.warn("read_tasks_config failed", e);
      }
    }

    // For in-person Tasks, estimate travel time from the configured origin and
    // set lead time = ETA + buffer. Cached per origin/mode (notify.transitKey)
    // so we geocode once; skipped if the user hand-edited the lead time.
    function transitNotify(notify, eta, buffer, mode, key) {
      return {
        ...(notify || {}),
        etaMinutes: eta,
        leadMinutes: eta + buffer,
        reason: `${eta} min ${mode} + ${buffer} min buffer`,
        transitKey: key,
      };
    }

    async function applyTransit(tasks) {
      if (!config.origin) return;
      const buffer = config.buffer || 0;
      for (const t of tasks) {
        const isInPerson = t.inPerson || (t.location && !t.online);
        if (!isInPerson || !t.location || t.notify?.leadEdited) continue;
        // Trip identity (origin/mode/destination) — not the buffer, so a
        // buffer change doesn't force a re-query.
        const key = `${config.origin}|${config.mode}|${t.location}`;
        try {
          // Same trip with a stored ETA: if only the buffer changed, re-add it
          // locally (no geocoding/network). A missing etaMinutes (Task cached
          // before that field existed) falls through to a fresh query.
          const cachedEta = t.notify?.transitKey === key ? t.notify?.etaMinutes : undefined;
          if (typeof cachedEta === "number") {
            if (t.notify.leadMinutes !== cachedEta + buffer) {
              t.notify = transitNotify(t.notify, cachedEta, buffer, config.mode, key);
              await invoke("save_task", {
                id: t.id,
                data: JSON.stringify(t)
              });
            }
            continue;
          }
          const res = JSON.parse(await invoke("transit_eta", {
            from: config.origin,
            to: t.location,
            mode: config.mode
          }));
          if (typeof res.minutes === "number") {
            t.notify = transitNotify(t.notify, res.minutes, buffer, config.mode, key);
          } else {
            // Couldn't resolve the address — surface it, and cache so we don't
            // re-query every sync (a new address changes the key and retries).
            t.notify = {
              ...(t.notify || {}),
              reason: "couldn't estimate travel — check the address",
              transitKey: key
            };
          }
          t.inPerson = true;
          await invoke("save_task", {
            id: t.id,
            data: JSON.stringify(t)
          });
        } catch (e) {
          console.warn("transit failed for", t.title, e);
        }
      }
    }

    const dayFmt = new Intl.DateTimeFormat(undefined, {
      weekday: "long",
      month: "short",
      day: "numeric"
    });
    const timeFmt = new Intl.DateTimeFormat(undefined, {
      hour: "numeric",
      minute: "2-digit"
    });
    const dayKey = (d) => d.toDateString();

    // Card-reveal animation: a 10px dot widens to a full-width line, then grows
    // to full height (see the .revealing / @keyframes rules). Played on the card
    // just added or edited. JS only supplies the two runtime values and toggles
    // the class; the keyframes handle the rest and the card reverts on end.
    let revealId = null;

    function revealCard(card) {
      card.style.setProperty("--reveal-h", card.offsetHeight + "px");
      card.style.setProperty("--reveal-scale", 10 / card.offsetWidth);
      card.classList.add("revealing");
      card.addEventListener("animationend", function done(e) {
        if (e.target !== card) return; // ignore child content-fade animations
        card.classList.remove("revealing");
        card.style.removeProperty("--reveal-h");
        card.style.removeProperty("--reveal-scale");
        card.removeEventListener("animationend", done);
      });
    }

    function render(tasks) {
      const list = document.getElementById("list");
      list.innerHTML = "";

      const upcoming = tasks
        .filter((t) => t.start && new Date(t.start) >= new Date(Date.now() - 60 * 60 * 1000))
        .sort((a, b) => new Date(a.start) - new Date(b.start));

      if (!upcoming.length) {
        list.appendChild(el("div", "", {
          id: "empty",
          textContent: "No upcoming tasks."
        }));
        return;
      }

      let lastDay = null;
      for (const t of upcoming) {
        const start = new Date(t.start);
        const key = dayKey(start);
        if (key !== lastDay) {
          list.appendChild(el("div", "day-head", {
            textContent: dayFmt.format(start)
          }));
          lastDay = key;
        }
        const flip = taskRow(t, start);
        list.appendChild(flip);
        // Size the flip container to its front face (now that it's laid out).
        const front = flip.querySelector(".front");
        flip.style.height = front.offsetHeight + "px";
        if (t.id === revealId) {
          revealId = null;
          revealCard(front);
        }
      }
    }

    // A row is a flip card: front (display) + back (inline editor). Clicking the
    // front flips to the back, expanding the card to the editor's height.
    function taskRow(t, start) {
      const flip = el("div", "flip");
      const inner = el("div", "flip-inner");
      const front = buildFront(t, start);
      const back = buildBack(t, flip, front);
      inner.append(front, back);
      flip.appendChild(inner);

      front.title = "Click to edit";
      front.addEventListener("click", () => {
        flip.style.height = back.offsetHeight + "px";
        flip.classList.add("flipped");
        back.querySelector(".edit-title")?.focus();
      });
      return flip;
    }

    // Reset the card to its front face at the front's height.
    function closeFlip(flip, front) {
      flip.style.height = front.offsetHeight + "px";
      flip.classList.remove("flipped");
    }

    function buildFront(t, start) {
      const row = el("div", "task face front");
      const when = el("div", "when");
      when.appendChild(el("div", "time", {
        textContent: timeFmt.format(start)
      }));
      row.appendChild(when);

      const body = el("div", "body");
      body.appendChild(el("div", "name", {
        textContent: t.title
      }));
      const meta = el("div", "meta");

      // Mark calendar-sourced tasks so it's clear edits need care.
      if (t.source === "calendar") {
        const cal = el("span", "cal-mark");
        cal.innerHTML = '<span class="mi mi-sm">event</span>';
        cal.title = t.userEdited ?
          "From your calendar · edited — sync won't overwrite it" :
          "From your calendar · editing takes manual control";
        meta.appendChild(cal);
      }

      if (t.online) {
        when.appendChild(el("span", "badge online", {
          textContent: "Online"
        }));
        const link = t.actions?.find((a) => a.kind === "url")?.target;
        if (link) {
          const a = el("a", "", {
            textContent: "Join link",
            href: "#"
          });
          a.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation(); // don't open the editor
            // Use open_path (the `open` command), not the opener plugin —
            // tool-* windows aren't granted opener:allow-open-url.
            invoke("open_path", {
              path: link
            }).catch((err) => console.warn(err));
          });
          meta.appendChild(a);
        }
      } else if (t.inPerson || t.location) {
        when.appendChild(el("span", "badge inperson", {
          textContent: "In person"
        }));
        if (t.location) meta.appendChild(el("span", "", {
          textContent: t.location
        }));
      } else if (t.source === "manual") {
        when.appendChild(el("span", "badge", {
          textContent: "Manual"
        }));
      }
      if (t.notify?.reason) meta.appendChild(el("span", "", {
        textContent: t.notify.reason
      }));
      body.appendChild(meta);
      row.appendChild(body);

      // Editable lead time.
      const lead = el("div", "lead");
      const input = el("input", "field");
      input.type = "number";
      input.min = "0";
      input.value = t.notify?.leadMinutes ?? DEFAULT_LEAD;
      input.addEventListener("click", (e) => e.stopPropagation());
      input.addEventListener("change", async () => {
        const v = Math.max(0, parseInt(input.value, 10) || 0);
        t.notify = {
          ...(t.notify || {}),
          leadMinutes: v,
          leadEdited: true
        };
        await invoke("save_task", {
          id: t.id,
          data: JSON.stringify(t)
        });
      });
      lead.appendChild(input);
      lead.appendChild(el("span", "", {
        textContent: "min before"
      }));
      row.appendChild(lead);
      return row;
    }

    // Back face: an inline editor for this task (title, link/location, date,
    // time). Save writes the task (marking it userEdited so calendar sync leaves
    // it alone); Cancel flips back without saving.
    function buildBack(t, flip, front) {
      const back = el("div", "task face back");
      const form = el("div", "edit-form");

      const title = el("input", "field edit-title", {
        value: t.title || ""
      });
      title.placeholder = "Title";
      const link = el("input", "field", {
        value: t.actions?.find((a) => a.kind === "url")?.target || t.location || "",
      });
      link.placeholder = "Link or location (optional)";
      const date = el("input", "field");
      date.type = "date";
      const time = el("input", "field");
      time.type = "time";
      const parts = t.start ? toLocalParts(t.start) : {
        date: "",
        time: ""
      };
      date.value = parts.date;
      time.value = parts.time;

      const save = el("button", "btn btn-primary", {
        textContent: "Save"
      });
      const cancel = el("button", "btn btn-ghost", {
        textContent: "Cancel"
      });
      const del = el("button", "btn btn-icon edit-delete");
      del.innerHTML = '<span class="mi">delete</span>';
      del.title = "Delete task";
      del.addEventListener("click", async () => {
        await invoke("delete_task", {
          id: t.id
        });
        refresh();
      });
      const hint = el("div", "form-hint text-xs text-muted");
      if (t.source === "calendar" && !t.userEdited) {
        hint.textContent = "Saving takes manual control — calendar sync won't overwrite it.";
      }

      save.addEventListener("click", async () => {
        const ttl = title.value.trim();
        if (!ttl || !date.value || !time.value) return;
        const raw = link.value.trim();
        const isUrl = /^https?:\/\//i.test(raw);
        const updated = {
          ...t,
          title: ttl,
          start: new Date(`${date.value}T${time.value}`).toISOString(),
          location: isUrl ? "" : raw,
          online: isUrl,
          inPerson: !!raw && !isUrl,
          userEdited: true,
        };
        updated.actions = isUrl ? [{
          kind: "url",
          target: raw
        }] : (raw ? [] : (t.actions || []));
        await invoke("save_task", {
          id: t.id,
          data: JSON.stringify(updated)
        });
        refresh();
      });
      cancel.addEventListener("click", () => closeFlip(flip, front));

      form.append(title, link, date, time, save, cancel, del, hint);
      back.appendChild(form);
      return back;
    }

    let busy = false;
    async function refresh() {
      if (!hasTauri || busy) return;
      busy = true;
      try {
        const stored = await loadTasks();
        await syncCalendar(stored);
        await applyTransit(await loadTasks());
        render(await loadTasks());
      } finally {
        busy = false;
      }
    }

    // Shared add / edit form. editingId is null for a new Task.
    const form = document.getElementById("addForm");
    const $title = document.getElementById("addTitle");
    const $url = document.getElementById("addUrl");
    const $date = document.getElementById("addDate");
    const $time = document.getElementById("addTime");
    let editingId = null;

    // ISO → local date (YYYY-MM-DD) and time (HH:mm) input values.
    function toLocalParts(iso) {
      const d = new Date(iso);
      const p = (n) => String(n).padStart(2, "0");
      return {
        date: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`,
        time: `${p(d.getHours())}:${p(d.getMinutes())}`,
      };
    }

    // Open the form for a new Task (task=null) or to edit an existing one.
    function openForm(task) {
      editingId = task?.id ?? null;
      $title.value = task?.title ?? "";
      $url.value = task ? (task.actions?.find((a) => a.kind === "url")?.target || task.location || "") : "";
      const parts = task?.start ? toLocalParts(task.start) : {
        date: "",
        time: ""
      };
      $date.value = parts.date;
      $time.value = parts.time;
      document.getElementById("addSave").textContent = task ? "Save" : "Add";
      document.getElementById("formHint").textContent =
        task?.source === "calendar" && !task?.userEdited ?
        "Saving your edits takes manual control of this event — calendar sync won't overwrite it afterward." :
        "";
      form.classList.add("open");
      revealCard(form);
      $title.focus();
    }

    function closeForm() {
      editingId = null;
      form.classList.remove("open");
      $title.value = $url.value = $date.value = $time.value = "";
      document.getElementById("formHint").textContent = "";
    }

    document.getElementById("addBtn").addEventListener("click", () => {
      if (form.classList.contains("open")) closeForm();
      else openForm(null);
    });
    document.getElementById("addCancel").addEventListener("click", closeForm);

    document.getElementById("addSave").addEventListener("click", async () => {
      const title = $title.value.trim();
      const raw = $url.value.trim();
      if (!title || !$date.value || !$time.value) return;
      const isUrl = /^https?:\/\//i.test(raw);
      const fields = {
        title,
        start: new Date(`${$date.value}T${$time.value}`).toISOString(),
        location: isUrl ? "" : raw,
        online: isUrl,
        inPerson: !!raw && !isUrl,
      };

      if (editingId) {
        const existing = (await loadTasks()).find((t) => t.id === editingId);
        if (existing) {
          const updated = {
            ...existing,
            ...fields,
            userEdited: true
          };
          // Replace the primary join link / clear it for in-person.
          updated.actions = isUrl ? [{
            kind: "url",
            target: raw
          }] : (raw ? [] : (existing.actions || []));
          await invoke("save_task", {
            id: editingId,
            data: JSON.stringify(updated)
          });
          revealId = editingId;
        }
      } else {
        const t = {
          id: "man-" + genId(),
          source: "manual",
          ...fields,
          actions: isUrl ? [{
            kind: "url",
            target: raw
          }] : [],
          notify: {
            leadMinutes: DEFAULT_LEAD,
            reason: ""
          },
        };
        await invoke("save_task", {
          id: t.id,
          data: JSON.stringify(t)
        });
        revealId = t.id;
      }
      closeForm();
      refresh();
    });

    document.getElementById("refreshBtn").addEventListener("click", refresh);

    // Transit settings.
    const settingsForm = document.getElementById("settingsForm");
    document.getElementById("settingsBtn").addEventListener("click", () => settingsForm.classList.toggle("open"));
    document.getElementById("cfgSave").addEventListener("click", async () => {
      config = {
        origin: document.getElementById("cfgOrigin").value.trim(),
        mode: document.getElementById("cfgMode").value,
        buffer: Math.max(0, parseInt(document.getElementById("cfgBuffer").value, 10) || 0),
      };
      await invoke("save_tasks_config", {
        data: JSON.stringify(config)
      });
      settingsForm.classList.remove("open");
      refresh(); // recompute transit with the new origin/mode/buffer
    });

    function fillSettings() {
      document.getElementById("cfgOrigin").value = config.origin || "";
      document.getElementById("cfgMode").value = config.mode || "driving";
      document.getElementById("cfgBuffer").value = config.buffer ?? 5;
    }

    if (hasTauri) {
      loadConfig().then(() => {
        fillSettings();
        refresh();
      });
    } else {
      document.getElementById("list").innerHTML =
        '<div id="empty">Open inside Studio to read your calendar.</div>';
    }

  </script>
</body>

</html>
