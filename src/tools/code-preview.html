<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; }
  #frame { width: 100%; height: 100%; border: 0; display: block; }
  #empty {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font: 13px -apple-system, system-ui, sans-serif; color: #999;
  }
</style>
</head>
<body>
  <div id="empty">Waiting for the editor…</div>
  <iframe id="frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>

<script type="module">
const { event } = window.__TAURI__;
const frame = document.getElementById("frame");
const empty = document.getElementById("empty");

let overlay = null;       // click-selection box (clay)
let hoverEl = null;       // hover outline (bright)
let pendingPath = null;   // highlight requested before the frame finished loading

frame.addEventListener("load", () => {
  overlay = null;         // recreated lazily on next highlight
  if (pendingPath) { highlight(pendingPath); pendingPath = null; }
  // Click an element to select it in the editor's DOM tree. Capture phase +
  // suppress default so it doesn't trigger the page's own click handlers.
  const doc = frame.contentDocument;
  if (doc) doc.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    event.emit("ce:select", pathOf(e.target));
  }, true);
});

function pathOf(el) {
  const doc = frame.contentDocument;
  const p = [];
  while (el && el !== doc.body && el.parentElement) {
    p.push([...el.parentElement.children].indexOf(el));
    el = el.parentElement;
  }
  return p.reverse();
}

// Register listeners and only announce readiness once they're actually
// attached on the backend — otherwise the editor's reply can race ahead of
// the listen() registration and the first push is lost.
(async () => {
  await event.listen("ce:html", (e) => {
    empty.style.display = "none";
    frame.srcdoc = e.payload || "";
  });
  await event.listen("ce:highlight", (e) => {
    const doc = frame.contentDocument;
    // If the frame is still parsing a fresh srcdoc, defer until load.
    if (!doc || !doc.body) { pendingPath = e.payload; return; }
    highlight(e.payload);
  });
  await event.listen("ce:hover", (e) => hover(e.payload));
  event.emit("ce:ready");
})();

function ensureOverlay() {
  const doc = frame.contentDocument;
  if (overlay && overlay.ownerDocument === doc) return overlay;
  overlay = doc.createElement("div");
  Object.assign(overlay.style, {
    position: "fixed", pointerEvents: "none", zIndex: 2147483647,
    background: "rgba(110,97,84,0.18)", outline: "1px solid #6e6154",
    display: "none", transition: "all 0.08s ease",
  });
  doc.body.appendChild(overlay);
  return overlay;
}

function resolvePath(path) {
  const doc = frame.contentDocument;
  if (!doc || !doc.body) return null;
  let el = doc.body;
  for (const i of path) {
    if (!el.children[i]) return null;
    el = el.children[i];
  }
  return el;
}

function boxOver(box, el) {
  const r = el.getBoundingClientRect();
  Object.assign(box.style, {
    display: "block",
    top: r.top + "px", left: r.left + "px",
    width: r.width + "px", height: r.height + "px",
  });
}

function highlight(path) {
  const el = resolvePath(path);
  if (!el) return;
  boxOver(ensureOverlay(), el);
}

// Bright, transient outline driven by hovering the editor's DOM tree.
function ensureHover() {
  const doc = frame.contentDocument;
  if (hoverEl && hoverEl.ownerDocument === doc) return hoverEl;
  hoverEl = doc.createElement("div");
  Object.assign(hoverEl.style, {
    position: "fixed", pointerEvents: "none", zIndex: 2147483647,
    outline: "2px solid #00e5ff", outlineOffset: "-1px",
    background: "rgba(0,229,255,0.12)", display: "none",
  });
  doc.body.appendChild(hoverEl);
  return hoverEl;
}

function hover(path) {
  if (!path) { if (hoverEl) hoverEl.style.display = "none"; return; }
  const el = resolvePath(path);
  if (!el) return;
  boxOver(ensureHover(), el);
}

// Tell the editor we're going away so it can stop emitting.
window.addEventListener("beforeunload", () => { event.emit("ce:closed"); });

import("../devinspect.js").then((m) => m.initDevInspect()).catch(() => {});
</script>
</body>
</html>
