<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch Mode</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    height: 100vh;
    overflow: hidden;
    font-family: var(--font-ui, "Futura PT", sans-serif);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
    outline: none;
  }

  #circle {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 500px;
    height: 500px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: black;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.06);
    z-index: 0;
  }

  #list {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    -webkit-app-region: no-drag;
  }

  .mode {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink-faint, #9a9a9a);
    opacity: 0.35;
    cursor: pointer;
    transition: opacity 0.12s, color 0.12s, transform 0.12s;
    white-space: nowrap;
  }

  .mode.active {
    color: var(--ink, #fff);
    opacity: 1;
    transform: scale(1.04);
  }

  #list.projects .mode { font-size: 32px; }

  .mode:focus { outline: none; }

  /* Armed: name scoots left, Record button appears on the right. */
  .mode.armed {
    flex-direction: row;
    align-items: center;
    gap: 28px;
    transform: scale(1.04);
  }

  .mode__save {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
    font-size: 18px;
    font-weight: 600;
    padding: 8px 18px 8px 12px;
    border: none;
    border-radius: 999px;
    background: #d23b3b;
    color: #fff;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }

  .rec-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
  }

  #empty {
    font-size: 22px;
    color: var(--ink-faint, #9a9a9a);
    -webkit-app-region: no-drag;
  }
</style>
</head>
<body tabindex="-1">
  <div id="circle"></div>
  <div id="list"></div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;
    const win = getCurrentWindow();

    const listEl = document.getElementById('list');

    // Drive window size from JS so it can be tuned with a reload (no restart).
    const { LogicalSize } = window.__TAURI__.dpi;
    win.setSize(new LogicalSize(960, 690)).then(() => win.center()).catch(() => {});

    // mode === 'mode' picks a Mode for the active project; mode === 'project'
    // picks a project to activate first (shown when none is active).
    let picking = 'mode';
    let items = [];
    let activeIndex = 0;
    let saveArmed = false;          // Tab reveals a Record button on the active mode
    let projectPath = null;         // for saving the workspace back
    let workspace = null;

    function mi(name) {
      return `<span class="material-symbols-rounded">${name}</span>`;
    }

    async function loadModes() {
      saveArmed = false;
      const project = await invoke('get_active_project').catch(() => null);
      if (project) {
        projectPath = project.path;
        workspace = await invoke('read_workspace', { path: project.path }).catch(() => ({}));
        picking = 'mode';
        items = (workspace && workspace.modes) || [];
      } else {
        projectPath = null;
        workspace = null;
        picking = 'project';
        items = await applyProjectOrder(await invoke('list_projects').catch(() => []));
      }
      // Open on the last mode used for this project, if still present.
      const last = picking === 'mode' && projectPath
        ? localStorage.getItem('lastMode:' + projectPath)
        : null;
      const idx = last ? items.findIndex((m) => m.name === last) : -1;
      activeIndex = idx >= 0 ? idx : 0;
      render();
    }

    function rememberMode(name) {
      if (projectPath && name) localStorage.setItem('lastMode:' + projectPath, name);
    }

    // Match the overview's manual project order (read_project_order), falling
    // back to name order for any project not in the saved list.
    async function applyProjectOrder(projects) {
      let order = [];
      try {
        const raw = await invoke('read_project_order');
        order = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(order)) order = [];
      } catch (_) {}
      if (!order.length) return projects;
      const idx = new Map(order.map((p, i) => [p, i]));
      const rank = (p) => (idx.has(p) ? idx.get(p) : Infinity);
      return [...projects].sort(
        (a, b) =>
          rank(a.path) - rank(b.path) ||
          a.name.toLowerCase().localeCompare(b.name.toLowerCase()),
      );
    }

    function render() {
      listEl.innerHTML = '';
      listEl.classList.toggle('projects', picking === 'project');
      if (!items.length) {
        const empty = document.createElement('div');
        empty.id = 'empty';
        empty.tabIndex = 0;
        empty.textContent = picking === 'project'
          ? 'No projects'
          : 'No modes for this project';
        empty.style.outline = 'none';
        listEl.appendChild(empty);
        empty.focus();
        return;
      }
      items.forEach((item, i) => {
        const armed = saveArmed && i === activeIndex && picking === 'mode';
        const el = document.createElement('div');
        el.className = 'mode' + (i === activeIndex ? ' active' : '') + (armed ? ' armed' : '');
        el.tabIndex = 0;

        const nameEl = document.createElement('span');
        nameEl.className = 'mode__name';
        nameEl.textContent = item.name;
        el.appendChild(nameEl);

        if (armed) {
          const saveBtn = document.createElement('button');
          saveBtn.type = 'button';
          saveBtn.className = 'mode__save';
          saveBtn.innerHTML = '<span class="rec-dot"></span>Record';
          saveBtn.addEventListener('mousedown', (e) => e.preventDefault());
          saveBtn.addEventListener('click', () => recordActive());
          el.appendChild(saveBtn);
        }

        el.addEventListener('mouseenter', () => setActive(i));
        el.addEventListener('click', () => run(items[i]));
        listEl.appendChild(el);
      });
      focusActive();
    }

    function setActive(i) {
      if (i === activeIndex) return;
      const wasArmed = saveArmed;
      saveArmed = false;
      activeIndex = i;
      // Full rebuild only needed to drop a Record button from the old row;
      // otherwise just move the highlight (keeps focus stable for arrow keys).
      if (wasArmed) { render(); return; }
      [...listEl.children].forEach((el, idx) => el.classList.toggle('active', idx === i));
      focusActive();
    }

    function focusActive() {
      listEl.children[activeIndex]?.focus();
    }

    async function run(item) {
      if (!item) return;
      if (picking === 'project') {
        // Activate the picked project, then switch to its Modes in place.
        await invoke('open_project', { path: item.path }).catch(() => {});
        await loadModes();
        return;
      }
      rememberMode(item.name);
      await invoke('apply_window_layout', { layout: item.layout || [] }).catch(() => {});
      await win.hide();
    }

    // Record the current window layout into the active mode (same as the
    // workspace card's Record button), then persist the workspace.
    async function recordActive() {
      const mode = items[activeIndex];
      if (!mode || !workspace || !projectPath) return;
      try {
        mode.layout = await invoke('list_windows');
        mode.recordedAt = new Date().toISOString();
        workspace.modes = items;
        await invoke('save_workspace', { path: projectPath, workspace });
        rememberMode(mode.name);
        await win.hide();
      } catch (err) {
        console.error(err);
      }
      saveArmed = false;
    }

    document.addEventListener('keydown', async (e) => {
      if (e.key === 'Escape') {
        await win.hide();
        return;
      }
      if (!items.length) return;
      if (e.key === 'Tab') {
        e.preventDefault();
        if (picking === 'mode') { saveArmed = !saveArmed; render(); }
        return;
      }
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        setActive((activeIndex + 1) % items.length);
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        setActive((activeIndex - 1 + items.length) % items.length);
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (saveArmed && picking === 'mode') recordActive();
        else run(items[activeIndex]);
      }
    });

    // Built once, then hidden/shown — so just pull fresh modes each time it opens.
    listen('mode-switcher-shown', () => loadModes());

    // Keep keyboard focus on the selected mode so arrow/Esc keys reach us.
    window.addEventListener('focus', focusActive);

    loadModes();
  </script>
</body>
</html>
