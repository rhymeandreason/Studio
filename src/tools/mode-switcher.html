<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch Mode</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    height: 100vh;
    overflow: hidden;
    font-family: var(--font-ui, "Futura PT", sans-serif);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
    outline: none;
  }

  #circle {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 500px;
    height: 500px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: black;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.06);
    z-index: 0;
  }

  #list {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    -webkit-app-region: no-drag;
  }

  .mode {
    font-size: 56px;
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink-faint, #9a9a9a);
    opacity: 0.35;
    cursor: pointer;
    transition: opacity 0.12s, color 0.12s, transform 0.12s;
    white-space: nowrap;
  }

  .mode.active {
    color: var(--ink, #fff);
    opacity: 1;
    transform: scale(1.04);
  }

  #list.projects .mode { font-size: 32px; }

  .mode:focus { outline: none; }

  #empty {
    font-size: 22px;
    color: var(--ink-faint, #9a9a9a);
    -webkit-app-region: no-drag;
  }
</style>
</head>
<body tabindex="-1">
  <div id="circle"></div>
  <div id="list"></div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;
    const win = getCurrentWindow();

    const listEl = document.getElementById('list');

    // Drive window size from JS so it can be tuned with a reload (no restart).
    const { LogicalSize } = window.__TAURI__.dpi;
    win.setSize(new LogicalSize(960, 690)).then(() => win.center()).catch(() => {});

    // mode === 'mode' picks a Mode for the active project; mode === 'project'
    // picks a project to activate first (shown when none is active).
    let picking = 'mode';
    let items = [];
    let activeIndex = 0;

    async function loadModes() {
      const project = await invoke('get_active_project').catch(() => null);
      if (project) {
        const ws = await invoke('read_workspace', { path: project.path }).catch(() => ({}));
        picking = 'mode';
        items = (ws && ws.modes) || [];
      } else {
        picking = 'project';
        items = await invoke('list_projects').catch(() => []);
      }
      activeIndex = 0;
      render();
    }

    function render() {
      listEl.innerHTML = '';
      listEl.classList.toggle('projects', picking === 'project');
      if (!items.length) {
        const empty = document.createElement('div');
        empty.id = 'empty';
        empty.tabIndex = 0;
        empty.textContent = picking === 'project'
          ? 'No projects'
          : 'No modes for this project';
        empty.style.outline = 'none';
        listEl.appendChild(empty);
        empty.focus();
        return;
      }
      items.forEach((item, i) => {
        const el = document.createElement('div');
        el.className = 'mode' + (i === activeIndex ? ' active' : '');
        el.tabIndex = 0;
        el.textContent = item.name;
        el.addEventListener('mouseenter', () => setActive(i));
        el.addEventListener('click', () => run(items[i]));
        listEl.appendChild(el);
      });
      focusActive();
    }

    function setActive(i) {
      activeIndex = i;
      [...listEl.children].forEach((el, idx) => {
        el.classList.toggle('active', idx === i);
      });
      focusActive();
    }

    function focusActive() {
      listEl.children[activeIndex]?.focus();
    }

    async function run(item) {
      if (!item) return;
      if (picking === 'project') {
        // Activate the picked project, then switch to its Modes in place.
        await invoke('open_project', { path: item.path }).catch(() => {});
        await loadModes();
        return;
      }
      await invoke('apply_window_layout', { layout: item.layout || [] }).catch(() => {});
      await win.hide();
    }

    document.addEventListener('keydown', async (e) => {
      if (e.key === 'Escape') {
        await win.hide();
        return;
      }
      if (!items.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        setActive((activeIndex + 1) % items.length);
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        setActive((activeIndex - 1 + items.length) % items.length);
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        run(items[activeIndex]);
      }
    });

    // Built once, then hidden/shown — so just pull fresh modes each time it opens.
    listen('mode-switcher-shown', () => loadModes());

    // Keep keyboard focus on the selected mode so arrow/Esc keys reach us.
    window.addEventListener('focus', focusActive);

    loadModes();
  </script>
</body>
</html>
