<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch Mode</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    height: 100vh;
    overflow: hidden;
    font-family: var(--font-ui, "Futura PT", sans-serif);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
    outline: none;
  }

  #focuscatch {
    position: fixed;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    border: none;
    background: transparent;
    -webkit-app-region: no-drag;
  }

  #circle {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 420px;
    height: 420px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--surface, #2a2520);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.06);
    z-index: 0;
  }

  #list {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    -webkit-app-region: no-drag;
  }

  .mode {
    font-size: 56px;
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink-faint, #9a9a9a);
    opacity: 0.35;
    cursor: pointer;
    transition: opacity 0.12s, color 0.12s, transform 0.12s;
    white-space: nowrap;
  }

  .mode.active {
    color: var(--ink, #fff);
    opacity: 1;
    transform: scale(1.04);
  }

  #empty {
    font-size: 22px;
    color: var(--ink-faint, #9a9a9a);
    -webkit-app-region: no-drag;
  }
</style>
</head>
<body tabindex="-1">
  <input id="focuscatch" autofocus autocomplete="off" spellcheck="false" />
  <div id="circle"></div>
  <div id="list"></div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;
    const win = getCurrentWindow();

    const listEl = document.getElementById('list');

    let modes = [];
    let activeIndex = 0;

    async function loadModes() {
      modes = [];
      const project = await invoke('get_active_project').catch(() => null);
      if (project) {
        const ws = await invoke('read_workspace', { path: project.path }).catch(() => ({}));
        modes = (ws && ws.modes) || [];
      }
      activeIndex = 0;
      render();
    }

    function render() {
      listEl.innerHTML = '';
      if (!modes.length) {
        const empty = document.createElement('div');
        empty.id = 'empty';
        empty.textContent = 'No modes for this project';
        listEl.appendChild(empty);
        return;
      }
      modes.forEach((mode, i) => {
        const el = document.createElement('div');
        el.className = 'mode' + (i === activeIndex ? ' active' : '');
        el.textContent = mode.name;
        el.addEventListener('mousedown', (e) => e.preventDefault());
        el.addEventListener('mouseenter', () => setActive(i));
        el.addEventListener('click', () => run(modes[i]));
        listEl.appendChild(el);
      });
    }

    function setActive(i) {
      activeIndex = i;
      [...listEl.children].forEach((el, idx) => {
        el.classList.toggle('active', idx === i);
      });
    }

    async function run(mode) {
      if (!mode) return;
      await invoke('apply_window_layout', { layout: mode.layout || [] }).catch(() => {});
      await win.hide();
    }

    document.addEventListener('keydown', async (e) => {
      if (e.key === 'Escape') {
        await win.hide();
        return;
      }
      if (!modes.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        setActive((activeIndex + 1) % modes.length);
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        setActive((activeIndex - 1 + modes.length) % modes.length);
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        run(modes[activeIndex]);
      }
    });

    // Built once, then hidden/shown — so just pull fresh modes each time it opens.
    listen('mode-switcher-shown', async () => {
      await loadModes();
      document.getElementById('focuscatch').focus();
    });

    loadModes();
  </script>
</body>
</html>
