<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch Mode</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    height: 100vh;
    overflow: hidden;
    font-family: var(--font-ui, "Futura PT", sans-serif);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
    outline: none;
  }

  #circle {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 500px;
    height: 500px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: black;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.06);
    z-index: 0;
  }

  #list {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    -webkit-app-region: no-drag;
  }

  .mode {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink-faint, #9a9a9a);
    opacity: 0.35;
    transition: opacity 0.12s, color 0.12s, transform 0.12s;
    white-space: nowrap;
  }

  .mode.active {
    color: var(--ink, #fff);
    opacity: 1;
    transform: scale(1.04);
  }

  #list.projects .mode { font-size: 32px; }

  /* Project-name header above the modes — smaller, with a bit of breathing room. */
  .mode.header {
    font-size: 28px;
position: absolute;
    top: -80px;
  }

  .mode:focus { outline: none; }

  /* Armed: name scoots left, Record button appears on the right. */
  .mode.armed {
    flex-direction: row;
    align-items: center;
    gap: 28px;
    transform: scale(1.04);
  }

  .mode__save {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
    font-size: 18px;
    font-weight: 600;
    padding: 8px 18px 8px 12px;
    border: none;
    border-radius: 999px;
    background: #d23b3b;
    color: #fff;
    -webkit-app-region: no-drag;
  }

  .rec-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
  }

  .swatches {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-left: 16px;
  }

  .swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: transform 0.12s, border-color 0.12s;
  }

  .swatch.sel {
    border-color: var(--ink, #fff);
    transform: scale(1.18);
  }

  #empty {
    font-size: 22px;
    color: var(--ink-faint, #9a9a9a);
    -webkit-app-region: no-drag;
  }
</style>
</head>
<body tabindex="-1">
  <div id="circle"></div>
  <div id="list"></div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;
    const win = getCurrentWindow();

    const listEl = document.getElementById('list');

    // Drive window size from JS so it can be tuned with a reload (no restart).
    const { LogicalSize } = window.__TAURI__.dpi;
    win.setSize(new LogicalSize(960, 690)).then(() => win.center()).catch(() => {});

    // mode === 'mode' picks a Mode for the active project; mode === 'project'
    // picks a project to activate first (shown when none is active).
    let picking = 'mode';
    let items = [];
    let activeIndex = 0;
    let saveArmed = false;          // Tab reveals a Record button on the active mode
    let colorArmed = false;         // Tab on the header reveals color swatches
    let projectPath = null;         // currently-shown project (may be a preview)
    let projectName = null;         // shown as the navigable header in mode view
    let projectColor = '';          // this project's accent color (hex), if set
    let activePath = null;          // the actually-active project (vs. flipped preview)
    let workspace = null;

    const COLORS = ['#ff7a5c', '#ff5d8f', '#c77dff', '#4cc9f0', '#43e8a0', '#ffe066', '#a0e548'];

    // In mode view the active project name sits above the modes as a
    // selectable header at index -1 (Enter on it shows the project list).
    function headerPresent() { return picking === 'mode' && !!projectName; }
    function domIndex(i) { return headerPresent() ? i + 1 : i; } // i>=0 → child index

    function mi(name) {
      return `<span class="material-symbols-rounded">${name}</span>`;
    }

    async function loadModes() {
      saveArmed = false;
      const project = await invoke('get_active_project').catch(() => null);
      activePath = project ? project.path : null;
      if (project) {
        await showProjectModes(project, 0);
      } else {
        projectPath = null;
        projectName = null;
        workspace = null;
        picking = 'project';
        items = await applyProjectOrder(await invoke('list_projects').catch(() => []));
        activeIndex = 0;
        render();
      }
    }

    // Show a project's Modes (the active one, or a flipped preview). dir drives
    // the slide animation: 1 = came from the right, -1 = from the left, 0 = none.
    async function showProjectModes(project, dir) {
      saveArmed = false;
      colorArmed = false;
      projectPath = project.path;
      projectName = project.name;
      workspace = await invoke('read_workspace', { path: project.path }).catch(() => ({}));
      projectColor = (workspace && workspace.color) || '';
      picking = 'mode';
      items = (workspace && workspace.modes) || [];
      // Open on the last mode used for this project, if still present.
      const last = localStorage.getItem('lastMode:' + projectPath);
      const idx = last ? items.findIndex((m) => m.name === last) : -1;
      activeIndex = idx >= 0 ? idx : (items.length ? 0 : -1);
      render();
      if (dir) slideIn(dir);
    }

    // Flip to the previous/next project (in custom order) as a preview.
    async function flipProject(dir) {
      const projects = await applyProjectOrder(await invoke('list_projects').catch(() => []));
      if (projects.length < 2) return;
      let i = projects.findIndex((p) => p.path === projectPath);
      if (i < 0) i = 0;
      const target = projects[(i + dir + projects.length) % projects.length];
      if (target.path === projectPath) return;
      await showProjectModes(target, dir);
    }

    function slideIn(dir) {
      listEl.style.transition = 'none';
      listEl.style.transform = `translateX(${dir > 0 ? 70 : -70}px)`;
      listEl.style.opacity = '0';
      requestAnimationFrame(() => {
        listEl.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
        listEl.style.transform = 'translateX(0)';
        listEl.style.opacity = '1';
      });
    }

    // Switch from a project's modes to the project picker (Enter on header).
    async function showProjects() {
      const current = projectPath;
      picking = 'project';
      projectPath = null;
      projectName = null;
      workspace = null;
      items = await applyProjectOrder(await invoke('list_projects').catch(() => []));
      const idx = current ? items.findIndex((p) => p.path === current) : -1;
      activeIndex = idx >= 0 ? idx : 0;
      render();
    }

    function rememberMode(name) {
      if (projectPath && name) localStorage.setItem('lastMode:' + projectPath, name);
    }

    // Move through the color swatches and persist the project's accent color.
    function selectSwatch(dir) {
      const cur = COLORS.indexOf(projectColor);
      const next = cur < 0
        ? (dir > 0 ? 0 : COLORS.length - 1)
        : (cur + dir + COLORS.length) % COLORS.length;
      projectColor = COLORS[next];
      render();
      saveProjectColor();
    }

    async function saveProjectColor() {
      if (!workspace || !projectPath) return;
      workspace.color = projectColor;
      await invoke('save_workspace', { path: projectPath, workspace }).catch(() => {});
    }

    // Match the overview's manual project order (the "project-order" store), falling
    // back to name order for any project not in the saved list. Archived
    // projects (per the overview's Archived divider) are left out entirely —
    // this is a "switch to what I'm working on" tool, not a browser.
    async function applyProjectOrder(projects) {
      let archived = new Set();
      try {
        const raw = await invoke('read_store', { name: 'archived-projects' });
        const list = raw ? JSON.parse(raw) : [];
        archived = new Set(Array.isArray(list) ? list : []);
      } catch (_) {}
      projects = projects.filter((p) => !archived.has(p.path));

      let order = [];
      try {
        const raw = await invoke('read_store', { name: 'project-order' });
        order = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(order)) order = [];
      } catch (_) {}
      if (!order.length) return projects;
      const idx = new Map(order.map((p, i) => [p, i]));
      const rank = (p) => (idx.has(p) ? idx.get(p) : Infinity);
      return [...projects].sort(
        (a, b) =>
          rank(a.path) - rank(b.path) ||
          a.name.toLowerCase().localeCompare(b.name.toLowerCase()),
      );
    }

    function render() {
      listEl.innerHTML = '';
      listEl.classList.toggle('projects', picking === 'project');

      if (headerPresent()) {
        const h = document.createElement('div');
        h.className = 'mode header' + (activeIndex === -1 ? ' active' : '');
        h.tabIndex = 0;
        h.title = 'Switch project';

        const nameEl = document.createElement('span');
        nameEl.className = 'mode__name';
        nameEl.textContent = projectName;
        if (projectColor) nameEl.style.color = projectColor;
        h.appendChild(nameEl);

        if (colorArmed && activeIndex === -1) {
          const row = document.createElement('div');
          row.className = 'swatches';
          COLORS.forEach((c) => {
            const sw = document.createElement('span');
            sw.className = 'swatch' + (c === projectColor ? ' sel' : '');
            sw.style.background = c;
            row.appendChild(sw);
          });
          h.appendChild(row);
        }

        listEl.appendChild(h);
      }

      if (!items.length) {
        const empty = document.createElement('div');
        empty.id = 'empty';
        empty.tabIndex = 0;
        empty.textContent = picking === 'project'
          ? 'No projects'
          : 'No modes for this project';
        empty.style.outline = 'none';
        listEl.appendChild(empty);
        focusActive();
        return;
      }
      items.forEach((item, i) => {
        const armed = saveArmed && i === activeIndex && picking === 'mode';
        const el = document.createElement('div');
        el.className = 'mode' + (i === activeIndex ? ' active' : '') + (armed ? ' armed' : '');
        el.tabIndex = 0;

        const nameEl = document.createElement('span');
        nameEl.className = 'mode__name';
        nameEl.textContent = item.name;
        el.appendChild(nameEl);

        if (armed) {
          const saveBtn = document.createElement('span');
          saveBtn.className = 'mode__save';
          saveBtn.innerHTML = '<span class="rec-dot"></span>Record';
          el.appendChild(saveBtn);
        }

        listEl.appendChild(el);
      });
      focusActive();
    }

    function setActive(i) {
      if (i === activeIndex) return;
      const wasArmed = saveArmed || colorArmed;
      saveArmed = false;
      colorArmed = false;
      activeIndex = i;
      // Full rebuild only needed to drop a Record button / swatches from the old
      // row; otherwise just move the highlight (keeps focus stable for arrows).
      if (wasArmed) { render(); return; }
      const di = i < 0 ? 0 : domIndex(i);
      [...listEl.children].forEach((el, idx) => el.classList.toggle('active', idx === di));
      focusActive();
    }

    function focusActive() {
      const di = activeIndex < 0 ? 0 : domIndex(activeIndex);
      (listEl.children[di] || listEl.firstElementChild)?.focus();
    }

    async function run(item) {
      if (!item) return;
      if (picking === 'project') {
        // Activate the picked project, then switch to its Modes in place.
        await invoke('open_project', { path: item.path }).catch(() => {});
        await loadModes();
        return;
      }
      rememberMode(item.name);
      // If we're previewing a flipped project, activate it before applying.
      if (projectPath !== activePath) {
        await invoke('open_project', { path: projectPath }).catch(() => {});
      }
      await invoke('apply_window_layout', { layout: item.layout || [] }).catch(() => {});
      await win.hide();
    }

    // Record the current window layout into the active mode (same as the
    // workspace card's Record button), then persist the workspace.
    async function recordActive() {
      const mode = items[activeIndex];
      if (!mode || !workspace || !projectPath) return;
      try {
        mode.layout = await invoke('list_windows');
        mode.recordedAt = new Date().toISOString();
        workspace.modes = items;
        await invoke('save_workspace', { path: projectPath, workspace });
        rememberMode(mode.name);
        await win.hide();
      } catch (err) {
        console.error(err);
      }
      saveArmed = false;
    }

    document.addEventListener('keydown', async (e) => {
      if (e.key === 'Escape') {
        await win.hide();
        return;
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        if (picking !== 'mode') return;
        if (activeIndex === -1) { colorArmed = !colorArmed; render(); }
        else { saveArmed = !saveArmed; render(); }
        return;
      }

      if (picking === 'mode' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        // On the header with swatches showing, left/right pick a color;
        // otherwise they flip to the adjacent project.
        if (colorArmed && activeIndex === -1) selectSwatch(e.key === 'ArrowRight' ? 1 : -1);
        else flipProject(e.key === 'ArrowRight' ? 1 : -1);
        return;
      }

      const min = headerPresent() ? -1 : 0;  // -1 = the project-name header
      const max = items.length - 1;

      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        if (max < min) return;
        setActive(activeIndex + 1 > max ? min : activeIndex + 1);
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        if (max < min) return;
        setActive(activeIndex - 1 < min ? max : activeIndex - 1);
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (activeIndex === -1) {
          if (colorArmed) { colorArmed = false; render(); }
          else showProjects();
          return;
        }
        if (saveArmed && picking === 'mode') recordActive();
        else run(items[activeIndex]);
      }
    });

    // Built once, then hidden/shown — so just pull fresh modes each time it opens.
    listen('mode-switcher-shown', () => loadModes());

    // Keep keyboard focus on the selected mode so arrow/Esc keys reach us.
    window.addEventListener('focus', focusActive);

    loadModes();
  </script>
</body>
</html>
