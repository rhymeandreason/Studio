<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Editor</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="../deck/render.css" />
<script type="module" src="../kit/components.js"></script>
<script src="../vendor/marked.min.js"></script>
<style>
  body { background: var(--bg); color: var(--text); font-family: var(--sans); height: 100vh; display: flex; overflow: hidden; }

  /* Left: font browser (ported from Brand Explorer). */
  .browser { flex: 0 0 360px; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--hairline); }
  .browser-head { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--hairline); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--hairline-strong); background: var(--elevated); color: var(--text-muted); cursor: pointer; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .font-list { overflow-y: auto; padding: 8px 16px 24px; }
  .font-card { padding: 12px 14px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .font-sample { font-size: 24px; line-height: 1.1; min-width: 0; }
  .font-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .font-name { font-family: var(--sans); font-size: 11px; color: var(--text-muted); }
  .font-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .assign { font-size: 11px; padding: 4px 8px; height: auto; }
  .assign.on { background: var(--sage); border-color: var(--sage); color: #fff; }

  /* Right: theme controls bar over the live preview grid. */
  .editor { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .editor-head { padding: 10px 16px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 10px; }
  .editor-head input.name { border: none; background: transparent; color: var(--text); font-family: var(--serif); font-size: 15px; min-width: 140px; flex: 1 1 auto; }
  .editor-head .status { font-family: var(--mono); font-size: 11px; color: var(--text-muted); flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .editor-bar { padding: 10px 16px; border-bottom: 1px solid var(--hairline); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .ctl { display: flex; align-items: center; gap: 6px; }
  .ctl > .label { font-size: 11px; color: var(--text-soft); }
  .ctl select.field { height: 28px; padding: 0 22px 0 8px; font-size: 12px; width: auto; }
  .ctl input.field { height: 28px; padding: 0 6px; font-size: 12px; width: 56px; }
  .divider { width: 1px; align-self: stretch; background: var(--hairline-strong); margin: -2px 2px; }
  .swatches { display: flex; gap: 5px; }
  .swatch { position: relative; }
  .swatch-block { width: 26px; height: 26px; border-radius: var(--radius-sm); border: 1px solid var(--hairline-strong); cursor: pointer; }
  .coloris-trigger { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }

  .preview-grid { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; align-content: start; }
  .preview-tile { display: flex; flex-direction: column; gap: 6px; }
  .preview-frame { aspect-ratio: 16 / 9; border: 1px solid var(--hairline-strong); border-radius: var(--radius-sm); overflow: hidden; position: relative; background: #fff; }
  .preview-frame .scaler { position: absolute; top: 0; left: 0; transform-origin: top left; }
  .preview-tile .cap { font-size: 11px; color: var(--text-soft); text-align: center; }
</style>
</head>
<body>
  <div class="browser">
    <div class="browser-head">
      <input id="search" class="field" placeholder="Search fonts…" />
      <div class="chips" id="chips"></div>
    </div>
    <div class="font-list" id="font-list"></div>
  </div>

  <div class="editor">
    <div class="editor-head">
      <input class="name" id="theme-name" value="Untitled theme" spellcheck="false" />
      <div class="status" id="status"></div>
      <button class="btn btn-primary" id="save" style="display:none;">Save</button>
      <button class="btn btn-secondary" id="save-as">Save as new theme</button>
    </div>
    <div class="editor-bar">
      <div class="ctl"><span class="label">Heading</span><select class="field" id="heading-w"></select></div>
      <div class="ctl"><span class="label">Body</span><select class="field" id="body-w"></select></div>
      <div class="divider"></div>
      <div class="swatches" id="colors"></div>
      <div class="divider"></div>
      <div class="ctl"><span class="label">H size</span><input class="field" id="heading-size" type="number" min="24" max="120" /></div>
      <div class="ctl"><span class="label">B size</span><input class="field" id="body-size" type="number" min="12" max="48" /></div>
    </div>
    <div class="preview-grid" id="preview-grid"></div>
  </div>

  <script type="module">
    import { renderSlide, PREVIEW_SLIDES } from "../deck/render.js";
    const invoke = window.__TAURI__?.core?.invoke;

    // ---- Curated top Google Fonts (family, category) — same set as Brand Explorer.
    const FONTS = [
      ["Inter","sans"],["Roboto","sans"],["Open Sans","sans"],["Lato","sans"],
      ["Montserrat","sans"],["Poppins","sans"],["Raleway","sans"],["Nunito","sans"],
      ["Work Sans","sans"],["Source Sans 3","sans"],["Mulish","sans"],["Rubik","sans"],
      ["DM Sans","sans"],["Manrope","sans"],["Karla","sans"],["Figtree","sans"],
      ["Outfit","sans"],["Plus Jakarta Sans","sans"],["Hanken Grotesk","sans"],
      ["Be Vietnam Pro","sans"],["Space Grotesk","sans"],["Josefin Sans","sans"],
      ["Syne","sans"],["Onest","sans"],["Barlow","sans"],["Barlow Condensed","sans"],
      ["Noto Sans","sans"],["IBM Plex Sans","sans"],["Cabin","sans"],["Exo 2","sans"],
      ["Jost","sans"],["Urbanist","sans"],["Lexend","sans"],["Quicksand","sans"],
      ["Oxanium","sans"],["Albert Sans","sans"],["Instrument Sans","sans"],
      ["Geist","sans"],["Familjen Grotesk","sans"],["Schibsted Grotesk","sans"],
      ["Mona Sans","sans"],["Red Hat Display","sans"],["Encode Sans","sans"],
      ["Epilogue","sans"],["Archivo","sans"],["Chivo","sans"],
      ["Playfair Display","serif"],["Merriweather","serif"],["Lora","serif"],
      ["PT Serif","serif"],["Source Serif 4","serif"],["Libre Baskerville","serif"],
      ["EB Garamond","serif"],["Cormorant Garamond","serif"],["Crimson Text","serif"],
      ["Bitter","serif"],["Spectral","serif"],["Newsreader","serif"],
      ["Fraunces","serif"],["Instrument Serif","serif"],["Frank Ruhl Libre","serif"],
      ["Noto Serif","serif"],["IBM Plex Serif","serif"],["Libre Caslon Text","serif"],
      ["Zilla Slab","serif"],["Rokkitt","serif"],["Arvo","serif"],
      ["Cardo","serif"],["Vollkorn","serif"],["Alegreya","serif"],
      ["Domine","serif"],["Tinos","serif"],["Gilda Display","serif"],
      ["Bodoni Moda","serif"],["DM Serif Display","serif"],["Quando","serif"],
      ["Oswald","display"],["Bebas Neue","display"],["Anton","display"],
      ["Archivo Black","display"],["Abril Fatface","display"],["Righteous","display"],
      ["Comfortaa","display"],["Unbounded","display"],["Alfa Slab One","display"],
      ["Lilita One","display"],["Paytone One","display"],["Russo One","display"],
      ["Dela Gothic One","display"],["Big Shoulders Display","display"],
      ["Passion One","display"],["Teko","display"],["Barlow Semi Condensed","display"],
      ["Exo","display"],["Rajdhani","display"],["Cinzel","display"],
      ["Cormorant","display"],["Yeseva One","display"],["Ultra","display"],
      ["Titan One","display"],["Bungee","display"],["Silkscreen","display"],
      ["Black Ops One","display"],["Press Start 2P","display"],["Monoton","display"],
      ["Caveat","handwriting"],["Dancing Script","handwriting"],["Pacifico","handwriting"],
      ["Lobster","handwriting"],["Satisfy","handwriting"],["Shadows Into Light","handwriting"],
      ["Great Vibes","handwriting"],["Sacramento","handwriting"],["Kalam","handwriting"],
      ["Patrick Hand","handwriting"],["Indie Flower","handwriting"],["Permanent Marker","handwriting"],
      ["Yellowtail","handwriting"],["Courgette","handwriting"],["Marck Script","handwriting"],
      ["JetBrains Mono","mono"],["Roboto Mono","mono"],["Source Code Pro","mono"],
      ["Fira Code","mono"],["IBM Plex Mono","mono"],["Space Mono","mono"],
      ["Inconsolata","mono"],["DM Mono","mono"],["Noto Sans Mono","mono"],
      ["Courier Prime","mono"],["Anonymous Pro","mono"],["Overpass Mono","mono"],
      ["Red Hat Mono","mono"],["Geist Mono","mono"],["Martian Mono","mono"],
    ].map(([family, category]) => ({ family, category }));
    const CATEGORIES = ["all","sans","serif","display","handwriting","mono"];
    const WEIGHTS = [300,400,500,600,700,800];

    // ---- Lazy font loading --------------------------------------------------
    const loaded = new Set();
    function loadFont(family, weight){
      if (!family) return;
      const key = weight ? `${family}@${weight}` : family;
      if (loaded.has(key)) return; loaded.add(key);
      const l = document.createElement("link"); l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=" + family.replace(/ /g,"+") + (weight?`:wght@${weight}`:"") + "&display=swap";
      document.head.appendChild(l);
    }
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) { loadFont(e.target.dataset.family); io.unobserve(e.target); }
    }, { root: document.getElementById("font-list"), rootMargin: "200px" });

    function cssFallback(cat){ return cat==="serif"?"serif":cat==="mono"?"monospace":cat==="handwriting"?"cursive":"sans-serif"; }

    // ---- Theme state --------------------------------------------------------
    const COLOR_ROLES = [
      ["bg","Background"],["surface","Surface"],["text","Text"],
      ["muted","Muted"],["accent","Accent"],["accent2","Accent 2"],
    ];
    let theme = {
      name: "Untitled theme",
      fonts: { heading: { family: "Fraunces", weight: 600 }, body: { family: "Newsreader", weight: 400 } },
      colors: { bg:"#f7f5f0", surface:"#efece5", text:"#2a2a28", muted:"#6e6154", accent:"#a85a4a", accent2:"#3f5e5a" },
      headingSize: 56, bodySize: 24,
    };
    let activePath = null;
    let filter = "all", query = "";

    // ---- Font browser -------------------------------------------------------
    const listEl = document.getElementById("font-list");
    function renderChips(){
      const chips = document.getElementById("chips"); chips.innerHTML = "";
      for (const c of CATEGORIES) {
        const el = document.createElement("button");
        el.className = "chip" + (filter===c?" active":""); el.textContent = c;
        el.onclick = () => { filter = c; renderList(); };
        chips.appendChild(el);
      }
    }
    function assignBtn(label, family, role){
      const b = document.createElement("button");
      b.className = "btn assign" + (theme.fonts[role].family===family ? " on" : "");
      b.textContent = label;
      b.onclick = () => { theme.fonts[role].family = family; loadFont(family, theme.fonts[role].weight); renderList(); renderPreview(); };
      return b;
    }
    function renderList(){
      renderChips();
      listEl.innerHTML = "";
      const q = query.trim().toLowerCase();
      const items = FONTS.filter(f => (filter==="all"||f.category===filter) && (!q||f.family.toLowerCase().includes(q)));
      for (const f of items) {
        const card = document.createElement("div"); card.className = "font-card"; card.dataset.family = f.family;
        const meta = document.createElement("div"); meta.className = "font-meta";
        const sample = document.createElement("div"); sample.className = "font-sample";
        sample.style.fontFamily = `"${f.family}", ${cssFallback(f.category)}`; sample.textContent = f.family;
        const name = document.createElement("div"); name.className = "font-name"; name.textContent = f.category;
        meta.append(sample, name);
        const actions = document.createElement("div"); actions.className = "font-actions";
        actions.append(assignBtn("Head", f.family, "heading"), assignBtn("Body", f.family, "body"));
        card.append(meta, actions); listEl.appendChild(card); io.observe(card);
      }
    }
    document.getElementById("search").oninput = (e) => { query = e.target.value; renderList(); };

    // ---- Preview grid -------------------------------------------------------
    const grid = document.getElementById("preview-grid");
    function rescaleAll(){
      grid.querySelectorAll(".preview-frame").forEach(frame => {
        const scaler = frame.querySelector(".scaler");
        if (scaler) scaler.style.transform = `scale(${frame.clientWidth/1280})`;
      });
    }
    window.addEventListener("resize", rescaleAll);
    function renderPreview(){
      loadFont(theme.fonts.heading.family, theme.fonts.heading.weight);
      loadFont(theme.fonts.body.family, theme.fonts.body.weight);
      grid.innerHTML = "";
      for (const slide of PREVIEW_SLIDES) {
        const tile = document.createElement("div"); tile.className = "preview-tile";
        const frame = document.createElement("div"); frame.className = "preview-frame";
        const scaler = document.createElement("div"); scaler.className = "scaler";
        scaler.appendChild(renderSlide(slide, theme));
        frame.appendChild(scaler);
        const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = slide.layout;
        tile.append(frame, cap); grid.appendChild(tile);
      }
      requestAnimationFrame(rescaleAll);
    }

    // ---- Right controls: weights, colors, sizes, name -----------------------
    function initBarControls(){
      for (const role of ["heading","body"]) {
        const w = document.getElementById(`${role}-w`);
        w.innerHTML = WEIGHTS.map(n => `<option value="${n}">${n}</option>`).join("");
        w.value = theme.fonts[role].weight;
        w.onchange = () => { theme.fonts[role].weight = +w.value; loadFont(theme.fonts[role].family, theme.fonts[role].weight); renderPreview(); };
      }
      const colors = document.getElementById("colors"); colors.innerHTML = "";
      for (const [key, label] of COLOR_ROLES) {
        const sw = document.createElement("div"); sw.className = "swatch"; sw.title = label;
        const trigger = document.createElement("input"); trigger.type = "text"; trigger.className = "coloris-trigger";
        trigger.setAttribute("data-coloris",""); trigger.value = theme.colors[key];
        const block = document.createElement("div"); block.className = "swatch-block"; block.style.background = theme.colors[key];
        block.onclick = () => trigger.click();
        trigger.addEventListener("input", () => { theme.colors[key] = trigger.value; block.style.background = trigger.value; renderPreview(); });
        sw.append(trigger, block); colors.appendChild(sw);
      }
      const sc = document.createElement("studio-color"); sc.style.display = "none";
      document.body.appendChild(sc); requestAnimationFrame(() => sc.remove());

      const hs = document.getElementById("heading-size"), bs = document.getElementById("body-size");
      hs.value = theme.headingSize; bs.value = theme.bodySize;
      hs.oninput = () => { theme.headingSize = +hs.value || 56; renderPreview(); };
      bs.oninput = () => { theme.bodySize = +bs.value || 24; renderPreview(); };
      const name = document.getElementById("theme-name");
      name.value = theme.name; name.oninput = () => { theme.name = name.value; };
    }

    // ---- Save ---------------------------------------------------------------
    const statusEl = document.getElementById("status");
    function buildDoc(){
      return { kind:"theme", version:1, name: theme.name||"Untitled theme",
               fonts: theme.fonts, colors: theme.colors,
               headingSize: theme.headingSize, bodySize: theme.bodySize,
               savedAt: new Date().toISOString() };
    }
    document.getElementById("save").onclick = async () => {
      try { await invoke("overwrite_artifact", { path: activePath, content: JSON.stringify(buildDoc(),null,2) }); statusEl.textContent = "Saved."; }
      catch(e){ statusEl.textContent = "Save failed: " + e; }
    };
    document.getElementById("save-as").onclick = async () => {
      const name = theme.name || "Untitled theme";
      const content = JSON.stringify(buildDoc(), null, 2);
      if (invoke) {
        try { const p = await invoke("save_artifact", { kind:"theme", name, content });
              activePath = p; document.getElementById("save").style.display = ""; statusEl.textContent = "Saved → " + p; }
        catch(e){ statusEl.textContent = "Save failed: " + e; }
      } else {
        const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content],{type:"application/json"}));
        a.download = name.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".json"; a.click();
      }
    };

    // ---- Boot ---------------------------------------------------------------
    async function boot(){
      const path = new URLSearchParams(location.search).get("artifact");
      if (path && invoke) {
        try {
          const data = JSON.parse(await invoke("read_artifact", { path }));
          if (data.fonts) theme.fonts = data.fonts;
          if (data.colors) theme.colors = { ...theme.colors, ...data.colors };
          if (data.name) theme.name = data.name;
          if (data.headingSize) theme.headingSize = data.headingSize;
          if (data.bodySize) theme.bodySize = data.bodySize;
          activePath = path; document.getElementById("save").style.display = "";
        } catch(e){ statusEl.textContent = "Couldn't load theme: " + e; }
      }
      initBarControls();
      renderList();
      renderPreview();
    }
    boot();
  </script>
</body>
</html>
