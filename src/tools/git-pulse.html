<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Pulse</title>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="../kit/window-chrome.css" />
<script type="module" src="../kit/components.js"></script>
<script type="module" src="../kit/window-chrome.js"></script>
<style>
  /* The last 7 days as rows, each commit a dot placed at its time of day — so
     the card reads as a work rhythm, not just a tally. */
  body {
    --pane: var(--bg);
    font-family: var(--sans);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Embedded in the Git panel, sit flush on the card's white. */
  body.is-embedded { --pane: var(--elevated); }

  .tb-title {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .titlebar h1 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1;
  }

  #stats-bar {
    background: var(--pane);
    display: flex;
    gap: 22px;
    padding: 4px 20px 12px;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .stat-val {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0;
    color: var(--text);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  #scroll-area {
    background: var(--pane);
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 24px;
  }

  .day-section { margin-bottom: 20px; }
  .day-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .day-row .label {
    width: 84px;
    flex-shrink: 0;
  }
  .dots {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    cursor: default;
    transition: transform var(--dur-fast) var(--ease-standard),
                opacity  var(--dur-fast) var(--ease-standard);
    flex-shrink: 0;
  }
  .dot:hover { transform: scale(1.6); opacity: 0.7; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--border);
    color: var(--bg);
    font-family: var(--sans);
    font-size: 12px;
    line-height: 1.4;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    max-width: 260px;
    z-index: 100;
    display: none;
  }
  #tooltip strong { display: block; font-weight: 600; margin-bottom: 2px; }
  #tooltip .tip-meta {
    font-family: var(--mono);
    font-size: 10px;
    opacity: 0.6;
  }

  #empty {
    background: var(--pane);
    display: none;
    flex: 1;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 12px;
  }
</style>
</head>
<body class="outline-window">

<div class="titlebar" data-window-bar>
  <div class="tb-title" data-window-close>
    <h1>Git Pulse</h1>
  </div>
</div>

<div id="stats-bar">
  <div class="stat"><span class="stat-val" id="s-total">—</span>Commits</div>
  <div class="stat"><span class="stat-val" id="s-days">—</span>Active days</div>
  <div class="stat"><span class="stat-val" id="s-streak">—</span>Day streak</div>
</div>

<div id="scroll-area" class="main"></div>
<div id="empty">No commits found in the last 7 days.</div>
<div id="tooltip"></div>

<script type="module">
import { hasTauri, invoke, esc } from "../kit/app.js";

const scrollArea = document.getElementById('scroll-area');
const empty      = document.getElementById('empty');
const tooltip    = document.getElementById('tooltip');

function repoFromUrl() {
  return new URLSearchParams(location.search).get('repo') || '';
}

// When embedded in the Git panel, ?color= carries the project accent — tint the
// commit dots with it (they use var(--accent)).
const _color = new URLSearchParams(location.search).get('color');
if (_color) document.documentElement.style.setProperty('--accent', _color);

function parseLog(raw) {
  return raw.trim().split('\n').filter(Boolean).map(line => {
    const [hash, short, subject, author, date, iso] = line.split('\x1f');
    return { hash, short, subject, author, date, iso };
  });
}

function groupByDay(commits) {
  const map = new Map();
  for (const c of commits) {
    const day = c.iso ? c.iso.slice(0, 10) : 'unknown';
    if (!map.has(day)) map.set(day, []);
    map.get(day).push(c);
  }
  return map;
}

const DAY_MS = 86400000;
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

function dayLabel(iso) {
  const d = new Date(iso + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - d) / DAY_MS);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', '');
}

// "2026-06-18 14:32:00 +0000" → minutes since midnight (committer's clock).
function minuteOf(c) {
  const m = c.iso && c.iso.match(/ (\d{2}):(\d{2})/);
  return m ? +m[1] * 60 + +m[2] : 0;
}

function streak(days) {
  if (!days.length) return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  let count = 0, cursor = new Date(today);
  for (const d of days) {
    const dd = new Date(d + 'T00:00:00');
    const diff = Math.round((cursor - dd) / DAY_MS);
    if (diff === 0 || diff === 1) { count++; cursor = dd; } else break;
  }
  return count;
}

function render(commits) {
  scrollArea.innerHTML = '';
  empty.style.display = 'none';

  const byDay = groupByDay(commits);
  const sortedDays = [...byDay.keys()].sort((a,b) => b.localeCompare(a));
  document.getElementById('s-total').textContent = commits.length;
  document.getElementById('s-days').textContent = sortedDays.length;
  document.getElementById('s-streak').textContent = streak(sortedDays);

  if (!commits.length) {
    scrollArea.style.display = 'none';
    empty.style.display = 'flex';
    return;
  }
  scrollArea.style.display = '';

  for (const day of sortedDays) {
    const section = document.createElement('div');
    section.className = 'day-section';
    const row = document.createElement('div');
    row.className = 'day-row';
    row.innerHTML = `<div class="label">${dayLabel(day)}</div><div class="dots"></div>`;
    const dots = row.querySelector('.dots');
    for (const c of byDay.get(day)) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.addEventListener('mouseenter', e => showTooltip(e, c));
      dot.addEventListener('mousemove',  e => moveTooltip(e));
      dot.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
      dots.appendChild(dot);
    }
    section.appendChild(row);
    scrollArea.appendChild(section);
  }
}

function showTooltip(e, c) {
  const m = minuteOf(c);
  tooltip.innerHTML = `<strong>${esc(c.subject || '')}</strong>` +
    `<span class="tip-meta">${pad(Math.floor(m / 60))}:${pad(m % 60)} · ${esc(c.short || '')}</span>`;
  tooltip.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e) {
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  tooltip.style.left = Math.max(4, Math.min(e.clientX + 12, window.innerWidth - w - 4)) + 'px';
  tooltip.style.top  = Math.max(4, Math.min(e.clientY + 12, window.innerHeight - h - 4)) + 'px';
}
async function load(repo) {
  try {
    const raw = await invoke('git_log_week', { repo });
    render(parseLog(raw));
  } catch (err) {
    scrollArea.innerHTML = `<p class="text-muted" style="padding:20px 0">${esc(String(err))}</p>`;
    empty.style.display = 'none';
  }
}

if (hasTauri) {
  const r = repoFromUrl();
  if (r) load(r);
} else {
  // Browser preview: a plausible week relative to today.
  const now = new Date(); now.setHours(0,0,0,0);
  const at = (daysAgo, hh, mm) => {
    const d = new Date(now - daysAgo * DAY_MS);
    return { hash: 'x' + daysAgo + hh + mm, short: 'a1b' + pad(hh) + pad(mm), subject: 'bloodflow: crescents collide, stick on contact',
      author: 'Mary Huang', date: '', iso: `${dayKey(d)} ${pad(hh)}:${pad(mm)}:00 +0000` };
  };
  render([
    at(1, 10, 12), at(1, 11, 40), at(1, 15, 5), at(1, 22, 30),
    ...[9, 10, 10, 11, 13, 14, 14, 15, 16, 16, 17, 21, 23].map((h, i) => at(3, h, (i * 17) % 60)),
    at(4, 14, 2), at(4, 18, 45),
    ...[8, 9, 9, 10, 12, 13, 13, 14, 15, 19, 20, 20, 21, 22].map((h, i) => at(5, h, (i * 23) % 60)),
  ]);
}
</script>
</body>
</html>
