<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Pulse</title>
<link rel="stylesheet" href="../tokens.css" />
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #efece5;
    --border: #2a2a28;
    --hairline: rgba(42, 42, 40, 0.12);
    --text: #2a2a28;
    --text-muted: #8a8678;
    --mono: "SF Mono", Menlo, monospace;
    --sans: "Futura", "Futura PT", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #header {
    padding: 28px 20px 14px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
  }
  #header h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  #repo-path {
    flex: 1;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    background: transparent;
    border: none;
    outline: none;
    border-bottom: 1px solid var(--hairline);
    padding: 2px 4px;
    min-width: 0;
  }
  #repo-path:focus { border-bottom-color: var(--border); }
  #load-btn {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--border);
    color: var(--bg);
    border: none;
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 2px;
    flex-shrink: 0;
  }
  #load-btn:hover { opacity: 0.85; }

  #stats-bar {
    display: flex;
    gap: 24px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
  }
  .stat { font-size: 11px; }
  .stat-val { font-weight: 700; font-size: 20px; display: block; }

  #scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 24px;
  }

  .day-section { margin-bottom: 24px; }
  .day-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .day-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    width: 90px;
    flex-shrink: 0;
  }
  .dots {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
    cursor: default;
    transition: transform 0.1s, opacity 0.1s;
    flex-shrink: 0;
  }
  .dot:hover {
    transform: scale(1.5);
    opacity: 0.7;
  }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--border);
    color: var(--bg);
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 3px;
    max-width: 320px;
    z-index: 100;
    display: none;
    line-height: 1.5;
  }
  #tooltip strong { display: block; font-size: 12px; margin-bottom: 2px; }

  #empty {
    display: none;
    flex: 1;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13px;
  }
</style>
</head>
<body>

<div id="header">
  <h1>Git Pulse</h1>
  <input id="repo-path" type="text" placeholder="repo path…" spellcheck="false" />
  <button id="load-btn">Load</button>
</div>

<div id="stats-bar">
  <div class="stat"><span class="stat-val" id="s-total">—</span>commits</div>
  <div class="stat"><span class="stat-val" id="s-days">—</span>days active</div>
  <div class="stat"><span class="stat-val" id="s-streak">—</span>day streak</div>
</div>

<div id="scroll-area"></div>
<div id="empty">No commits found in the last 7 days.</div>
<div id="tooltip"></div>

<script type="module">
const invoke = window.__TAURI__?.core?.invoke;

const repoInput = document.getElementById('repo-path');
const loadBtn   = document.getElementById('load-btn');
const scrollArea = document.getElementById('scroll-area');
const empty     = document.getElementById('empty');
const tooltip   = document.getElementById('tooltip');

function repoFromUrl() {
  return new URLSearchParams(location.search).get('repo') || '';
}

function parseLog(raw) {
  return raw.trim().split('\n').filter(Boolean).map(line => {
    const [hash, short, subject, author, date, iso] = line.split('\x1f');
    return { hash, short, subject, author, date, iso };
  });
}

function groupByDay(commits) {
  const map = new Map();
  for (const c of commits) {
    const day = c.iso ? c.iso.slice(0, 10) : 'unknown';
    if (!map.has(day)) map.set(day, []);
    map.get(day).push(c);
  }
  return map;
}

function dayLabel(iso) {
  const d = new Date(iso + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((today - d) / 86400000);
  const full = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return full[d.getDay()] + ' ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function streak(days) {
  if (!days.length) return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  let count = 0, cursor = new Date(today);
  for (const d of days) {
    const dd = new Date(d + 'T00:00:00');
    const diff = Math.round((cursor - dd) / 86400000);
    if (diff === 0 || diff === 1) { count++; cursor = dd; } else break;
  }
  return count;
}

function render(commits) {
  scrollArea.innerHTML = '';
  empty.style.display = 'none';

  if (!commits.length) {
    empty.style.display = 'flex';
    document.getElementById('s-total').textContent = '0';
    document.getElementById('s-days').textContent = '0';
    document.getElementById('s-streak').textContent = '0';
    return;
  }

  const byDay = groupByDay(commits);
  const sortedDays = [...byDay.keys()].sort((a,b) => b.localeCompare(a));

  document.getElementById('s-total').textContent = commits.length;
  document.getElementById('s-days').textContent = sortedDays.length;
  document.getElementById('s-streak').textContent = streak(sortedDays);

  for (const day of sortedDays) {
    const section = document.createElement('div');
    section.className = 'day-section';

    const row = document.createElement('div');
    row.className = 'day-row';

    const label = document.createElement('div');
    label.className = 'day-label';
    label.textContent = dayLabel(day);
    row.appendChild(label);

    const dots = document.createElement('div');
    dots.className = 'dots';

    for (const c of byDay.get(day)) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.addEventListener('mouseenter', e => showTooltip(e, c));
      dot.addEventListener('mousemove',  e => moveTooltip(e));
      dot.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
      dots.appendChild(dot);
    }

    row.appendChild(dots);
    section.appendChild(row);
    scrollArea.appendChild(section);
  }
}

function showTooltip(e, c) {
  const timeMatch = c.date ? c.date.match(/(\d{2}:\d{2})/) : null;
  const time = timeMatch ? timeMatch[1] : '';
  tooltip.innerHTML = `<strong>${escHtml(c.subject || '')}</strong>${escHtml(time)}  <span style="opacity:.5;font-family:var(--mono)">${escHtml(c.short || '')}</span>`;
  tooltip.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e) {
  tooltip.style.left = Math.min(e.clientX + 14, window.innerWidth - 340) + 'px';
  tooltip.style.top  = Math.max(0, e.clientY - 10) + 'px';
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function load() {
  const repo = repoInput.value.trim();
  if (!repo) return;
  loadBtn.textContent = '…';
  loadBtn.disabled = true;
  try {
    const raw = await invoke('git_log_week', { repo });
    render(parseLog(raw));
  } catch (err) {
    scrollArea.innerHTML = `<div style="color:var(--text-muted);font-size:12px;padding:20px 0">${escHtml(String(err))}</div>`;
    empty.style.display = 'none';
  } finally {
    loadBtn.textContent = 'Load';
    loadBtn.disabled = false;
  }
}

loadBtn.addEventListener('click', load);
repoInput.addEventListener('keydown', e => { if (e.key === 'Enter') load(); });

if (invoke) {
  const r = repoFromUrl();
  if (r) { repoInput.value = r; load(); }
} else {
  repoInput.value = '~/Projects/demo';
  render([
    { hash:'abc1234567890', short:'abc1234', subject:'feat: add commit pulse visualization', author:'Mary Huang', date:'Wed Jun 18 14:32', iso:'2026-06-18 14:32:00 +0000' },
    { hash:'def2345678901', short:'def2345', subject:'fix: resolve toolbar overlap on small screens', author:'Mary Huang', date:'Wed Jun 18 10:05', iso:'2026-06-18 10:05:00 +0000' },
    { hash:'ghi3456789012', short:'ghi3456', subject:'docs: tighten media.md', author:'Mary Huang', date:'Tue Jun 17 16:48', iso:'2026-06-17 16:48:00 +0000' },
    { hash:'jkl4567890123', short:'jkl4567', subject:'refactor: simplify state handling', author:'Mary Huang', date:'Tue Jun 17 09:22', iso:'2026-06-17 09:22:00 +0000' },
    { hash:'mno5678901234', short:'mno5678', subject:'chore: update dependencies', author:'Mary Huang', date:'Mon Jun 16 15:11', iso:'2026-06-16 15:11:00 +0000' },
  ]);
}
</script>
</body>
</html>
