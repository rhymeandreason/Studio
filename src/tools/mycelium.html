<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mycelium</title>
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../kit/kit.css" />
  <script type="module" src="../kit/components.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100vh; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- top bar ---- */
    #bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--hairline);
      background: var(--bg);
    }
    #bar .brand {
      display: flex; align-items: center; gap: 7px;
      font-weight: 600; font-size: 15px; margin-right: auto;
    }
    #bar .brand .mi { color: var(--accent); }

    /* ---- body split ---- */
    #split { flex: 1 1 auto; display: flex; min-height: 0; }

    /* ---- canvas ---- */
    #stage {
      position: relative;
      flex: 1 1 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 1px 1px, var(--hairline) 1px, transparent 0);
      background-size: 26px 26px;
      cursor: grab;
    }
    #stage.panning { cursor: grabbing; }
    #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    #edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      text-align: center;
    }
    .node, .node * {
      user-select: none; -webkit-user-select: none;
      -webkit-user-drag: none;
    }
    .node .dot {
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      margin: 0 auto;
      border: 1.5px solid var(--hairline-strong);
      background: var(--surface);
      transition: box-shadow .12s, transform .12s;
    }
    .node.tree .dot {
      width: 66px; height: 66px;
      background: var(--tree-color, var(--accent-soft));
      border-color: transparent;
    }
    .node.tree .dot .mi { color: #fff; font-size: 30px;
      mix-blend-mode: luminosity; opacity: .9; }
    .node.person .dot { width: 40px; height: 40px; font-size: 15px; font-weight: 600; }
    .node.selected .dot { box-shadow: 0 0 0 3px var(--accent-ring), 0 4px 14px rgba(0,0,0,.14); }
    .node .label {
      margin-top: 5px; font-size: 11.5px; line-height: 1.2;
      max-width: 96px; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .node.tree .label { font-weight: 600; font-size: 12.5px; max-width: 120px; }
    .node .sublabel { font-size: 10px; color: var(--text-muted); }

    #empty {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--text-muted); text-align: center; pointer-events: none;
    }
    #empty .mi { font-size: 40px; opacity: .5; }

    /* ---- inspector ---- */
    #inspector {
      flex: 0 0 320px;
      border-left: 1px solid var(--hairline);
      background: var(--bg);
      overflow-y: auto;
      padding: 16px 16px 40px;
    }
    #inspector.hidden { display: none; }
    #inspector .eyebrow { margin-bottom: 10px; }
    #inspector h2 { margin: 0 0 2px; font-size: 18px; }

    .insp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .insp-head .swatch {
      width: 26px; height: 26px; border-radius: 8px; flex: 0 0 auto;
      border: 1px solid var(--hairline-strong);
    }
    .row { margin-bottom: 12px; }
    .row > .label { display: block; margin-bottom: 4px; }
    .field { width: 100%; }
    .two { display: flex; gap: 8px; }
    .two > * { flex: 1; min-width: 0; }

    .contact-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .contact-row select.field { flex: 0 0 108px; }
    .contact-row input.field { flex: 1 1 auto; }
    .contact-row .btn-icon { flex: 0 0 auto; }

    .qr-wrap { text-align: center; margin: 6px 0 10px; }
    .qr-wrap img { width: 176px; height: 176px; background: #fff; border-radius: 12px;
      padding: 10px; border: 1px solid var(--hairline); }
    .link-box {
      display: flex; gap: 6px; align-items: center;
      background: var(--surface); border-radius: var(--radius-sm);
      padding: 6px 6px 6px 10px; font-size: 11px; margin-bottom: 8px;
    }
    .link-box code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: var(--mono, ui-monospace, monospace); }
    .divider { height: 1px; background: var(--hairline); margin: 16px 0; }
    .muted-note { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    .danger { color: #b4443a; }
    .toast {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 8px 14px;
      border-radius: 999px; font-size: 12px; opacity: 0; transition: opacity .2s;
      pointer-events: none; z-index: 50;
    }
    .toast.show { opacity: 1; }
    .pill-kind { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill-kind button {
      font-size: 11px; padding: 4px 9px; border-radius: 999px;
      border: 1px solid var(--hairline-strong); background: transparent;
      color: var(--text-muted); cursor: pointer;
    }
    .pill-kind button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  </style>
</head>

<body>
  <div id="bar">
    <div class="brand"><span class="mi">hub</span> Mycelium</div>
    <button class="btn" id="btn-me"><span class="mi mi-sm">badge</span> My card</button>
    <button class="btn" id="btn-settings"><span class="mi mi-sm">settings</span></button>
    <button class="btn btn-primary" id="btn-tree"><span class="mi mi-sm">add</span> New tree</button>
  </div>

  <div id="split">
    <div id="stage">
      <div id="world"><svg id="edges"></svg></div>
      <div id="empty">
        <span class="mi">hub</span>
        <div>No trees yet.<br>Create one for an event, place, company, or group.</div>
        <button class="btn btn-primary" id="btn-tree-empty"><span class="mi mi-sm">add</span> New tree</button>
      </div>
    </div>
    <aside id="inspector" class="hidden"></aside>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { forceSimulation, forceLink, forceManyBody, forceCollide } from "../vendor/d3-force.mjs";

    const invoke = window.__TAURI__?.core?.invoke;
    const CONTACT_TYPES = ["phone","email","linkedin","instagram","x","website","other"];
    const KINDS = ["event","place","company","group"];
    const KIND_ICON = { event:"event", place:"place", company:"business", group:"groups" };
    const TREE_COLORS = ["#7a5cff","#e0699a","#3aa6a0","#e08a3c","#5b8def","#8a7cff","#4caf7d"];

    let store = { version: 1, serverUrl: "", me: { name: "", contacts: [] }, trees: [], people: [] };
    let selected = null;            // { type:'tree'|'person', id } | null
    let view = { x: 120, y: 120, scale: 1 };
    let draggingId = null;          // node currently under the pointer — exempt from collision push
    let sim = null, simRunning = false; // live d3-force session, active only while dragging

    const $ = (s) => document.querySelector(s);
    const stage = $("#stage"), world = $("#world"), edges = $("#edges");
    const inspector = $("#inspector");

    const uid = (p) => p + Math.random().toString(36).slice(2, 8);
    const nowISO = () => new Date().toISOString();

    // ---------- persistence ----------
    // d3-force writes vx/vy/fx/fy/index onto tree & person objects directly (they
    // double as sim nodes). Strip those before writing mycelium.json so the saved
    // shape stays exactly the documented data model.
    const SIM_KEYS = ["vx", "vy", "fx", "fy", "index"];
    function cleanNode(o) {
      const c = { ...o };
      for (const k of SIM_KEYS) delete c[k];
      return c;
    }
    let saveTimer = null;
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        if (invoke) {
          const payload = { ...store, trees: store.trees.map(cleanNode), people: store.people.map(cleanNode) };
          await invoke("save_mycelium", { store: payload });
        }
      }, 400);
    }
    async function load() {
      if (invoke) {
        const onDisk = await invoke("read_mycelium");
        store = Object.assign(store, onDisk || {});
      }
      store.me ||= { name: "", contacts: [] };
      store.trees ||= []; store.people ||= [];
      render();
    }

    function toast(msg) {
      const t = $("#toast"); t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1600);
    }

    // ---------- model helpers ----------
    const tree = (id) => store.trees.find(t => t.id === id);
    const person = (id) => store.people.find(p => p.id === id);
    function primaryTreeOf(p) { return p.treeIds?.[0] ? tree(p.treeIds[0]) : null; }

    function layoutPerson(p) {
      // Assign a position if missing: fan around the primary tree hub.
      if (p.x != null && p.y != null) return;
      const t = primaryTreeOf(p);
      const base = t ? { x: t.x, y: t.y } : { x: 300, y: 200 };
      const siblings = store.people.filter(q => q.treeIds?.[0] === p.treeIds?.[0]);
      const i = siblings.indexOf(p);
      const n = Math.max(siblings.length, 1);
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      p.x = Math.round(base.x + Math.cos(a) * 150);
      p.y = Math.round(base.y + Math.sin(a) * 150);
    }

    // ---------- collision avoidance ----------
    // Radii roughly match the .dot sizes (66px/40px) plus breathing room.
    const NODE_RADIUS = { tree: 42, person: 27 };
    function resolveCollisions() {
      const nodes = [
        ...store.trees.map(t => ({ obj: t, r: NODE_RADIUS.tree })),
        ...store.people.map(p => ({ obj: p, r: NODE_RADIUS.person })),
      ];
      for (let iter = 0; iter < 6; iter++) {
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i], b = nodes[j];
            let dx = b.obj.x - a.obj.x, dy = b.obj.y - a.obj.y;
            let dist = Math.hypot(dx, dy);
            const minDist = a.r + b.r;
            if (dist >= minDist) continue;
            if (dist < 0.01) {
              // exactly coincident — nudge apart along a stable pseudo-random axis
              const a2 = (i * 13 + j * 7) % (Math.PI * 2);
              dx = Math.cos(a2); dy = Math.sin(a2); dist = 1;
            }
            const overlap = (minDist - dist) / 2;
            const nx = dx / dist, ny = dy / dist;
            const aPinned = a.obj.id === draggingId, bPinned = b.obj.id === draggingId;
            if (!aPinned) { a.obj.x -= nx * overlap; a.obj.y -= ny * overlap; }
            if (!bPinned) { b.obj.x += nx * overlap; b.obj.y += ny * overlap; }
          }
        }
      }
    }

    // ---------- drag physics ----------
    // A live d3-force session, spun up only while actively dragging a node.
    // The dragged node is pinned to the cursor (fx/fy); its direct neighbors
    // (people <-> tree links) are freed to react elastically via forceLink +
    // forceCollide, giving the "connected people follow the tree" motion a
    // springy, force-directed feel instead of a rigid delta copy. Everything
    // else stays pinned so the graph doesn't drift or rearrange on its own.
    function isTreeObj(d) { return d.kind !== undefined; }

    function startDragPhysics(draggedObj) {
      const nodes = [...store.trees, ...store.people];
      const links = [];
      for (const p of store.people) {
        for (const tid of (p.treeIds || [])) {
          const t = tree(tid); if (t) links.push({ source: p, target: t });
        }
      }
      const neighborIds = new Set();
      for (const l of links) {
        if (l.source === draggedObj) neighborIds.add(l.target.id);
        if (l.target === draggedObj) neighborIds.add(l.source.id);
      }
      for (const n of nodes) {
        if (n === draggedObj || neighborIds.has(n.id)) { n.fx = null; n.fy = null; }
        else { n.fx = n.x; n.fy = n.y; }
      }
      draggedObj.fx = draggedObj.x; draggedObj.fy = draggedObj.y;

      if (sim) sim.stop();
      sim = forceSimulation(nodes)
        .force("link", forceLink(links).distance(140).strength(0.6))
        .force("charge", forceManyBody().strength(-90))
        .force("collide", forceCollide(d => NODE_RADIUS[isTreeObj(d) ? "tree" : "person"] + 4).strength(0.9))
        .alpha(1).alphaTarget(0.35)
        .on("tick", render)
        .on("end", () => {
          simRunning = false;
          for (const n of nodes) { n.fx = n.x; n.fy = n.y; }
          render(); scheduleSave();
        });
      simRunning = true;
    }
    function coolDragPhysics() {
      sim?.alphaTarget(0);
    }

    // ---------- rendering ----------
    function applyView() {
      // #edges is a child of #world, so it inherits this transform for free —
      // no separate sync needed (that split used to let the lines drift/detach
      // from the nodes on zoom, since two elements never scale in perfect lockstep).
      world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    }

    // Persistent DOM elements keyed by node id. render() used to tear down and
    // rebuild every .node on each call — including the one under the pointer —
    // which released its pointer capture mid-drag (removing a captured element
    // from the DOM ends the capture per spec) and made dragging die after one
    // move. Now nodes are created once and updated in place.
    const nodeEls = new Map();

    function render() {
      $("#empty").style.display = store.trees.length ? "none" : "flex";

      for (const p of store.people) layoutPerson(p);
      if (!simRunning) resolveCollisions(); // the d3-force session handles collision live while dragging

      let lines = "";
      for (const p of store.people) {
        for (const tid of (p.treeIds || [])) {
          const t = tree(tid); if (!t) continue;
          lines += `<line x1="${t.x}" y1="${t.y}" x2="${p.x}" y2="${p.y}"
            stroke="var(--hairline-strong)" stroke-width="1.5" />`;
        }
      }
      edges.innerHTML = lines;

      const live = new Set();
      for (const t of store.trees) { live.add(t.id); updateTreeNode(t); }
      for (const p of store.people) { live.add(p.id); updatePersonNode(p); }
      for (const [id, el] of nodeEls) {
        if (!live.has(id)) { el.remove(); nodeEls.delete(id); }
      }
      applyView();
    }

    function initials(name) {
      return (name || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase() || "?";
    }

    function getNodeEl(id, type, obj) {
      let el = nodeEls.get(id);
      if (!el) {
        el = document.createElement("div");
        wireNode(el, type, obj);
        world.appendChild(el);
        nodeEls.set(id, el);
      }
      return el;
    }

    function updateTreeNode(t) {
      const el = getNodeEl(t.id, "tree", t);
      el.className = "node tree" + (isSel("tree", t.id) ? " selected" : "");
      el.style.left = t.x + "px"; el.style.top = t.y + "px";
      el.style.setProperty("--tree-color", t.color || "var(--accent)");
      el.innerHTML =
        `<div class="dot"><span class="mi">${KIND_ICON[t.kind] || "hub"}</span></div>
         <div class="label">${esc(t.name || "Untitled")}</div>` +
        (t.date ? `<div class="sublabel">${esc(t.date)}</div>` : "");
    }
    function updatePersonNode(p) {
      const el = getNodeEl(p.id, "person", p);
      el.className = "node person" + (isSel("person", p.id) ? " selected" : "");
      el.style.left = p.x + "px"; el.style.top = p.y + "px";
      el.innerHTML =
        `<div class="dot">${esc(initials(p.name))}</div>
         <div class="label">${esc(p.name || "New contact")}</div>`;
    }

    // node drag + select
    function wireNode(el, type, obj) {
      let moved = false, start = null;
      el.addEventListener("dragstart", (e) => e.preventDefault());
      el.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        e.preventDefault(); // stop WKWebView's native text/icon drag-ghost from hijacking the gesture
        moved = false;
        start = { mx: e.clientX, my: e.clientY, ox: obj.x, oy: obj.y };
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener("pointermove", (e) => {
        if (!start) return;
        const dx = (e.clientX - start.mx) / view.scale;
        const dy = (e.clientY - start.my) / view.scale;
        if (Math.abs(dx) + Math.abs(dy) > 3 && !moved) { moved = true; draggingId = obj.id; startDragPhysics(obj); }
        obj.x = Math.round(start.ox + dx); obj.y = Math.round(start.oy + dy);
        if (moved) { obj.fx = obj.x; obj.fy = obj.y; }
        el.style.left = obj.x + "px"; el.style.top = obj.y + "px";
        render(); // keeps edges attached; physics tick also renders, this keeps input feel responsive
      });
      el.addEventListener("pointerup", (e) => {
        el.releasePointerCapture(e.pointerId);
        start = null;
        draggingId = null;
        if (moved) { coolDragPhysics(); scheduleSave(); }
        else { select(type, obj.id); }
      });
    }

    const isSel = (type, id) => selected && selected.type === type && selected.id === id;
    function select(type, id) { selected = { type, id }; render(); showInspector(); }
    function deselect() { selected = null; render(); inspector.classList.add("hidden"); }

    // ---------- stage pan / zoom ----------
    (function panZoom() {
      let panning = null;
      stage.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".node")) return;
        panning = { mx: e.clientX, my: e.clientY, vx: view.x, vy: view.y };
        stage.classList.add("panning");
        deselect();
      });
      window.addEventListener("pointermove", (e) => {
        if (!panning) return;
        view.x = panning.vx + (e.clientX - panning.mx);
        view.y = panning.vy + (e.clientY - panning.my);
        applyView();
      });
      window.addEventListener("pointerup", () => { panning = null; stage.classList.remove("panning"); });
      stage.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = stage.getBoundingClientRect();
        const px = e.clientX - rect.left, py = e.clientY - rect.top;
        const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
        const ns = Math.min(2.5, Math.max(0.3, view.scale * factor));
        // zoom toward cursor
        view.x = px - (px - view.x) * (ns / view.scale);
        view.y = py - (py - view.y) * (ns / view.scale);
        view.scale = ns;
        applyView();
      }, { passive: false });
    })();

    // ---------- inspector ----------
    function showInspector() {
      if (!selected) return inspector.classList.add("hidden");
      inspector.classList.remove("hidden");
      if (selected.type === "tree") renderTreeInspector(tree(selected.id));
      else renderPersonInspector(person(selected.id));
    }

    function contactRows(list, onChange) {
      const wrap = document.createElement("div");
      const draw = () => {
        wrap.innerHTML = "";
        list.forEach((c, i) => {
          const row = document.createElement("div");
          row.className = "contact-row";
          row.innerHTML =
            `<select class="field">${CONTACT_TYPES.map(t =>
              `<option ${t === c.type ? "selected" : ""}>${t}</option>`).join("")}</select>
             <input class="field" placeholder="value" value="${esc(c.value || "")}">
             <button class="btn-icon" title="Remove"><span class="mi mi-sm">close</span></button>`;
          const [sel, inp, rm] = row.children;
          sel.onchange = () => { c.type = sel.value; onChange(); };
          inp.oninput = () => { c.value = inp.value; onChange(); };
          rm.onclick = () => { list.splice(i, 1); draw(); onChange(); };
          wrap.appendChild(row);
        });
        const add = document.createElement("button");
        add.className = "btn btn-ghost"; add.style.marginTop = "2px";
        add.innerHTML = `<span class="mi mi-sm">add</span> Add contact`;
        add.onclick = () => { list.push({ type: "email", value: "" }); draw(); onChange(); };
        wrap.appendChild(add);
      };
      draw();
      return wrap;
    }

    // Person <-> tree links: a person can connect to several trees at once
    // (e.g. a friend met at an event who's also part of a company you track).
    function treeLinks(p, onChange) {
      p.treeIds ||= [];
      const wrap = document.createElement("div");
      const draw = () => {
        wrap.innerHTML = "";
        p.treeIds.forEach((tid, i) => {
          const t = tree(tid);
          const row = document.createElement("div");
          row.className = "contact-row";
          row.innerHTML =
            `<div class="field" style="display:flex; align-items:center; gap:6px; flex:1 1 auto;">
               <span style="width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:${t?.color || 'var(--accent)'}"></span>
               ${esc(t?.name || "Deleted tree")}
             </div>
             <button class="btn-icon" title="Disconnect"><span class="mi mi-sm">close</span></button>`;
          row.lastElementChild.onclick = () => {
            p.treeIds.splice(i, 1);
            if (!p.treeIds.length) { p.x = p.y = null; } // fall back to auto-layout
            draw(); onChange();
          };
          wrap.appendChild(row);
        });

        const remaining = store.trees.filter(t => !p.treeIds.includes(t.id));
        if (remaining.length) {
          const addRow = document.createElement("div"); addRow.className = "contact-row";
          const tsel = document.createElement("select"); tsel.className = "field";
          tsel.innerHTML = `<option value="" disabled selected>Connect to tree…</option>` +
            remaining.map(t => `<option value="${t.id}">${esc(t.name || "Untitled")}</option>`).join("");
          tsel.onchange = () => {
            if (!tsel.value) return;
            const first = !p.treeIds.length;
            p.treeIds.push(tsel.value);
            if (first) p.x = p.y = null; // re-layout around the new (first) hub
            draw(); onChange();
          };
          addRow.appendChild(tsel);
          wrap.appendChild(addRow);
        }
      };
      draw();
      return wrap;
    }

    function renderPersonInspector(p) {
      if (!p) return;
      inspector.innerHTML = `<div class="eyebrow">Contact</div>`;
      const head = document.createElement("div"); head.className = "insp-head";
      head.innerHTML = `<div class="swatch" style="background:${primaryTreeOf(p)?.color || 'var(--accent)'}"></div>`;
      const nameIn = fieldInput("Name", p.name, (v) => { p.name = v; render(); scheduleSave(); });
      inspector.appendChild(head);
      inspector.appendChild(nameIn);

      inspector.appendChild(sectionLabel("Trees"));
      inspector.appendChild(treeLinks(p, () => { render(); scheduleSave(); }));

      inspector.appendChild(sectionLabel("Contact info"));
      inspector.appendChild(contactRows(p.contacts ||= [], () => { render(); scheduleSave(); }));

      inspector.appendChild(fieldTextarea("Note", p.note, (v) => { p.note = v; scheduleSave(); }));

      inspector.appendChild(divider());
      const del = dangerBtn("Delete contact", () => {
        store.people = store.people.filter(x => x.id !== p.id);
        deselect(); scheduleSave();
      });
      inspector.appendChild(del);
    }

    function renderTreeInspector(t) {
      if (!t) return;
      inspector.innerHTML = `<div class="eyebrow">Tree</div>`;
      inspector.appendChild(fieldInput("Name", t.name, (v) => { t.name = v; render(); scheduleSave(); }));

      // kind pills
      const kr = document.createElement("div"); kr.className = "row";
      kr.innerHTML = `<span class="label">Type</span>`;
      const pk = document.createElement("div"); pk.className = "pill-kind";
      KINDS.forEach(k => {
        const b = document.createElement("button");
        b.textContent = k; if (t.kind === k) b.classList.add("on");
        b.onclick = () => { t.kind = k; render(); scheduleSave(); renderTreeInspector(t); };
        pk.appendChild(b);
      });
      kr.appendChild(pk); inspector.appendChild(kr);

      const two = document.createElement("div"); two.className = "row two";
      two.appendChild(inlineField("Date", "date", t.date, (v) => { t.date = v; render(); scheduleSave(); }));
      const colWrap = document.createElement("div");
      colWrap.innerHTML = `<span class="label">Color</span>`;
      const col = document.createElement("input"); col.type = "color"; col.value = t.color || "#7a5cff";
      col.className = "field"; col.style.height = "34px"; col.style.padding = "2px";
      col.oninput = () => { t.color = col.value; render(); scheduleSave(); };
      colWrap.appendChild(col); two.appendChild(colWrap);
      inspector.appendChild(two);

      // add person
      const addP = document.createElement("button");
      addP.className = "btn btn-primary"; addP.style.width = "100%"; addP.style.marginTop = "4px";
      addP.innerHTML = `<span class="mi mi-sm">person_add</span> Add person`;
      addP.onclick = () => {
        const p = { id: uid("person_"), name: "", contacts: [], treeIds: [t.id], note: "",
                    x: null, y: null, createdAt: nowISO(), sourceSubmissionId: null };
        store.people.push(p); render(); scheduleSave(); select("person", p.id);
      };
      inspector.appendChild(addP);

      inspector.appendChild(divider());

      // ---- sharing ----
      inspector.appendChild(sectionLabel("Share to collect contacts"));
      if (!store.serverUrl) {
        const hint = document.createElement("div"); hint.className = "muted-note";
        hint.innerHTML = `Set your Mycelium server URL in <b>Settings</b> to generate a QR and collect contacts.`;
        inspector.appendChild(hint);
      } else {
        const base = store.serverUrl.replace(/\/$/, "");
        const link = `${base}/?t=${t.id}`;
        const presenter = `${base}/show.html?t=${encodeURIComponent(t.id)}&name=${encodeURIComponent(t.name || "")}`;

        // The intake QR — what guests scan.
        const qr = document.createElement("div"); qr.className = "qr-wrap";
        qr.innerHTML = `<img alt="QR" src="${base}/api/qr?t=${encodeURIComponent(t.id)}" />`;
        inspector.appendChild(qr);

        const lb = document.createElement("div"); lb.className = "link-box";
        lb.innerHTML = `<code>${esc(link)}</code>`;
        const copy = document.createElement("button"); copy.className = "btn-icon";
        copy.innerHTML = `<span class="mi mi-sm">content_copy</span>`;
        copy.onclick = () => { navigator.clipboard.writeText(link); toast("Intake link copied"); };
        lb.appendChild(copy); inspector.appendChild(lb);

        // Handoff: scan this with YOUR phone to open the presenter page there,
        // then hold your phone up for guests to scan.
        inspector.appendChild(sectionLabel("Show on your phone"));
        const hint = document.createElement("div"); hint.className = "muted-note"; hint.style.marginTop = "0";
        hint.textContent = "Scan this with your own phone to pull up a full-screen QR you can show people.";
        inspector.appendChild(hint);
        const hqr = document.createElement("div"); hqr.className = "qr-wrap";
        hqr.innerHTML = `<img alt="Open on phone" style="width:128px;height:128px" src="${base}/api/qr?url=${encodeURIComponent(presenter)}" />`;
        inspector.appendChild(hqr);
        const plb = document.createElement("div"); plb.className = "link-box";
        plb.innerHTML = `<code>${esc(presenter)}</code>`;
        const pcopy = document.createElement("button"); pcopy.className = "btn-icon";
        pcopy.innerHTML = `<span class="mi mi-sm">content_copy</span>`;
        pcopy.onclick = () => { navigator.clipboard.writeText(presenter); toast("Presenter link copied"); };
        plb.appendChild(pcopy); inspector.appendChild(plb);

        inspector.appendChild(divider());
        const sync = document.createElement("button");
        sync.className = "btn"; sync.style.width = "100%";
        sync.innerHTML = `<span class="mi mi-sm">sync</span> Pull new contacts`;
        sync.onclick = () => pullInbox(t, sync);
        inspector.appendChild(sync);
      }

      inspector.appendChild(divider());
      const count = store.people.filter(p => p.treeIds?.includes(t.id)).length;
      const del = dangerBtn(`Delete tree (${count} contact${count===1?"":"s"})`, () => {
        if (count && !confirm("Delete this tree and detach its contacts?")) return;
        store.people.forEach(p => { p.treeIds = (p.treeIds||[]).filter(id => id !== t.id); });
        store.people = store.people.filter(p => (p.treeIds||[]).length);
        store.trees = store.trees.filter(x => x.id !== t.id);
        deselect(); scheduleSave();
      });
      inspector.appendChild(del);
    }

    // ---------- pull from Vercel inbox ----------
    async function pullInbox(t, btn) {
      const base = store.serverUrl.replace(/\/$/, "");
      btn.disabled = true; btn.innerHTML = `<span class="mi mi-sm">sync</span> Pulling…`;
      try {
        const res = await fetch(`${base}/api/pull?tree=${encodeURIComponent(t.id)}`);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const subs = await res.json(); // [{ id, name, contacts, note, createdAt }]
        let added = 0;
        for (const s of subs) {
          if (store.people.some(p => p.sourceSubmissionId === s.id)) continue;
          store.people.push({
            id: uid("person_"), name: s.name || "", contacts: s.contacts || [],
            treeIds: [t.id], note: s.note || "", x: null, y: null,
            createdAt: s.createdAt || nowISO(), sourceSubmissionId: s.id,
          });
          added++;
        }
        render(); scheduleSave();
        toast(added ? `Added ${added} contact${added===1?"":"s"}` : "No new contacts");
      } catch (e) {
        toast("Sync failed: " + e.message);
      } finally {
        btn.disabled = false; btn.innerHTML = `<span class="mi mi-sm">sync</span> Pull new contacts`;
      }
    }

    // ---------- settings / my card ----------
    function openSettings() {
      selected = null; render();
      inspector.classList.remove("hidden");
      inspector.innerHTML = `<div class="eyebrow">Settings</div>`;
      inspector.appendChild(fieldInput("Mycelium server URL", store.serverUrl,
        (v) => { store.serverUrl = v.trim(); scheduleSave(); }, "https://mycelium-xxx.vercel.app"));
      const note = document.createElement("div"); note.className = "muted-note";
      note.innerHTML = `The Vercel deployment that hosts your intake page + inbox. See <code>mycelium-web/README.md</code>.`;
      inspector.appendChild(note);
    }
    function openMyCard() {
      selected = null; render();
      inspector.classList.remove("hidden");
      inspector.innerHTML = `<div class="eyebrow">My card</div>`;
      const me = store.me ||= { name: "", contacts: [] };
      inspector.appendChild(fieldInput("Name", me.name, (v) => { me.name = v; scheduleSave(); }));
      inspector.appendChild(sectionLabel("Your contact info"));
      inspector.appendChild(contactRows(me.contacts ||= [], scheduleSave));
      const note = document.createElement("div"); note.className = "muted-note";
      note.innerHTML = `Shown to people on the intake page. Sync it to the server via <code>mycelium-web/public/me.json</code> for now.`;
      inspector.appendChild(note);
    }

    // ---------- small field builders ----------
    function fieldInput(label, val, onInput, ph = "") {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<span class="label">${label}</span>`;
      const i = document.createElement("input"); i.className = "field"; i.value = val || ""; i.placeholder = ph;
      i.oninput = () => onInput(i.value); row.appendChild(i); return row;
    }
    function inlineField(label, type, val, onInput) {
      const w = document.createElement("div");
      w.innerHTML = `<span class="label">${label}</span>`;
      const i = document.createElement("input"); i.type = type; i.className = "field"; i.value = val || "";
      i.oninput = () => onInput(i.value); w.appendChild(i); return w;
    }
    function fieldTextarea(label, val, onInput) {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<span class="label">${label}</span>`;
      const t = document.createElement("textarea"); t.className = "field"; t.rows = 2; t.value = val || "";
      t.oninput = () => onInput(t.value); row.appendChild(t); return row;
    }
    function sectionLabel(txt) {
      const d = document.createElement("div"); d.className = "label"; d.style.margin = "8px 0 6px"; d.textContent = txt; return d;
    }
    function divider() { const d = document.createElement("div"); d.className = "divider"; return d; }
    function dangerBtn(txt, onClick) {
      const b = document.createElement("button"); b.className = "btn btn-ghost danger"; b.style.width = "100%";
      b.innerHTML = `<span class="mi mi-sm">delete</span> ${txt}`; b.onclick = onClick; return b;
    }
    function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

    // ---------- new tree ----------
    function newTree() {
      const n = store.trees.length;
      const t = {
        id: uid("tree_"), name: "New tree", kind: "event", date: "",
        color: TREE_COLORS[n % TREE_COLORS.length],
        x: 240 + (n % 3) * 260, y: 200 + Math.floor(n / 3) * 220,
        createdAt: nowISO(),
      };
      store.trees.push(t); render(); scheduleSave(); select("tree", t.id);
    }

    $("#btn-tree").onclick = newTree;
    $("#btn-tree-empty").onclick = newTree;
    $("#btn-settings").onclick = openSettings;
    $("#btn-me").onclick = openMyCard;

    load();
  </script>
</body>
</html>
