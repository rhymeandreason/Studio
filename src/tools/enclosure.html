<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enclosure</title>
<!-- OrbitControls imports bare "three"; must precede every module script. -->
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../kit/kit.css" />
<link rel="stylesheet" href="../kit/window-chrome.css" />
<script type="module" src="../kit/components.js"></script>
<script type="module" src="../kit/window-chrome.js"></script>
<style>
  body { color: var(--text); font-family: var(--sans); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #titlebar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; }
  .tb-title { display: flex; align-items: center; gap: 8px; }
  #name { border: none; background: transparent; color: var(--text); font-family: var(--sans); font-size: 13px; width: 240px; min-width: 0; padding: 4px 6px; border-radius: var(--radius-sm); }
  #name:focus { outline: none; background: var(--elevated); }
  .tb-spacer { flex: 1 1 auto; }
  #dims { font-family: var(--mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; }

  #main { flex: 1 1 auto; display: flex; min-height: 0; background: var(--bg); border-top: 1px solid var(--hairline); }

  /* ---- 2D face editor ---- */
  .face-pane { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
  .pane-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
  .pill-tab sup { font-size: 9px; color: var(--text-soft); margin-left: 2px; }
  .pill-tab.is-active sup { color: var(--text-muted); }
  .add-btns { display: flex; gap: 2px; margin-left: auto; }
  .face-stage { flex: 1 1 auto; min-height: 0; position: relative; }
  #face-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
  #face-svg .cut { cursor: grab; }
  body.dragging, body.dragging #face-svg .cut { cursor: grabbing; }
  #face-svg .handle { cursor: nwse-resize; }
  #face-svg .handle[data-corner="ne"], #face-svg .handle[data-corner="sw"] { cursor: nesw-resize; }
  .face-foot { border-top: 1px solid var(--hairline); padding: 10px 12px; min-height: 58px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .face-foot .hint { align-self: center; }
  .foot-fld { display: flex; flex-direction: column; gap: 3px; width: 62px; }
  .foot-fld.wide { width: 120px; }
  .foot-fld > span, .fld > span { font-size: 10.5px; color: var(--text-muted); letter-spacing: .03em; }
  .foot-fld .field, .fld .field { height: 28px; font-size: 12px; padding: 0 7px; }
  .link-note { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); align-self: center; }

  /* ---- 3D view ---- */
  .view-pane { flex: 1.15 1 0; min-width: 0; position: relative; border-left: 1px solid var(--hairline); }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .view-tools { position: absolute; top: 10px; left: 10px; display: flex; gap: 2px; z-index: 1; }
  .view-status { position: absolute; left: 12px; right: 12px; bottom: 10px; font-family: var(--mono); font-size: 11px; color: var(--text-muted); display: flex; gap: 10px; align-items: center; pointer-events: none; }
  .view-status a { color: var(--text); text-decoration: underline; cursor: pointer; pointer-events: auto; }

  /* ---- inspector ---- */
  .inspector { flex: 0 0 280px; border-left: 1px solid var(--hairline); overflow-y: auto; }
  .insp-sec { padding: 14px; border-bottom: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .hint { font-size: 11px; color: var(--text-muted); line-height: 1.45; }
  .hint.warn { color: var(--rose); }
  .port-row { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; }
  .port-row .edge { margin-left: auto; font-size: 10.5px; color: var(--text-soft); }
  .sec-head { display: flex; align-items: center; justify-content: space-between; }
  .size-readout { font-family: var(--mono); font-size: 12px; }
  textarea.field { font-family: var(--mono); font-size: 11px; min-height: 70px; }
</style>
</head>
<body>
  <div id="titlebar" data-window-bar>
    <div class="tb-title" data-window-close><span class="eyebrow">Enclosure</span></div>
    <input id="name" spellcheck="false" />
    <span class="tb-spacer"></span>
    <span id="dims"></span>
    <button class="btn btn-primary" id="export"><span class="mi mi-sm ph ph-download-simple"></span> Export STL</button>
  </div>

  <div id="main">
    <section class="face-pane">
      <div class="pane-bar">
        <div class="pill-tabs" id="face-tabs"></div>
        <div class="add-btns">
          <button class="btn btn-icon btn-ghost" data-add="rect" title="Add rectangle"><span class="mi mi-sm ph ph-square"></span></button>
          <button class="btn btn-icon btn-ghost" data-add="slot" title="Add slot"><span class="mi mi-sm ph ph-pill"></span></button>
          <button class="btn btn-icon btn-ghost" data-add="circle" title="Add round hole"><span class="mi mi-sm ph ph-circle"></span></button>
          <button class="btn btn-icon btn-ghost" data-add="vent" title="Add vent grille"><span class="mi mi-sm ph ph-columns"></span></button>
        </div>
      </div>
      <div class="face-stage"><svg id="face-svg"></svg></div>
      <div class="face-foot" id="foot"></div>
    </section>

    <section class="view-pane" id="view-pane">
      <canvas id="view" tabindex="-1"></canvas>
      <div class="view-tools">
        <button class="btn btn-icon btn-ghost" id="t-lid" title="Show lid"><span class="mi mi-sm ph-fill ph-package"></span></button>
        <button class="btn btn-icon btn-ghost" id="t-explode" title="Lift lid"><span class="mi mi-sm ph ph-arrows-out-line-vertical"></span></button>
        <button class="btn btn-icon btn-ghost" id="t-board" title="Show board"><span class="mi mi-sm ph-fill ph-cpu"></span></button>
        <button class="btn btn-icon btn-ghost" id="t-home" title="Reset view"><span class="mi mi-sm ph ph-crosshair"></span></button>
      </div>
      <div class="view-status" id="status"></div>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "../vendor/three/OrbitControls.js";
import { hasTauri, invoke, listen, esc, toast } from "../kit/app.js";
import { BOARDS, BOARD_ORDER } from "../enclosure/boards.js";
import {
  FACES, FACE_LABEL, newEnclosure, normalize, resolveBoard, defaultPortCutouts, layout, faceSize, faceBasis,
  faceToWorld, worldToFace, nearestFace, portOnFace, portBox, resolveCutouts, cutoutPolys, roundedRectPoly, polyPath, uid,
} from "../enclosure/model.js";
import { loadManifold, buildParts, lidForPrint, toSTL } from "../enclosure/geometry.js";

if (window.__TAURI__) {
  const { getCurrentWindow } = window.__TAURI__.window;
  const { LogicalSize } = window.__TAURI__.dpi;
  getCurrentWindow().setSize(new LogicalSize(1400, 860));
}

// ---------------------------------------------------------------- state
let doc = newEnclosure("pi5");
let L = null, cuts = [];
let face = "front", sel = null;
let activePath = null, projectRoot = null;
const view = { lid: true, explode: false, board: true };
const $ = (id) => document.getElementById(id);
const r2 = (v) => Math.round(v * 100) / 100;
const snapTo = (v, s) => Math.round(v / s) * s;
const statusEl = $("status");

const rawCut = (id) => doc.cutouts.find((c) => c.id === id);
const resolved = (id) => cuts.find((c) => c.id === id);

// ---------------------------------------------------------------- history
let history = [], hIdx = -1;
function commit() {
  const s = JSON.stringify(doc);
  if (s === history[hIdx]) return;
  history = history.slice(0, hIdx + 1);
  history.push(s); hIdx = history.length - 1;
  if (history.length > 200) { history.shift(); hIdx--; }
}
function restore(i) {
  hIdx = i; doc = JSON.parse(history[i]);
  if (sel && !rawCut(sel)) sel = null;
  $("name").value = doc.name;
  renderInspector(); update();
}

// ---------------------------------------------------------------- update loop
function update({ geometry = true } = {}) {
  L = layout(doc);
  cuts = resolveCutouts(doc, L);
  $("dims").textContent = `${r2(L.W)} × ${r2(L.D)} × ${r2(L.H)} mm`;
  renderTabs();
  draw2D();
  if (!$("foot").contains(document.activeElement)) renderFoot();
  syncHints();
  if (geometry) schedule3D(); else updateHighlight();
  scheduleSave();
}

// ---------------------------------------------------------------- face tabs
function renderTabs() {
  const counts = Object.fromEntries(FACES.map((f) => [f, 0]));
  for (const c of cuts) counts[c.face]++;
  $("face-tabs").innerHTML = FACES.map((f) =>
    `<button class="pill-tab${f === face ? " is-active" : ""}" data-face="${f}">${FACE_LABEL[f]}${counts[f] ? `<sup>${counts[f]}</sup>` : ""}</button>`).join("");
}
$("face-tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-face]");
  if (!b) return;
  setFace(b.dataset.face, { turn: true });
});
function setFace(f, { turn = false } = {}) {
  if (f !== face && sel && resolved(sel)?.face !== f) sel = null;
  face = f;
  update({ geometry: false });
  if (turn) turnCameraTo(f);
}

// ---------------------------------------------------------------- 2D face editor
const svg = $("face-svg");
let vb = { x: 0, y: 0, w: 100, h: 100 }, scale = 1, guides = [];

function pxScale() {
  const r = svg.getBoundingClientRect();
  return Math.min(r.width / vb.w, r.height / vb.h) || 1;
}

function draw2D() {
  const { w: fw, h: fh } = faceSize(face, L);
  const m = Math.max(fw, fh) * 0.09 + 8;
  vb = { x: -m, y: -m, w: fw + 2 * m, h: fh + 2 * m };
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  scale = pxScale();
  const px = (n) => n / scale;                     // screen px → mm
  const Y = (v) => fh - v;
  const f = faceBasis(face, L);
  const top = face === "top" || face === "bottom";
  const ns = `vector-effect="non-scaling-stroke"`;
  let s = "";

  // grid inside the face: 5 mm, stronger every 10
  let grid = "";
  for (let u = 5; u < fw; u += 5) grid += `<line x1="${u}" y1="0" x2="${u}" y2="${fh}" stroke-opacity="${u % 10 ? 0.5 : 1}"/>`;
  for (let v = 5; v < fh; v += 5) grid += `<line x1="0" y1="${Y(v)}" x2="${fw}" y2="${Y(v)}" stroke-opacity="${v % 10 ? 0.5 : 1}"/>`;

  // face body
  const body = top ? polyPath([roundedRectPoly(0, 0, fw, fh, L.radius)], fh) : `M0 0H${fw}V${fh}H0Z`;
  s += `<path d="${body}" fill="var(--elevated)" stroke="none"/>`;
  s += `<clipPath id="fc"><path d="${body}"/></clipPath>`;
  s += `<g clip-path="url(#fc)" stroke="var(--hairline)" stroke-width="1" ${ns}>${grid.replaceAll("<line ", `<line ${ns} `)}</g>`;

  // structure hints
  const dash = `fill="none" stroke="var(--text-soft)" stroke-dasharray="4 3" ${ns}`;
  if (top) {
    s += `<path d="${polyPath([roundedRectPoly(L.wall, L.wall, L.iw, L.id, Math.max(0.5, L.radius - L.wall))], fh)}" ${dash}/>`;
    if (face === "top" && L.style === "screw") for (const [x, y] of L.bosses) s += `<circle cx="${x}" cy="${Y(y)}" r="${L.screw.clear}" fill="none" stroke="var(--text-muted)" ${ns}/>`;
  } else {
    const iu0 = L.wall, iu1 = fw - L.wall, topIn = L.style === "slide" ? L.z0 : L.baseH;
    s += `<rect x="${iu0}" y="${Y(topIn)}" width="${iu1 - iu0}" height="${topIn - L.floor}" ${dash}/>`;
    if (L.style !== "slide") {
      s += `<rect x="0" y="0" width="${fw}" height="${L.H - L.baseH}" fill="var(--surface)" opacity=".7"/>`;
      s += `<line x1="0" x2="${fw}" y1="${Y(L.baseH)}" y2="${Y(L.baseH)}" stroke="var(--text-muted)" ${ns}/>`;
    } else if (face === "front") {
      const g = L.grooveDepth;
      s += `<rect x="${L.wall - g}" y="0" width="${fw - 2 * (L.wall - g)}" height="${L.H - L.z0}" fill="var(--surface)" opacity=".7" stroke="var(--text-muted)" ${ns}/>`;
    } else {
      s += `<rect x="${L.wall - L.grooveDepth}" y="${Y(L.z0 + L.lidT + L.fit)}" width="${fw - 2 * (L.wall - L.grooveDepth)}" height="${L.lidT + L.fit}" ${dash}/>`;
    }
  }

  // board silhouette
  if (view.board) s += boardSilhouette(f, fh, ns, top);

  // outline on top of the fills
  s += `<path d="${body}" fill="none" stroke="var(--text)" stroke-width="1.25" ${ns}/>`;

  // cutouts
  const mine = cuts.filter((c) => c.face === face);
  for (const c of mine) {
    const on = c.id === sel;
    s += `<path class="cut" data-cut="${c.id}" d="${polyPath(cutoutPolys(c), fh)}" fill="var(--text)" fill-opacity="${on ? 0.9 : 0.75}" fill-rule="nonzero"/>`;
    if (c.shape === "vent") s += `<rect class="cut" data-cut="${c.id}" x="${c.cx - c.w / 2}" y="${Y(c.cy + c.h / 2)}" width="${c.w}" height="${c.h}" fill="transparent" stroke="${on ? "none" : "var(--text-soft)"}" stroke-dasharray="2 2" ${ns}/>`;
  }
  // selection: outline, handles, dimensions
  const sc = mine.find((c) => c.id === sel);
  if (sc) {
    const x0 = sc.cx - sc.w / 2, x1 = sc.cx + sc.w / 2, y0 = sc.cy - sc.h / 2, y1 = sc.cy + sc.h / 2;
    s += `<rect x="${x0}" y="${Y(y1)}" width="${sc.w}" height="${sc.h}" fill="none" stroke="var(--accent)" stroke-width="1.5" ${ns} pointer-events="none"/>`;
    const hs = px(8);
    for (const [k, u, v] of [["sw", x0, y0], ["se", x1, y0], ["nw", x0, y1], ["ne", x1, y1]]) {
      s += `<rect class="handle" data-corner="${k}" x="${u - hs / 2}" y="${Y(v) - hs / 2}" width="${hs}" height="${hs}" fill="var(--elevated)" stroke="var(--accent)" stroke-width="1.5" ${ns}/>`;
    }
    s += dimLine(0, sc.cy, x0, sc.cy, r2(x0), fh, px, "h");
    s += dimLine(sc.cx, 0, sc.cx, y0, r2(y0), fh, px, "v");
  }
  // overall size, outside the face
  s += dimLine(0, -px(16), fw, -px(16), r2(fw), fh, px, "h", true);
  s += dimLine(-px(16), 0, -px(16), fh, r2(fh), fh, px, "v", true);

  for (const g of guides) {
    s += g.axis === "u"
      ? `<line x1="${g.at}" x2="${g.at}" y1="${vb.y}" y2="${vb.y + vb.h}" stroke="var(--accent)" stroke-dasharray="3 3" ${ns}/>`
      : `<line y1="${Y(g.at)}" y2="${Y(g.at)}" x1="${vb.x}" x2="${vb.x + vb.w}" stroke="var(--accent)" stroke-dasharray="3 3" ${ns}/>`;
  }
  svg.innerHTML = s;
}

function dimLine(u0, v0, u1, v1, label, fh, px, dir, muted) {
  if (Math.hypot(u1 - u0, v1 - v0) < 0.01) return "";
  const col = muted ? "var(--text-soft)" : "var(--accent)";
  const fs = px(10.5), t = px(4);
  const Y = (v) => fh - v;
  const ns = `vector-effect="non-scaling-stroke"`;
  let s = `<line x1="${u0}" y1="${Y(v0)}" x2="${u1}" y2="${Y(v1)}" stroke="${col}" stroke-width="1" ${ns} pointer-events="none"/>`;
  const ticks = dir === "h" ? [[u0, v0], [u1, v1]].map(([u, v]) => `M${u} ${Y(v) - t}V${Y(v) + t}`) : [[u0, v0], [u1, v1]].map(([u, v]) => `M${u - t} ${Y(v)}H${u + t}`);
  s += `<path d="${ticks.join("")}" stroke="${col}" ${ns} pointer-events="none"/>`;
  const mu = (u0 + u1) / 2, mv = (v0 + v1) / 2;
  const txt = `font-family="var(--mono)" font-size="${fs}" fill="${col}" pointer-events="none"`;
  s += dir === "h"
    ? `<text x="${mu}" y="${Y(mv) - px(5)}" text-anchor="middle" ${txt}>${label}</text>`
    : `<text x="${mu - px(5)}" y="${Y(mv)}" text-anchor="end" dominant-baseline="middle" ${txt}>${label}</text>`;
  return s;
}

/** Board + connectors as seen on this face. */
function boardSilhouette(f, fh, ns, top) {
  const B = L.board, Y = (v) => fh - v;
  const proj = (x0, x1, y0, y1, z0, z1) => {
    let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
    for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) {
      const [u, v] = worldToFace(f, [x, y, z]);
      u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v);
    }
    return { u0, u1, v0, v1 };
  };
  const st = `stroke="var(--sage)" stroke-width="1" ${ns}`;
  let s = "";
  if (top) {
    s += `<path d="${polyPath([roundedRectPoly(L.bx, L.by, B.w, B.d, B.r)], fh)}" fill="var(--sage-soft)" ${st}/>`;
    for (const [hx, hy] of B.holes) s += `<circle cx="${L.bx + hx}" cy="${Y(L.by + hy)}" r="${B.holeDia / 2}" fill="var(--elevated)" ${st}/>`;
    for (const p of B.ports) {
      const b = portBox(p, B);
      s += `<rect x="${L.bx + b.x0}" y="${Y(L.by + b.y1)}" width="${b.x1 - b.x0}" height="${b.y1 - b.y0}" fill="none" stroke-dasharray="2 2" ${st}/>`;
    }
  } else {
    const r = proj(L.bx, L.bx + B.w, L.by, L.by + B.d, L.bz, L.boardTop);
    s += `<rect x="${r.u0}" y="${Y(r.v1)}" width="${r.u1 - r.u0}" height="${r.v1 - r.v0}" fill="var(--sage-soft)" ${st}/>`;
    for (const [hx, hy] of B.holes) {
      const q = proj(L.bx + hx - L.standoffDia / 2, L.bx + hx + L.standoffDia / 2, L.by + hy, L.by + hy, L.floor, L.bz);
      s += `<rect x="${q.u0}" y="${Y(q.v1)}" width="${q.u1 - q.u0}" height="${q.v1 - q.v0}" fill="none" stroke="var(--text-soft)" ${ns}/>`;
    }
    for (const p of B.ports) {
      if (p.edge !== face) continue;
      const pf = portOnFace(p, L);
      s += pf.circle
        ? `<circle cx="${pf.cx}" cy="${Y(pf.cy)}" r="${pf.h / 2}" fill="none" ${st}/>`
        : `<rect x="${pf.cx - pf.w / 2}" y="${Y(pf.cy + pf.h / 2)}" width="${pf.w}" height="${pf.h}" rx="0.4" fill="none" ${st}/>`;
    }
  }
  return s;
}

// ---- pointer interaction
function svgPoint(e) {
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  return [p.x, faceSize(face, L).h - p.y];
}
let drag = null;
svg.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  const [u, v] = svgPoint(e);
  const handle = e.target.closest(".handle");
  const cutEl = e.target.closest(".cut");
  if (handle && sel) {
    const c = resolved(sel);
    drag = { kind: "resize", id: sel, corner: handle.dataset.corner, start: { ...c } };
  } else if (cutEl) {
    sel = cutEl.dataset.cut;
    const c = resolved(sel);
    drag = { kind: "move", id: sel, u0: u, v0: v, cx: c.cx, cy: c.cy, moved: false };
    renderFoot();
  } else {
    sel = null;
    update({ geometry: false });
    return;
  }
  svg.setPointerCapture(e.pointerId);
  document.body.classList.add("dragging");
  update({ geometry: false });
});
svg.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const [u, v] = svgPoint(e);
  const free = e.altKey;
  if (drag.kind === "move") {
    let cx = drag.cx + (u - drag.u0), cy = drag.cy + (v - drag.v0);
    if (!free) [cx, cy] = snapCenter(drag.id, snapTo(cx, 0.5), snapTo(cy, 0.5));
    else guides = [];
    setCenter(rawCut(drag.id), cx, cy);
    drag.moved = true;
  } else {
    resizeTo(drag, free ? u : snapTo(u, 0.5), free ? v : snapTo(v, 0.5));
  }
  update();
});
const endDrag = () => {
  if (!drag) return;
  drag = null; guides = [];
  document.body.classList.remove("dragging");
  commit();
  update({ geometry: false });
};
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);
svg.addEventListener("dblclick", (e) => {
  if (e.target.closest(".cut, .handle")) return;
  const [u, v] = svgPoint(e);
  addCutout("circle", snapTo(u, 0.5), snapTo(v, 0.5));
});

/** Snap a centre to the face centre, this face's ports and the other cutouts. */
function snapCenter(id, cx, cy) {
  const { w: fw, h: fh } = faceSize(face, L);
  const T = 6 / scale;
  const us = [fw / 2], vs = [fh / 2];
  for (const p of L.board.ports) {
    const pf = portOnFace(p, L);
    if (pf.face === face) { us.push(pf.cx); vs.push(pf.cy); }
  }
  for (const c of cuts) if (c.face === face && c.id !== id) { us.push(c.cx); vs.push(c.cy); }
  guides = [];
  const near = (val, list) => list.reduce((best, t) => (Math.abs(t - val) < T && (best == null || Math.abs(t - val) < Math.abs(best - val)) ? t : best), null);
  const su = near(cx, us), sv = near(cy, vs);
  if (su != null) { cx = su; guides.push({ axis: "u", at: su }); }
  if (sv != null) { cy = sv; guides.push({ axis: "v", at: sv }); }
  return [cx, cy];
}

function portCenter(raw) {

    if (!raw.dy) delete raw.dy;

function resizeTo(d, u, v) {

  }
  const ax = d.corner.includes("w") ? c.cx + c.w / 2 : c.cx - c.w / 2;
  const ay = d.corner.includes("s") ? c.cy + c.h / 2 : c.cy - c.h / 2;
  raw.w = r2(Math.max(1, Math.abs(u - ax)));

function disposeGroup(g) {
  for (const o of [...g.children]) { o.geometry?.dispose(); g.remove(o); }

/** Indexed manifold mesh → flat-ish shading: normals averaged only across soft edges. */
function creased({ positions: P, indices: I }, angle = 32) {
  const nt = I.length / 3, nv = P.length / 3;
  const fn = new Float32Array(nt * 3);
  for (let t = 0; t < nt; t++) {
    const a = I[t * 3] * 3, b = I[t * 3 + 1] * 3, c = I[t * 3 + 2] * 3;
    const ux = P[b] - P[a], uy = P[b + 1] - P[a + 1], uz = P[b + 2] - P[a + 2];
    const vx = P[c] - P[a], vy = P[c + 1] - P[a + 1], vz = P[c + 2] - P[a + 2];
    let x = uy * vz - uz * vy, y = uz * vx - ux * vz, z = ux * vy - uy * vx;
    const l = Math.hypot(x, y, z) || 1;
    fn[t * 3] = x / l; fn[t * 3 + 1] = y / l; fn[t * 3 + 2] = z / l;
  }
  const start = new Uint32Array(nv + 1);
  for (const v of I) start[v + 1]++;
  for (let i = 0; i < nv; i++) start[i + 1] += start[i];
  const fill = start.slice(0, nv), adj = new Uint32Array(I.length);
  for (let i = 0; i < I.length; i++) adj[fill[I[i]]++] = (i / 3) | 0;
  const cos = Math.cos((angle * Math.PI) / 180);
  const pos = new Float32Array(nt * 9), nor = new Float32Array(nt * 9);
  for (let t = 0; t < nt; t++) {
    for (let k = 0; k < 3; k++) {
      const v = I[t * 3 + k], o = (t * 3 + k) * 3;
      pos[o] = P[v * 3]; pos[o + 1] = P[v * 3 + 1]; pos[o + 2] = P[v * 3 + 2];
      let x = 0, y = 0, z = 0;
      for (let j = start[v]; j < start[v + 1]; j++) {
        const f = adj[j];
        if (fn[f * 3] * fn[t * 3] + fn[f * 3 + 1] * fn[t * 3 + 1] + fn[f * 3 + 2] * fn[t * 3 + 2] >= cos) { x += fn[f * 3]; y += fn[f * 3 + 1]; z += fn[f * 3 + 2]; }
      }
      const l = Math.hypot(x, y, z) || 1;
      nor[o] = x / l; nor[o + 1] = y / l; nor[o + 2] = z / l;

}

function partMesh(group, mesh, mat) {
  disposeGroup(group);
  const g = creased(mesh);
  const m = new THREE.Mesh(g, mat);
  group.add(m, new THREE.LineSegments(new THREE.EdgesGeometry(g, 28), matEdge));
  return m;
}

function buildBoard() {
  disposeGroup(boardGroup);
  const B = L.board;
  const shape = new THREE.Shape();
  const pts = roundedRectPoly(0, 0, B.w, B.d, B.r);
  shape.setFromPoints(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  for (const [hx, hy] of B.holes) { const p = new THREE.Path(); p.absarc(hx, hy, B.holeDia / 2, 0, Math.PI * 2, true); shape.holes.push(p); }
  const pcb = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: B.t, bevelEnabled: false, curveSegments: 16 }), matPcb);
  pcb.position.set(L.bx, L.by, L.bz);
  boardGroup.add(pcb);
  for (const p of B.ports) {
    const b = portBox(p, B);
    const m = new THREE.Mesh(new THREE.BoxGeometry(b.x1 - b.x0, b.y1 - b.y0, b.z1 - b.z0), matPort);
    // Underside parts hang below the PCB: z is measured from the board top.
    m.position.set(L.bx + (b.x0 + b.x1) / 2, L.by + (b.y0 + b.y1) / 2, L.boardTop + (b.z0 + b.z1) / 2);
    boardGroup.add(m);

}

    if (statusEl.dataset.err) { statusEl.textContent = ""; delete statusEl.dataset.err; }
  } catch (e) {
    console.error(e);
    statusEl.textContent = "Geometry error: " + (e.message || e);
    statusEl.dataset.err = "1";
  }
  if (needsFit) { fitCamera(); needsFit = false; }
  updateHighlight();
}

const liftHeight = () => Math.max(18, L.H * 0.8);

function updateHighlight() {
  if (!L) return;
  disposeGroup(hiGroup);
  if (face === "top" && !view.lid) return render();     // nothing there to point at
  const f = faceBasis(face, L), { w, h } = faceSize(face, L);
  const off = 0.15 * f.out;
  const lifted = (u, v) => {
    const p = faceToWorld(f, u, v, off);
    // the top face rides with the lid when it's lifted
    if (face === "top") p[2] += lidLift;
    return new THREE.Vector3(...p);
  };
  const corners = [[0, 0], [w, 0], [w, h], [0, h]].map(([u, v]) => lifted(u, v));
  const plane = new THREE.BufferGeometry().setFromPoints([corners[0], corners[1], corners[2], corners[0], corners[2], corners[3]]);
  hiGroup.add(new THREE.Mesh(plane, matHi));
  hiGroup.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(corners), matHiLine));
  const c = resolved(sel);
  if (c && c.face === face) {
    for (const poly of cutoutPolys(c)) hiGroup.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(poly.map(([u, v]) => lifted(u, v))), matSelLine));
  }
  render();
}

function render() { renderer.render(scene, camera); }

function resize3D() {
  const r = $("view-pane").getBoundingClientRect();
  if (!r.width || !r.height) return;
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
  render();
}
new ResizeObserver(() => { resize3D(); if (L) draw2D(); }).observe(document.body);

const VIEW_DIR = {
  front: [0.45, -1, 0.6], back: [-0.45, 1, 0.6], left: [-1, -0.45, 0.6], right: [1, 0.45, 0.6],
  top: [0.35, -0.7, 1.5], bottom: [0.35, -0.7, -1.3], home: [0.75, -1.2, 0.95],
};
function camDistance() {
  const rad = 0.5 * Math.hypot(L.W, L.D, L.H + (view.explode ? liftHeight() : 0));
  const fov = (camera.fov * Math.PI) / 180;
  return (rad / Math.sin(fov / 2)) * 1.08 / Math.min(1, camera.aspect);
}
function fitCamera(dirKey = "home") {
  if (!L) return;
  controls.target.set(0, 0, L.H / 2);
  const d = new THREE.Vector3(...VIEW_DIR[dirKey]).normalize().multiplyScalar(camDistance());
  camera.position.copy(controls.target).add(d);
  camera.near = 1; camera.far = camDistance() * 20;
  camera.updateProjectionMatrix();
  controls.update();
  render();
}
let camAnim = 0;
function turnCameraTo(f) {
  if (!L) return;
  const target = new THREE.Vector3(0, 0, L.H / 2);
  const from = camera.position.clone().sub(controls.target);
  const dist = from.length();
  const to = new THREE.Vector3(...VIEW_DIR[f]).normalize().multiplyScalar(dist);
  const t0 = performance.now(), id = ++camAnim;
  const step = (now) => {
    if (id !== camAnim) return;
    const k = Math.min(1, (now - t0) / 380), e = 1 - Math.pow(1 - k, 3);
    const dir = from.clone().lerp(to, e).normalize().multiplyScalar(dist);
    controls.target.copy(target);
    camera.position.copy(target).add(dir);
    controls.update();
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// click (not drag) on the model → pick face + cutout
let downAt = null;
canvas.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4 || !L) return;
  const r = canvas.getBoundingClientRect();
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const targets = [baseMesh, view.lid ? lidMesh : null].filter(Boolean);
  const hit = ray.intersectObjects(targets, false)[0];
  if (!hit) return;
  const p = model.worldToLocal(hit.point.clone());
  if (hit.object === lidMesh) p.z -= lidLift;
  const f = nearestFace([p.x, p.y, p.z], L);
  const [u, v] = worldToFace(faceBasis(f, L), [p.x, p.y, p.z]);
  const c = cuts.find((q) => q.face === f && Math.abs(u - q.cx) <= q.w / 2 + 0.6 && Math.abs(v - q.cy) <= q.h / 2 + 0.6);
  sel = c ? c.id : null;
  setFace(f);
});

function setToggle(btn, on) {
  const ic = btn.querySelector(".mi");
  ic.classList.toggle("ph-fill", on);
  ic.classList.toggle("ph", !on);
}
$("t-lid").onclick = () => { view.lid = !view.lid; setToggle($("t-lid"), view.lid); lidGroup.visible = view.lid; updateHighlight(); };
$("t-board").onclick = () => { view.board = !view.board; setToggle($("t-board"), view.board); boardGroup.visible = view.board; draw2D(); render(); };
$("t-home").onclick = () => fitCamera();
$("t-explode").onclick = () => {
  view.explode = !view.explode;
  setToggle($("t-explode"), view.explode);
  if (view.explode && !view.lid) { view.lid = true; setToggle($("t-lid"), true); lidGroup.visible = true; }
  const from = lidLift, to = view.explode ? liftHeight() : 0, t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / 260), e = 1 - Math.pow(1 - k, 3);
    lidLift = from + (to - from) * e;
    lidGroup.position.z = lidLift;
    updateHighlight();
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
};

// ---------------------------------------------------------------- export
const slug = (s) => (s || "enclosure").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "enclosure";
function b64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
$("export").onclick = async () => {
  if (!wasm) return;
  const parts = buildParts(wasm, L, cuts);
  const files = [
    [`${slug(doc.name)}-base.stl`, toSTL(parts.base, doc.name + " base")],
    [`${slug(doc.name)}-lid.stl`, toSTL(lidForPrint(parts.lid, L), doc.name + " lid")],
  ];
  if (!hasTauri) {
    for (const [name, bytes] of files) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([bytes], { type: "model/stl" }));
      a.download = name; a.click();
    }
    return;
  }
  let root = projectRoot;
  if (!root) root = (await invoke("get_active_project"))?.path;
  if (!root) { toast("Open a project to export into it"); return; }
  const dir = `${root}/models`;
  try {
    for (const [name, bytes] of files) {
      const path = `${dir}/${name}`;
      try { await invoke("write_image", { path, dataBase64: b64(bytes) }); }
      catch { await invoke("fs_new_folder", { dir: root, name: "models" }); await invoke("write_image", { path, dataBase64: b64(bytes) }); }
    }
    const first = `${dir}/${files[0][0]}`;
    statusEl.innerHTML = `Exported base + lid → models/ <a id="reveal">Reveal</a>`;
    $("reveal").onclick = () => invoke("reveal_in_finder", { path: first });
    toast("Exported STL");
  } catch (e) { toast("Export failed: " + e); }
};

// ---------------------------------------------------------------- save / load
let booted = false, saveTimer = null, saving = false, saveAgain = false, lastSaved = "";
const snapshot = () => JSON.stringify({ ...doc, savedAt: undefined });
function buildDoc() { return { ...doc, kind: "enclosure", version: 1, savedAt: new Date().toISOString() }; }
function scheduleSave() {
  if (!booted || !hasTauri || snapshot() === lastSaved) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autoSave, 700);
}
async function autoSave() {
  if (saving) { saveAgain = true; return; }
  saving = true;
  const snap = snapshot();
  try {
    const content = JSON.stringify(buildDoc(), null, 2);
    if (activePath) await invoke("overwrite_artifact", { path: activePath, content });
    else {
      activePath = await invoke("save_artifact", { kind: "enclosure", name: (doc.name || "Untitled enclosure").replace(/[/\\]/g, "-").replace(/^\./, ""), content });
      deriveProjectRoot(activePath);
    }
    lastSaved = snap;
  } catch (e) { statusEl.textContent = "Not saved: " + e; }
  saving = false;
  if (saveAgain) { saveAgain = false; autoSave(); }
}
function deriveProjectRoot(p) { const m = p.match(/^(.*)\/artifacts\//); projectRoot = m ? m[1] : null; }

function adopt(data) {
  doc = normalize(data);
  if (sel && !rawCut(sel)) sel = null;
  $("name").value = doc.name;
}

function initWatch() {
  if (!hasTauri) return;
  listen("fs-changed", async () => {
    if (!activePath || saving || snapshot() !== lastSaved) return;   // local edits win
    let data;
    try { data = JSON.parse(await invoke("read_artifact", { path: activePath })); } catch { return; }
    const probe = JSON.stringify({ ...normalize(data), savedAt: undefined });
    if (probe === lastSaved) return;
    adopt(data);
    lastSaved = snapshot();
    commit(); renderInspector(); update();
    statusEl.textContent = "Reloaded from disk " + new Date().toLocaleTimeString();
  });
}

async function boot() {
  const path = new URLSearchParams(location.search).get("artifact");
  if (path && hasTauri) {
    try { adopt(JSON.parse(await invoke("read_artifact", { path }))); activePath = path; deriveProjectRoot(path); }
    catch (e) { statusEl.textContent = "Couldn't load: " + e; }
  }
  $("name").value = doc.name;
  renderInspector();
  resize3D();
  update();
  commit();
  lastSaved = snapshot();
  booted = true;
  initWatch();
  if (window.__TAURI__) import("../devinspect.js").then((m) => m.initDevInspect()).catch(() => {});
  statusEl.textContent = "Loading geometry kernel…";
  try {
    wasm = await loadManifold();
    statusEl.textContent = "";
    build3D();
  } catch (e) { statusEl.textContent = "Couldn't load manifold: " + e; }
}
boot();
</script>
