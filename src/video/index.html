<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video</title>
    <style>
      :root {
        --bg: #15171c;
        --ink: #f3f1ea;
        --ink-dim: rgba(243, 241, 234, 0.55);
        --line: rgba(243, 241, 234, 0.14);
        --card: rgba(255, 255, 255, 0.06);
        --card-strong: rgba(255, 255, 255, 0.12);
        --accent: #ffd23f;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 "Futura", "Avenir Next", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
      }
      .titlebar {
        height: 34px;
        flex: 0 0 34px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
      }
      .titlebar .project {
        font-weight: 700;
        letter-spacing: 0.02em;
        flex: 0 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .titlebar .project::before { content: "🎬 "; }
      .titlebar .spacer { flex: 1 1 auto; }
      .docsel {
        -webkit-appearance: none;
        appearance: none;
        border: none;
        border-radius: 7px;
        background: var(--card-strong);
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        padding: 4px 8px;
        max-width: 220px;
        cursor: pointer;
      }
      .iconbtn {
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        padding: 4px 7px;
        opacity: 0.7;
      }
      .iconbtn:hover { opacity: 1; background: var(--card-strong); }
      main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 4px 14px 12px;
        gap: 10px;
      }
      /* Preview keeps a 16:9 box; the video letterboxes inside. */
      .stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 120px;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stage .vid {
        position: absolute;
        inset: 0;
        margin: auto;
        max-width: 100%;
        max-height: 100%;
        opacity: 0;
        transition: none;
      }
      .stage .vid.active { opacity: 1; }
      .stage .placeholder {
        color: var(--ink-dim);
        font-style: italic;
        text-align: center;
        padding: 20px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .controls .time {
        font-variant-numeric: tabular-nums;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--ink-dim);
      }
      /* Caption/title overlay over the preview (preview of the baked look). */
      .overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .overlay .lyr {
        position: absolute;
        transform: translate(-50%, -50%);
        white-space: pre-wrap;
        text-align: center;
        font-family: "Futura", "Avenir Next", system-ui, sans-serif;
        font-weight: 700;
        line-height: 1.15;
        padding: 0.15em 0.45em;
        border-radius: 0.2em;
        max-width: 92%;
      }
      /* Timeline: a clip lane + a text lane, with a draggable playhead. */
      .timeline {
        position: relative;
        flex: 0 0 auto;
        background: var(--card);
        border-radius: 10px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        user-select: none;
      }
      .lane {
        position: relative;
        height: 42px;
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.25);
      }
      /* Text tracks: one stacked lane per row of non-overlapping layers. */
      .texttracks {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .lane--text { height: 26px; }
      .block {
        position: absolute;
        top: 3px;
        bottom: 3px;
        border-radius: 6px;
        background: var(--card-strong);
        overflow: hidden;
        cursor: grab;
        display: flex;
        align-items: center;
        font-size: 11px;
      }
      .block.sel { outline: 2px solid var(--accent); z-index: 2; }
      .block .label {
        padding: 0 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      .block .handle {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 9px;
        cursor: ew-resize;
        background: rgba(255, 255, 255, 0.18);
      }
      .block .handle.l { left: 0; border-radius: 6px 0 0 6px; }
      .block .handle.r { right: 0; border-radius: 0 6px 6px 0; }
      .lane--text .block {
        background: rgba(255, 210, 63, 0.35);
      }
      .lane--text .block.sel { background: rgba(255, 210, 63, 0.55); }
      .playhead {
        position: absolute;
        top: 4px;
        bottom: 4px;
        width: 2px;
        background: var(--accent);
        pointer-events: none;
        z-index: 3;
        left: 6px;
      }
      .playhead::before {
        content: "";
        position: absolute;
        top: -3px;
        left: -4px;
        border: 5px solid transparent;
        border-top-color: var(--accent);
      }
      /* Wide invisible grab target so the thin playhead is easy to drag. */
      .playhead .grab {
        position: absolute;
        top: -6px;
        bottom: -6px;
        left: -9px;
        width: 20px;
        pointer-events: auto;
        cursor: ew-resize;
      }
      .timeline.scrubbing { cursor: ew-resize; }
      /* Inspector for the selected text layer. */
      .inspector {
        flex: 0 0 auto;
        background: var(--card);
        border-radius: 10px;
        padding: 8px 10px;
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 6px 8px;
        align-items: center;
        font-size: 12px;
      }
      .inspector label { color: var(--ink-dim); }
      .inspector .full { grid-column: 1 / -1; }
      .inspector input, .inspector select {
        width: 100%;
        border: none;
        border-radius: 6px;
        background: var(--card-strong);
        color: var(--ink);
        font: inherit;
        padding: 5px 7px;
        outline: none;
      }
      .inspector input[type="color"] { padding: 2px; height: 26px; }
      .inspector .del {
        grid-column: 1 / -1;
        justify-self: start;
        background: transparent;
        color: var(--ink-dim);
        padding: 4px 0;
      }
      button, select {
        border: none;
        border-radius: 9px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        padding: 7px 12px;
        color: var(--ink);
        background: var(--card-strong);
      }
      button.primary { background: var(--accent); color: #1a1a1a; }
      button:disabled { opacity: 0.35; cursor: default; }
      select { -webkit-appearance: none; appearance: none; }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        max-width: 90%;
      }
      .toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region>
      <span class="project" id="project" data-tauri-drag-region></span>
      <select class="docsel" id="docsel" title="Switch edit"></select>
      <button class="iconbtn" id="newdoc" title="New video">＋</button>
      <span class="spacer" data-tauri-drag-region></span>
      <button class="iconbtn" id="deldoc" title="Delete this edit">🗑</button>
    </div>
    <main>
      <div class="stage" id="stage">
        <div class="placeholder" id="placeholder">No clips yet — add one below.</div>
        <!-- Two stacked elements for double-buffered playback: one shows the
             current clip while the other preloads the next, so clip boundaries
             don't flash black. -->
        <video class="vid" id="vidA" playsinline></video>
        <video class="vid" id="vidB" playsinline></video>
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="controls">
        <button id="play" disabled>▶︎ Play</button>
        <span class="time" id="time">0:00 / 0:00</span>
        <span class="spacer" style="flex:1 1 auto"></span>
        <button id="addtext">＋ Text</button>
        <select id="addsel"><option value="">+ Add clip…</option></select>
      </div>
      <div class="timeline" id="timeline">
        <div class="lane" id="clipLane"></div>
        <div class="texttracks" id="textLane"></div>
        <div class="playhead" id="playhead"><div class="grab"></div></div>
      </div>
      <div class="inspector" id="inspector" hidden></div>
    </main>
    <div class="toast" id="toast"></div>

    <script type="module" src="./video.js"></script>
  </body>
</html>
